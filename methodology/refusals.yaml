# Формулировки отказов для раздела «Ограничения анализа».
#
# **Раздел — перечень того, что нужно запросить у организации**, а не место
# для оговорок о методике. До 18.09.2026 он выполнял вторую роль и не
# выполнял первую: причины, по которым показатель не рассчитан, туда
# не попадали вовсе, а в сборке стоял цикл, не делавший ничего.
#
# **У отказа три семейства, и третьего не бывает.**
#
#   data_missing    величины нет в отчётности — из отказа следует запрос
#                   к организации;
#   not_applicable  показатель к этим данным неприменим — запрашивать
#                   нечего, и это сказано прямо;
#   our_gap         величина в отчётности есть, а мы её не извлекаем —
#                   запрашивать тоже нечего, но долг записывается в BACKLOG.
#
# Поле `request` обязательно у каждого: пустое поле скрыло бы, к какому
# семейству отказ относится, а семейство и есть решение о том, что делать.
#
# **Отказ обязан назвать место.** «Ликвидность не рассчитана» — потеря
# сведений; «не рассчитана: средства на счетах эскроу раскрыты сноской
# под балансом, а не строкой формы» — готовый запрос. Место подставляется
# расчётом в `{where}`, наименование — в `{subject}`.

version: "0.1.0"

kinds:
  data_missing: Величина не раскрыта в отчётности
  not_applicable: Показатель к этим данным неприменим
  our_gap: Величина раскрыта, но нами не извлекается

reasons:
  # --- расчёт показателя: МСФО --------------------------------------------
  - code: missing_input
    kind: data_missing
    template: "Показатель «{subject}» не рассчитан: не раскрыто — {where}"
    group_text: "Не рассчитаны — не раскрыты входные величины"
    request: "Запросить раскрытие: перечень приведён у каждого показателя"
  # **Места эти два отказа не называют, и это не пробел.** Запрашивать нечего:
  # знаменатель раскрыт, и причина отказа — его величина, а не чьё-то
  # умолчание. Прежде в скобках стояло `{where}`, то есть та же причина
  # словами расчёта, и выходило «знаменатель отрицателен (знаменатель
  # отрицателен, отношение читалось бы наоборот), и отношение читалось бы
  # противоположно смыслу» — одно утверждение трижды.
  - code: zero_denominator
    kind: not_applicable
    template: "Показатель «{subject}» не рассчитан: знаменатель равен нулю"
    request: "Запрашивать нечего: величина раскрыта и равна нулю"
  - code: negative_denominator
    kind: not_applicable
    template: >-
      Показатель «{subject}» не рассчитан: знаменатель отрицателен,
      и отношение читалось бы противоположно смыслу
    group_text: >-
      Не рассчитаны — знаменатель отрицателен, и отношение читалось бы
      противоположно смыслу
    request: "Запрашивать нечего: величина раскрыта, отношение к ней не строится"
  - code: not_extracted_yet
    kind: our_gap
    template: "Показатель «{subject}» не рассчитан: {where}"
    request: "Запрашивать нечего: величина есть в отчётности, извлечение за нами"
  # **Семейство — наш пробел, а не пробел раскрытия.** Величина здесь
  # организацией раскрыта, и место отказа само это говорит: «раскрыты сноской
  # под балансом, а не строкой формы». Прежде отказ числился `data_missing`
  # и просил «Запросить раскрытие отдельной строкой: {where}» — то есть
  # требовал у организации раскрыть то, что она раскрыла, а в слоте предмета
  # стояла причина. Запрашивать здесь нечего: сноска извлекается, в состав
  # величин показателя она не переведена, и это за нами.
  - code: adjustment_impossible
    kind: our_gap
    template: >-
      Показатель «{subject}» не рассчитан: {where}. Без этой поправки он
      завышен и поэтому не приводится
    request: >-
      Запрашивать нечего: величина раскрыта сноской и приведена в этом
      разделе дословно, перевод её в состав показателя за нами
  # **Замена показателя диапазоном — решение методики, а не пробел данных.**
  # Величины есть, и обе границы приведены; одним числом показатель
  # не приводится потому, что так объявлено методикой для этого типа
  # эмитента. Запрашивать у организации нечего.
  - code: replaced_by_range
    kind: not_applicable
    template: >-
      Показатель «{subject}» одним числом не приводится: {where}. Границы
      диапазона приведены отдельными величинами
    request: "Запрашивать нечего: это решение методики, а не пробел отчётности"
  - code: interim_not_annualised
    kind: not_applicable
    template: >-
      Показатель «{subject}» на промежуточной отчётности не рассчитывается:
      {where}
    request: "Запрашивать нечего: показатель считается по годовой отчётности"

  # --- величина из примечания ---------------------------------------------
  - code: no_reference
    kind: our_gap
    template: "{subject}: строка формы не ссылается ни на одно примечание ({where})"
    request: "Запрашивать нечего: переход к примечанию за нами"
  - code: note_not_found
    kind: data_missing
    template: "{subject}: примечание {where} в документе не найдено"
    request: "Запросить полный текст отчётности с примечанием {where}"
  - code: line_not_found
    kind: data_missing
    template: "{subject}: в примечании {where} такой строки нет"
    request: "Запросить расшифровку в примечании {where}"
  - code: not_in_table
    kind: our_gap
    template: "{subject}: величина раскрыта текстом примечания {where}, а не строкой"
    request: "Запрашивать нечего: разбор текста примечаний за нами"

  # --- аудиторское заключение ---------------------------------------------
  - code: audit_not_readable
    kind: data_missing
    template: >-
      Аудиторское заключение не прочитано: {where}. Вид мнения не определён,
      и это не то же самое, что отсутствие оговорок
    request: "Запросить аудиторское заключение с текстовым слоем"
  - code: audit_absent
    kind: data_missing
    template: "Аудиторское заключение к отчётности не приложено ({where})"
    request: "Запросить аудиторское заключение"
  - code: audit_section_not_readable
    kind: data_missing
    template: "{subject}: дословный текст не извлечён — {where}"
    request: "Запросить страницы заключения с текстовым слоем: {where}"

  # --- опознание строк отчётности -----------------------------------------
  - code: line_not_recognised
    kind: our_gap
    template: "Строка «{subject}» не опознана справочником ({where})"
    request: "Запрашивать нечего: пополнение справочника за нами"
  - code: contested_total
    kind: data_missing
    template: "{subject}: итог раскрыт несколькими строками ({where}), величина не взята"
    request: "Запросить, какая из строк является итогом: {where}"

  # --- расчёт показателя: РСБУ ---------------------------------------------
  - code: missing_lines
    kind: data_missing
    template: "Показатель «{subject}» не рассчитан: не раскрыты строки {where}"
    group_text: "Не рассчитаны из-за нераскрытых строк отчётности"
    request: "Запросить раскрытие строк: перечень приведён у каждого показателя"
  - code: no_previous_period
    kind: data_missing
    group_text: "Не рассчитаны — нет предыдущего периода для средних величин"
    template: >-
      Показатель «{subject}» не рассчитан: нет предыдущего периода, а средние
      величины требуют двух точек ({where})
    request: "Запросить отчётность за предыдущий период"
  # Предыдущий период есть, но сравнивать с ним нельзя: он другой
  # длительности. Отдельная причина, а не разновидность предыдущей:
  # та не исправляется ничем — это самый ранний период организации, —
  # а эта исправляется загрузкой сопоставимого комплекта.
  - code: no_comparable_period
    kind: data_missing
    group_text: "Не рассчитаны — нет сопоставимого периода для сравнения"
    template: >-
      Показатель «{subject}» не рассчитан: сопоставимого периода нет, а
      подстановка периода другой длительности запрещена ({where})
    request: >-
      Запросить отчётность за сопоставимый период: балансовым величинам нужен
      конец предыдущего годового периода, величинам за период — тот же отрезок
      прошлого года
  - code: sign_change
    kind: not_applicable
    template: >-
      {subject} не приводится: величина сменила знак ({where}), и процент
      изменения читался бы ложно
    request: "Запрашивать нечего: обе величины раскрыты"

  # --- исключение из балла --------------------------------------------------
  - code: excluded_stop_factor
    kind: not_applicable
    template: "{subject} в балл не входит: это стоп-фактор, а не измерение ({where})"
    request: "Запрашивать нечего: решение методики"
  - code: excluded_no_level_scale
    kind: not_applicable
    template: "{subject} в балл не входит: шкалы уровня у него нет ({where})"
    group_text: "В балл не входят — шкалы уровня у них нет"
    request: "Запрашивать нечего: решение методики"
  - code: excluded_duplicate
    kind: not_applicable
    template: "{subject} в балл не входит: дублирует другой показатель ({where})"
    request: "Запрашивать нечего: решение методики"
  - code: excluded_not_routing
    kind: not_applicable
    template: "{subject} в балл не входит: {where}"
    request: "Запрашивать нечего: решение методики"
  - code: excluded_no_data
    kind: data_missing
    template: "{subject} в балл не вошёл: показатель не рассчитан ({where})"
    group_text: "В балл не вошли, потому что не рассчитаны"
    request: "Запросить раскрытие величин, которых не хватило: {where}"
  - code: excluded_not_applicable
    kind: not_applicable
    template: "{subject} рассчитан, но в оценку не входит: {where}"
    request: "Запрашивать нечего: неприменимость объявлена методикой"

  # --- класс не присвоен ----------------------------------------------------
  - code: no_class_group_weight
    kind: not_applicable
    template: >-
      Класс не присвоен: оценка держится на одной группе показателей ({where})
    request: "Запросить раскрытие, которого не хватило перечисленным группам"
  - code: no_class_metrics
    kind: data_missing
    template: "Класс не присвоен: рассчитано слишком мало показателей — {where}"
    request: "Запросить раскрытие величин, названных выше"
  - code: no_class_groups
    kind: data_missing
    template: "Класс не присвоен: показатели относятся к одной группе — {where}"
    request: "Запросить раскрытие величин, названных выше"

# Как одинаковые отказы сводятся в одну строку раздела. Двенадцать строк
# «процентное изменение не определено» подряд читателя не осведомляют,
# а перечень показателей в одной строке — да.
grouping:
  min_to_group: 3
  # У свёрнутой строки своё подлежащее: перечень показателей, а не первый
  # из них. Иначе фраза говорит об одном показателе, а перечисляет восемь.
  template: "{group_text} ({count}): {subjects}"
