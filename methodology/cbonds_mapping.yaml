# Сопоставление полей нормализованных данных Cbonds с позициями модели.
#
# **Справочник, а не код.** Сопоставление «поле источника → позиция нашей
# модели» правится диффом и объявляет род каждого поля: точное соответствие,
# агрегат, сверка. Иначе решение о том, чем считать «Краткосрочный долг»
# агрегатора, лежало бы в загрузчике, а проверить его было бы нечем.
#
# **Три рода поля, и путать их нельзя.**
#
#   exact      поле означает ровно нашу позицию. Проверено сверкой
#              с разобранными документами: у восьми эмитентов 139 величин
#              совпали, расхождений четыре, и все четыре — не эти поля.
#   aggregate  поле шире нашей позиции: оно покрывает её и что-то ещё.
#              Такое поле фактом становится только тогда, когда без него
#              не считается величина маршрута, и тогда расхождение объявлено
#              здесь же. Иначе поле не грузится вовсе — агрегат, разложить
#              который нечем, есть то же, что величина неизвестного состава.
#   control    поле фактом не становится: оно сверяется с суммой наших
#              и служит проверкой, а не величиной.
#
# **Устройство рассчитано на РСБУ следующим шагом.** Виды отчёта объявлены
# блоками, у каждого свой стандарт, свои поля и свои проверки; загрузчик
# читает справочник, а не знает поля наизусть.

version: "0.1.0"

origin: >-
  Сопоставление выверено 21.09.2026 сверкой с разобранными документами МСФО
  восьми эмитентов разных отраслей: 229 величин сверено, 139 совпало,
  4 разошлись. Два расхождения объяснены составом поля (гудвил в нематериальных
  активах, текущая часть долгосрочного долга в краткосрочном), два остались
  развилкой и записаны в NIGHT_QUESTIONS.md.

reports:

  report_msfo_real:
    standard: ifrs
    name: Показатели МСФО (реальный сектор)
    # Доставка одна, и отбор по ИНН источник поддерживает именно у этого вида
    # отчёта. `cache` — имя сохранённого ответа: по нему видно, что спрашивали.
    deliveries:
      - method: get_report_msfo_real
        filter_field: emitent_inn
        cache: msfo_real
    # Годовые строки: ключ уникальности комплекта содержит год, и квартальная
    # строка того же года заняла бы место годовой. Промежуточные периоды
    # агрегатора — отдельная работа, объявлена в NIGHT_QUESTIONS.md.
    annual_only: true
    currency_field: ln104
    unit_field: ln105
    standard_field: ln102
    # Величины идут как пришли: у позиций МСФО расходная статья хранится
    # со своим знаком, правила скобок в этой ветке нет вовсе.
    sign_rule: as_reported
    sign_origin: >-
      В справочнике статей МСФО признака `in_brackets` нет: расходные статьи
      опознаются наименованием и хранятся со знаком отчётности. Менять знак
      здесь было бы решением о данных, которого методика не объявляла.
    # Единица объявляется источником построчно и умолчания не имеет: ошибка
    # здесь тихая — баланс сойдётся, коэффициенты будут верны, а все
    # абсолютные величины окажутся неверными.
    units:
      "1000": "384"
      "1000000": "385"
      "1000000000": "386"
    # Стандарт и консолидация — два признака, а не один: неконсолидированная
    # отчётность по МСФО относится к отдельному юридическому лицу, и смешивать
    # её с консолидированной нельзя. Сравнение приведённой строки целиком:
    # «МСФО» входит в «МСФО(к)» как подстрока.
    consolidated_marks: ["МСФО(к)", "МСФО (к)"]
    standalone_marks: ["МСФО"]

    fields:
      # --- Отчёт о финансовом положении ------------------------------------
      ln1: {code: ifrs.trade_receivables, form: position, kind: exact}
      ln2: {code: ifrs.long_term_trade_receivables, form: position, kind: exact}
      ln3: {code: ifrs.cash, form: position, kind: exact}
      ln4: {code: ifrs.inventories, form: position, kind: exact}
      ln6: {code: ifrs.total_current_assets, form: position, kind: exact}
      ln8: {code: ifrs.ppe, form: position, kind: exact}
      ln10: {code: ifrs.total_non_current_assets, form: position, kind: exact}
      ln11: {code: ifrs.total_assets, form: position, kind: exact}
      ln12: {code: ifrs.long_term_trade_payables, form: position, kind: exact}
      ln13: {code: ifrs.trade_payables, form: position, kind: exact}
      ln16: {code: ifrs.short_term_lease_liabilities, form: position, kind: exact}
      ln17: {code: ifrs.long_term_borrowings, form: position, kind: exact}
      ln19: {code: ifrs.total_non_current_liabilities, form: position, kind: exact}
      ln20: {code: ifrs.total_equity, form: position, kind: exact}
      ln21: {code: ifrs.total_equity_and_liabilities, form: position, kind: exact}
      ln22: {code: ifrs.long_term_lease_liabilities, form: position, kind: exact}
      ln38: {code: ifrs.total_current_liabilities, form: position, kind: exact}
      ln41: {code: ifrs.retained_earnings, form: position, kind: exact}
      ln42:
        code: ifrs.equity_attributable_to_owners_of_parent
        form: position
        kind: exact

      # **Нематериальные активы агрегатора включают гудвил** — у Черкизово
      # 7 451 + 2 723 = 10 174 ровно. Ни один показатель, флаг и стоп-фактор
      # на эту позицию не опирается, поэтому поле не грузится вовсе: величина
      # неизвестного состава хуже отсутствующей.
      ln7:
        code: ifrs.intangible_assets
        form: position
        kind: aggregate
        loaded: false
        covers: [ifrs.intangible_assets, ifrs.goodwill]
        seen_at: "Черкизово: 7 451 + гудвил 2 723 = 10 174"

      # **Краткосрочный долг агрегатора шире нашей позиции**: у ФосАгро 220 850
      # против 209 715 по документу, у О'КЕЙ 13 597 629 против 13 320 252.
      # Поле грузится, потому что без него не считается долг — величина
      # маршрута, — и расхождение объявлено здесь. Развилка о его составе
      # записана в NIGHT_QUESTIONS.md.
      # **Состав установлен 22.09.2026: разница — дивиденды к уплате.**
      # У ФосАгро 220 850 − 209 715 = 11 135, и ровно 11 135 стоит в балансе
      # строкой «Дивиденды к уплате» (примечание 19). Агрегатор кладёт их
      # в краткосрочный долг. Ошибка направлена в сторону завышения долга,
      # то есть для скрининга безопасна: эмитент скорее попадёт на разбор,
      # чем проскочит мимо.
      ln14:
        code: ifrs.short_term_borrowings
        form: position
        kind: aggregate
        loaded: true
        covers: [ifrs.short_term_borrowings, ifrs.dividends_payable]
        seen_at: >-
          ФосАгро: 220 850 против 209 715 по документу; разница 11 135 равна
          строке «Дивиденды к уплате» баланса. Завышение долга — безопасное
          для скрининга направление.

      # --- Отчёт о прибыли или убытке --------------------------------------
      ln23: {code: ifrs.revenue, form: profit_or_loss, kind: exact}
      ln24: {code: ifrs.gross_profit, form: profit_or_loss, kind: exact}
      ln25: {code: ifrs.profit_before_tax, form: profit_or_loss, kind: exact}
      ln26: {code: ifrs.profit_for_period, form: profit_or_loss, kind: exact}
      ln37: {code: ifrs.operating_profit, form: profit_or_loss, kind: exact}

      # --- Отчёт о движении денежных средств -------------------------------
      ln28: {code: ifrs.cash_from_operations, form: cash_flow, kind: exact}
      ln29: {code: ifrs.cash_from_investing, form: cash_flow, kind: exact}
      ln39: {code: ifrs.cash_from_financing, form: cash_flow, kind: exact}
      ln40: {code: ifrs.capital_expenditure, form: cash_flow, kind: exact}
      ln79: {code: ifrs.depreciation, form: cash_flow, kind: exact}

    # --- Сверки: поля, которые фактами не становятся -----------------------
    #
    # Общий долг и чистый долг агрегатора считаются им самим, и в фактах им
    # места нет: долг у нас собирается из срочностей, а чистый долг — разностью
    # с денежными средствами. Но сверка содержательна: у ЛСР чистый долг
    # агрегатора занижен ровно на величину счетов эскроу (217 501 на 31.12.2025
    # и 137 899 на 31.12.2024), то есть источник применяет собственную поправку.
    controls:
      identity:
        left: ln11
        right: ln21
        check: cbonds_identity_mismatch
      sums:
        - total: ln11
          parts: [ln6, ln10]
          check: cbonds_sections_mismatch
        - total: ln34
          parts: [ln14, ln17]
          check: cbonds_debt_split_mismatch
          origin: >-
            Тождество сходится у 3 281 строки из 3 283 на всём массиве рублёвых
            записей. Два расхождения нужно увидеть, а не отбросить, поэтому
            уровень предупреждающий.

    # Ноль у агрегатора не означает нуля: источник пишет ноль и там, где
    # величина не раскрыта. Итог, равный нулю при ненулевой деятельности, —
    # признак нераскрытия, а не пустого баланса.
    zero_total:
      totals: [ln11, ln20]
      activity: [ln23]
      check: cbonds_zero_total

    # Величины, которые агрегатор посчитал сам. Фактами они не становятся —
    # состав у них его, а не наш, — но хранятся с комплектом: по ним делается
    # сверка, а EBITDA источника служит заменой там, где состав не собрать.
    reported:
      ebitda: ln36
      debt_total: ln34
      net_debt: ln35
      revenue_yoy: ln71
      ebitda_margin: ln73

  # ---------------------------------------------------------------------------
  # Отчётность РСБУ агрегатора. **Устройство здесь другое, и различие
  # не в удобстве.**
  #
  # 1. **Поля названы кодами строк РСБУ.** `ln1600` означает строку 1600
  #    и ничего другого: коды форм утверждены приказом 66н, и агрегатор
  #    нормализует отчётность в них. Перечислять сто двадцать пять полей
  #    поимённо значило бы переписать справочник строк во второй файл —
  #    и обречь себя на расхождение двух перечней. Поэтому объявлено правило,
  #    а состав решает `lines.yaml`: код, которого в справочнике нет,
  #    не грузится и называется отдельным числом.
  # 2. **Комплект собирается из трёх доставок.** Баланс, отчёт о финансовых
  #    результатах и отчёт о движении денежных средств приходят разными
  #    методами, и одна строка источника несёт одну форму. Сводятся они
  #    по паре «ИНН, дата»: комплект РСБУ — это три формы одного периода.
  # 3. **Отчёт о движении денежных средств отбирается по идентификатору
  #    эмитента**: поля ИНН у него нет вовсе, а неподдерживаемое поле отбора
  #    Cbonds пропускает молча и отдаёт весь справочник.
  report_rsbu:
    standard: rsbu
    name: Отчётность РСБУ (нормализованная)
    annual_only: true
    deliveries:
      - method: get_report_rsbu_balance
        filter_field: emitent_inn
        cache: rsbu_get_report_rsbu_balance
      - method: get_report_rsbu_profit
        filter_field: emitent_inn
        cache: rsbu_get_report_rsbu_profit
      - method: get_report_cash_flow_statement_newform
        filter_field: emitent_id
        cache: rsbu_get_report_cash_flow_statement_newform

    # **Поле означает строку, а форму называет справочник.** Форма у строки
    # РСБУ одна и объявлена в `lines.yaml`; брать её у доставки значило бы
    # завести второй источник того же сведения.
    field_rule:
      pattern: "^ln(\\d{4})$"
      catalog: rsbu_lines
      origin: >-
        Проверено сверкой с выгрузкой ГИР БО 22.09.2026: 26 организаций,
        96 периодов, 3 929 величин совпали до копейки при сопоставлении
        «поле lnNNNN — строка NNNN». Правило, а не перечень: перечень
        разошёлся бы со справочником строк при первой же его правке.

    # **Валюта — не умолчание, а норма закона.** Денежное измерение объектов
    # бухгалтерского учёта производится в валюте Российской Федерации
    # (Федеральный закон № 402-ФЗ, статья 12), и отчётность РСБУ в иной
    # валюте не составляется. Поля валюты у этих доставок нет вовсе.
    currency: RUB
    currency_origin: >-
      Норма Федерального закона № 402-ФЗ, статья 12. Того же основания
      держится выгрузка ГИР БО, где поля валюты тоже нет.

    # **Единица берётся правилом «форма задаёт единицу»** — тем самым, которым
    # она определяется у ГИР БО (`lines.yaml`, блок `units`). Своего поля
    # единицы у доставки нет, и объявлять её здесь вторым местом нельзя:
    # ошибка в тысячу раз не ловится ни одним контролем сходимости, и второе
    # объявление той же величины однажды разойдётся с первым.
    unit_from: forms
    unit_origin: >-
      Правило `lines.yaml`, блок `units`: формы 0710001, 0710002 и 0710005
      несут единицу в заголовке и иных единиц не предусматривают. Подтверждено
      той же сверкой: 3 929 величин совпали с выгрузкой ГИР БО, где единица
      определяется этим правилом.

    # **Консолидации у РСБУ нет по устройству.** Отчётность РСБУ — отчётность
    # отдельного юридического лица, и признака стандарта в доставке нет.
    # Объявлено явно: молчание читалось бы как «проверку забыли».
    consolidation_required: false
    consolidation_origin: >-
      Стандарт `rsbu` и означает отчётность отдельного юридического лица;
      консолидированная отчётность приходит стандартом `ifrs`. Проверять
      здесь нечего, и признака стандарта у этих доставок нет.

    reporting_type: full
    reporting_type_origin: >-
      Агрегатор нормализует отчётность в коды полного набора: во всех
      сохранённых ответах встречаются только они. Право на упрощённую форму
      относится к сданному комплекту, и комплект агрегатора — не он:
      это прочтение отчётности, приведённое к полному набору.

    # **Расходная статья хранится величиной расхода, а не отрицательным
    # числом** — то же правило, что у выгрузки ГИР БО и у ручной подачи:
    # знак задаёт оператор в составе итога, а строка помечена `in_brackets`.
    sign_rule: expense_magnitude
    sign_origin: >-
      Замер 22.09.2026 на сохранённых ответах против наших фактов ГИР БО:
      у строк с `in_brackets` знак обратный нашему в 280 случаях против 29
      совпавших — агрегатор печатает расход отрицательным числом. У прочих
      строк знаки совпадают: 2 856 совпадений против двух расхождений,
      и оба по строке 2410, где соглашение о знаке различается и в самой
      отчётности.

    # **Допуск берётся из методики контролей, а не задаётся здесь числом.**
    # Нормализованная отчётность РСБУ приходит в тысячах рублей, и сумма
    # разделов расходится с итогом на единицу у восьми организаций набора —
    # это округление составителя, а не дефект. Точное равенство отправляло
    # такие комплекты в карантин; допуск тот же, которым пользуются контроли
    # сходимости РСБУ (`thresholds.yaml`, блок `rounding`).
    controls:
      identity:
        left: ln1600
        right: ln1700
        check: cbonds_identity_mismatch
        tolerance_from: thresholds.rounding
      sums:
        - total: ln1600
          parts: [ln1100, ln1200]
          check: cbonds_sections_mismatch
          tolerance_from: thresholds.rounding
        - total: ln1700
          parts: [ln1300, ln1400, ln1500]
          check: cbonds_sections_mismatch
          tolerance_from: thresholds.rounding

    # Ноль итога при ненулевой деятельности — признак нераскрытия, а не
    # пустого баланса. Выручка приходит другой доставкой того же периода,
    # и сведённый комплект её уже содержит.
    zero_total:
      totals: [ln1600, ln1300]
      activity: [ln2110]
      check: cbonds_zero_total

# **Замены объявлены методикой, а не подобраны загрузчиком.**
substitutions:
  debt_total:
    primary: ln34
    fallback: [ln14, ln17]
    origin: >-
      Общий долг берётся суммой срочностей: тождество ln34 = ln14 + ln17
      сходится у 3 281 строки из 3 283, а поле общего долга пусто у 58
      эмитентов из 455 — там, впрочем, пусты и срочности, так что замена
      их не спасает. Правило объявлено ради обратного случая.
  ebitda:
    primary: [ln37, ln79]
    fallback: ln36
    shown_as: по данным источника, упрощённая
    origin: >-
      EBITDA собирается из операционной прибыли и амортизации. Амортизация
      не раскрыта у 110 эмитентов из 455, и тогда берётся поле источника —
      с пометкой: состав его нам неизвестен, и у ЛСР оно даёт 68 369 против
      61 159 по составу. Нулевое значение поля заменой не считается: ноль
      здесь означает «не раскрыто».
