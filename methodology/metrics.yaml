# Определения показателей финансового состояния.
#
# ПОЛЯ «НОРМАТИВ» ЗДЕСЬ НЕТ И НЕ БУДЕТ. Абсолютные опорные точки шкал
# вынесены в scoring.yaml (секция calibration_points) и объявлены там
# экспертной калибровкой, а не нормативом: они подлежат замене на отраслевые
# перцентили по мере накопления базы отчётностей. В определении показателя
# остаются только его смысл, формула и чувствительность к изменению.
#
# stop_factor — немногие пороги, содержательные вне отрасли (отрицательный
# собственный капитал, покрытие процентов меньше единицы). Помечены явно.
#
# in_scoring: false — показатель рассчитывается и попадает в заключение,
# но в балл не идёт: он либо дублирует другой, либо служит стоп-фактором,
# а не измерением. Причина обязательна.
#
# Язык формул. Четырёхзначное число — код строки отчётности. avg(код) —
# полусумма на начало и конец периода, требует предыдущего периода.
# Прописные имена — константы из thresholds.yaml. Числовых литералов
# в формулах нет: любое число либо код строки, либо именованная константа.
#
# formulas.simplified — переопределение формулы для упрощённой отчётности,
# где состав строк другой. Показатель без переопределения и без
# упрощённого набора в applicable_to для упрощённых форм не рассчитывается
# и получает статус not_applicable_form.

version: "1.2.0"

# Производные величины: изменения за период и вертикальная структура.
#
# Зачем. Темпы изменения нужны в заключении постоянно («дебиторская
# задолженность сократилась на 59,6 %»), но во входных данных модели их нет.
# Без них модель вынуждена либо считать сама — прямое нарушение инварианта 1,
# либо молчать о динамике, ради которой методика и построена. Поэтому
# изменения и доли считаются здесь и подаются готовыми, каждая со своим кодом.
#
# Коды: {база}_chg_abs — изменение за период в единицах базы,
# {база}_chg_pct — то же в процентах, {база}_share — доля в валюте баланса.
# База — либо код строки отчётности (1230_chg_pct), либо код показателя
# (cur_liq_chg_abs).
#
# В балльную оценку производные не входят: балл считается по показателям
# из metrics, а динамика уже учтена в нём слагаемым dynamics. Иначе одно
# и то же изменение вошло бы в оценку дважды.
derived:
  change:
    # Изменения считаются не для всех строк подряд: строка, о которой
    # в заключении не говорят, только раздувает контекст модели.
    lines:
      # Актив
      ["1100", "1150", "1170", "1200", "1210", "1230", "1240", "1250", "1600",
      # Пассив
       "1300", "1370", "1400", "1410", "1500", "1510", "1520", "1700",
      # Финансовые результаты
       "2110", "2120", "2200", "2300", "2330", "2400",
      # Движение денежных средств
       "4100", "4200", "4300"]
    # Изменения показателей считаются для всех рассчитанных: их всего 21,
    # и выбирать среди них было бы произволом.
    metrics: true
  share:
    denominator: "1600"
    # Только строки баланса: доля выручки в валюте баланса смысла не имеет.
    # 1600 и 1700 в список не входят — их доля равна 100 по определению.
    lines:
      ["1100", "1150", "1170", "1200", "1210", "1230", "1240", "1250",
       "1300", "1370", "1400", "1410", "1500", "1510", "1520"]
    note: >-
      Доля строки в валюте баланса рассчитана к итогу актива (строка 1600).
      Строки, не раскрытые в отчётности, в структуре не показаны, поэтому
      сумма приведённых долей меньше 100 %.

# Происхождение отсечек существенного изменения. Блок обязателен: без него
# методика не загрузится, а текст уходит в раздел «Ограничения анализа».
# Общий, а не копия у каждого из 21 показателя: происхождение у всех отсечек
# одно, и двадцать одна копия разъехалась бы при первой правке.
calibration:
  material_change:
    organizations: 3
    observations: 159
    source: Пробы ГИР БО в data/raw/probe
    note: >-
      Отсечки существенного изменения (material_change) округлены от медианы
      относительных изменений каждого показателя между периодами. Калибровка
      выполнена на трёх организациях и 159 наблюдениях и подлежит уточнению
      на эталонном наборе задачи 11. Значения задают только масштаб
      чувствительности к динамике и не являются нормативами.

# benchmark — бесспорный ориентир: только знак или единица. Ни одного
# отраслевого порога. Есть у 11 показателей из 21; у остальных уровень
# не оценивается, и балл строится на одной динамике.

groups:
  liquidity:
    name: Ликвидность
  capital_structure:
    name: Структура капитала
  debt_service:
    name: Обслуживание долга
  profitability:
    name: Рентабельность
  turnover:
    name: Оборачиваемость

metrics:

  # --- Ликвидность ----------------------------------------------------------

  - code: cur_liq
    name: Коэффициент текущей ликвидности
    group: liquidity
    unit: ratio
    direction: higher_better
    material_change: "0.15"
    benchmark: "1"
    denominator_must_be_positive: true
    formula: "1200 / 1500"
    formulas:
      simplified: "(1210 + 1240 + 1250) / (1510 + 1520 + 1550)"
    applicable_to: [full, simplified]

  - code: quick_liq
    name: Коэффициент быстрой ликвидности
    group: liquidity
    unit: ratio
    direction: higher_better
    material_change: "0.20"
    denominator_must_be_positive: true
    in_scoring: false
    scoring_exclusion_reason: >-
      Нет шкалы уровня: бесспорного ориентира у показателя нет, а придумывать
      отраслевой порог запрещено. Показатель с одной лишь динамикой награждал бы
      за улучшение того, чей уровень мы оценить не умеем.
    formula: "(1230 + 1240 + 1250) / 1500"
    applicable_to: [full]
    methodology_note: >-
      В упрощённой отчётности не рассчитывается: дебиторская задолженность
      и финансовые вложения слиты в укрупнённую строку, выделить их нельзя.

  - code: abs_liq
    name: Коэффициент абсолютной ликвидности
    group: liquidity
    unit: ratio
    direction: higher_better
    material_change: "0.50"
    denominator_must_be_positive: true
    in_scoring: false
    scoring_exclusion_reason: >-
      Нет шкалы уровня: бесспорного ориентира у показателя нет, а придумывать
      отраслевой порог запрещено.
    formula: "(1240 + 1250) / 1500"
    applicable_to: [full]
    methodology_note: >-
      В упрощённой отчётности не рассчитывается: строка 1240 там включает
      дебиторскую задолженность и финансовыми вложениями не является.

  - code: nwc
    name: Чистый оборотный капитал
    group: liquidity
    unit: thousand_rub
    direction: higher_better
    material_change: "0.40"
    benchmark: "0"
    formula: "1200 - 1500"
    formulas:
      simplified: "(1210 + 1240 + 1250) - (1510 + 1520 + 1550)"
    applicable_to: [full, simplified]
    stop_factor:
      condition: lt
      value: "0"
      note: >-
        Отрицательный чистый оборотный капитал означает, что краткосрочные
        обязательства финансируют внеоборотные активы. Порог содержателен
        вне отрасли.

  # --- Финансовая устойчивость ----------------------------------------------

  - code: equity
    name: Собственный капитал (строка 1300)
    group: capital_structure
    unit: thousand_rub
    direction: higher_better
    material_change: "0.30"
    benchmark: "0"
    in_scoring: false
    scoring_exclusion_reason: >-
      Это стоп-фактор, а не измерение: отрицательный собственный капитал
      опускает класс до низшего независимо от балла. Начислять за него ещё
      и баллы значило бы учитывать одно обстоятельство дважды. Показатель
      рассчитывается и приводится в заключении справочно.
    formula: "1300"
    applicable_to: [full, simplified]
    note: >-
      Это итог раздела III баланса, а не чистые активы по методике Минфина
      (приказ от 28.08.2014 № 84н). Та методика исключает задолженность
      участников по взносам в уставный капитал и учитывает часть доходов
      будущих периодов; ни то, ни другое в формах 0710001 и 0710002
      отдельными строками не раскрывается, поэтому рассчитать её по нашим
      входным данным невозможно. Для организаций без задолженности
      участников и без целевых доходов будущих периодов величины совпадают.
    stop_factor:
      condition: lt
      value: "0"
      note: >-
        Отрицательный собственный капитал — признак того, что обязательства
        превышают активы. Порог содержателен вне отрасли.

  # Ориентира у автономии нет намеренно. «Больше нуля» дублирует ориентир
  # собственного капитала: отрицательная автономия возможна только при
  # отрицательном капитале. С таким ориентиром организация с автономией 5 %
  # получала бы за уровень полный балл — ориентир не нёс бы информации.
  - code: equity_ratio
    name: Коэффициент автономии
    group: capital_structure
    unit: ratio
    direction: higher_better
    material_change: "0.10"
    denominator_must_be_positive: true
    formula: "1300 / 1700"
    applicable_to: [full, simplified]
    stop_factor:
      condition: lt
      value: "0"
      note: >-
        Отрицательное значение возможно только при отрицательном собственном
        капитале и означает то же самое.

  - code: debt_to_equity
    name: Отношение обязательств к собственному капиталу
    group: capital_structure
    unit: ratio
    direction: lower_better
    material_change: "0.40"
    denominator_must_be_positive: true
    in_scoring: false
    scoring_exclusion_reason: >-
      Нет шкалы уровня: бесспорного ориентира у показателя нет. Кроме того,
      структура капитала уже измеряется коэффициентом автономии, у которого
      шкала есть.
    formula: "(1400 + 1500) / 1300"
    formulas:
      simplified: "(1700 - 1300) / 1300"
    applicable_to: [full, simplified]

  - code: own_wc_ratio
    name: Обеспеченность собственными оборотными средствами
    group: liquidity
    unit: ratio
    direction: higher_better
    material_change: "0.70"
    benchmark: "0"
    denominator_must_be_positive: true
    formula: "(1300 - 1100) / 1200"
    formulas:
      simplified: "(1300 - 1150 - 1170) / (1210 + 1240 + 1250)"
    applicable_to: [full, simplified]

  - code: fin_leverage
    name: Финансовый рычаг
    group: capital_structure
    unit: ratio
    direction: lower_better
    material_change: "0.10"
    denominator_must_be_positive: true
    in_scoring: false
    scoring_exclusion_reason: >-
      Финансовый рычаг есть монотонная функция коэффициента автономии
      (1700 / 1300 против 1300 / 1700) и измеряет то же самое. Учитывать оба
      в балле — значит удвоить вес структуры капитала. Показатель
      рассчитывается и приводится в заключении справочно.
    formula: "1700 / 1300"
    applicable_to: [full, simplified]

  # --- Долговая нагрузка ----------------------------------------------------

  - code: debt_total
    name: Совокупный долг
    group: debt_service
    unit: thousand_rub
    direction: lower_better
    material_change: "0.20"
    in_scoring: false
    scoring_exclusion_reason: >-
      Нет шкалы уровня: это абсолютная величина в тысячах рублей, и бесспорного
      ориентира у неё быть не может. Долговая нагрузка оценивается через
      покрытие процентов, у которого ориентир есть.
    formula: "1410 + 1510"
    applicable_to: [full, simplified]
    note: >-
      В расчёт входят только заёмные средства — строки 1410 и 1510.
      Обязательства по аренде, кредиторская задолженность, оценочные и прочие
      обязательства сюда не включены: отдельными строками они не раскрываются
      и по характеру не являются заёмным финансированием.

  - code: net_debt
    name: Чистый долг
    group: debt_service
    unit: thousand_rub
    direction: lower_better
    material_change: "0.15"
    in_scoring: false
    scoring_exclusion_reason: >-
      Нет шкалы уровня: абсолютная величина в тысячах рублей, бесспорного
      ориентира быть не может.
    formula: "1410 + 1510 - 1250"
    applicable_to: [full, simplified]
    note: >-
      Совокупный долг за вычетом денежных средств. Ограничение по составу
      долга — то же, что у показателя «Совокупный долг».

  - code: debt_to_op_profit
    name: Чистый долг к прибыли от продаж
    group: debt_service
    unit: ratio
    direction: lower_better
    material_change: "1.00"
    in_scoring: false
    scoring_exclusion_reason: >-
      Нет шкалы уровня. Бесспорного ориентира нет, а знаменатель — прибыль
      от продаж — может быть отрицательным при убытке, и тогда отношение
      читалось бы как низкая долговая нагрузка.
    formula: "(1410 + 1510 - 1250) / 2200"
    applicable_to: [full]
    note: >-
      Это НЕ «Чистый долг / EBITDA». Амортизация в формах 0710001, 0710002
      и 0710005 не раскрывается — она приводится в пояснениях, которые
      методикой не разбираются, поэтому EBITDA рассчитать нельзя. Показатель
      назван по фактическому знаменателю, чтобы не выдавать одно за другое.

  - code: interest_cover
    name: Покрытие процентов прибылью от продаж
    group: debt_service
    unit: ratio
    direction: higher_better
    material_change: "1.00"
    benchmark: "1"
    denominator_must_be_positive: true
    formula: "2200 / 2330"
    applicable_to: [full]
    zero_denominator_note: >-
      Проценты к уплате раскрыты и равны нулю. Если при этом у организации
      есть заёмные средства по строкам 1410 или 1510, отсутствие процентных
      расходов требует пояснения: это сигнал, а не отсутствие данных.
    stop_factor:
      condition: lt
      value: "1"
      note: >-
        Покрытие меньше единицы означает, что прибыли от продаж не хватает
        на обслуживание процентов. Порог содержателен вне отрасли.

  # --- Рентабельность -------------------------------------------------------

  - code: gross_margin
    name: Валовая рентабельность
    group: profitability
    unit: ratio
    direction: higher_better
    material_change: "0.30"
    benchmark: "0"
    denominator_must_be_positive: true
    formula: "2100 / 2110"
    applicable_to: [full]
    methodology_note: >-
      В упрощённой отчётности не рассчитывается: валовой прибыли там нет,
      а строка 2120 включает коммерческие и управленческие расходы.

  - code: op_margin
    name: Рентабельность продаж
    group: profitability
    unit: ratio
    direction: higher_better
    material_change: "1.00"
    benchmark: "0"
    denominator_must_be_positive: true
    formula: "2200 / 2110"
    applicable_to: [full]

  - code: net_margin
    name: Чистая рентабельность
    group: profitability
    unit: ratio
    direction: higher_better
    material_change: "0.50"
    benchmark: "0"
    denominator_must_be_positive: true
    formula: "2400 / 2110"
    applicable_to: [full, simplified]

  - code: roa
    name: Рентабельность активов
    group: profitability
    unit: ratio
    direction: higher_better
    material_change: "1.00"
    benchmark: "0"
    denominator_must_be_positive: true
    formula: "2400 / avg(1600)"
    applicable_to: [full, simplified]

  - code: roe
    name: Рентабельность собственного капитала
    group: profitability
    unit: ratio
    direction: higher_better
    material_change: "1.00"
    benchmark: "0"
    denominator_must_be_positive: true
    formula: "2400 / avg(1300)"
    applicable_to: [full, simplified]

  # --- Оборачиваемость ------------------------------------------------------

  - code: asset_turnover
    name: Оборачиваемость активов
    group: turnover
    unit: ratio
    direction: higher_better
    material_change: "0.20"
    denominator_must_be_positive: true
    in_scoring: false
    scoring_exclusion_reason: >-
      Нет шкалы уровня: бесспорного ориентира у оборачиваемости быть не может,
      она целиком отраслевая. Показатель рассчитывается и приводится
      в заключении, но балл по нему был бы наградой за рост без понимания
      исходного положения.
    formula: "2110 / avg(1600)"
    applicable_to: [full, simplified]

  - code: receivables_days
    name: Оборачиваемость дебиторской задолженности, дней
    group: turnover
    unit: days
    direction: lower_better
    material_change: "0.15"
    denominator_must_be_positive: true
    in_scoring: false
    scoring_exclusion_reason: >-
      Нет шкалы уровня: сколько дней оборачиваемости дебиторки считать хорошим
      результатом — вопрос отрасли, а отраслевых порогов у нас нет.
    formula: "DAYS * avg(1230) / 2110"
    applicable_to: [full]
    methodology_note: >-
      В упрощённой отчётности не рассчитывается: дебиторская задолженность
      отдельной строкой не раскрывается.

  - code: inventory_days
    name: Оборачиваемость запасов, дней
    group: turnover
    unit: days
    direction: lower_better
    material_change: "0.20"
    denominator_must_be_positive: true
    in_scoring: false
    scoring_exclusion_reason: >-
      Нет шкалы уровня: нормальная оборачиваемость запасов у торговли
      и у тяжёлого машиностроения различается на порядок.
    formula: "DAYS * avg(1210) / 2120"
    applicable_to: [full]
    methodology_note: >-
      В упрощённой отчётности не рассчитывается: строка 2120 там означает
      все расходы по обычной деятельности, а не себестоимость продаж,
      и знаменатель был бы несопоставим.
