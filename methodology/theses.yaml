# Предписанные интерпретации показателей (задача 18).
#
# НАЗНАЧЕНИЕ. Модель не истолковывает показатели. Расчёт выбирает из этого
# справочника готовые утверждения — тезисы — по машинным признакам и
# подставляет в них величины. Модель получает перечень тезисов и связывает
# их в текст: порядок, переходы, членение на абзацы — её работа, содержание
# утверждений — наша. Утверждение, которого в перечне нет, в заключение
# попасть не может.
#
# ОСНОВАНИЕ. Три пилотных документа дали шесть методологических ошибок
# интерпретации при чистом расчётном ядре — все в свободно сгенерированном
# тексте. Самый показательный случай: приложение к тому же документу прямо
# предупреждало, что знаменатель debt_to_op_profit может быть отрицательным,
# и модель воспроизвела именно эту ошибку.
#
# ПРАВИЛА ТЕКСТА. Тезис модель обязана привести дословно, поэтому он сам
# проходит постпроверку — по тем же правилам, что и ответ модели:
#   - слова «норматив», «при норме», «не менее», «должен составлять»
#     запрещены: абсолютных нормативов методика не содержит принципиально;
#   - сравнений с числом («ниже 1,0», «меньше 100 %») в тексте нет вовсе;
#     отношение величин выражается словами — «оборотных активов меньше,
#     чем краткосрочных обязательств»;
#   - число стоит при своём коде, и код предшествует величинам:
#     «Коэффициент текущей ликвидности (cur_liq) 0,82»;
#   - глагол согласован со знаком изменения: «сократилась на 59,6 %», а не
#     «сократилась на −59,6 %»;
#   - у показателей в днях сокращение периода оборота — ускорение, а не
#     замедление; формулировки об этом заданы отдельно;
#   - единицы измерения в тексте не пишутся вовсе: их подставляет единая
#     точка округления вместе с величиной («1 235 тыс. руб.», «45,0 дн.»).
#     Написанная в тексте единица либо задвоится, либо переврёт показатель:
#     чистая рентабельность — отношение, и «0,91 %» вместо «0,91» ошибается
#     в сто раз;
#   - глагол согласуется с родом наименования показателя, поэтому формы
#     глаголов объявлены отдельно, а род — у каждого показателя.
#
# ЧЕГО ЗДЕСЬ НЕТ. Стоп-факторы, флаги, надзорные сигналы и оговорки
# справочников сюда не дублируются: их формулировки уже предписаны
# в scoring.yaml, flags.yaml, signals.yaml и lines.yaml, и приходят
# в своих блоках. Тезис называет состояние показателя, а не последствие
# для класса.

version: "0.1.0"

# --- Подстановки ------------------------------------------------------------
#
# Величины подставляет расчёт; модель не считает ничего (инвариант 1).
# Разрядность — единая точка округления, metrics/display.py: в тезис идёт
# та же округлённая величина, что в приложение и в таблицу показателей.
slots:
  name: >-
    Наименование показателя: короткое из short_names, если оно задано,
    иначе наименование из metrics.yaml
  code: Код показателя; ставится перед величинами
  verb: Форма глагола по роду наименования показателя, из блока verbs
  value: >-
    Значение за отчётный период вместе с единицей измерения, как его даёт
    metrics/display.py: единицу в текст писать не нужно
  previous: Значение за предыдущий период, так же с единицей
  lines: Перечень кодов строк отчётности, которых не хватило
  change_abs: Изменение за период, величина со знаком, с единицей
  change_pct: Изменение за период в процентах, величина со знаком
  # Коды производных величин: приписываются к своему числу справа в скобках,
  # как того требует формат prompts/rules.md. Без них постпроверка привязала
  # бы изменение к коду самого показателя и сочла бы его чужим.
  change_code: Код изменения за период — {code}_chg_abs
  change_pct_code: Код процентного изменения — {code}_chg_pct
  period: Отчётная дата периода
  reason: Причина, по которой показатель не рассчитан

# --- Признаки выбора --------------------------------------------------------
#
# Все признаки машинные: считаются расчётом по величинам, а не подбираются.
# Признак, которого нет у показателя, не даёт тезиса вовсе — выдумывать
# уровень там, где шкалы нет, мы не будем.
selectors:
  status:
    description: Рассчитан показатель или нет; при отказе — машинная причина
    values: [ok, not_calculable]
  position:
    description: >-
      Положение величины относительно бесспорного ориентира (benchmark
      в metrics.yaml — только знак либо единица). Это не норматив и не
      отраслевой порог: ориентир либо арифметический (ноль отделяет прибыль
      от убытка), либо тождественный (единица отделяет превышение активов
      над обязательствами). У показателя без ориентира признака нет.
    values: [above, at, below]
  band:
    description: >-
      Часть калибровочной шкалы, в которую попала величина: шкала задана
      в scoring.yaml и объявлена экспертной калибровкой. Есть только
      у показателей со шкалой. В тексте шкала называется своим именем —
      калибровочной шкалой методики, а не нормой.
    values: [lower, middle, upper]
  sign:
    description: >-
      Знак величины. От положения относительно ориентира отличается тем, что
      ориентира не требует: знак — арифметика, а не калибровка. Нужен там, где
      бесспорного ориентира у показателя нет, а знак сам по себе содержателен
      (отрицательный чистый долг означает, что денег и финансовых вложений
      больше, чем долга).
    values: [positive, negative, zero]
  dynamics:
    description: >-
      Направление изменения за период относительно material_change
      показателя: изменение меньше существенного считается устойчивостью,
      а не движением.
    values: [grew, fell, stable]
  sign_change:
    description: Величина сменила знак между периодами
    values: [to_positive, to_negative]

# Условие по другому показателю: тезис не выдаётся, если состояние соседнего
# показателя делает его ложным (`unless`), либо выдаётся только при таком
# состоянии (`only_if`). Нужно ровно там, где показатель арифметически
# считается, а истолкованию не подлежит.
cross_conditions:
  unless: Тезис не выдаётся при названном состоянии другого показателя
  only_if: Тезис выдаётся только при названном состоянии другого показателя

# --- Границы частей калибровочной шкалы -------------------------------------
#
# Признак `band` отвечает, в какую часть шкалы попала величина, и считается
# по баллу уровня, который даёт сама шкала (`scoring.yaml`), а не по значению
# показателя: у каждого показателя шкала своя, и общих границ по значению
# не существует. Свободных чисел в коде быть не должно, поэтому границы
# объявлены здесь.
bands:
  lower_below: "34"
  upper_from: "67"
  origin: >-
    Границы взяты третями стобалльной шкалы уровня. Это не норматив
    и не отраслевой порог: сама шкала объявлена экспертной калибровкой
    в scoring.yaml, а трети лишь делят её на нижнюю, среднюю и верхнюю части
    для словесного описания. Подлежат пересмотру вместе со шкалами при
    переходе к отраслевым перцентилям.

# --- Тезисы надзорных сигналов ----------------------------------------------
#
# Сигнал входит в перечень тезисов наравне с показателями, а не отдельным
# списком наименований. Причина в связи разделов: раздел 3 истолковывает
# показатели, раздел 4 перечисляет сигналы, и если в промпте это два
# несвязанных перечня, связь между ними строит модель — ровно то, от чего
# уводит переход к предписанным формулировкам.
#
# Поэтому связь делает расчёт. У сигнала есть строки отчётности, по которым
# он посчитан; у тезиса показателя — строки его формулы. Пересечение непусто —
# сигнал и тезис говорят об одном обстоятельстве, и это напечатано прямо.
#
# Предписанная формулировка сигнала сюда не идёт: её печатает расчёт
# в разделе 4 документа, и дублировать её модели незачем. Идут величина
# и отсечка — те самые, которых модели прежде не хватало, чтобы истолковать
# сигнал в разделе 3, — уже набранные расчётом (`value_shown`,
# `threshold_shown`) и потому не расходящиеся с разделом 4.
signals:
  # Первая строка тезиса сигнала повторяет разметку блока ПОКАЗАТЕЛИ: код,
  # наименование в кавычках, величины. Без этого постпроверка не нашла бы
  # для величины сигнала кода и объявила бы её приведённой без привязки.
  headline: >-
    {code}  «{name}»  уровень {level}  |  величина {value}  |  отсечка {threshold}
  # Связь, посчитанная нами. Печатается у каждого сигнала, даже когда
  # связанных тезисов нет: пустая графа говорит, что сигнал опирается
  # не на показатели, а на качество отчётности.
  lines_prefix: "строки отчётности:"
  metrics_prefix: "об этом же говорят тезисы о показателях:"
  no_metrics: "тезисов о показателях, опирающихся на те же строки, нет"
  levels:
    attention: внимания
    supervisory: надзорный

# --- Род наименований и формы глаголов --------------------------------------
#
# «Рентабельность активов вырос» — не по-русски, а общие формулировки динамики
# одни на все показатели. Поэтому род объявлен у каждого показателя, а формы
# глаголов — здесь. Показатель, рода которого нет в перечне, общих тезисов
# динамики не получает: подставлять мужской род по умолчанию значит
# согласиться на такую же ошибку.
verbs:
  grew: {m: вырос, f: выросла, n: выросло}
  fell: {m: снизился, f: снизилась, n: снизилось}
  changed: {m: изменился, f: изменилась, n: изменилось}
  shortened: {m: сократился, f: сократилась, n: сократилось}
  moved: {m: перешёл, f: перешла, n: перешло}

# Род объявляется по тому наименованию, которое печатается, — то есть
# по короткому, если оно задано ниже. Проверено на живых данных: у
# `receivables_days` наименование справочника показателей женского рода
# («Оборачиваемость дебиторской задолженности»), а печатается короткое
# мужского («Период оборота дебиторской задолженности»), и глагол
# согласовывался не с тем.
genders:
  cur_liq: m
  quick_liq: m
  abs_liq: m
  nwc: m
  equity: m
  equity_ratio: m
  debt_to_equity: n        # отношение обязательств к собственному капиталу
  own_wc_ratio: f          # обеспеченность собственными оборотными средствами
  fin_leverage: m
  debt_total: m
  net_debt: m
  debt_to_op_profit: m     # «Чистый долг к прибыли от продаж»
  interest_cover: n        # «Покрытие процентов прибылью от продаж»
  gross_margin: f
  op_margin: f
  net_margin: f
  roa: f
  roe: f
  asset_turnover: f
  receivables_days: m      # «Период оборота дебиторской задолженности»
  inventory_days: m        # «Период оборота запасов»

# Короткие наименования для общих формулировок: в metrics.yaml наименование
# несёт уточнение, которое рядом с кодом показателя читается как повтор
# («Собственный капитал (строка 1300) (equity)»).
short_names:
  equity: Собственный капитал
  receivables_days: Период оборота дебиторской задолженности
  inventory_days: Период оборота запасов

# --- Общие тезисы -----------------------------------------------------------
#
# Применимы к любому показателю: говорят о факте расчёта и о движении
# величины, но не о её содержании.
common:
  # Причина отказа берётся машинным кодом, а не пересказом текста расчёта:
  # текст причины содержит величины без кодов («знаменатель = -442.000»),
  # и, попав в заключение, они стали бы посторонними числами.
  status:
    - code: missing_lines
      when: {status: not_calculable, reason_code: missing_lines}
      text: >-
        Показатель «{name}» ({code}) не рассчитан: в отчётности не раскрыты
        строки {lines}.
    - code: no_previous_period
      when: {status: not_calculable, reason_code: no_previous_period}
      text: >-
        Показатель «{name}» ({code}) не рассчитан: он считается по средним
        величинам, а данных за предыдущий период нет.
    - code: zero_denominator
      when: {status: not_calculable, reason_code: zero_denominator}
      text: >-
        Показатель «{name}» ({code}) не рассчитан: знаменатель обратился
        в ноль, и отношение не определено.
    - code: negative_denominator
      when: {status: not_calculable, reason_code: negative_denominator}
      text: >-
        Показатель «{name}» ({code}) не рассчитан: знаменатель отрицателен,
        и отношение не истолковывается.
    - code: not_in_form
      when: {status: not_calculable, reason_code: not_in_form}
      text: >-
        Показатель «{name}» ({code}) не рассчитан: набор строк сданной
        отчётности его не предусматривает.

  dynamics:
    - code: grew
      when: {dynamics: grew}
      units: [ratio, thousand_rub]
      text: >-
        {name} ({code}) {verb} с {previous} до {value}, изменение
        {change_abs} ({change_code}).
      verb: grew
    - code: fell
      when: {dynamics: fell}
      units: [ratio, thousand_rub]
      text: >-
        {name} ({code}) {verb} с {previous} до {value}, изменение
        {change_abs} ({change_code}).
      verb: fell
    - code: stable
      when: {dynamics: stable}
      units: [ratio, thousand_rub, days]
      text: >-
        {name} ({code}) за период {verb} незначительно: {previous}
        в прошлом периоде, {value} в отчётном.
      verb: changed
    # Показатели в днях: сокращение периода оборота означает ускорение,
    # и глагол обязан этому соответствовать.
    - code: days_shorter
      when: {dynamics: fell}
      units: [days]
      text: >-
        {name} ({code}) {verb} с {previous} до {value}: оборот ускорился.
      verb: shortened
    - code: days_longer
      when: {dynamics: grew}
      units: [days]
      text: >-
        {name} ({code}) {verb} с {previous} до {value}: оборот замедлился.
      verb: grew

  sign_change:
    - code: to_negative
      when: {sign_change: to_negative}
      text: >-
        {name} ({code}) {verb} из положительных величин в отрицательные:
        {previous} в прошлом периоде, {value} в отчётном. Темп изменения
        для такого перехода не приводится.
      verb: moved
    - code: to_positive
      when: {sign_change: to_positive}
      text: >-
        {name} ({code}) {verb} из отрицательных величин в положительные:
        {previous} в прошлом периоде, {value} в отчётном. Темп изменения
        для такого перехода не приводится.
      verb: moved

# --- Тезисы по показателям --------------------------------------------------
#
# Здесь только то, что говорит о содержании показателя у этой организации.
# Показатель, у которого нет ни ориентира, ни шкалы, описывается общими
# тезисами динамики — и это осознанно: уровень его методикой не оценивается.
metrics:
  # --- Ликвидность ---------------------------------------------------------
  cur_liq:
    position:
      - code: cur_liq_above
        when: {position: above}
        text: >-
          Оборотных активов больше, чем краткосрочных обязательств:
          коэффициент текущей ликвидности ({code}) {value}.
      - code: cur_liq_at
        when: {position: at}
        text: >-
          Оборотные активы и краткосрочные обязательства равны: коэффициент
          текущей ликвидности ({code}) {value}.
      - code: cur_liq_below
        when: {position: below}
        text: >-
          Краткосрочных обязательств больше, чем оборотных активов:
          коэффициент текущей ликвидности ({code}) {value}. Погашение
          обязательств отчётного года за счёт оборотных активов целиком
          не обеспечено.

  nwc:
    position:
      - code: nwc_above
        when: {position: above}
        text: >-
          Чистый оборотный капитал ({code}) положителен и составляет {value}:
          оборотные активы покрывают краткосрочные обязательства с запасом.
      - code: nwc_below
        when: {position: below}
        text: >-
          Чистый оборотный капитал ({code}) отрицателен: {value}. Часть
          внеоборотных активов профинансирована краткосрочными
          обязательствами.

  own_wc_ratio:
    position:
      - code: own_wc_above
        when: {position: above}
        text: >-
          Часть оборотных активов профинансирована собственными средствами:
          обеспеченность собственными оборотными средствами ({code}) {value}.
      - code: own_wc_below
        when: {position: below}
        text: >-
          Собственных оборотных средств у организации нет: обеспеченность
          собственными оборотными средствами ({code}) {value}. Оборотные
          активы сформированы заёмными источниками полностью.

  # --- Структура капитала --------------------------------------------------
  equity:
    position:
      - code: equity_above
        when: {position: above}
        text: >-
          Собственный капитал ({code}) положителен: {value}.
      - code: equity_below
        when: {position: below}
        text: >-
          Собственный капитал ({code}) отрицателен: {value}. Обязательства
          организации превышают её активы.

  equity_ratio:
    band:
      - code: equity_ratio_upper
        when: {band: upper}
        text: >-
          Коэффициент автономии ({code}) {value} — верхняя часть калибровочной
          шкалы методики: деятельность опирается преимущественно
          на собственные источники.
      - code: equity_ratio_middle
        when: {band: middle}
        text: >-
          Коэффициент автономии ({code}) {value} — средняя часть калибровочной
          шкалы методики: собственные и заёмные источники сопоставимы.
      - code: equity_ratio_lower
        when: {band: lower}
        text: >-
          Коэффициент автономии ({code}) {value} — нижняя часть калибровочной
          шкалы методики: деятельность опирается преимущественно на заёмные
          источники.

  # --- Обслуживание долга ---------------------------------------------------
  interest_cover:
    position:
      - code: interest_cover_above
        when: {position: above}
        text: >-
          Прибыли от продаж хватает на проценты к уплате: покрытие процентов
          ({code}) {value}.
      - code: interest_cover_below
        when: {position: below}
        text: >-
          Прибыли от продаж не хватает на проценты к уплате: покрытие
          процентов ({code}) {value}.

  # Бесспорного ориентира у чистого долга нет, и вводить его мы не будем:
  # уровень долговой нагрузки отраслевой. Содержателен только знак.
  net_debt:
    sign:
      - code: net_debt_negative
        when: {sign: negative}
        text: >-
          Денежных средств и финансовых вложений больше, чем долга: чистый
          долг ({code}) отрицателен и составляет {value}.

  # --- Рентабельность -------------------------------------------------------
  #
  # Показатели рентабельности — отношения, а не проценты: чистая
  # рентабельность 0,91 означает 91 копейку прибыли на рубль выручки.
  # Знак процента в тексте ошибся бы в сто раз, поэтому единицу
  # подставляет расчёт, а текст её не называет.
  # Признак положения берётся по отображаемой величине, а не по полной:
  # иначе рядом со словом «прибыльна» стояло бы «0,00». Поэтому у показателей
  # с нулевым ориентиром объявлен и третий случай — величина, которая
  # в разрядности отображения от ориентира не отличается. Молчать о нём
  # нельзя: у ПАО «Газпром» чистая рентабельность отчётного периода именно
  # такова, и без этого тезиса раздел не сказал бы о результате ничего.
  net_margin:
    position:
      - code: net_margin_above
        when: {position: above}
        text: >-
          Деятельность за период прибыльна: чистая рентабельность ({code})
          {value}.
      - code: net_margin_at
        when: {position: at}
        text: >-
          Чистая рентабельность ({code}) {value}: финансовый результат
          за период мал относительно выручки.
      - code: net_margin_below
        when: {position: below}
        text: >-
          Деятельность за период убыточна: чистая рентабельность ({code})
          {value}.

  op_margin:
    position:
      - code: op_margin_above
        when: {position: above}
        text: >-
          Основная деятельность приносит прибыль: рентабельность продаж
          ({code}) {value}.
      - code: op_margin_at
        when: {position: at}
        text: >-
          Рентабельность продаж ({code}) {value}: результат основной
          деятельности за период мал относительно выручки.
      - code: op_margin_below
        when: {position: below}
        text: >-
          Основная деятельность убыточна: рентабельность продаж ({code})
          {value}. Выручка не покрывает расходов по обычным видам
          деятельности.

  gross_margin:
    position:
      - code: gross_margin_above
        when: {position: above}
        text: >-
          Выручка превышает себестоимость продаж: валовая рентабельность
          ({code}) {value}.
      - code: gross_margin_at
        when: {position: at}
        text: >-
          Валовая рентабельность ({code}) {value}: выручка и себестоимость
          продаж за период сопоставимы.
      - code: gross_margin_below
        when: {position: below}
        text: >-
          Себестоимость продаж превышает выручку: валовая рентабельность
          ({code}) {value}.

  roa:
    position:
      - code: roa_above
        when: {position: above}
        text: >-
          Активы за период принесли прибыль: рентабельность активов ({code})
          {value}.
      - code: roa_at
        when: {position: at}
        text: >-
          Рентабельность активов ({code}) {value}: финансовый результат
          за период мал относительно средней величины активов.
      - code: roa_below
        when: {position: below}
        text: >-
          Активы за период принесли убыток: рентабельность активов ({code})
          {value}.

  # Рентабельность собственного капитала при отрицательном капитале
  # не истолковывается: прибыль, делённая на среднюю величину, которая
  # сменила знак внутри периода, даёт большое положительное число, и «капитал
  # принёс прибыль» рядом с отрицательным капиталом — ложное утверждение.
  # Проверено на ПК «Стройсервис»: 328 при капитале −442.
  roe:
    position:
      - code: roe_above
        when: {position: above}
        unless: {equity: below}
        text: >-
          Собственный капитал за период принёс прибыль: рентабельность
          собственного капитала ({code}) {value}.
      - code: roe_at
        when: {position: at}
        unless: {equity: below}
        text: >-
          Рентабельность собственного капитала ({code}) {value}: финансовый
          результат за период мал относительно средней величины собственного
          капитала.
      - code: roe_below
        when: {position: below}
        unless: {equity: below}
        text: >-
          Собственный капитал за период принёс убыток: рентабельность
          собственного капитала ({code}) {value}.
      - code: roe_negative_equity
        when: {position: any}
        only_if: {equity: below}
        text: >-
          Рентабельность собственного капитала ({code}) за период
          не истолковывается: собственный капитал отрицателен, и отношение
          к нему смысла не имеет.
