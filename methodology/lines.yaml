# Справочник строк форм бухгалтерской отчётности РСБУ.
#
# Источник форм: приказ Минфина России от 02.07.2010 № 66н в действующей
# редакции (с учётом приказа от 19.04.2019 № 61н).
#
# Соглашение о знаке:
#   sign: positive — показатель не может быть отрицательным (запасы, выручка,
#                    себестоимость как величина расхода);
#   sign: any      — показатель может быть отрицательным (нераспределённая
#                    прибыль, сальдо денежных потоков, финансовый результат).
#   in_brackets    — строка приводится в отчётности в круглых скобках
#                    (расход или контр-статья). Значение хранится в fact_report
#                    как величина расхода, а вычитание задано оператором "-"
#                    в составе итоговой строки.
#
# Состав итоговых строк (components) — перечень слагаемых с операторами.
# Именно он используется контролями сходимости (задача 5).
#
# Наборы строк (reporting_type):
#   full       — полные формы;
#   simplified — упрощённые формы (приложение 5 к приказу 66н).
# Ключ справочника — пара (reporting_type, code): один и тот же код может
# существовать в обоих наборах и означать разное (например, 2120).
#
# Особенность упрощённых форм: код укрупнённой строки не фиксирован, он
# указывается по показателю с наибольшим удельным весом в её составе. Поэтому
# строка опознаётся по наименованию (name + name_aliases), а code_allowed —
# лишь перечень кодов, которые допустимо встретить. В fact_report пишется
# канонический code, фактический код источника — в source_line_code.
#
# Поля упрощённого набора:
#   code_allowed         — какие коды источника могут стоять у этой строки;
#   aggregates           — какие строки полного набора она укрупняет;
#   same_meaning_as_full — совпадает ли смысл со строкой полного набора
#                          с тем же кодом; при false обязателен note.

version: "2.0.0"

forms:
  "0710001":
    name: Бухгалтерский баланс
  "0710002":
    name: Отчёт о финансовых результатах
  "0710005":
    name: Отчёт о движении денежных средств

reporting_types:
  full:
    name: Полная бухгалтерская отчётность
    forms: ["0710001", "0710002", "0710005"]
  simplified:
    name: Упрощённая бухгалтерская отчётность (приложение 5 к приказу 66н)
    # Отчёт о движении денежных средств и отчёт об изменениях капитала
    # субъекты малого предпринимательства вправе не представлять.
    forms: ["0710001", "0710002"]

# Коды, которые встречаются в ответе источника, но методикой не используются
# осознанно. Игнорируемый код — принятое решение, неизвестный — сигнал
# проверить справочник; смешивать их нельзя, поэтому игнорируемые в журнал
# качества не пишутся.
ignored_codes:
  - pattern: "^1\\d{4}$"
    form: "0710001"
    reason: >-
      Пятизначные коды 13001, 13101, 13201, 13301, 13501, 13601, 13701 —
      расшифровки раздела III, относящиеся к отчёту об изменениях капитала
      (форма 0710004). Эта форма методикой не разбирается, нераспределённая
      прибыль берётся из строки 1370 баланса. Ни в одной пробе не заполнены.

  - pattern: "^4\\d{2}[1-9]$"
    form: "0710005"
    reason: >-
      Расшифровки «в том числе» внутри поступлений и платежей ОДДС
      (4111–4119, 4121–4129, 4211–4229, 4311–4329). В итоги 4100, 4200 и 4300
      не входят — они считаются от строк 4110, 4120, 4210, 4220, 4310, 4320,
      а формулы методики оперируют только сальдо и остатками.

  - code: "2420"
    form: "0710002"
    reason: >-
      Строка относится к налоговой части ОФР и в цепочку прибыли
      2110 → 2100 → 2200 → 2300 → 2400 не входит. Формулами методики
      не используется.

  - code: "2500"
    form: "0710002"
    reason: >-
      Совокупный финансовый результат периода — отдельная итоговая строка
      ниже чистой прибыли. Ни в один показатель методики не входит.

  - code: "2510"
    form: "0710002"
    reason: Результат переоценки, не включаемый в чистую прибыль; формулами не используется.

  - code: "2520"
    form: "0710002"
    reason: Результат прочих операций, не включаемый в чистую прибыль; формулами не используется.

  - code: "2530"
    form: "0710002"
    reason: Налог на прибыль по операциям вне чистой прибыли; формулами не используется.

  - code: "2900"
    form: "0710002"
    reason: >-
      Базовая прибыль на акцию. Не денежная величина в тысячах рублей,
      а рубли на акцию; в показатели методики не входит.

  - code: "2910"
    form: "0710002"
    reason: Разводнённая прибыль на акцию; в показатели методики не входит.

