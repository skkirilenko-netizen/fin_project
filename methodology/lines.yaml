  # периодах сходится ровно 2400 = 2300 + 2410 + 2460, тогда как вычитание
  # даёт расхождение вплоть до 305 млрд руб. Внимание: в УПРОЩЁННОЙ форме
  # та же строка приходит положительной величиной и вычитается — см. набор
