# Справочник строк форм бухгалтерской отчётности РСБУ.
#
# Источник форм: приказ Минфина России от 02.07.2010 № 66н в действующей
# редакции (с учётом приказа от 19.04.2019 № 61н).
#
# Соглашение о знаке:
#   sign: positive — показатель не может быть отрицательным (запасы, выручка,
#                    себестоимость как величина расхода);
#   sign: any      — показатель может быть отрицательным (нераспределённая
#                    прибыль, сальдо денежных потоков, финансовый результат).
#   in_brackets    — строка приводится в отчётности в круглых скобках
#                    (расход или контр-статья). Значение хранится в fact_report
#                    как величина расхода, а вычитание задано оператором "-"
#                    в составе итоговой строки.
#
# Состав итоговых строк (components) — перечень слагаемых с операторами.
# Именно он используется контролями сходимости (задача 5).

