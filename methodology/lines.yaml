  # не отдаёт ни в одном ответе, поэтому назвать их точнее нельзя.
  # Проверено на отчётности ПАО «Газпром» за 2025 год: 1215 закрывает разницу
  # между итогом 1200 и суммой строк 1210–1260 ровно, во всех трёх периодах.
