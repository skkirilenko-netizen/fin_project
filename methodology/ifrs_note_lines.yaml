# Строки примечаний, которые нужны расчёту.
#
# **Справочник маленький намеренно.** Замер показал, что в той части, ради
# которой задача делается, ссылка из строки формы есть у всех пяти разобранных
# эмитентов и ведёт точно в нужное примечание: финансовые расходы — примечание
# 9 у Сегежи, 10 у ФосАгро и ЛСР, 11 у Автодора, 12 у Норникеля. Номер ведёт
# в таблицу, а здесь объявлено только то, как называется строка внутри неё.
# Поиска по документу нет и быть не может: у Норникеля «амортизация дисконта
# по оценочным обязательствам» — финансовый расход, а не износ, и по слову
# «амортизация» она найдётся первой.
#
# **Зачем это нужно.** Величина в отчёте о прибыли или убытке у двух эмитентов
# из пяти — остаток после капитализации: у Автодора 414 против 54 382
# начисленных, у Норникеля 537 «за вычетом капитализированных». Покрытие
# процентов по такой величине показывает стоимость долга в десятки раз ниже
# действительной.
#
# `found_in` — строки формы, по ссылке которых ищется примечание. Строка
# примечания не ищется нигде, кроме названных ими примечаний.
#
# `combine: sum` — величина складывается из всех подошедших строк примечания:
# у Автодора начисленные проценты раскрыты двумя строками (концессионные
# соглашения и облигационные займы), и взять одну значило бы занизить вдвое.
#
# **Величина из примечания бывает и меньше строки формы, и это не ошибка.**
# Через год это первое, что покажется странным, поэтому записано здесь.
# Примечание не «уточняет в большую сторону» — оно делает знаменатель
# ценой заёмных средств, а не суммой всего, что попало в строку финансовых
# расходов. Проверено на пяти комплектах 18.09.2026:
#
#   Автодор    414 в форме против 54 382 начисленных — остальное
#              капитализировано в затраты в интересах Принципала;
#   ФосАгро    23 728 против 30 974 — в форме не видно капитализированных
#              процентов 9 280;
#   ЛСР        47 968 против 46 405 — в строке формы есть ещё высвобождение
#              дисконта, курсовые разницы и резервы по сомнительным долгам;
#   Сегежа     25 488 против 19 059 — в строке формы есть проценты по аренде
#              2 749 и по обязательствам, относящимся к опционным
#              соглашениям, 3 557; к долгу они не относятся.
#
# Направление разницы зависит от того, что эмитент сложил в строку формы,
# и ни то ни другое направление само по себе ни о чём не говорит.

version: "0.1.0"

lines:
  - code: ifrs.interest_expense_accrued
    name: Процентные расходы, начисленные по заёмным средствам
    found_in: [ifrs.finance_costs]
    combine: sum
    # Проценты по аренде и по опционным обязательствам сюда не входят: состав
    # долга тот же, что в РСБУ, — только заёмные средства. У Сегежи из 25 488
    # финансовых расходов формы к долгу относятся 19 059, остальное аренда,
    # опционные соглашения и прочее.
    aliases:
      - {name: Проценты по концессионным и долговым инвестиционным соглашениям,
         seen_at: Автодор}
      - {name: Проценты по облигационным займам, seen_at: Автодор}
      - {name: Процентный расход по кредитам и облигациям, seen_at: ФосАгро}
      - {name: Процентный расход, seen_at: ЛСР}
      - {name: "Процентный расход (дополнительно начисленные проценты
          по кредитам с эскроу и значительный компонент финансирования)",
         seen_at: ЛСР}
      - {name: "Расходы по процентам, за вычетом капитализированных процентов",
         seen_at: Норникель}
      - {name: Процентные расходы по кредитам и займам полученным, seen_at: Сегежа}

  # **Требования, погашаемые раскрытием счетов эскроу.** Нужны нижней границе
  # текущей ликвидности девелопера: деньги дольщиков лежат у уполномоченного
  # банка, в оборотные активы не входят вовсе (у ЛСР денежные средства баланса
  # 27 724 при эскроу 217 501), а вот **требования**, которые погашаются
  # раскрытием этих счетов, в оборотных активах стоят.
  #
  # Расшифровка ЛСР за 2025 год, примечание 19 (краткосрочная часть 216 119):
  # «Активы по договорам долевого участия» 118 796, «Дебиторская задолженность
  # по договорам долевого участия» 27 855, «Актив по эскроу» 9 202 — вместе
  # 155 853, то есть 72,1 % задолженности. Само примечание называет источник
  # погашения прямо: «по которым на отчётную дату не произошло раскрытие
  # денежных средств со счетов эскроу… раскрытие… произошло в январе 2026».
  #
  # Состав взят широким намеренно: это **нижняя** граница, и она отвечает
  # на вопрос «хуже чего быть не может». Узкий состав — только две строки,
  # названные примечанием прямо (37 057), — объявлен развилкой
  # в `NIGHT_QUESTIONS.md` вместе с числом.
  - code: ifrs.escrow_backed_claims
    name: Требования, погашаемые раскрытием счетов эскроу
    # Ссылка на примечание берётся у любой строки дебиторской задолженности
    # формы: примечание одно на обе части, долгосрочную и краткосрочную.
    # У ЛСР краткосрочная строка — агрегат, присвоенный человеком, и ссылки
    # от неё нет вовсе; долгосрочная опознана справочником и ведёт в то же
    # примечание 19.
    found_in:
      - ifrs.contract_assets
      - ifrs.trade_receivables
      - ifrs.long_term_trade_receivables
    combine: sum
    aliases:
      - {name: Активы по договорам долевого участия, seen_at: ЛСР}
      - {name: Дебиторская задолженность по договорам долевого участия, seen_at: ЛСР}
      - {name: Актив по эскроу, seen_at: ЛСР}

  - code: ifrs.interest_capitalised
    name: Проценты капитализированные
    found_in: [ifrs.finance_costs, ifrs.long_term_borrowings, ifrs.short_term_borrowings]
    combine: sum
    # У Норникеля величина раскрыта прозой примечания об основных средствах
    # («Сумма капитализированных затрат по займам … составила 1 110 млн долл.
    # США»), а не строкой таблицы. Разбор прозы здесь не делается: показатель
    # получает отказ, и это верный исход — угаданное число хуже отсутствия.
    aliases:
      - {name: Капитализированные проценты начисленные, seen_at: ФосАгро}

# Состав показателя «покрытие процентов по действительной стоимости долга».
# Объявлен здесь, а не в коде: перечень слагаемых — методика.
interest_cover:
  numerator: ifrs.operating_profit
  denominator:
    - ifrs.interest_expense_accrued
    - ifrs.interest_capitalised
  # Капитализированные проценты обязательны там, где строка формы объявила
  # себя очищенной от них. Иначе знаменатель занижен, а выглядит полным.
  requires_capitalised_when_net:
    - "за вычетом капитализированных"
  origin: >-
    Состав повторяет определение РСБУ («покрытие процентов прибылью
    от продаж»), но знаменатель берётся начисленный, а не показанный в форме:
    у Автодора это 54 382 против 414, у Норникеля 1 647 против 537.
    Проверено на пяти комплектах 18.09.2026.
