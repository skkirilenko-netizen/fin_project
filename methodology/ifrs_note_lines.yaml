# Строки примечаний, которые нужны расчёту.
#
# **Справочник маленький намеренно.** Замер показал, что в той части, ради
# которой задача делается, ссылка из строки формы есть у всех пяти разобранных
# эмитентов и ведёт точно в нужное примечание: финансовые расходы — примечание
# 9 у Сегежи, 10 у ФосАгро и ЛСР, 11 у Автодора, 12 у Норникеля. Номер ведёт
# в таблицу, а здесь объявлено только то, как называется строка внутри неё.
# Поиска по документу нет и быть не может: у Норникеля «амортизация дисконта
# по оценочным обязательствам» — финансовый расход, а не износ, и по слову
# «амортизация» она найдётся первой.
#
# **Зачем это нужно.** Величина в отчёте о прибыли или убытке у двух эмитентов
# из пяти — остаток после капитализации: у Автодора 414 против 54 382
# начисленных, у Норникеля 537 «за вычетом капитализированных». Покрытие
# процентов по такой величине показывает стоимость долга в десятки раз ниже
# действительной.
#
# `found_in` — строки формы, по ссылке которых ищется примечание. Строка
# примечания не ищется нигде, кроме названных ими примечаний.
#
# `combine: sum` — величина складывается из всех подошедших строк примечания:
# у Автодора начисленные проценты раскрыты двумя строками (концессионные
# соглашения и облигационные займы), и взять одну значило бы занизить вдвое.
#
# **Величина из примечания бывает и меньше строки формы, и это не ошибка.**
# Через год это первое, что покажется странным, поэтому записано здесь.
# Примечание не «уточняет в большую сторону» — оно делает знаменатель
# ценой заёмных средств, а не суммой всего, что попало в строку финансовых
# расходов. Проверено на пяти комплектах 18.09.2026:
#
#   Автодор    414 в форме против 54 382 начисленных — остальное
#              капитализировано в затраты в интересах Принципала;
#   ФосАгро    23 728 против 30 974 — в форме не видно капитализированных
#              процентов 9 280;
#   ЛСР        47 968 против 46 405 — в строке формы есть ещё высвобождение
#              дисконта, курсовые разницы и резервы по сомнительным долгам;
#   Сегежа     25 488 против 19 059 — в строке формы есть проценты по аренде
#              2 749 и по обязательствам, относящимся к опционным
#              соглашениям, 3 557; к долгу они не относятся.
#
# Направление разницы зависит от того, что эмитент сложил в строку формы,
# и ни то ни другое направление само по себе ни о чём не говорит.

version: "0.1.0"

lines:
  - code: ifrs.interest_expense_accrued
    name: Процентные расходы, начисленные по заёмным средствам
    found_in: [ifrs.finance_costs]
    combine: sum
    # Проценты по аренде и по опционным обязательствам сюда не входят: состав
    # долга тот же, что в РСБУ, — только заёмные средства. У Сегежи из 25 488
    # финансовых расходов формы к долгу относятся 19 059, остальное аренда,
    # опционные соглашения и прочее.
    aliases:
      - {name: Проценты по концессионным и долговым инвестиционным соглашениям,
         seen_at: Автодор}
      - {name: Проценты по облигационным займам, seen_at: Автодор}
      - {name: Процентный расход по кредитам и облигациям, seen_at: ФосАгро}
      - {name: Процентный расход, seen_at: ЛСР}
      - {name: "Процентный расход (дополнительно начисленные проценты
          по кредитам с эскроу и значительный компонент финансирования)",
         seen_at: ЛСР}
      - {name: "Расходы по процентам, за вычетом капитализированных процентов",
         seen_at: Норникель}
      - {name: Процентные расходы по кредитам и займам полученным, seen_at: Сегежа}

  # **Требования, погашаемые раскрытием счетов эскроу.** Нужны нижней границе
  # текущей ликвидности девелопера: деньги дольщиков лежат у уполномоченного
  # банка, в оборотные активы не входят вовсе (у ЛСР денежные средства баланса
  # 27 724 при эскроу 217 501), а вот **требования**, которые погашаются
  # раскрытием этих счетов, в оборотных активах стоят.
  #
  # Расшифровка ЛСР за 2025 год, примечание 19 (краткосрочная часть 216 119):
  # «Активы по договорам долевого участия» 118 796, «Дебиторская задолженность
  # по договорам долевого участия» 27 855, «Актив по эскроу» 9 202 — вместе
  # 155 853, то есть 72,1 % задолженности. Само примечание называет источник
  # погашения прямо: «по которым на отчётную дату не произошло раскрытие
  # денежных средств со счетов эскроу… раскрытие… произошло в январе 2026».
  #
  # Состав взят широким намеренно: это **нижняя** граница, и она отвечает
  # на вопрос «хуже чего быть не может». Узкий состав — только две строки,
  # названные примечанием прямо (37 057), — объявлен развилкой
  # в `NIGHT_QUESTIONS.md` вместе с числом.
  - code: ifrs.escrow_backed_claims
    name: Требования, погашаемые раскрытием счетов эскроу
    # Ссылка на примечание берётся у любой строки дебиторской задолженности
    # формы: примечание одно на обе части, долгосрочную и краткосрочную.
    # У ЛСР краткосрочная строка — агрегат, присвоенный человеком, и ссылки
    # от неё нет вовсе; долгосрочная опознана справочником и ведёт в то же
    # примечание 19.
    found_in:
      - ifrs.contract_assets
      - ifrs.trade_receivables
      - ifrs.long_term_trade_receivables
    combine: sum
    aliases:
      - {name: Активы по договорам долевого участия, seen_at: ЛСР}
      - {name: Дебиторская задолженность по договорам долевого участия, seen_at: ЛСР}
      - {name: Актив по эскроу, seen_at: ЛСР}

  - code: ifrs.interest_capitalised
    name: Проценты капитализированные
    found_in: [ifrs.finance_costs, ifrs.long_term_borrowings, ifrs.short_term_borrowings]
    combine: sum
    # У Норникеля величина раскрыта прозой примечания об основных средствах
    # («Сумма капитализированных затрат по займам … составила 1 110 млн долл.
    # США»), а не строкой таблицы. Разбор прозы здесь не делается: показатель
    # получает отказ, и это верный исход — угаданное число хуже отсутствия.
    aliases:
      - {name: Капитализированные проценты начисленные, seen_at: ФосАгро}

# Состав показателя «покрытие процентов по действительной стоимости долга».
# Объявлен здесь, а не в коде: перечень слагаемых — методика.
interest_cover:
  numerator: ifrs.operating_profit
  denominator:
    - ifrs.interest_expense_accrued
    - ifrs.interest_capitalised
  # Капитализированные проценты обязательны там, где строка формы объявила
  # себя очищенной от них. Иначе знаменатель занижен, а выглядит полным.
  requires_capitalised_when_net:
    - "за вычетом капитализированных"
  origin: >-
    Состав повторяет определение РСБУ («покрытие процентов прибылью
    от продаж»), но знаменатель берётся начисленный, а не показанный в форме:
    у Автодора это 54 382 против 414, у Норникеля 1 647 против 537.
    Проверено на пяти комплектах 18.09.2026.

# Сроки погашения долга (уровень 2) ------------------------------------------
#
# **Где лежат сроки.** В примечании «Кредиты и займы» таблицы по корзинам
# срока нет ни у одного из шести эмитентов «Разбора» с PDF: там годы
# погашения по видам долга (О'КЕЙ, Самолёт, ЛСР) либо только деление
# на долгосрочную и краткосрочную части (Брусника, Сегежа). Корзины стоят
# в разделе о риске ликвидности (МСФО (IFRS) 7) — недисконтированными
# договорными потоками, у пяти из шести с графой балансовой стоимости.
#
# **Сверка — по графе балансовой стоимости той же таблицы**: сумма строк
# «займы + долгоподобные» против займов опоры. Опора — баланс документа
# у принятого комплекта, займы агрегатора у комплекта в карантине; сошлось
# только с «займы + аренда» — пройдено с оговоркой «таблица сроков включает
# аренду» (решения владельца 29.09.2026). Допуск — одна единица более грубой
# стороны, как у сверки агрегатора (`quality/reconcile.py`). Графы
# балансовой нет (ЛСР) — сверки нет, потоки печатаются как есть
# с оговоркой (решение 30.09.2026).
#
# **Хранятся графы как напечатаны** (решение 30.09.2026): код — основа,
# род строк и границы графы в месяцах от отчётной даты. В четыре корзины
# графы сводятся только при печати и только если лежат в корзине целиком
# и покрывают её целиком; иначе печатаются как напечатаны.
debt_maturity:
  found_in: [ifrs.long_term_borrowings, ifrs.short_term_borrowings]
  lease_lines: [ifrs.long_term_lease_liabilities, ifrs.short_term_lease_liabilities]
  buckets:
    - {code: within_1y, name: до 1 года, from_months: 0, to_months: 12}
    - {code: y1_y2, name: от 1 до 2 лет, from_months: 12, to_months: 24}
    - {code: y2_y5, name: от 2 до 5 лет, from_months: 24, to_months: 60}
    - {code: after_y5, name: свыше 5 лет, from_months: 60}
  # Код хранения: `{префикс}_m{начало}_m{конец}`, открытая сверху графа —
  # `{префикс}_m{начало}_plus`. Примеры: `ifrs.debt_cf_due_m012_m024` —
  # потоки по займам от 12 до 24 месяцев; `ifrs.debt_cf_due_m000_m000` —
  # «до востребования»; `ifrs.debt_like_cf_due_m060_plus` — потоки
  # по долгоподобным свыше 5 лет. Балансовая стоимость строк рода в таблице
  # сроков по графам не делится и хранится кодом всей шкалы:
  # `ifrs.debt_due_m000_plus`, `ifrs.debt_like_due_m000_plus`.
  storage:
    prefixes:
      undiscounted: {debt: ifrs.debt_cf_due, debt_like: ifrs.debt_like_cf_due}
      carrying: {debt: ifrs.debt_due, debt_like: ifrs.debt_like_due}
    open_end: plus
    digits: 3
  # **Запасная опора, когда баланс не прочитан** (решение владельца
  # 30.09.2026): итог примечания, расшифровывающего балансовую строку займов.
  # Ссылки из формы нет — нет самой формы (у Автодора пассив баланса стоит
  # на странице 9 без текстового слоя), поэтому примечание опознаётся полным
  # наименованием из оглавления, а итог — наименованием строки.
  balance_fallback:
    note_titles:
      - {name: "Заемные средства и обязательства по долгосрочным
          инвестиционным и концессионным соглашениям", seen_at: Автодор}
    total_names:
      - {name: Итого заемных средств, seen_at: Автодор}
  # Роды строк таблицы сроков — наименованиями, как у справочника статей.
  # Строка вне перечня не опознана и печатается поимённо: по слову «кредит»
  # угадывать нельзя, его содержит «кредиторская задолженность».
  rows:
    debt:
      - {name: "Банковские кредиты, облигационные и прочие полученные займы",
         seen_at: Брусника}
      - {name: Облигации без обеспечения, seen_at: Самолёт}
      - {name: Прочие кредиты и займы, seen_at: Самолёт}
      - {name: Обеспеченные банковские кредиты, seen_at: "О'КЕЙ, ЛСР"}
      - {name: Обеспеченные облигационные займы, seen_at: "О'КЕЙ"}
      - {name: Необеспеченные займы от третьих лиц, seen_at: "О'КЕЙ"}
      - {name: Облигационные займы, seen_at: Автодор}
      - {name: Кредиты и займы, seen_at: Сегежа}
      - {name: Проектное финансирование, seen_at: ЛСР}
      - {name: Кредиты на реконструкцию, seen_at: ЛСР}
      - {name: Необеспеченные банковские кредиты, seen_at: ЛСР}
      - {name: Необеспеченные выпущенные облигации, seen_at: ЛСР}
      - {name: Прочие необеспеченные займы, seen_at: ЛСР}
    # **Долгоподобные обязательства** (решение владельца 30.09.2026): не займы,
    # но долг по существу. Печатаются второй величиной «займы + долгоподобные»
    # с перечнем добавленного. У Автодора строка баланса — «Заемные средства
    # и обязательства по долгосрочным инвестиционным и концессионным
    # соглашениям», а займы агрегатора (798 411) — ровно облигации.
    # Поэтому у комплекта в карантине сумма с долгоподобными сверяется ещё
    # и с займами баланса документа, с оговоркой «опора — баланс документа,
    # комплект в карантине» (решение 30.09.2026); сошлось — печатается
    # вторая величина и её потоки.
    debt_like:
      - {name: Долгосрочные инвестиционные соглашения, seen_at: Автодор}
      - {name: Концессионные соглашения, seen_at: Автодор}
    lease:
      - {name: Обязательство по аренде, seen_at: "Брусника, Сегежа"}
      - {name: Обязательства по аренде, seen_at: "О'КЕЙ, Автодор"}
      - {name: Обязательства по договорам долгосрочной аренды, seen_at: Самолёт}
      - {name: Обязательства по договорам аренды, seen_at: ЛСР}
    other:
      - {name: Торговая и прочая кредиторская задолженность, seen_at: все шесть}
      - {name: Долгосрочная торговая и прочая кредиторская задолженность,
         seen_at: Самолёт}
      - {name: Краткосрочная торговая и прочая кредиторская задолженность,
         seen_at: Самолёт}
      - {name: "Обязательства, относящиеся к опционным соглашениям", seen_at: Сегежа}
      # Потоки процентов у ЛСР отдельной строкой: в долг по балансу
      # не входят, и складывать их с потоками займов без решения нельзя.
      - {name: Будущий процентный расход, seen_at: ЛСР}
  origin: >-
    План уровня 2 согласован 29.09.2026; основа сроков поправлена по документам
    шести эмитентов, хранение графами как напечатаны, долгоподобные
    обязательства и печать ЛСР без сверки — по решениям 30.09.2026.

# Раскрытия уровня 2: ковенанты, залоги и поручительства, события после
# отчётной даты ----------------------------------------------------------------
#
# **Это проза, а не таблицы, и величинами она не становится.** Разведка
# 30.09.2026 по шести эмитентам: о нарушении ковенантов, о залогах
# и поручительствах эмитент пишет абзацами, и сумма в абзаце бывает
# балансовой стоимостью заложенного, лимитом, справедливой стоимостью
# поручительства — разными величинами под одним словом. Поэтому абзацы
# приводятся дословно, с номером примечания и страницей, как цитаты
# аудиторского заключения; фактами они не пишутся, в расчёт не идут.
#
# **Где искать — строением, а не по документу.** Абзац ищется только
# в названных примечаниях: о долге — по ссылке из строки займов формы
# (как сроки), остальные — по наименованию примечания в указателе
# и оглавлении. Внутри примечания абзац отбирается приметами; примета
# без названного примечания не ищется нигде.
#
# **Нарушение ковенанта машина не устанавливает, а предлагает** — тот же
# порядок, что у вида оговорки аудитора (`ifrs_audit.yaml`, `caveat_kinds`):
# приметы нарушения в абзаце печатаются как «приметы», решение — за
# человеком. Так видно и Сегежу («по которой были нарушены ограничительные
# условия»), и Бруснику («Группа нарушила условия нескольких кредитных
# договоров… получила отказ банков от права требования досрочного
# возврата»), и не выдаётся за нарушение «Группа соблюдала все ковенанты»
# О'КЕЙ.
disclosures:
  covenants:
    # Примечание о долге — то же, что у сроков (`debt_maturity.found_in`,
    # при непрочитанном балансе — `balance_fallback`).
    in_debt_note: true
    paragraph_markers: [ограничительн, ковенант]
    breach_markers:
      - {name: были нарушены, seen_at: Сегежа}
      - {name: нарушила условия, seen_at: Брусника}
      - {name: не были соблюдены, seen_at: Сегежа}
      - {name: отказ банков от права требования, seen_at: Брусника}
    # Перенос долгосрочного долга в краткосрочный (МСФО (IAS) 1.74) — след
    # нарушения, объявленный самой отчётностью.
    reclassification_markers:
      - {name: в составе краткосрочных кредитов, seen_at: Сегежа}
  pledges:
    in_debt_note: true
    paragraph_markers: [залог]
    heading_markers:
      - {name: Обеспечения, seen_at: Самолёт}
      - {name: "Активы, переданные в качестве обеспечения", seen_at: Сегежа}
  guarantees:
    # Поручительства и финансовые гарантии: выданные и полученные эмитент
    # пишет в разных местах — в условных обязательствах, у связанных сторон,
    # в примечании о рисках. Выданное или полученное — различает человек.
    in_debt_note: true
    note_titles:
      - {name: Условные активы и обязательства, seen_at: "Брусника, ЛСР, Самолёт"}
      - {name: Условные активы и обязательства и оценочные резервы, seen_at: Автодор}
      - {name: Условные обязательства, seen_at: "О'КЕЙ"}
      - {name: Условные обязательства и условные активы, seen_at: Сегежа}
      - {name: Сделки между связанными сторонами, seen_at: "Брусника, Автодор"}
