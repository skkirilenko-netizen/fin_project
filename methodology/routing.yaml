# Маршрутизация: в какую корзину попадает эмитент. **ЧЕРНОВИК.**
#
# **Статус объявлен полем, а не соглашением.** Правила здесь не утверждены,
# и расчёт обязан это печатать: корзина, выданная как решение методики,
# неотличима от согласованной, а согласована она не была.
#
# **Своих чисел у маршрута почти нет, и это условие.** Границы берутся
# из существующих шкал: «ниже нижней части калибровочной шкалы» — это балл
# уровня ниже границы `bands.lower_below` в `theses.yaml` (34 из 100),
# и та же граница делит шкалу для словесных тезисов. Порог долговой нагрузки
# для вывода по границе — нижняя опорная точка шкалы `net_debt_ebitda`
# в `ifrs_metrics.yaml` (5,0). Новый порог здесь ровно один, и он назван
# отдельно: срок, после которого отсутствие годовой отчётности за прошлый год
# само становится обстоятельством.
#
# **Корзины упорядочены, и порядок — часть правила.** Основание разбора
# старше основания внимания: у эмитента со сработавшим стоп-фактором
# и устаревшей отчётностью корзина — разбор, а не внимание. Внутри корзины
# основания перечисляются все: сводка по частоте нужна, чтобы видеть, чем
# корзина наполняется.
#
# **Разбор — это риск, а не нехватка данных.** Величина, которой нет,
# ни о чём не говорит: она не свидетельство в пользу эмитента и не улика
# против него. Смешав пробел с обстоятельством, маршрут отправляет к человеку
# тех, о ком просто нечего сказать, — и теряет смысл: к человеку идут все.
# Поэтому нерассчитанная величина маршрута — основание внимания и называет
# недостающее поле, а в разборе стоят только основания риска.
#
# **Стоп-факторы разведены по тяжести, объявленной методикой.** Градация
# у каждого объявлена в `ifrs_issuer_type.yaml` полем `cap`, и маршрут берёт
# её оттуда: ограничение класса низшим и неустойчивым — обстоятельство разбора,
# ограничение средним — обстоятельство внимания. Своего перечня у маршрута нет.

# **Утверждена структура, а не пороги, и это два разных утверждения.**
# `status: approved` говорит, что состав корзин, перечень оснований, градации
# тяжести и подгруппы внимания согласованы человеком. Величины при этом
# остаются предварительными: `thresholds: preliminary` — у порогов маршрута
# ровно то же положение, что у калибровочных точек шкал, они проверены
# на одном наборе и одном прогоне. Одно поле на оба утверждения означало бы,
# что согласие со структурой читается как согласие с числами.
version: "1.0.0"
status: approved
approved_by: "Сергей, 22.09.2026 — структура правил"
thresholds: preliminary
thresholds_origin: >-
  Пороги остаются предварительными до калибровки на данных: единственный
  собственный порог маршрута (срок сдачи годовой отчётности) проверен
  на одном наборе, а прочие взяты из калибровочных точек шкал МСФО,
  у которых статус тот же.
origin: >-
  Черновик 22.09.2026 по поставленным условиям: три корзины, пороги
  из существующих шкал МСФО, новый порог только там, где шкалы нет.
  Правила подлежат утверждению человеком; до утверждения расчёт печатает
  корзину вместе со статусом черновика.
  Редакция 0.2.0 от 22.09.2026 по замеру первой: стоп-факторы разведены
  по объявленной тяжести, нехватка данных перенесена во внимание, срок
  раскрытия назван своим основанием, добавлены класс оценки по документу
  и величина за концом своей шкалы.
  Редакция 0.3.0 от 22.09.2026 (дорожная карта, фаза 1): маршрут строится
  и по отчётности РСБУ, у эмитента без отчётности — по событиям и рейтингам,
  а универсум задан долгом в обращении, а не доставками МСФО.

# **Маршрут один, справочника показателей два.** Вопрос «нужен ли человек»
# от стандарта отчётности не зависит, а коды величин зависят: в МСФО долговая
# нагрузка зовётся `net_debt_ebitda`, в РСБУ её нет вовсе — амортизация
# в формах 0710001–0710005 не раскрывается, и остаётся граница: чистый долг
# к прибыли от продаж (строка 2200). Поэтому здесь объявлено только то, чем
# стандарты различаются, а правила остаются одни: второй маршрут разошёлся бы
# с первым, и какая корзина попала к человеку, зависело бы от того, кто
# спросил.
#
# **Шкалы у маршрута одни на оба стандарта.** Решение человека 22.09.2026:
# «те же правила маршрута на показателях РСБУ». Маршрут класса не присваивает —
# он отвечает, нужен ли человек, — и корзина, означающая в соседних строках
# одного списка разное, хуже неточной шкалы. Собственная калибровка РСБУ
# (`scoring.yaml`) объявлена только для автономии: развести по стандартам одну
# величину из трёх значило бы получить список, в котором «Внимание» у двух
# эмитентов означает не одно и то же. Величина шкал остаётся предварительной,
# и вердикт печатает это вместе с корзиной.
standards:
  scales_from: ifrs
  scales_origin: >-
    Решение человека 22.09.2026 (дорожная карта, фаза 1): те же правила
    маршрута на показателях РСБУ. Шкалы взяты у справочника МСФО целиком,
    потому что это единственный полный их набор; собственная калибровка РСБУ
    объявлена только для автономии. Величины предварительны и подлежат
    пересмотру вместе с прочими порогами маршрута.
  by_standard:
    ifrs:
      label: МСФО · консолидированная
      metrics: [net_debt_ebitda, equity_ratio, cur_liq]
      burden: net_debt_ebitda
      bound: net_debt_op_profit
      bound_of: net_debt_ebitda
      bound_requires_positive: ifrs.operating_profit
      earnings: ebitda
      operating_line: ifrs.operating_profit
      cash_line: ifrs.cash
      # Текущая ликвидность девелопера заменена методикой диапазоном
      # (`ifrs_metrics.yaml`, adjustments.replaced_by): за полноту отвечает
      # верхняя граница. «Не рассчитана» здесь было бы неправдой — это
      # решение методики, а не пробел данных.
      replaced_by:
        cur_liq: cur_liq_ex_inventories
      cover: [net_debt_ebitda, equity_ratio, cur_liq]
      absent_names:
        net_debt_ebitda: долговая нагрузка
        equity_ratio: автономия
        cur_liq: текущая ликвидность
      # Строки заёмных средств и величины, которые из них считаются: ноль
      # по всем строкам у эмитента с выпусками в обращении означает
      # нераскрытие (`cbonds_mapping.yaml`, `debt_zero_with_bonds`), и тогда
      # ни одна из этих величин не считается раскрытой.
      debt_lines: [ifrs.long_term_borrowings, ifrs.short_term_borrowings]
      debt_metrics: [net_debt, debt_total, net_debt_ebitda, net_debt_op_profit]
      why: >-
        Периметр консолидированной отчётности описывает деятельность группы,
        и база оценки у группы — она (`standards.yaml`, base_standard).
    rsbu:
      label: РСБУ · юрлицо
      metrics: [equity_ratio, cur_liq]
      # Долговой нагрузки у РСБУ нет **вовсе**, и это не пробел отчётности:
      # амортизация приводится в пояснениях, которые методикой не разбираются.
      # Пустота здесь означает «величины не бывает», а вывод делается границей.
      burden: ""
      bound: debt_to_op_profit
      bound_of: net_debt_ebitda
      bound_requires_positive: "2200"
      earnings: ""
      operating_line: "2200"
      cash_line: "1250"
      cover: [debt_to_op_profit, equity_ratio, cur_liq]
      absent_names:
        debt_to_op_profit: долговая нагрузка
        equity_ratio: автономия
        cur_liq: текущая ликвидность
      debt_lines: ["1410", "1510"]
      debt_metrics: [net_debt, debt_total, debt_to_op_profit]
      why: >-
        Отчётность отдельного юридического лица: долг 1410 + 1510, денежные
        средства 1250, ликвидность 1200 / 1500, автономия 1300 / 1700,
        вывод по границе через прибыль от продаж 2200. У холдинга она
        описывает управляющую компанию, а не группу, и это обстоятельство
        названо своим основанием.

# **Тяжесть берётся у стоп-фактора, а не назначается маршрутом.** Ограничение
# класса объявлено в `ifrs_issuer_type.yaml` полем `cap`, и здесь названы
# только те градации, при которых обстоятельство требует человека: низший
# класс (E) и неустойчивое состояние (D). Ограничение средним (C) —
# обстоятельство внимания: методика прямо объявляет его штатным режимом при
# быстром обороте и доступном рефинансировании.
#
# Те же градации читаются и у **присвоенного** класса: оценка по документу
# с классом D или E — не предположение о риске, а установленный нами исход,
# и он старше любой величины агрегатора.
# **Одно обстоятельство — одно решение о маршруте.** Величина за концом шкалы
# и стоп-фактор говорят об одном и том же, когда мерят одно и то же:
# отрицательный чистый оборотный капитал означает текущую ликвидность ниже
# единицы, а нижняя опорная точка шкалы ликвидности — 0,80. Тяжесть такого
# обстоятельства методика уже назвала — градацией стоп-фактора, — и величина
# самостоятельным основанием не становится: иначе правило о тяжести
# отменялось бы следующим правилом, у 82 эмитентов набора ровно так
# и выходило.
#
# Совпадение объявляется парой, а не выводится из имён: у стоп-фактора
# и показателя маршрута код бывает один (автономия) и бывает разный
# (чистый оборотный капитал против текущей ликвидности). Совпадение кодов
# действует всегда и без объявления — это буквально тот же показатель.
same_circumstance:
  # Стоп-фактор РСБУ объявлен сразу по двум величинам — чистому оборотному
  # капиталу и покрытию процентов, — и гасит он текущую ликвидность только
  # тогда, когда сработал первой из них. Какой именно величиной он сработал,
  # знает расчёт, а не справочник, поэтому пара названа по величине,
  # а не по коду стоп-фактора.
  - stop_factor: weak_coverage
    metric: cur_liq
    by_value: nwc
    why: >-
      То же обстоятельство, что и в ветке МСФО, только стоп-фактор в РСБУ
      объявлен по паре величин: отрицательный чистый оборотный капитал
      означает текущую ликвидность ниже единицы, и величина за концом её
      шкалы говорит о том же. Покрытие процентов ниже единицы — обстоятельство
      другое, и текущую ликвидность оно не гасит.
    origin: >-
      Перенесено 22.09.2026 вместе с маршрутом по РСБУ (дорожная карта,
      фаза 1). Величина, которой стоп-фактор сработал, называется расчётом:
      гашение по коду стоп-фактора молчало бы о ликвидности и там, где
      сработало покрытие процентов.
  - stop_factor: negative_nwc
    metric: cur_liq
    why: >-
      Отрицательный чистый оборотный капитал означает, что краткосрочные
      обязательства выше оборотных активов, то есть текущая ликвидность ниже
      единицы. Нижняя опорная точка её шкалы 0,80 лежит внутри этой области,
      и величина за концом шкалы говорит о том же обстоятельстве, тяжесть
      которого объявлена градацией C.
    origin: >-
      Замер 22.09.2026: из 142 эмитентов с величиной за концом шкалы 82
      держались только текущей ликвидностью, и у всех 82 сработал
      отрицательный чистый оборотный капитал.

# **Отраслевой гаситель отрицательного оборотного капитала.** Для сетей,
# нефтегаза, телекома, ритейла и железнодорожного транспорта отрицательный
# чистый оборотный капитал — модель бизнеса, а не обстоятельство: выручка
# собирается быстрее, чем платятся счета, и рефинансирование у таких компаний
# постоянное. Гасится **основание маршрута, а не стоп-фактор**: класс методика
# по-прежнему ограничивает средним, и в оценке обстоятельство остаётся.
#
# Отрасль берётся у карточки источника (`branch_name_rus`), написания названы
# дословно: гашение по вхождению слова однажды проглотило бы чужую отрасль
# («Оптовая торговля» — не ритейл, «Вспомогательная транспортная
# деятельность» — не железнодорожный транспорт).
stop_factor_muted:
  - stop_factor: negative_nwc
    branches:
      - Электроэнергетика
      - Нефтегазовая отрасль
      - Связь и телекоммуникация
      - FMCG ретейл
      - Онлайн-ретейл
      - Специализированная розничная торговля
      - Железнодорожный транспорт
    why: >-
      У сетевых, нефтегазовых, телекоммуникационных, розничных
      и железнодорожных компаний краткосрочные обязательства выше оборотных
      активов постоянно: оборот быстрый, рефинансирование доступно, и признак
      мерит устройство отрасли, а не положение эмитента.
    origin: >-
      Замер 22.09.2026: во «Внимании» только по отрицательному оборотному
      капиталу стояли 42 эмитента, из них 15 электроэнергетика и 6 нефтегаз.
      Перечень отраслей утверждён человеком; написания взяты дословно
      из карточек источника, где отраслей 57.

# **Событийный слой: то, чего годовая отчётность не видит.** Дефолт
# и понижение рейтинга случаются между отчётными датами, и числа за прошлый год
# о них не говорят ничего: у ЕвроТранса отчётность 2025 года спокойна,
# а по двенадцати выпускам стоит неурегулированный дефолт и рейтинги всех
# четырёх агентств отозваны.
#
# **Категории рейтинга берутся из справочника шкал источника**
# (`get_rating_scale_points`, 745 точек): у каждой точки объявлено написание
# и место в шкале, а категория — её буква. Перечни ниже — решение методики
# о том, что делать с категорией, а не таблица шкал, написанная руками.
events:
  default_review: true
  default_origin: >-
    Экспертная проверка 22.09.2026: ЕвроТранс, Кириллица и ДВМП стояли
    в «Без внимания» при неурегулированном дефолте в карточке эмитента.
    Годовая отчётность события между отчётными датами не видит по устройству.
  # **Рейтинг рейтингу не равен: ESG-рейтинг о кредитоспособности не говорит.**
  # Вид шкалы у источника для этого не годится: тип 3 («национальная») стоит
  # только у АКРА, а у национальных шкал Эксперт РА, НКР и НРА он тот же, что
  # у ESG-шкал, — ноль. Поэтому кредитные шкалы объявлены по идентификаторам,
  # а шкала, которой в перечне нет, кредитной не считается и печатается
  # в журнале вместе с наименованием: новая шкала обязана быть замечена,
  # а не попасть в градацию молча.
  credit_scales:
    "459": Национальная российская рейтинговая шкала (Эксперт РА)
    "169": Национальная рейтинговая шкала АКРА для Российской Федерации
    "637": Оценка собственной кредитоспособности, нац. шкала РФ (Эксперт РА)
    "627": Оценка собственной кредитоспособности, нац. шкала (АКРА)
    "375": Национальная рейтинговая шкала для Российской Федерации (НКР)
    "625": Оценка собственной кредитоспособности (НКР)
    "447": Национальная кредитная рейтинговая шкала для РФ (НРА)
    "635": Оценка собственной кредитоспособности (НРА)
  credit_scales_origin: >-
    Найдено 22.09.2026 при первом прогоне: в категориях оказались «ESG-A-»,
    «ESG-II(c)» и «5» — точки шкал, к кредитоспособности не относящихся.
    Перечень измерен по снимку: из 17 шкал, встреченных у 329 эмитентов,
    кредитных восемь, ESG пять, «Некредитные рейтинги акций» одна.
  # **Давность дефолта: три года.** Решение человека от 22.09.2026, порог
  # предварительный: наблюдений 17 эмитентов, и калибровать его пока нечем.
  # Четыре исхода, и они разведены по двум признакам — улажен ли дефолт
  # и давно ли: неурегулированный свежий требует разбора, неурегулированный
  # старый — вопроса о статусе урегулирования (у ДВМП событие 2018 года),
  # урегулированный свежий — внимания как кредитная история, урегулированный
  # старый остаётся справочным сведением.
  #
  # **Дата события приходит отдельным методом** — `get_emission_default`:
  # плановый срок, дата дефолта, дата фактического исполнения и неисполненная
  # сумма по каждому событию. Перечень берётся целиком по стране, 3 529 записей
  # в четырёх запросах. Правило выбора события — `cbonds_events.default_event`:
  # давность считается по неисполненному, а не по тому, что позже улажено.
  #
  # **Графиком платежей дата не восстанавливается, и это проверено.** Поле
  # `actual_payment_date` метода `get_flow_new` выглядит датой платежа,
  # а является сроком, сдвинутым на рабочий день: оно заполнено и у платежей
  # 2027 года. По 93 выпускам с признаком дефолта неуплаченным не оказался
  # ни один — включая выпуск Кириллицы в статусе «Дефолт по погашению»,
  # у которого неисполненная сумма 300 000 000 стоит в записи дефолта.
  #
  # **Улажен ли дефолт, говорят события; признак карточки — только при их
  # отсутствии** (решение человека 22.09.2026). Событие подробнее
  # и датировано: вид обязательства, срок, сумма и дата фактического
  # исполнения, — а признак карточки отстаёт, что видно на ДВМП: обязательства
  # 2018 года, признак стоит бессрочно. У Росгеологии и Концессий
  # теплоснабжения карточка объявляет неурегулированность при всех исполненных
  # событиях, и прежде обстоятельство держалось ею. Расхождение не исчезает:
  # оно считается и идёт в перечень к агрегатору наравне с прочерками —
  # это противоречие **внутри источника**, а не вопрос к эмитенту.
  #
  # **Дата неизвестна — давность не считается, и обстоятельство остаётся
  # в разборе.** Понизить корзину по неизвестной давности значило бы принять
  # решение по отсутствию данных: так же и выпуск с признаком, о котором
  # событий нет вовсе, давности не имеет.
  default_stale_years: 3
  default_stale_origin: >-
    Порог назван человеком 22.09.2026 и не калиброван: признак дефолта стоит
    у 20 эмитентов списка, и три года — суждение о том, когда кредитная история
    перестаёт описывать сегодняшнего эмитента, а не измеренная величина.
    Замер исходов: не улажен до трёх лет — 8, не улажен старше — 5, улажен
    до трёх лет — 6, улажен старше — 1. Расхождений «карточка против событий»
    два: Росгеология и Концессии теплоснабжения, и оба разрешены в пользу
    событий.
  # **Поручительство и оферта — разные обязательства, и различает их статус
  # записи.** Поручитель и гарант отвечают по долгу; оферент обязуется выкупить
  # бумагу по требованию — это обязательство о ликвидности, а не о кредитном
  # качестве, и чужую корзину по нему брать нельзя. Написания дословные:
  # различение по вхождению слова однажды приняло бы «Оферент» за поручителя.
  guarantee_statuses: ["Поручитель", "Гарант"]
  offer_statuses: ["Оферент"]
  guarantee_origin: >-
    Замер 22.09.2026 по 481 карточке: записей поручительства 401
    («Поручитель»), 165 («Гарант») и 354 («Оферент»); поручители нашлись
    у 136 эмитентов, и у 23 из них поручитель сам стоит в списке. Финансирующих
    структур в списке при этом **одна** — «Коммерческая недвижимость ФПК», —
    и её единственная запись имеет вид «Оферент», причём оферент — физическое
    лицо. Правило поэтому объявлено, но ни одного наблюдения не имеет:
    считать это работающим правилом нельзя, и счётчик печатает знаменатель.
  review_categories: ["D", "RD", "SD", "C", "CC", "CCC"]
  attention_categories: ["B", "BB"]
  attention_outlooks: ["Негативный", "Развивающийся"]
  categories_origin: >-
    Градации названы человеком 22.09.2026: D, RD, SD и категория C — разбор;
    категория B с негативным прогнозом или под наблюдением — внимание.
    Написания категорий приведены к букве правилом разбора, а перечень точек
    шкал берётся у справочника источника.

# **Срочность долга в балансе не видна, и это отдельное обстоятельство.**
# «Долг 40 млрд» у эмитента с погашением через восемь лет и с погашением
# в марте означает разное, а балансовые коэффициенты их не различают. График
# платежей различает прямо: купоны и погашения ближайших месяцев против
# денежных средств отчётной даты.
#
# **Отсечка — единица, и она объяснима словами**: денежных средств не хватает
# на платежи ближайших двенадцати месяцев. Замер показал, что единица и двойка
# дают на наборе одно и то же — в полосе 1–2 в «Без внимания» нет никого, —
# и выбрана единица: у неё есть смысл помимо калибровки.
#
# Оферта в отсечку не входит: предъявление бумаги к выкупу — право владельца,
# и сложенная с купоном она выдала бы возможное за состоявшееся. Величина
# по офертам печатается рядом сведением.
refinancing:
  months: 12
  cover_ratio: 1
  origin: >-
    Решение человека 22.09.2026 по замеру на 150 эмитентах: платежи выше
    денежных средств у 57, из них в «Без внимания» стояли 8 — их отсечка
    и добавляет к увиденному. В полосе 1–2 в «Без внимания» нет никого,
    поэтому 1 и 2 дают одно и то же, а единица объяснима без калибровки.
  calibration_status: preliminary

# **Холдинг на одной отчётности РСБУ.** Основной вид деятельности берётся
# из ЕГРЮЛ через ГИР БО (поле `okved2` ответа поиска по ИНН): 64.20 —
# деятельность холдинговых компаний, 70.10 — деятельность головных офисов.
# Коды названы кодами, а не словами: наименование вида деятельности
# в выписке пишется свободно, и сравнение по слову «холдинг» проглотило бы
# чужой вид. Сравнение по началу кода — подвиды (64.20.1 и прочие) означают
# то же самое.
#
# **Обстоятельство — периметр отчётности, а не ухудшение величин**, поэтому
# корзина не мягче внимания, а разбора само по себе оно не даёт. Действует
# только тогда, когда маршрут построен по РСБУ: у эмитента с консолидированной
# отчётностью группа видна, и холдинговый вид деятельности ничего не скрывает.
holdings:
  # Код и его наименование по ОК 029-2014: наименование объявлено здесь,
  # а не берётся из выписки, потому что в выписке оно пишется свободно,
  # а в основании маршрута читателю нужен вид деятельности, а не код.
  okved:
    "64.20": Деятельность холдинговых компаний
    "70.10": >-
      Деятельность головных офисов; консультирование по вопросам управления
  # **Запасной признак по отчётности, и он нужен потому, что вида
  # деятельности может не быть.** ГИР БО не отвечал всю ночь на 23.09.2026,
  # и правило, опирающееся на один ОКВЭД, молчало у 773 организаций из 807.
  # Признак, работающий только при доступном источнике, неотличим
  # от невыполненного в тот день, когда источник недоступен.
  #
  # Существо признака то же: организация, у которой активы — вложения
  # в другие организации, а собственной выручки почти нет, ведёт не свою
  # деятельность, а владеет чужой. Величины берутся из той же отчётности,
  # по которой построен маршрут, и обе доли объявлены здесь.
  fallback:
    financial_investments: ["1170", "1240"]
    assets: "1600"
    revenue: "2110"
    investments_share: "0.50"
    revenue_share: "0.05"
    origin: >-
      Решение человека 23.09.2026: финансовые вложения (1170 + 1240) больше
      половины активов при выручке ниже порога существенности. Половина
      активов — величина решения, порог существенности взят объявленный
      (`ifrs_lines.yaml`, materiality.share_of_total_assets — 5 %), нового
      числа здесь не заводится. Признак запасной: при известном виде
      деятельности решает ОКВЭД.
    calibration_status: preliminary
  origin: >-
    Решение человека 22.09.2026 (дорожная карта, фаза 1), урок Кириллицы:
    показатели управляющей компании спокойны, а обслуживание долга зависит
    от группы, которой в её отчётности нет. Коды взяты из ОКВЭД2
    (ОК 029-2014): 64.20 «Деятельность холдинговых компаний», 70.10
    «Деятельность головных офисов; консультирование по вопросам управления».
  calibration_status: preliminary

# **У крупного долга цена ошибки другая, и «Без внимания» ему даётся строже.**
# Эмитент верхнего десятка по объёму долга в обращении попадает в «Без
# внимания» только при полном покрытии: долговая нагрузка, автономия
# и ликвидность рассчитаны — **не оценкой сверху**. Оценка сверху доказывает
# прохождение критерия, но не заменяет величины, и у такого эмитента цена
# этой замены выше всех прочих.
#
# Доля считается от эмитентов списка, у которых объём в обращении известен
# и положителен: у эмитента без облигаций величины нет вовсе, и включать его
# в знаменатель значило бы мерить не долг, а состав списка.
systemic:
  top_share: 0.10
  origin: >-
    Решение человека 22.09.2026. Отсечка — доля, а не сумма: рублёвый порог
    устарел бы с первым размещением, а верхний десяток остаётся верхним.
  calibration_status: preliminary

severity:
  review_caps: ["E", "D"]
  origin: >-
    Градации взяты у стоп-факторов методики, новых величин здесь нет.
    Замер 22.09.2026: из 158 эмитентов со сработавшим стоп-фактором
    у 131 сработал только отрицательный чистый оборотный капитал
    (ограничение средним), у 26 — отрицательный капитал вместе
    с отрицательной автономией (низший), у одного — неопределённость
    непрерывности (неустойчивое состояние).

# Новый порог — единственный. Годовая отчётность за истекший год публикуется
# к концу мая (у эмитентов набора — апрель и май), и после 1 июня её
# отсутствие означает не срок публикации, а то, что отчётности нет либо
# она не получена.
freshness:
  annual_due: "06-01"
  # Два цикла раскрытия: последняя годовая отчётность за год, который старше
  # позапрошлого. Величины такой давности описывают организацию, которой могло
  # не стать, и вопрос к ней уже другой — о статусе, а не о нагрузке.
  status_unknown_after_cycles: 2
  origin: >-
    Новый порог, шкалы у него нет. Отсечка `freshness.max_months` (15 месяцев)
    из `report.yaml` для маршрута не годится: она отвечает на вопрос
    «описывает ли документ состояние на день чтения», а здесь вопрос другой —
    сдана ли отчётность вообще.
  calibration_status: preliminary

# **Ни один эмитент не покидает список молча.** Выход объявляется причиной,
# датой и преемником и пишется в журнал исключений; неподтверждённое —
# не выход, а очередь «установить статус эмитента». Сводка печатает число
# вышедших: список, уменьшившийся без записи, врёт о себе сам.
#
# **Поле поглощения выходом не является, и это стоило двадцати четырёх живых
# эмитентов.** `emitents_id_absorption` названо у источника «Компания,
# оставшаяся после слияния/поглощения», и заполнено оно у живых тоже:
# у Ростелекома, МегаФона, Вымпелкома, Мосэнерго, Т Плюс, Металлоинвеста,
# Мостотреста — и даже у Норникеля, где указан Полюс. Прочитав поле как
# «поглощён», список потерял их всех; проверено по 29 карточкам с непустым
# полем — у 18 из них статус «действующая».
#
# **Решает статус, а поле поглощения лишь называет преемника.** Справочника
# статусов у API нет (`get_emitent_statuses` отвечает 404), но описание поля
# в `docs/cbonds/openapi.yaml` перечисляет значения по порядку, и порядок
# соответствует идентификаторам. Сверено на случаях: у Монополии, Голдман
# Групп и ООО «ОР» статус 7, и все трое в дефолте; у КИВИ Финанс 9 при
# объявленной реорганизации; у Лензолота 3.
universe:
  statuses:
    "1": действующая
    "3": в процессе ликвидации
    "5": ликвидирована
    "7": идёт процедура банкротства
    "9": в процессе реорганизации
  statuses_origin: >-
    Выведено из описания поля `emitent_statuses_id` в `docs/cbonds/openapi.yaml`
    («действующая, в процессе ликвидации, ликвидирована, идет процедура
    банкротства, в процессе реорганизации»): порядок значений соответствует
    порядку идентификаторов 1, 3, 5, 7, 9. Справочника у API нет, поэтому
    соответствие проверено на случаях — Монополия, Голдман Групп и ООО «ОР»
    со статусом 7 в дефолте, КИВИ Финанс со статусом 9 в реорганизации,
    Лензолото со статусом 3. Замер 22.09.2026 по 481 карточке: статус 1
    у 450, 5 у 19, 7 у 9, 3 у 2, 9 у одного.
  # Выходит из списка только ликвидированный эмитент, у которого **известен
  # преемник** — карточка преемника есть в справочнике. Ликвидированный
  # без известного преемника не выходит: о нём нечего сказать, и это очередь
  # статуса, а не исключение.
  exclude_statuses: ["5"]
  require_successor: true
  unconfirmed_to: status_unknown
  origin: >-
    Правило переписано 22.09.2026 после повторной проверки: прежнее исключало
    по полю поглощения и вывело из списка 24 живых эмитента. Теперь основание —
    статус «ликвидирована» вместе с известным преемником; таких 7 из 29
    карточек с непустым полем поглощения, остальные остаются в списке.

# **Формулировка основания говорит о смысле, а не о механике расчёта.**
# «Величина маршрута за концом своей калибровочной шкалы» — правда о том, как
# устроен расчёт, и ничего не говорит человеку, которому эмитента передают.
# Формулировки объявлены здесь по таблице записки эксперта (раздел 6,
# «Проверка списка наблюдения», 22.09.2026) и правятся диффом, как всякая
# формулировка документа.
#
# Слоты: `{metric}` — наименование показателя, `{value}` — его величина
# в разрядности единой точки округления, `{threshold}` — порог, `{name}` —
# наименование стоп-фактора, `{extra}` — величина стоп-фактора в скобках,
# `{group}`, `{leader}`, `{class}`, `{where}`, `{field}`, `{date}`, `{cycles}`,
# `{months}`, `{due}`, `{cash}`, `{volume}`, `{missing}`, `{reason}`.
#
# **`{unit}` обязателен у формулировки, печатающей денежную величину голым
# числом.** Величина, набранная через показатель, единицу несёт в себе —
# её ставит единая точка печати; величина, набранная `money()`, не несёт,
# и без слота строка читается в тех единицах, которые предположит читатель.
# Проверено дорого: 39 строк списка наблюдения подписали миллионы тысячами
# (Мечел, АФК «Система», Уральская Сталь), и «Операционный убыток: -26 487»
# без единицы был среди них.
#
# **Перцентиля здесь нет ни у одной формулировки.** Шкалы экспертные,
# не перцентильные, и «ниже N % выборки» было бы утверждением о выборке,
# которой не существует. Перцентиль допустим только посчитанный на самом
# списке и подписанный «ниже N % эмитентов списка».
statements:
  by_ground:
    level_off_scale:
      net_debt_ebitda: "Высокая долговая нагрузка: чистый долг / EBITDA {value}x (порог {threshold}x)"
      equity_ratio: "Собственного капитала почти нет: автономия {value} (порог {threshold})"
      cur_liq: "Низкая ликвидность: текущая ликвидность {value} (порог {threshold})"
      default: "{metric} {value} за порогом {threshold}"
    metric_in_lower_band:
      net_debt_ebitda: "Повышенная долговая нагрузка: чистый долг / EBITDA {value}x"
      equity_ratio: "Низкая доля собственного капитала: автономия {value}"
      cur_liq: "Невысокая ликвидность: текущая ликвидность {value}"
      default: "{metric} в нижней части шкалы: {value}"
    stop_factor_severe:
      default: "Стоп-фактор: {name}{extra}"
    stop_factor_capped:
      default: "Стоп-фактор: {name}{extra}"
    # **Граница сверху — не «не менее».** Настоящее значение бывает и ниже
    # порога, поэтому вывода о нарушении здесь нет: есть отсутствие вывода.
    bound_above_threshold:
      default: >-
        Долговая нагрузка не установлена: чистый долг / EBITDA не выше {value}x
        (оценка сверху по операционной прибыли, амортизация не раскрыта)
    data_insufficient:
      default: "Данных для маршрута нет: {field}"
    # **«Отчётности нет вовсе» и «три величины не собраны» — одно
    # обстоятельство, а не три.** Перечислять недостающие поля там, где
    # отчётности не поступало ни по одному стандарту, значило бы называть
    # следствия вместо причины.
    reporting_unavailable:
      default: >-
        Отчётность недоступна: маршрут построен по событиям и рейтингам.
        Нормализованной отчётности у источника нет ни по МСФО, ни по РСБУ
      quarantined: >-
        Отчётность недоступна: комплекты в карантине, маршрут построен
        по событиям и рейтингам
    # **Формулировка называет, чем холдинг опознан.** Вид деятельности
    # объявлен реестром, доля вложений выведена из отчётности, и читателю
    # это разные сведения: первое — факт о регистрации, второе — наше чтение.
    holding_rsbu_only:
      default: >-
        Отчётность управляющей компании, группа не видна: основной вид
        деятельности {okved} ({activity}), консолидированной отчётности
        по МСФО у источника нет
      by_values: >-
        Отчётность управляющей компании, группа не видна: финансовые вложения
        составляют {share} % активов при выручке ниже порога существенности,
        консолидированной отчётности по МСФО у источника нет
    refinancing_gap:
      default: >-
        Денежных средств не хватает на платежи ближайших {months} месяцев:
        {due} против {cash} {unit}
    # **Оферта названа правом владельца прямо в формулировке.** Иначе мера
    # читается как долг, которого эмитент не платит, а она описывает худший
    # случай: предъявление — право, и пользуются им именно в стрессе.
    refinancing_offers:
      default: >-
        При предъявлении всех оферт ближайших {months} месяцев денежных
        средств не хватит: {offered} против {cash} {unit}. Предъявление —
        право владельца, а не обязанность эмитента, и пользуются им
        в стрессе
    systemic_partial_cover:
      default: >-
        Крупный долг в обращении ({volume} {unit}), а покрытие неполное:
        {missing}
    negative_ebitda:
      default: "EBITDA не положительна: {value}"
    operating_loss:
      default: "Операционный убыток: {value} {unit}"
    disclosure_overdue:
      default: "Нарушен срок раскрытия: последняя годовая отчётность за {date}"
    status_not_confirmed:
      default: >-
        Статус эмитента не подтверждён: {reason}. Из списка он не выходит,
        пока не установлено, что с ним стало
    reporting_two_cycles_old:
      default: >-
        Годовой отчётности нет за {cycles} цикла раскрытия: последняя
        за {date}. Сперва устанавливается статус эмитента
    # **У финансирующей структуры три разных положения, и формулировка у каждого
    # своя.** Поручитель в списке — её корзина берётся у него; поручитель вне
    # списка — оценивать нечем, нужен человек; поручителя нет вовсе — остаётся
    # группа. Одна формулировка на три случая говорила бы о группе там, где
    # речь о поручителе.
    financing_structure:
      default: >-
        SPV группы {group}: собственные показатели неинформативны,
        оценка по группе {leader}
      by_guarantor: "SPV группы {group}: корзина поручителя {guarantor}"
      guarantor_unlisted: >-
        SPV группы {group}: поручитель {guarantor} в списке отсутствует,
        оценивать по собственным показателям нечего
    group_under_review:
      default: "Группа {group}: {leader} в разборе"
    guarantor_under_review:
      default: "Поручитель {guarantor} в разборе"
    assessed_class_low:
      default: "Класс {class} по {where}"
    zero_check_failed:
      default: "Проверка нуля не сошлась: комплект в карантине"
    emission_default:
      default: "{what} по выпуску {issue}: {where}"
    # **Признак старого дефолта — не утверждение о дефолте сегодня.** Поэтому
    # формулировка говорит о признаке и называет то действие, которого он
    # требует: узнать, улажено ли. Год печатается, потому что «давний дефолт»
    # без года не проверить.
    default_unsettled_stale:
      default: >-
        Признак неурегулированного дефолта {year}, проверить статус
        урегулирования ({where})
    # **Год не всегда определим, и тогда о нём не говорится в скобках.**
    # «Дефолт урегулирован (год не определён)» читается как год, взятый
    # в скобки, а не как его отсутствие; у выпуска в обращении дата погашения
    # лежит в будущем и события не называет.
    default_settled_recent:
      default: >-
        Дефолт урегулирован ({year}) — кредитная история эмитента:
        выпуск {issue}
      no_year: >-
        Дефолт урегулирован, год события не определён — кредитная история
        эмитента: выпуск {issue}
    default_settled_stale:
      default: >-
        Справочно: урегулированный дефолт {year} года, старше {years} лет
        ({issue})
    rating_default:
      default: "Рейтинг {point} ({agency}, {date}) — категория {category}"
    # Дата перевода — содержание события, и без неё формулировка говорит
    # о состоянии, а не о том, что случилось и когда.
    risk_sector:
      default: >-
        Биржа перевела выпуск {issue} в сектор повышенного риска {date}
        (режим {board}, прежде {came_from})
      undated: >-
        Выпуск {issue} торгуется в секторе повышенного риска (режим {board}),
        даты перевода биржа не приводит
    rating_outlook_adverse:
      default: "Рейтинг {point} ({agency}), прогноз {outlook}"
    # Решение человека называет автора и срок: без автора оно читалось бы
    # как правило, без срока — пережило бы своё основание.
    manual_floor:
      default: >-
        Решение человека ({author}, {date}, до {until}): {reason}

# **Источник основания объявлен у каждого, и объявлен в одном месте.**
# Корзина без источника ничего не доказывает: совпасть с ожиданием она может
# и по другой причине, — а перечень «основание → источник», заведённый вторым
# экземпляром в замере и в выгрузке, разошёлся бы при первом же новом
# основании. Справочник не загрузится, если у основания источника нет
# либо источник объявлен у основания, которого нет.
#
# Источник здесь — **откуда пришло обстоятельство**, а не кто его считает:
# «выпуск» — карточка выпуска и события дефолта, «рейтинг» — снимок рейтингов,
# «отчётность» — величины комплекта, «группа» и «поручитель» — обстоятельство
# другого эмитента.
ground_sources:
  refinancing_offers: выпуск и отчётность
  status_not_confirmed: справочник эмитентов
  reporting_two_cycles_old: отчётность (срок)
  stop_factor_severe: отчётность
  assessed_class_low: отчётность (наша оценка)
  level_off_scale: отчётность
  emission_default: выпуск
  risk_sector: биржа
  rating_default: рейтинг
  financing_structure: группа (SPV)
  zero_check_failed: отчётность (карантин)
  stop_factor_capped: отчётность
  group_under_review: группа
  guarantor_under_review: поручитель
  data_insufficient: отчётность (пробел)
  reporting_unavailable: отчётность (нет вовсе)
  holding_rsbu_only: отчётность (периметр)
  default_unsettled_stale: выпуск
  default_settled_recent: выпуск
  rating_outlook_adverse: рейтинг
  refinancing_gap: выпуск и отчётность
  systemic_partial_cover: выпуск и отчётность
  metric_in_lower_band: отчётность
  bound_above_threshold: отчётность
  negative_ebitda: отчётность
  operating_loss: отчётность
  disclosure_overdue: отчётность (срок)
  default_settled_stale: выпуск
  # Источник здесь — журнал решений в базе, и он назван так же прямо, как
  # справочник или выпуск: решение человека — такое же основание, только
  # с именем.
  manual_floor: решение человека

baskets:
  # **Очередь «установить статус эмитента» — не корзина тяжести, а другой
  # вопрос.** Если последняя годовая отчётность старше двух циклов раскрытия,
  # маршрутизировать по её числам нельзя: они описывают организацию, которой
  # могло не стать. Спрашивать надо не о долговой нагрузке, а о том, есть ли
  # выпуски в обращении, не идёт ли ликвидация или банкротство.
  - code: status_unknown
    name: Установить статус эмитента
    order: 1
    meaning: >-
      Последняя годовая отчётность старше двух циклов раскрытия. По числам
      такой давности маршрут не строится: сперва устанавливается, существует
      ли эмитент, есть ли выпуски в обращении и не начата ли ликвидация.
    # **Природы здесь две, и действия у них разные.** Статус карточки говорит
    # о ликвидации — вопрос к реестру: что стало с эмитентом и кто преемник.
    # Отчётности нет два цикла — вопрос к раскрытию: обязан ли он её сдавать
    # и не прекращена ли деятельность. Одной корзиной их показывать нельзя
    # по тому же основанию, по которому разделено «Внимание»: потерянная
    # при показе подгруппа уносит и своё действие.
    groups:
      - code: legal_status
        name: статус в реестре
        order: 1
        action: >-
          Установить статус в ЕГРЮЛ и у источника: действует ли эмитент,
          не начата ли ликвидация или банкротство, кто преемник
        why: >-
          Обстоятельство названо карточкой источника, а не выведено из чисел:
          статус объявлен, а подтверждения преемника нет. Действие — сверка
          с реестром, и величины здесь ни при чём.
      - code: disclosure_stopped
        name: раскрытие прекращено
        order: 2
        action: >-
          Проверить, есть ли выпуски в обращении и обязан ли эмитент сдавать
          отчётность: величины прошлых лет описывают другой предмет
        why: >-
          Обстоятельство названо сроком: годовой отчётности нет за два цикла
          раскрытия. Действие другое — не сверка реестра, а вопрос о самом
          раскрытии; смешав их, очередь потеряла бы своё действие.
    grounds:
      # **Неподтверждённый выход — не выход.** Эмитент, у которого статус
      # карточки говорит о ликвидации, а преемник не назван либо неизвестен
      # нам, из списка не выходит: о нём нечего сказать, и спрашивать надо
      # то же, что у давней отчётности — что с ним стало. Сюда же попадает
      # статус, которого нет в справочнике: молча приравнять его
      # к действующему значило бы не заметить новое значение.
      - code: status_not_confirmed
        group: legal_status
        name: статус эмитента не подтверждён
        threshold_from: routing.universe.statuses
        why: >-
          Основание заведено 22.09.2026 вместе с правилом «ни один эмитент
          не покидает список молча»: прежде такой эмитент исчезал из списка
          по полю поглощения, и вместе с ним исчезли 24 живых.
      - code: reporting_two_cycles_old
        group: disclosure_stopped
        name: годовой отчётности нет за два цикла раскрытия
        threshold_from: routing.freshness.status_unknown_after_cycles
        why: >-
          Давность видна всегда и более сильным основанием не гасится: величины
          такой давности описывают прошлое состояние, и решение по ним было бы
          решением о другом предмете. Очередь отдельная, потому что и вопрос
          другой — статус эмитента, а не его долговая нагрузка.

  - code: review
    name: Разбор
    order: 2
    meaning: >-
      Обстоятельство риска: решение по нормализованным данным не принимается,
      нужен человек. Нехватки данных здесь нет — пробел о риске не говорит
      и стоит во внимании.
    grounds:
      - code: stop_factor_severe
        name: стоп-фактор с ограничением класса низшим либо неустойчивым
        threshold_from: ifrs_issuer_type.stop_factors.cap
        why: >-
          Отрицательный собственный капитал, отрицательная автономия
          и объявленная аудитором неопределённость непрерывности — состояния,
          при которых методика ограничивает класс низшим либо неустойчивым.
          Класс по данным агрегатора при этом не фиксируется: состав величин
          у него собственный, — но обстоятельство настоящее и требует разбора.
      - code: assessed_class_low
        name: присвоенный класс D или E по разобранному документу
        threshold_from: routing.severity.review_caps
        why: >-
          Оценка из базы — установленный нами исход по документу эмитента,
          а не предположение по нормализованным величинам, и она старше любого
          признака агрегатора. Градации те же, что у стоп-факторов: маршрут
          своих не вводит. Основание заведено по противоречию — у ЛСР класс E,
          а маршрут давал внимание.
      - code: level_off_scale
        name: величина маршрута за концом своей калибровочной шкалы
        threshold_from: ifrs_metrics.calibration_points
        why: >-
          Балл уровня равен нулю: величина лежит за последней опорной точкой
          шкалы, дальше которой шкала не продолжается. Это не новый порог,
          а конец существующего, и одной такой величины достаточно — шкала
          кончилась, и различать «насколько хуже» методике нечем.
      # **Дефолт — обстоятельство разбора, и дата события называется.**
      # Даты события источник не приводит вовсе: опорой служит дата погашения
      # (день, когда платёж был должен состояться) либо дата обновления
      # записи, и каждая называется тем, чем является.
      - code: emission_default
        name: дефолт по выпуску
        why: >-
          Событие между отчётными датами, которого годовая отчётность не видит.
          Признак объявлен статусом выпуска и полем неурегулированности:
          первое говорит, что случилось, второе — что не улажено.
      # **Перевод в сектор повышенного риска — решение биржи с датой.**
      # Это не наше суждение о выпуске и не признак, выведенный из величин:
      # биржа перевела бумагу в режим «Д» и день перевода назвала. У ЕвроТранса
      # он приходится на 06.08.2026 — задолго до отчётной даты, по которой
      # маршрут судит.
      - code: risk_sector
        name: выпуск переведён в сектор повышенного риска
        threshold_from: moex_risk.RISK_BOARDS
        why: >-
          Режимы риска объявлены поимённо (`TQRD`, `TQUD`), а не отбором
          по слову: в наименовании режима слова «риск» нет вовсе, а буква «Д»
          стоит и в «Гособлигациях». Дата перевода берётся у карточки выпуска,
          режим, из которого переведён, — у безадресного «Т+»: у выпуска
          сорок режимов, и торги в РЕПО и адресных сделках кончаются когда
          угодно.
      - code: rating_default
        name: рейтинг категории D, RD, SD или C
        threshold_from: routing.events.review_categories
        why: >-
          Рейтинг такой категории — состояние, а не движение: агентство
          объявляет дефолт либо преддефолтный уровень. Категория берётся
          из справочника точек шкал источника.
      - code: financing_structure
        name: финансирующая структура группы
        why: >-
          Признак SPV справочника эмитентов. У такой структуры «прочие» —
          внутригрупповые займы, а отрицательный капитал бывает устройством:
          оценивать её в отрыве от группы нельзя, а поручителя источник
          не даёт.
      - code: zero_check_failed
        name: провал проверки нуля
        why: >-
          Комплект в карантине: тождество отчётности не сходится либо итог
          равен нулю при ненулевой деятельности. Ноль у агрегатора
          не означает нуля, и считать по такому комплекту нечего.

  - code: attention
    name: Внимание
    order: 3
    meaning: >-
      Обстоятельство требует объяснения, но решения за человека не требует:
      величина в нижней части своей шкалы, штатно ограничивающий стоп-фактор,
      нарушенный срок раскрытия либо недостающее для маршрута поле.
    # **Внимание одной корзиной не показывается: природы там четыре, и действия
    # у них разные.** Наступившее обстоятельство смотрят первым, риск
    # по величинам смотрят, пробел данных добирают, нарушение срока раскрытия
    # мониторят. Эмитент бывает в нескольких подгруппах — тогда он
    # показывается по старшей, а остальные перечисляются: подгруппа,
    # потерянная при показе, снимает и своё действие.
    #
    # **Порядок подгрупп — порядок тяжести, и он объявлен человеком
    # 23.09.2026**: события и рейтинги выше величин, величины выше нехватки
    # данных и просрочки раскрытия. Причина в размере корзины: «Внимание» —
    # 461 эмитент из 701, и корзина такого размера выбирать не помогает,
    # если внутри неё нет порядка. Порядок относится к показу, а не к решению:
    # корзина у всех четырёх подгрупп одна.
    groups:
      # **Наступившее обстоятельство старше состояния.** Дефолт, рейтинговое
      # действие и решение человека говорят о том, что **случилось**, а
      # величина — о том, каково положение. Случившееся смотрят раньше.
      # Поручитель в разборе стоит здесь по той же причине: обстоятельство
      # наступило — у того, кто отвечает по долгу.
      - code: event_risk
        name: события и рейтинги
        order: 1
        action: смотреть первым
        why: >-
          Обстоятельство наступило, а не следует из величин: дефолт по выпуску,
          рейтинговое действие, разбор у поручителя, внесённое человеком
          наблюдение агентства. Годовая отчётность этого не видит
          по устройству, и порядок показа обязан ставить такое выше.
      - code: value_risk
        name: риск по величинам
        order: 2
        action: смотреть
        why: >-
          Величины собраны, и то, что они показывают, требует объяснения.
          Действие — разобрать показанное, а не добирать данные.
      - code: data_gap
        name: данных для маршрута недостаточно
        order: 3
        action: добрать данные
        why: >-
          Об эмитенте нельзя сказать ни хорошего, ни плохого: недостающее поле
          названо, и действие относится к данным, а не к эмитенту.
      - code: disclosure
        name: нарушение срока раскрытия
        order: 4
        action: мониторить раскрытие
        why: >-
          Обстоятельство документа, а не расчёта: ждать следующей отчётности
          и следить, появится ли она. Величины при этом бывают в полном порядке.
    grounds:
      - code: stop_factor_capped
        group: value_risk
        name: стоп-фактор с ограничением класса средним
        threshold_from: ifrs_issuer_type.stop_factors.cap
        why: >-
          Отрицательный чистый оборотный капитал и покрытие процентов ниже
          единицы методика объявляет штатным режимом при быстром обороте
          и доступном рефинансировании — ограничение класса средним, а не
          низшим. **Норма неприменимости по нормализованным данным
          не проверяется**: гаситель отрицательного оборотного капитала
          объявлен по покрытию процентов, а начисленных процентов агрегатор
          не раскрывает вовсе, поэтому признак срабатывает у всех, у кого
          краткосрочные обязательства выше оборотных активов. Разбор по такому
          основанию означал бы разбор половины универсума.
      # **Оценка сверху заменой не считается.** Правило «ниже порога — критерий
      # пройден доказуемо» оставалось бы верным арифметически, но у восьми
      # эмитентов оно давало «без внимания» при нерассчитанной долговой
      # нагрузке, то есть решение по величине, которой нет. Решение
      # 22.09.2026: не рассчитан — не ниже внимания, а оценка сверху остаётся
      # сведением и печатается рядом. Замена диапазоном — другое дело: там
      # величина заменена решением методики, а не пропущена.
      # **Поручитель — тот же групповой контур, только объявленный договором.**
      # Обязательство поручителя названо самим выпуском, а не выведено
      # из принадлежности к группе, и обстоятельство поручителя говорит
      # о том, кто отвечает по долгу. Корзина при этом не переносится:
      # разбор сказан о нём, а не о заёмщике.
      - code: guarantor_under_review
        group: event_risk
        name: поручитель в разборе
        why: >-
          Поручительство объявлено записью источника с видом обязательства:
          поручитель и гарант отвечают по долгу, оферент — за выкуп бумаги,
          и корзину даёт только первое. Самопоручительство в счёт не идёт —
          эмитент не отвечает за себя дважды.
      - code: data_insufficient
        group: data_gap
        name: данных для маршрута недостаточно
        why: >-
          Долг, автономия либо текущая ликвидность не собраны, и недостающее
          поле называется. Это пробел данных, а не риск: молчание читалось бы
          как «без внимания», а разбор — как обстоятельство, которого нет.
      # **Отчётности нет вовсе — одно обстоятельство, а не три пробела.**
      # Маршрут при этом строится: события и рейтинги от стандарта отчётности
      # не зависят, и дефолт по выпуску виден у эмитента, о котором чисел
      # у нас нет ни одного. Основание объявляет, чем маршрут построен, —
      # иначе «Внимание» у такого эмитента читалось бы как суждение
      # о величинах, которых не было.
      - code: reporting_unavailable
        group: data_gap
        name: отчётности нет ни по одному стандарту
        why: >-
          Основание заведено 22.09.2026 (дорожная карта, фаза 1): из 702
          эмитентов с выпусками в обращении у 93 нормализованной отчётности
          нет у источника вовсе. Перечислять три недостающие величины значило
          бы называть следствия вместо причины, а молчать — выдавать
          отсутствие данных за отсутствие обстоятельств.
      # **Отчётность управляющей компании группой не является.** У холдинга
      # РСБУ описывает юридическое лицо, через которое привлекается долг,
      # а деятельность ведут дочерние общества: величины такой отчётности
      # верны и не описывают того, за счёт чего долг обслуживается. Вид
      # деятельности берётся из ЕГРЮЛ через ГИР БО (`okved2`), написания
      # объявлены кодами, а не словами.
      - code: holding_rsbu_only
        group: value_risk
        name: маршрут по отчётности управляющей компании
        threshold_from: routing.holdings.okved
        why: >-
          Урок Кириллицы: показатели управляющей компании сами по себе
          спокойны, а обслуживание долга зависит от группы, которой в этой
          отчётности нет. Обстоятельство не мягче внимания, разбора же
          само по себе не требует: периметр — свойство отчётности,
          а не признак ухудшения.
      # **Обстоятельство, которого машина не видит, вносит человек — с именем
      # и сроком.** Статуса наблюдения у источника нет вовсе: у Русагро АКРА
      # объявило наблюдение 22.04.2026, а в карточке стоит стабильный прогноз,
      # и вывести одно из другого нельзя. Журнал решений лежит в базе
      # (`routing_decision`), а не в методике: методика правится диффом,
      # а решение об одном эмитенте, принятое во время работы, методикой
      # не является.
      #
      # «Не ниже», а не «назначить»: решение человека добавляется к машинным
      # обстоятельствам, а не отменяет их, — иначе журнал стал бы способом
      # вывести эмитента из разбора.
      - code: manual_floor
        group: event_risk
        name: решение человека о корзине
        why: >-
          Решение названо автором, основанием и сроком действия. Срок
          обязателен: обстоятельство, внесённое руками, устаревает само —
          наблюдение агентства снимается, а запись о нём осталась бы навсегда.
          Истёкшие решения остаются в журнале и считаются отдельно.
      # Спекулятивная категория сама по себе обстоятельством не является —
      # обстоятельство даёт её движение: негативный прогноз либо наблюдение.
      # **Дефолт давностью старше трёх лет — вопрос об урегулировании, а не
      # состояние.** Признак неурегулированности у выпуска, погашение которого
      # было должно состояться в 2018 году, говорит о том, что запись
      # не закрыта, — а закрыта она или нет, устанавливается у эмитента.
      # Держать по такому признаку разбор значило бы разбирать прошлое: у ДВМП
      # с тех пор сменились и долг, и собственник.
      - code: default_unsettled_stale
        group: event_risk
        name: признак неурегулированного дефолта старше трёх лет
        threshold_from: routing.events.default_stale_years
        why: >-
          Обстоятельство настоящего из него не следует, а бесследно исчезнуть
          он не вправе: признак стоит в карточке источника, и вопрос
          о статусе урегулирования задаётся эмитенту. Давность считается
          от даты погашения — дату события источник не приводит вовсе,
          а неизвестная давность корзину не понижает.
      - code: default_settled_recent
        group: event_risk
        name: урегулированный дефолт не старше трёх лет
        threshold_from: routing.events.default_stale_years
        why: >-
          Дефолт улажен, и состоянием он не является: обстоятельство здесь —
          кредитная история, свежая настолько, что описывает нынешнего
          эмитента. Разбора она не требует, молчания не допускает.
      # **Основание называется по тому, на что срабатывает.** Прежде оно
      # звалось `rating_watch`, «спекулятивная категория с негативным
      # прогнозом», а срабатывало и на «развивающийся» — то есть графа
      # считала не то, как называется. Хуже того, «watch» обещает статус
      # наблюдения, которого у источника нет вовсе: есть только прогноз,
      # и наблюдение агентства приходится вносить решением человека
      # (`manual_decisions`).
      - code: rating_outlook_adverse
        group: event_risk
        name: спекулятивная категория с неблагоприятным прогнозом
        threshold_from: routing.events.attention_outlooks
        why: >-
          Категория B — уровень, а не событие; событием её делает прогноз,
          объявленный агентством. Неблагоприятны оба объявленных: негативный
          говорит о вероятном пересмотре вниз, развивающийся — о том, что
          направление пересмотра агентством не определено. Пересмотр при
          таком прогнозе — вопрос месяцев, и он приходит между отчётными
          датами.
      # **Срочность долга — своё обстоятельство, и в балансе его нет.**
      # Платежи ближайших двенадцати месяцев выше денежных средств означают,
      # что эмитенту предстоит либо занять, либо продать, — и коэффициенты
      # этого не показывают: остаток долга у них один и тот же независимо
      # от того, когда он гасится.
      - code: refinancing_gap
        group: value_risk
        name: денежных средств не хватает на платежи года
        threshold_from: routing.refinancing.cover_ratio
        why: >-
          Отсечка объяснима словами, а не калибровкой: денежных средств
          не хватает на платежи ближайших двенадцати месяцев. Оферты в неё
          не входят — предъявление право владельца, — и считаются второй
          мерой. Платежи есть, а денежных средств нет вовсе — это пробел
          данных, и он идёт основанием «данных недостаточно».
      # **Вторая мера рефинансирования: те же платежи при предъявлении оферт.**
      # Первая мера считает то, что эмитент обязан заплатить; оферта —
      # обязательство выкупить бумагу **по требованию владельца**, и складывать
      # её с купоном нельзя: это возможное, а не состоявшееся. Меры поэтому
      # две, а не одна, и отсечка у второй та же — своего числа она не вводит.
      #
      # **Основанием корзины мера стала 23.09.2026 решением человека.**
      # Прежде она была справочной: «корзина по чужому праву означала бы
      # „человек нужен“ у всякого эмитента с офертой в окне». Довод снят
      # существом права: предъявляют оферту именно в стрессе, и ошибиться
      # в мягкую сторону здесь дешевле. Цена решения измерена — восемь
      # эмитентов перешли из «Без внимания», и двое из них ушли бы оттуда
      # и без события дефолта, которое по ним потом и случилось.
      - code: refinancing_offers
        group: value_risk
        name: при предъявлении оферт денежных средств не хватает
        threshold_from: routing.refinancing.cover_ratio
        why: >-
          Мера описывает худший случай, и худший случай здесь не редкость:
          право предъявления владелец использует тогда, когда у эмитента
          трудности. Своего порога у меры нет — та же отсечка покрытия,
          что у первой.
      # **Крупному долгу «Без внимания» даётся строже.** Оценка сверху
      # прохождение критерия доказывает, но величины не заменяет, — и у того,
      # чей долг в обращении в верхнем десятке, цена этой замены выше всех
      # прочих. Обстоятельство здесь не в эмитенте, а в нашем знании о нём.
      - code: systemic_partial_cover
        group: value_risk
        name: крупный долг при неполном покрытии величин
        threshold_from: routing.systemic.top_share
        why: >-
          Долговая нагрузка, автономия и ликвидность обязаны быть рассчитаны,
          а не выведены границей. Правило меняет только исход «Без внимания»:
          в прочих корзинах эмитент уже назван другим обстоятельством,
          и основание добавляется к ним сведением.
      - code: metric_in_lower_band
        group: value_risk
        name: величина маршрута в нижней части своей шкалы
        threshold_from: theses.bands.lower_below
        why: >-
          Балл уровня ниже границы нижней части — та же граница, которой
          делится шкала для словесных тезисов. Своего числа маршрут здесь
          не вводит.
      - code: bound_above_threshold
        group: value_risk
        name: вывод по границе выше порога
        threshold_from: ifrs_metrics.calibration_points.net_debt_ebitda
        why: >-
          Точной величины нет, а оценка сверху выше нижней опорной точки
          шкалы: вывода о прохождении она не даёт, и обстоятельство требует
          внимания.
      # **Неположительная EBITDA не делает долговую нагрузку хорошей.**
      # Отношение чистого долга к неположительной EBITDA даёт отрицательную
      # величину, а шкала читает её как низкую нагрузку — то есть «без
      # внимания» у эмитента с убытком. Отрицательное отношение означает одно
      # из двух: чистую денежную позицию либо убыток, и путать их нельзя,
      # поэтому знак EBITDA объявляется своим основанием, а величины чистого
      # долга и EBITDA печатаются порознь.
      - code: negative_ebitda
        group: value_risk
        name: EBITDA не положительна
        why: >-
          При неположительной EBITDA отношение чистого долга к ней не измеряет
          нагрузку: оно отрицательно у эмитента с убытком так же, как
          у эмитента без долга. Величина при этом считается, и молчание
          о знаке оставляло бы такого эмитента без внимания.
      - code: operating_loss
        group: value_risk
        name: операционная прибыль не положительна
        why: >-
          Ни один вывод по границе при этом невозможен, а сама величина
          говорит о состоянии прямо. Порога здесь нет вовсе — знак.
      - code: disclosure_overdue
        group: disclosure
        name: нарушение срока раскрытия
        threshold_from: routing.freshness.annual_due
        why: >-
          После 1 июня отсутствие годовой отчётности за истекший год означает,
          что она не сдана либо не получена, — обстоятельство документа,
          а не расчёта, и с величинами его смешивать нельзя: у эмитента
          с нарушенным сроком раскрытые величины бывают в полном порядке,
          и наоборот.

  - code: clear
    name: Без внимания
    order: 4
    meaning: >-
      Все величины маршрута считаются, все в пределах своих шкал, отчётность
      свежая. Это не суждение о качестве эмитента, а ответ на вопрос
      «нужен ли человек»: не нужен.
    grounds: []

# **Список называет то, чего он не проверяет и чем ограничен.** Пустое место
# читается как «проверено всё», и по этому же основанию рядом с корзинами
# стоит строка охвата: «347 эмитентов» без «из 702» выглядит полнотой.
#
# Ограничения объявлены здесь, а не написаны в коде страницы: текст, который
# читатель принимает за оговорку методики, обязан правиться диффом, как всякая
# формулировка документа.
limitations:
  - >-
    Не проверяется: статус наблюдения рейтингового агентства — в источнике
    его нет вовсе, есть только прогноз; рыночная цена и доходность выпуска;
    раскрывает ли МСФО в своём отчёте эмитент, у которого их нет у агрегатора.
  # Решение человека 23.09.2026 по развилке о шкалах: шкала одна на оба
  # стандарта, и цена выбора названа числом, а не оговоркой вообще.
  - >-
    Шкалы маршрута откалиброваны на консолидированной отчётности по МСФО
    и применяются к обоим стандартам: корзина, означающая в соседних строках
    одного списка разное, хуже неточной шкалы. Цена выбора измерена —
    у 109 эмитентов из 443 с рассчитанной автономией величина лежит в полосе
    от нуля до 0,10, и собственная шкала РСБУ развела бы их иначе. Своя шкала
    для РСБУ — вместе с калибровкой по накопленной истории.
  - >-
    Пороги маршрута предварительны: проверены на одном наборе и одном прогоне.
    Утверждена структура правил, а не величины.

# **Справочное обстоятельство корзины не называет, и поэтому объявлено
# отдельно.** Молчание о нём было бы третьим исходом там, где объявлено два:
# «в корзину не попало» и «его не было». Урегулированный дефолт старше трёх лет
# о сегодняшнем эмитенте не говорит — но человек, открывший строку, обязан
# видеть, что признак в карточке есть, иначе он найдёт его сам и не поймёт,
# отчего маршрут молчал.
reference:
  # **Поле группы отражает бенефициара, а не финансовую связь, и потому
  # корзины не называет.** Решение человека 22.09.2026 по проверке названных
  # пар; прежде оно поднимало членов группы до внимания — 31 эмитент.
  #
  # Проверено на семи парах, и ни одна не оказалась финансовой связью:
  #
  # - Монополия и ГТМ отнесены к «Globaltrans Investment PLC» вместе с его
  #   настоящей дочерней «Новой перевозочной компанией». ГТМ — Globaltruck,
  #   Монополия его и купила; это совпадение написаний, а не группа;
  # - МКПАО «Озон» отнесён к «Системе»: у АФК доля около трети, общество
  #   ассоциированное и в её долг не входит;
  # - Славнефть, Мегионнефтегаз и ЯНОС отнесены к «Газпрому»: Славнефть —
  #   совместное предприятие двух совладельцев, и назван один из них;
  # - «Объединённая авиастроительная корпорация» отнесена к группе «ИРКУT»:
  #   связь перевёрнута — ИРКУТ входит в ОАК, а не наоборот, и группа
  #   названа именем дочерней;
  # - Первая Грузовая Компания отнесена к группе «НЛМК»: общий
  #   бенефициар, финансовой связи нет;
  # - «Синара-Транспортные Машины» отнесена к «ТМК» вместе с ЧТПЗ; ЧТПЗ —
  #   настоящая дочерняя ТМК, СТМ — общий бенефициар;
  # - Иркутскэнерго и «ЭН+ ГРУП» отнесены к «РусГидро»: два разных
  #   холдинга в одной группе.
  #
  # **Признака головной компании у источника нет вовсе**, а распространение
  # вниз объявлено только от неё: `significant_emitents_subr_1` стоит
  # единицей у 442 карточек из 481 — то есть не различает ничего, а тёзка
  # группы найден лишь в 28 группах из 64 с двумя и более членами.
  # Распространение вверх требует доли дочерней в активах группы,
  # а консолидированных активов группы у нас нет.
  #
  # Явная связь остаётся действующей и объявлена отдельно: поручительство
  # названо самим выпуском, а не выведено из принадлежности к группе.
  - code: group_under_review
    name: в группе карточки есть эмитент в разборе
    why: >-
      Поле группы источника отражает бенефициара, а не финансовую связь,
      и в разобранных случаях указывало то на ассоциированное общество,
      то на совместное предприятие, то на дочернюю вместо материнской,
      то на совпадение написаний. Корзину такое основание называть
      не вправе — иначе «Разбор» означал бы «кто-то рядом в разборе».
      Сведением оно остаётся: человек, открывший строку, найдёт группу
      в карточке сам и молчание маршрута прочтёт как недосмотр.

  - code: default_settled_stale
    name: урегулированный дефолт старше трёх лет
    threshold_from: routing.events.default_stale_years
    why: >-
      Дефолт улажен, и улажен давно: обстоятельством настоящего он не является
      ни в каком виде, а сведением остаётся. Корзину справочное основание
      не называет — иначе «Без внимания» перестала бы значить «человек
      не нужен».

