# Маршрутизация: в какую корзину попадает эмитент. **ЧЕРНОВИК.**
#
# **Статус объявлен полем, а не соглашением.** Правила здесь не утверждены,
# и расчёт обязан это печатать: корзина, выданная как решение методики,
# неотличима от согласованной, а согласована она не была.
#
# **Своих чисел у маршрута почти нет, и это условие.** Границы берутся
# из существующих шкал: «ниже нижней части калибровочной шкалы» — это балл
# уровня ниже границы `bands.lower_below` в `theses.yaml` (34 из 100),
# и та же граница делит шкалу для словесных тезисов. Порог долговой нагрузки
# для вывода по границе — нижняя опорная точка шкалы `net_debt_ebitda`
# в `ifrs_metrics.yaml` (5,0). Новый порог здесь ровно один, и он назван
# отдельно: срок, после которого отсутствие годовой отчётности за прошлый год
# само становится обстоятельством.
#
# **Корзины упорядочены, и порядок — часть правила.** Основание разбора
# старше основания внимания: у эмитента со сработавшим стоп-фактором
# и устаревшей отчётностью корзина — разбор, а не внимание. Внутри корзины
# основания перечисляются все: сводка по частоте нужна, чтобы видеть, чем
# корзина наполняется.

version: "0.1.0"
status: draft
approved_by: null
origin: >-
  Черновик 22.09.2026 по поставленным условиям: три корзины, пороги
  из существующих шкал МСФО, новый порог только там, где шкалы нет.
  Правила подлежат утверждению человеком; до утверждения расчёт печатает
  корзину вместе со статусом черновика.

# Новый порог — единственный. Годовая отчётность за истекший год публикуется
# к концу мая (у эмитентов набора — апрель и май), и после 1 июня её
# отсутствие означает не срок публикации, а то, что отчётности нет либо
# она не получена.
freshness:
  annual_due: "06-01"
  origin: >-
    Новый порог, шкалы у него нет. Отсечка `freshness.max_months` (15 месяцев)
    из `report.yaml` для маршрута не годится: она отвечает на вопрос
    «описывает ли документ состояние на день чтения», а здесь вопрос другой —
    сдана ли отчётность вообще.
  calibration_status: preliminary

baskets:
  - code: review
    name: Разбор
    order: 1
    meaning: >-
      Решение по данным не принимается: нужен человек. Либо обстоятельство
      таково, что класс по нормализованным данным не фиксируется, либо
      величин для решения нет вовсе.
    grounds:
      - code: stop_factor
        name: сработал стоп-фактор
        why: >-
          Стоп-фактор по нормализованным данным класс не фиксирует: состав
          величин у агрегатора его собственный, и ограничивать класс
          по величине неизвестного состава нельзя. Обстоятельство при этом
          настоящее и требует разбора.
      - code: metrics_missing
        name: величины маршрута не считаются
        why: >-
          Долг, EBITDA, капитал, оборотные активы либо краткосрочные
          обязательства не собраны. Решать «нужен ли человек» нечем,
          и молчание здесь означало бы «без внимания».
      - code: financing_structure
        name: финансирующая структура группы
        why: >-
          Признак SPV справочника эмитентов. У такой структуры «прочие» —
          внутригрупповые займы, а отрицательный капитал бывает устройством:
          оценивать её в отрыве от группы нельзя, а поручителя источник
          не даёт.
      - code: zero_check_failed
        name: провал проверки нуля
        why: >-
          Комплект в карантине: тождество отчётности не сходится либо итог
          равен нулю при ненулевой деятельности. Ноль у агрегатора
          не означает нуля, и считать по такому комплекту нечего.

  - code: attention
    name: Внимание
    order: 2
    meaning: >-
      Величины считаются, и хотя бы одна из них в нижней части своей шкалы
      либо обстоятельство требует объяснения. Решение возможно, но не само
      собой.
    grounds:
      - code: metric_in_lower_band
        name: величина маршрута в нижней части своей шкалы
        threshold_from: theses.bands.lower_below
        why: >-
          Балл уровня ниже границы нижней части — та же граница, которой
          делится шкала для словесных тезисов. Своего числа маршрут здесь
          не вводит.
      - code: bound_above_threshold
        name: вывод по границе выше порога
        threshold_from: ifrs_metrics.calibration_points.net_debt_ebitda
        why: >-
          Точной величины нет, а оценка сверху выше нижней опорной точки
          шкалы: вывода о прохождении она не даёт, и обстоятельство требует
          внимания.
      - code: operating_loss
        name: операционная прибыль не положительна
        why: >-
          Ни один вывод по границе при этом невозможен, а сама величина
          говорит о состоянии прямо. Порога здесь нет вовсе — знак.
      - code: stale_annual
        name: годовой отчётности за прошлый год нет
        threshold_from: routing.freshness.annual_due
        why: >-
          После 1 июня отсутствие годовой отчётности за истекший год означает,
          что она не сдана либо не получена, — обстоятельство документа,
          а не расчёта.

  - code: clear
    name: Без внимания
    order: 3
    meaning: >-
      Все величины маршрута считаются, все в пределах своих шкал, отчётность
      свежая. Это не суждение о качестве эмитента, а ответ на вопрос
      «нужен ли человек»: не нужен.
    grounds: []
