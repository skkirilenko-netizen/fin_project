# Маршрутизация: в какую корзину попадает эмитент. **ЧЕРНОВИК.**
#
# **Статус объявлен полем, а не соглашением.** Правила здесь не утверждены,
# и расчёт обязан это печатать: корзина, выданная как решение методики,
# неотличима от согласованной, а согласована она не была.
#
# **Своих чисел у маршрута почти нет, и это условие.** Границы берутся
# из существующих шкал: «ниже нижней части калибровочной шкалы» — это балл
# уровня ниже границы `bands.lower_below` в `theses.yaml` (34 из 100),
# и та же граница делит шкалу для словесных тезисов. Порог долговой нагрузки
# для вывода по границе — нижняя опорная точка шкалы `net_debt_ebitda`
# в `ifrs_metrics.yaml` (5,0). Новый порог здесь ровно один, и он назван
# отдельно: срок, после которого отсутствие годовой отчётности за прошлый год
# само становится обстоятельством.
#
# **Корзины упорядочены, и порядок — часть правила.** Основание разбора
# старше основания внимания: у эмитента со сработавшим стоп-фактором
# и устаревшей отчётностью корзина — разбор, а не внимание. Внутри корзины
# основания перечисляются все: сводка по частоте нужна, чтобы видеть, чем
# корзина наполняется.
#
# **Разбор — это риск, а не нехватка данных.** Величина, которой нет,
# ни о чём не говорит: она не свидетельство в пользу эмитента и не улика
# против него. Смешав пробел с обстоятельством, маршрут отправляет к человеку
# тех, о ком просто нечего сказать, — и теряет смысл: к человеку идут все.
# Поэтому нерассчитанная величина маршрута — основание внимания и называет
# недостающее поле, а в разборе стоят только основания риска.
#
# **Стоп-факторы разведены по тяжести, объявленной методикой.** Градация
# у каждого объявлена в `ifrs_issuer_type.yaml` полем `cap`, и маршрут берёт
# её оттуда: ограничение класса низшим и неустойчивым — обстоятельство разбора,
# ограничение средним — обстоятельство внимания. Своего перечня у маршрута нет.

# **Утверждена структура, а не пороги, и это два разных утверждения.**
# `status: approved` говорит, что состав корзин, перечень оснований, градации
# тяжести и подгруппы внимания согласованы человеком. Величины при этом
# остаются предварительными: `thresholds: preliminary` — у порогов маршрута
# ровно то же положение, что у калибровочных точек шкал, они проверены
# на одном наборе и одном прогоне. Одно поле на оба утверждения означало бы,
# что согласие со структурой читается как согласие с числами.
version: "1.0.0"
status: approved
approved_by: "Сергей, 22.09.2026 — структура правил"
thresholds: preliminary
thresholds_origin: >-
  Пороги остаются предварительными до калибровки на данных: единственный
  собственный порог маршрута (срок сдачи годовой отчётности) проверен
  на одном наборе, а прочие взяты из калибровочных точек шкал МСФО,
  у которых статус тот же.
origin: >-
  Черновик 22.09.2026 по поставленным условиям: три корзины, пороги
  из существующих шкал МСФО, новый порог только там, где шкалы нет.
  Правила подлежат утверждению человеком; до утверждения расчёт печатает
  корзину вместе со статусом черновика.
  Редакция 0.2.0 от 22.09.2026 по замеру первой: стоп-факторы разведены
  по объявленной тяжести, нехватка данных перенесена во внимание, срок
  раскрытия назван своим основанием, добавлены класс оценки по документу
  и величина за концом своей шкалы.

# **Тяжесть берётся у стоп-фактора, а не назначается маршрутом.** Ограничение
# класса объявлено в `ifrs_issuer_type.yaml` полем `cap`, и здесь названы
# только те градации, при которых обстоятельство требует человека: низший
# класс (E) и неустойчивое состояние (D). Ограничение средним (C) —
# обстоятельство внимания: методика прямо объявляет его штатным режимом при
# быстром обороте и доступном рефинансировании.
#
# Те же градации читаются и у **присвоенного** класса: оценка по документу
# с классом D или E — не предположение о риске, а установленный нами исход,
# и он старше любой величины агрегатора.
# **Одно обстоятельство — одно решение о маршруте.** Величина за концом шкалы
# и стоп-фактор говорят об одном и том же, когда мерят одно и то же:
# отрицательный чистый оборотный капитал означает текущую ликвидность ниже
# единицы, а нижняя опорная точка шкалы ликвидности — 0,80. Тяжесть такого
# обстоятельства методика уже назвала — градацией стоп-фактора, — и величина
# самостоятельным основанием не становится: иначе правило о тяжести
# отменялось бы следующим правилом, у 82 эмитентов набора ровно так
# и выходило.
#
# Совпадение объявляется парой, а не выводится из имён: у стоп-фактора
# и показателя маршрута код бывает один (автономия) и бывает разный
# (чистый оборотный капитал против текущей ликвидности). Совпадение кодов
# действует всегда и без объявления — это буквально тот же показатель.
same_circumstance:
  - stop_factor: negative_nwc
    metric: cur_liq
    why: >-
      Отрицательный чистый оборотный капитал означает, что краткосрочные
      обязательства выше оборотных активов, то есть текущая ликвидность ниже
      единицы. Нижняя опорная точка её шкалы 0,80 лежит внутри этой области,
      и величина за концом шкалы говорит о том же обстоятельстве, тяжесть
      которого объявлена градацией C.
    origin: >-
      Замер 22.09.2026: из 142 эмитентов с величиной за концом шкалы 82
      держались только текущей ликвидностью, и у всех 82 сработал
      отрицательный чистый оборотный капитал.

severity:
  review_caps: ["E", "D"]
  origin: >-
    Градации взяты у стоп-факторов методики, новых величин здесь нет.
    Замер 22.09.2026: из 158 эмитентов со сработавшим стоп-фактором
    у 131 сработал только отрицательный чистый оборотный капитал
    (ограничение средним), у 26 — отрицательный капитал вместе
    с отрицательной автономией (низший), у одного — неопределённость
    непрерывности (неустойчивое состояние).

# Новый порог — единственный. Годовая отчётность за истекший год публикуется
# к концу мая (у эмитентов набора — апрель и май), и после 1 июня её
# отсутствие означает не срок публикации, а то, что отчётности нет либо
# она не получена.
freshness:
  annual_due: "06-01"
  # Два цикла раскрытия: последняя годовая отчётность за год, который старше
  # позапрошлого. Величины такой давности описывают организацию, которой могло
  # не стать, и вопрос к ней уже другой — о статусе, а не о нагрузке.
  status_unknown_after_cycles: 2
  origin: >-
    Новый порог, шкалы у него нет. Отсечка `freshness.max_months` (15 месяцев)
    из `report.yaml` для маршрута не годится: она отвечает на вопрос
    «описывает ли документ состояние на день чтения», а здесь вопрос другой —
    сдана ли отчётность вообще.
  calibration_status: preliminary

# **Состав списка объявляется, а не подразумевается.** Карточка эмитента
# у агрегатора говорит, поглощён ли он: `emitents_id_absorption` указывает
# на идентификатор преемника. Отчётность поглощённого — история, и строкой
# списка наблюдения он быть не может: у «Глоракс (не сущ.)» поглощение
# указывает ровно на живой «Глоракс» с другим ИНН. Правило структурное,
# а не по наименованию: статусы эмитента приходят кодами, справочника к ним
# у API нет, а «(не сущ.)» в наименовании — примета, не признак.
universe:
  exclude_absorbed: true
  origin: >-
    Замер 22.09.2026 по 481 карточке: у 30 эмитентов статус не «действующий»,
    и поглощение объявлено полем `emitents_id_absorption`. У «Глоракс
    (не сущ.)» оно равно идентификатору живого «Глоракса». Справочника статусов
    у API нет — методы `get_emitent_statuses` и подобные отвечают 404, —
    поэтому основанием служит поглощение, а не код статуса.

baskets:
  # **Очередь «установить статус эмитента» — не корзина тяжести, а другой
  # вопрос.** Если последняя годовая отчётность старше двух циклов раскрытия,
  # маршрутизировать по её числам нельзя: они описывают организацию, которой
  # могло не стать. Спрашивать надо не о долговой нагрузке, а о том, есть ли
  # выпуски в обращении, не идёт ли ликвидация или банкротство.
  - code: status_unknown
    name: Установить статус эмитента
    order: 1
    meaning: >-
      Последняя годовая отчётность старше двух циклов раскрытия. По числам
      такой давности маршрут не строится: сперва устанавливается, существует
      ли эмитент, есть ли выпуски в обращении и не начата ли ликвидация.
    grounds:
      - code: reporting_two_cycles_old
        name: годовой отчётности нет за два цикла раскрытия
        threshold_from: routing.freshness.status_unknown_after_cycles
        why: >-
          Давность видна всегда и более сильным основанием не гасится: величины
          такой давности описывают прошлое состояние, и решение по ним было бы
          решением о другом предмете. Очередь отдельная, потому что и вопрос
          другой — статус эмитента, а не его долговая нагрузка.

  - code: review
    name: Разбор
    order: 2
    meaning: >-
      Обстоятельство риска: решение по нормализованным данным не принимается,
      нужен человек. Нехватки данных здесь нет — пробел о риске не говорит
      и стоит во внимании.
    grounds:
      - code: stop_factor_severe
        name: стоп-фактор с ограничением класса низшим либо неустойчивым
        threshold_from: ifrs_issuer_type.stop_factors.cap
        why: >-
          Отрицательный собственный капитал, отрицательная автономия
          и объявленная аудитором неопределённость непрерывности — состояния,
          при которых методика ограничивает класс низшим либо неустойчивым.
          Класс по данным агрегатора при этом не фиксируется: состав величин
          у него собственный, — но обстоятельство настоящее и требует разбора.
      - code: assessed_class_low
        name: присвоенный класс D или E по разобранному документу
        threshold_from: routing.severity.review_caps
        why: >-
          Оценка из базы — установленный нами исход по документу эмитента,
          а не предположение по нормализованным величинам, и она старше любого
          признака агрегатора. Градации те же, что у стоп-факторов: маршрут
          своих не вводит. Основание заведено по противоречию — у ЛСР класс E,
          а маршрут давал внимание.
      - code: level_off_scale
        name: величина маршрута за концом своей калибровочной шкалы
        threshold_from: ifrs_metrics.calibration_points
        why: >-
          Балл уровня равен нулю: величина лежит за последней опорной точкой
          шкалы, дальше которой шкала не продолжается. Это не новый порог,
          а конец существующего, и одной такой величины достаточно — шкала
          кончилась, и различать «насколько хуже» методике нечем.
      - code: financing_structure
        name: финансирующая структура группы
        why: >-
          Признак SPV справочника эмитентов. У такой структуры «прочие» —
          внутригрупповые займы, а отрицательный капитал бывает устройством:
          оценивать её в отрыве от группы нельзя, а поручителя источник
          не даёт.
      - code: zero_check_failed
        name: провал проверки нуля
        why: >-
          Комплект в карантине: тождество отчётности не сходится либо итог
          равен нулю при ненулевой деятельности. Ноль у агрегатора
          не означает нуля, и считать по такому комплекту нечего.

  - code: attention
    name: Внимание
    order: 3
    meaning: >-
      Обстоятельство требует объяснения, но решения за человека не требует:
      величина в нижней части своей шкалы, штатно ограничивающий стоп-фактор,
      нарушенный срок раскрытия либо недостающее для маршрута поле.
    # **Внимание одной корзиной не показывается: природы там три, и действия
    # у них разные.** Риск по величинам смотрят, пробел данных добирают,
    # нарушение срока раскрытия мониторят. Эмитент бывает в нескольких
    # подгруппах — тогда он показывается по старшей, а остальные
    # перечисляются: подгруппа, потерянная при показе, снимает и своё действие.
    groups:
      - code: value_risk
        name: риск по величинам
        order: 1
        action: смотреть
        why: >-
          Величины собраны, и то, что они показывают, требует объяснения.
          Действие — разобрать показанное, а не добирать данные.
      - code: data_gap
        name: данных для маршрута недостаточно
        order: 2
        action: добрать данные
        why: >-
          Об эмитенте нельзя сказать ни хорошего, ни плохого: недостающее поле
          названо, и действие относится к данным, а не к эмитенту.
      - code: disclosure
        name: нарушение срока раскрытия
        order: 3
        action: мониторить раскрытие
        why: >-
          Обстоятельство документа, а не расчёта: ждать следующей отчётности
          и следить, появится ли она. Величины при этом бывают в полном порядке.
    grounds:
      - code: stop_factor_capped
        group: value_risk
        name: стоп-фактор с ограничением класса средним
        threshold_from: ifrs_issuer_type.stop_factors.cap
        why: >-
          Отрицательный чистый оборотный капитал и покрытие процентов ниже
          единицы методика объявляет штатным режимом при быстром обороте
          и доступном рефинансировании — ограничение класса средним, а не
          низшим. **Норма неприменимости по нормализованным данным
          не проверяется**: гаситель отрицательного оборотного капитала
          объявлен по покрытию процентов, а начисленных процентов агрегатор
          не раскрывает вовсе, поэтому признак срабатывает у всех, у кого
          краткосрочные обязательства выше оборотных активов. Разбор по такому
          основанию означал бы разбор половины универсума.
      # **Оценка сверху заменой не считается.** Правило «ниже порога — критерий
      # пройден доказуемо» оставалось бы верным арифметически, но у восьми
      # эмитентов оно давало «без внимания» при нерассчитанной долговой
      # нагрузке, то есть решение по величине, которой нет. Решение
      # 22.09.2026: не рассчитан — не ниже внимания, а оценка сверху остаётся
      # сведением и печатается рядом. Замена диапазоном — другое дело: там
      # величина заменена решением методики, а не пропущена.
      - code: data_insufficient
        group: data_gap
        name: данных для маршрута недостаточно
        why: >-
          Долг, автономия либо текущая ликвидность не собраны, и недостающее
          поле называется. Это пробел данных, а не риск: молчание читалось бы
          как «без внимания», а разбор — как обстоятельство, которого нет.
      - code: metric_in_lower_band
        group: value_risk
        name: величина маршрута в нижней части своей шкалы
        threshold_from: theses.bands.lower_below
        why: >-
          Балл уровня ниже границы нижней части — та же граница, которой
          делится шкала для словесных тезисов. Своего числа маршрут здесь
          не вводит.
      - code: bound_above_threshold
        group: value_risk
        name: вывод по границе выше порога
        threshold_from: ifrs_metrics.calibration_points.net_debt_ebitda
        why: >-
          Точной величины нет, а оценка сверху выше нижней опорной точки
          шкалы: вывода о прохождении она не даёт, и обстоятельство требует
          внимания.
      # **Неположительная EBITDA не делает долговую нагрузку хорошей.**
      # Отношение чистого долга к неположительной EBITDA даёт отрицательную
      # величину, а шкала читает её как низкую нагрузку — то есть «без
      # внимания» у эмитента с убытком. Отрицательное отношение означает одно
      # из двух: чистую денежную позицию либо убыток, и путать их нельзя,
      # поэтому знак EBITDA объявляется своим основанием, а величины чистого
      # долга и EBITDA печатаются порознь.
      - code: negative_ebitda
        group: value_risk
        name: EBITDA не положительна
        why: >-
          При неположительной EBITDA отношение чистого долга к ней не измеряет
          нагрузку: оно отрицательно у эмитента с убытком так же, как
          у эмитента без долга. Величина при этом считается, и молчание
          о знаке оставляло бы такого эмитента без внимания.
      - code: operating_loss
        group: value_risk
        name: операционная прибыль не положительна
        why: >-
          Ни один вывод по границе при этом невозможен, а сама величина
          говорит о состоянии прямо. Порога здесь нет вовсе — знак.
      - code: disclosure_overdue
        group: disclosure
        name: нарушение срока раскрытия
        threshold_from: routing.freshness.annual_due
        why: >-
          После 1 июня отсутствие годовой отчётности за истекший год означает,
          что она не сдана либо не получена, — обстоятельство документа,
          а не расчёта, и с величинами его смешивать нельзя: у эмитента
          с нарушенным сроком раскрытые величины бывают в полном порядке,
          и наоборот.

  - code: clear
    name: Без внимания
    order: 4
    meaning: >-
      Все величины маршрута считаются, все в пределах своих шкал, отчётность
      свежая. Это не суждение о качестве эмитента, а ответ на вопрос
      «нужен ли человек»: не нужен.
