# Аудиторское заключение: тип задания, вид мнения и разделы-признаки.
#
# **Вид мнения читается из заголовка раздела**, а не из разбора текста.
# МСА 700 предписывают называть раздел одним из четырёх наименований, и это
# то же самое, что ссылка на примечание или ближайший итог ниже строки:
# документ объявляет искомое своим строением. Поиск по словам дал бы здесь
# не отсутствие ответа, а чужой: слово «оговорка» стоит и в абзаце
# об ответственности аудитора.
#
# **Три состояния определённости, а не два.** «Оговорок нет», «заключение
# нечитаемо» и «заключения в документе нет» — разные сведения. У Автодора
# заключение занимает страницы 3–7, и все пять без текстового слоя: сказать
# по нему «мнение немодифицированное» значило бы выдать незнание за результат.
# А у промежуточной отчётности заключения может не быть вовсе, и это тоже
# не то же самое, что нечитаемое.
#
# **Обзорная проверка — отдельный тип задания, а не разновидность мнения.**
# У промежуточной отчётности Автодора было «Заключение по результатам
# обзорной проверки» с выводом с оговоркой. Объём процедур там существенно
# меньше аудита, и аудитор прямо пишет, что мнения не выражает. Смешать это
# с аудиторским мнением — значит выдать меньшую уверенность за большую.

version: "0.2.0"

# Заголовок самого заключения. Запись оглавления им не считается: она
# кончается номером страницы.
report_headings:
  audit:
    - Аудиторское заключение независимого аудитора
    - Аудиторское заключение независимых аудиторов
    - Аудиторское заключение
  review:
    - Заключение по результатам обзорной проверки
    - Отчёт по результатам обзорной проверки
    - Заключение по результатам обзорной аудиторской проверки

# Заключение стоит до первой формы: это его место в отчётности, и оно
# служит границей поиска. Признак структурный, как и всё остальное здесь.
before_forms: true

# Чем кончается заключение. Первая форма для этого слишком поздний рубеж:
# между подписью аудитора и формой стоит заявление об ответственности
# руководства, и у Норникеля из-за этого терялась страница. Граница берётся
# по заголовку следующего раздела — тому, который идёт за заключением.
# Наименования форм сюда не входят намеренно: заключение перечисляет
# проверенные формы в самом мнении («консолидированного отчета о финансовом
# положении по состоянию на…»), и по такому совпадению заключение обрывалось
# на первой же странице, теряя разделы-признаки. Внешним рубежом остаётся
# заголовок первой формы, найденный структурно — по таблице за ним.
ends_before:
  - Заявление об ответственности руководства
  - Ответственность руководства за подготовку
  - Ответственность руководства и лиц, отвечающих за корпоративное управление

# Реквизиты заключения: кем подписано и когда. Нужны цитате — читатель
# обязан видеть, чьи это слова и какого числа они сказаны.
attribution:
  auditor_markers:
    - "Независимый аудитор:"
    - "Аудиторская организация:"
    - "Аудитор:"
  # Организационные формы, с которых начинается наименование аудитора.
  auditor_forms:
    - "АО «"
    - "ООО «"
    - "Акционерное общество «"
  # Месяц перечислен поимённо, а не взят любым словом: «за 12 месяцев
  # 2025 года» под общий образец подходит и становилось датой подписания.
  date_pattern: >-
    \d{1,2}\s+(?:января|февраля|марта|апреля|мая|июня|июля|августа|сентября|
    октября|ноября|декабря)\s+\d{4}\s*(?:года|г\.)
  # Дата подписания стоит отдельной короткой строкой в конце заключения.
  # Отчётные даты самой отчётности стоят внутри предложений мнения, и длина
  # строки — единственное, что их различает без разбора смысла.
  date_line_max_length: 60
  # Как цитата печатается в документе. Кавычки-ёлочки и указание источника
  # обязательны: читатель обязан видеть, где кончается аудитор и начинаемся мы.
  quote_template: >-
    Из аудиторского заключения, раздел «{section}»{signed}:
    «{text}»

# Виды мнения по МСА 700 и 705. Порядок важен: сначала опознаются
# модифицированные заголовки, и лишь затем общий «Мнение» — иначе
# «Мнение с оговоркой» стало бы немодифицированным по совпадению начала.
opinions:
  - code: qualified
    name: Мнение с оговоркой
    modified: true
    headings:
      - Мнение с оговоркой
      - Вывод с оговоркой
  - code: adverse
    name: Отрицательное мнение
    modified: true
    headings:
      - Отрицательное мнение
      - Отрицательный вывод
  - code: disclaimer
    name: Отказ от выражения мнения
    modified: true
    headings:
      - Отказ от выражения мнения
      - Отказ от выражения вывода
  - code: unmodified
    name: Немодифицированное мнение
    modified: false
    headings:
      - Мнение
      - Вывод

# Разделы заключения, каждый из которых сам по себе признак. Наличие раздела
# и есть условие: объявлять отсечку в коде нельзя по тому же правилу, по
# которому у надзорных сигналов условие стоит в справочнике.
sections:
  - code: going_concern_uncertainty
    name: Существенная неопределённость в отношении непрерывности деятельности
    headings:
      - Существенная неопределенность в отношении непрерывности деятельности
      - Существенная неопределённость в отношении непрерывности деятельности
      - Существенная неопределенность, связанная с непрерывностью деятельности
    note: >-
      Раздел объявляется отдельно от вида мнения и сильнее его: у Сегежи
      мнение немодифицированное, а неопределённость объявлена — превышение
      краткосрочных обязательств над краткосрочными активами, продолжающиеся
      убытки и отрицательные операционные потоки.
  - code: emphasis_of_matter
    name: Важные обстоятельства
    headings:
      - Важные обстоятельства
      - Важные обстоятельства – пересмотр
  - code: key_audit_matters
    name: Ключевые вопросы аудита
    headings:
      - Ключевые вопросы аудита
  - code: basis_for_opinion
    name: Основание для выражения мнения
    headings:
      - Основание для выражения мнения
      - Основание для выражения мнения с оговоркой
      - Основание для отказа в выражении мнения

# Сигнал, выводимый из заключения. Условие объявлено здесь, а не в коде:
# прочитав справочник, надо видеть, когда печатается формулировка.
signals:
  - code: opinion_modified
    name: Мнение аудитора модифицировано
    level: supervisory
    # Условие — вид мнения, а не раздел: заголовок раздела мнения и есть
    # объявление вида, и раздела-признака у этого сигнала нет.
    condition: opinion_modified
    formulation: >-
      Мнение аудитора о достоверности отчётности модифицировано. Расчёт
      построен на отчётности, которую аудитор подтвердил не полностью;
      вид мнения и основание модификации названы в самом заключении
      и приведены ниже дословно.
    origin: >-
      Заведён 21.09.2026 после чтения первого заключения МСФО глазами:
      у годового комплекта ПАО «ФосАгро» мнение с оговоркой — не раскрыта
      информация о сегментах, требуемая МСФО (IFRS) 8, — и в документе
      этого не было вовсе. Уровень надзорный, а не «требует внимания»:
      модифицированное мнение есть основание надзорных мер само по себе,
      и в очереди вопросов оно обязано стоять прежде стоп-фактора.
    calibration_status: "preliminary, встречено у 2 комплектов из 15;
      отсечки у признака нет — он структурный, а не пороговый"
  - code: going_concern_uncertainty
    name: Существенная неопределённость в отношении непрерывности деятельности
    level: supervisory
    # Условие — наличие раздела, и слов в нём искать не нужно: МСА 570
    # предписывают называть раздел этими словами, и само его наличие есть
    # утверждение аудитора. Это не то же, что сигнал о пересмотре, где раздел
    # «Важные обстоятельства» бывает о чём угодно и различают его слова.
    condition: section_present
    section: going_concern_uncertainty
    formulation: >-
      Аудитор объявил существенную неопределённость в отношении непрерывности
      деятельности. Это утверждение о способности организации продолжать
      деятельность, а не оговорка о достоверности отчётности: отчётность
      аудитор подтвердил, а исход обстоятельств, от которых зависит
      продолжение деятельности, ему неизвестен.
    origin: >-
      Заведён 21.09.2026 по комплекту ПАО «Сегежа Групп» за 2025 год: мнение
      немодифицированное, раздел о непрерывности объявлен, класс E. Прежде
      неопределённость шла в журнал предупреждением, и соразмерность выходила
      перевёрнутой: у Сегежи уверенность была высшей и эскалации не возникало,
      а у ФосАгро с нераскрытыми сегментами — средней и с эскалацией.
    calibration_status: "preliminary, встречено у 1 эмитента из 15;
      отсечки у признака нет — он структурный, а не пороговый"
  - code: statements_restated
    name: Пересмотр ранее выпущенной отчётности
    level: supervisory
    # Условие — наличие раздела «Важные обстоятельства», объявляющего
    # пересмотр. Структурное, как и всё в этом справочнике.
    condition: section_found
    section: emphasis_of_matter
    markers:
      - пересмотр
      - пересмотренная
    formulation: >-
      Аудитор обратил внимание на пересмотр ранее выпущенной отчётности.
      Пересмотр означает, что опубликованные прежде данные организации
      изменены после выпуска, и сопоставления с ними требуют проверки.
    origin: >-
      Заведён 18.09.2026 по разбору шести комплектов: у ЛСР раздел называется
      «Важные обстоятельства – пересмотр раскрываемой консолидированной
      финансовой отчетности». Событие того же рода, что интенсивность
      пересмотра сравнительных данных в РСБУ (`period_value_mismatch`),
      но объявленное аудитором, а не выведенное нами.
    calibration_status: "preliminary, встречено у 1 эмитента из 6,
      подлежит пересмотру на наборе задачи 29"

# Разделы заключения, которые печатаются в документе **дословно**. Перечень
# объявлен здесь, а не выведен из вида мнения: основание модификации стоит
# в своём разделе, и пересказывать его мы не вправе — читатель обязан видеть
# слова аудитора. Ключевые вопросы аудита сюда не входят намеренно: это
# описание работы аудитора, а не оговорка об отчётности, и пять тысяч знаков
# в «Ограничениях анализа» вытеснили бы собой всё остальное.
quoted_sections:
  - basis_for_opinion
  - going_concern_uncertainty

# Чем кончается цитируемый раздел. Границей служит заголовок следующего
# раздела заключения, но подразделы, наименования которых в перечень
# разделов-признаков не входят, её не образуют — и цитата шла дальше своего
# конца: у ФосАгро в «Основание для выражения мнения» попали «Независимость»
# и колонтитул страницы. Опора та же структурная, только перечень заголовков
# здесь свой: это подразделы, предписанные МСА, а не признаки.
quote_ends_before:
  - Независимость
  - Ответственность аудитора
  - Ответственность руководства
  - Прочая информация
  - Ключевые вопросы аудита
  - Обязанности аудитора

# Уверенность в оценке считается не здесь: основания понижения объявлены
# в справочнике показателей ветки (`ifrs_metrics.yaml`, блок `confidence`),
# потому что их четыре и только два из них о заключении. Держать половину
# правила в одном файле, а половину в другом значило бы завести два места
# для одной величины.
#
# Прочие три состояния заключения — обзорная проверка, нечитаемое заключение,
# отсутствие заключения — уверенности не понижают: они объявлены оговорками,
# и решение по ним отдельное. Молчаливо приравнять их к оговорке значило бы
# решить методический вопрос умолчанием.

# Оговорки, которые идут в «Ограничения анализа» заключения. Текст объявлен
# здесь дословно: пересказывать аудиторскую оговорку мы не вправе.
limitations:
  review: >-
    Отчётность прошла обзорную проверку, а не аудит. Объём процедур обзорной
    проверки существенно меньше, и аудитор мнения о достоверности отчётности
    не выражает.
  not_readable: >-
    Аудиторское заключение приложено к отчётности изображением без текстового
    слоя. Вид мнения по нему не определён: сведений об оговорках нет, и это
    не то же самое, что их отсутствие.
  absent: >-
    Аудиторское заключение к отчётности не приложено. Проверялась ли
    отчётность и с каким исходом, по документу не установить.
  modified: >-
    Мнение аудитора модифицировано. Основание модификации приведено
    в заключении и относится к отчётности, на которой построен расчёт.
