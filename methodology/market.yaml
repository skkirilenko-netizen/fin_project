# Рыночный слой: спред к кривой ОФЗ и что он означает. **ЧЕРНОВИК.**
#
# Устройство принято владельцем 24.09.2026 по предложению от 22.09; **величины
# здесь не утверждены ни одна**, и статус объявлен полем, а не соглашением.
# Расчёт обязан печатать оба сведения порознь: согласие с устройством правил
# не делает пороги проверенными.
#
# **Что этот слой называет и чего не называет.** После замера упреждения
# 24.09.2026 в маршрут вошли три признака и только они: уровень на p99
# и цена ниже 60 % — «Разбор», уровень на p95 — «Внимание» подгруппой рынка.
# Всё прочее объявлено недействующим **вместе с числами**, по которым
# отвергнуто. Условие входа было одно и осталось: признак, о котором
# не измерено, на сколько дней он опережает отчётность, — это утверждение
# о рынке, сделанное без наблюдения.
#
# **Почему слой вообще нужен.** Годовая отчётность о событиях между отчётными
# датами не говорит ничего: у Кириллицы величины за 2025 год здоровые —
# автономия 0,75, долговая нагрузка 1,75, — а 07.09.2026 не исполнено
# погашение. Рынок в это время держал спред выше двенадцатикратного
# к ориентиру, а в последнюю неделю перед событием кратность дошла до 115×.
# **Замер ответил** (24.09.2026): в общем окне слоёв рынок в одиночку назвал
# одного эмитента, отчётность — двоих, рейтинги — ни одного, и не увидел
# никто — ни одного из 29.
#
# **Пороги обосновываются распределением, а не событиями** (правило
# дорожной карты и условие владельца 24.09.2026). У каждой ступени лестницы
# обязаны стоять два числа: какую долю рынка она отсекает на дату и на какой
# перцентиль кратности приходится. События служат **проверкой** упреждения,
# а не источником порогов: подогнанный под 59 наблюдений порог меряет набор.

version: "0.1.0"
status: draft
status_origin: >-
  Устройство принято владельцем 24.09.2026; пороги не калиброваны ни один,
  и каждый несёт собственный `calibration_status`.

# --- источник и то, чем он ограничен -----------------------------------------
source:
  name: ISS Московской биржи
  delivery: scripts/moex_market_fetch.py
  # Дневные итоги торгов по рынку облигаций целиком и кривая ОФЗ того же дня.
  # Срез берётся по рынку, а не по нашим выпускам: ориентир есть перцентиль
  # ликвидного ядра, и по одним своим он считался бы по перечню, который мы
  # сами и задали.
  depth_days: 730
  # **Что доставлено на 24.09.2026** — не обещание, а замер (`make iss-summary`):
  delivered:
    trading_days: 507
    rows: 1450047
    issues_with_history: 4912
    our_outstanding_covered: 3098
    our_outstanding_total: 5305
    curves: 507
  # **Покрытие мерится тремя причинами непокрытия, а не одной долей.**
  # «Рынок молчал» — три разных ответа: выпусков эмитента в истории биржи нет
  # вовсе (наша доставка), есть и не торговались ни дня (ликвидность бумаги),
  # торговались и спред не считается (метод: у флоатера доходность к сроку
  # не определена). Замер 24.09.2026 на универсуме долга.
  # **Круг — справочник эмитентов, а не выпуски в обращении.** У эмитента
  # в дефолте бумаг «в обращении» не остаётся, и круг по ним терял бы ровно
  # тех, ради кого слой заведён: у Кириллицы все три выпуска погашены либо
  # в дефолте по погашению, и рыночного ряда у неё не было вовсе.
  coverage_measured:
    universe: 977
    with_isin: 806
    rows_present: 562
    traded_at_least_once: 477
    spread_computable: 461
  # **Поля, у которых заполненность решает.** Доля непустых строк измерена
  # на всей доставке: строка среза есть у каждого допущенного выпуска,
  # а доходность — только у торговавшихся в этот день.
  fill_measured:
    YIELDATWAP: 0.620
    YIELDCLOSE: 0.540
    DURATION: 0.567
    NUMTRADES: 0.987
    ZSPREAD: 0.236
  # **Z-спред биржи годится только для сверки и только с декабря 2025 года.**
  # До 12.2025 поле пусто у всех строк — ноль процентов за каждый месяц
  # с сентября 2024, — и сверять им наш спред на двух годах нельзя.
  zspread_from: "2025-12-01"
  zspread_origin: >-
    Замер заполненности по месяцам 24.09.2026: 0,0 % до ноября 2025
    включительно, 43,7 % в декабре, далее около половины.

# --- правило сравнимости -----------------------------------------------------
#
# **Спред кредитного риска считается не у всякой бумаги.** У флоатера
# доходность к погашению не определена, пока не известен будущий купон;
# у линкера она выражена в другой единице — реальной ставке; у валютной бумаги
# кривая другая. Посчитанный по ним спред — число настоящего вида,
# несравнимое с прочими, и это тот же класс, что графа чужой длительности
# в отчётности: величина есть, а означает она другое.
#
# **Перечень выверен по данным, а не написан по памяти** (24.09.2026). Первая
# редакция называла поля наугад — `BONDSUBTYPE` с «Переменным купоном»,
# `FACEUNIT` со значением `SUR`, — и замер отбросил **1 450 047 строк
# из 1 450 047**: ни одной не осталось. Абсурдная доля и есть признак нашей
# ошибки, а не свойства рынка; поля измерены и названы ниже вместе с тем,
# сколько строк каждое отсекает на дне 21.09.2026 (3 430 строк всего).
comparability:
  measured_on: "2026-09-21"
  measured_rows: 3430
  # Годных после всех правил — 1 391 строка, из них с доходностью 856
  # и с дюрацией 907: доходность есть только у торговавшихся в тот день.
  measured_kept: 1391
  # **Правило объявляет, что именно оно ломает — доходность или и цену.**
  # Прежде оно ломало строку целиком, и цена флоатера терялась вместе
  # с его неопределённой доходностью; исправление «брать цену до правила»
  # завело обратный дефект — в ценовой признак пошли структурные и дисконтные
  # бумаги. Проверено 24.09.2026 на сработавших: у ВТБ «ВТБС1-1599» цена
  # 0,28 % номинала, у Сбера «СбКИБ1P285» — 0,12 %, и это стоимость
  # структурной выплаты, а не мнение о возврате тела; у дисконтной «СберSbD10R»
  # 49,18 % — это дисконт, по устройству бумаги, а не утрата доверия.
  #
  # Ломает цену то, что меняет **смысл процента от номинала**: чужая валюта
  # (своя кривая ставок и своя конвенция котировки), структурная выплата
  # (зависит от условия, а не от срока), индексируемый номинал (процент
  # считается от проиндексированного), дисконтная бумага (ниже номинала
  # по устройству). Не ломают: плавающий купон, бессрочность, неизвестные
  # купоны после оферты — там не определена доходность, а цена определена.
  #
  # Поле `breaks` объявлено у каждого правила и умолчания не имеет: молчание
  # читалось бы как решение методики, а оно здесь стоило двух дефектов подряд.
  exclude:
    - code: foreign_currency
      breaks: [yield, price]
      why: >-
        Кривая ОФЗ рублёвая. Валютная бумага сравнивается со своей кривой,
        которой у нас нет вовсе. Валюта номинала стоит в `FACEUNIT`
        («RUB», «USD», «CNY», «EUR», «CHF»), а не в `CURRENCYID`: там код
        расчётов («SUR»), и это разные сведения.
      by: FACEUNIT
      keep_only: ["RUB"]
      measured_rows: 490
    - code: structural
      breaks: [yield, price]
      why: >-
        Выплата зависит от наступления условия, а не от срока: доходность
        такой бумаги — не цена кредитного риска эмитента.
      by: BONDTYPE
      values: ["Структурная облигация"]
      measured_rows: 495
    - code: linker
      breaks: [yield, price]
      why: >-
        Номинал индексируется, и доходность выражена реальной ставкой:
        сравнивать её с номинальной кривой ОФЗ — складывать разные величины.
      by: FACEVALUE_TYPE
      values: ["Индексированный"]
      measured_rows: 18
    - code: perpetual
      breaks: [yield, price]
      why: >-
        У бессрочной бумаги нет срока, к которому считается доходность:
        дюрации в смысле кривой у неё не существует. **Цену она ломает
        по той же причине**: процент от номинала измеряет обещание вернуть
        номинал в срок, а такого обещания здесь нет вовсе. «РСХБ 09Т1» стоит
        58,42 % при доходности 15,01 % — это цена вечного купона, а не
        недоверие к возврату тела.
      by: BONDSUBTYPE
      values: ["Бессрочные"]
      measured_rows: 33
    - code: floater
      breaks: [yield]
      why: >-
        Купон привязан к ставке, и доходность к сроку не определена: она
        считается по предположению о будущих ставках, которого мы не делаем.
        Вид привязки объявлен полем `COUPON_DETAILS`.
      by: COUPON_DETAILS
      values:
        - "Ключевая ставка"
        - "Ставка RUONIA"
        - "Индекс RUONIA"
        - "Срочная ставка RUONIA 3m"
        - "Срочная ставка RUONIA 6m"
        - "ИПЦ"
      measured_rows: 609
    - code: floater_by_type
      breaks: [yield]
      why: >-
        Тот же признак с другой стороны: биржа называет бумагу облигацией
        с плавающим купоном в `BONDTYPE`, даже когда вид привязки не назван.
      by: BONDTYPE
      values: ["Облигация с плавающим купоном"]
    # **Дисконтная бумага ниже номинала по устройству, а не по недоверию.**
    # Доходность к сроку у неё определена — спред считается, — а цена
    # в процентах номинала о возврате тела не говорит: «СберSbD10R» стоит
    # 49,18 %, «ГПБ006Р05P» — 51,45 %, и оба выпуска в полном порядке.
    # Вид объявлен самой биржей, порога здесь нет: «дисконтная» — это тип,
    # а не величина купона, которую пришлось бы калибровать.
    - code: discount
      breaks: [price]
      why: >-
        Бумага без купона гасится номиналом, и цена её ниже номинала ровно
        на дисконт за срок. Признак зоны дефолта на ней срабатывает всегда
        и ничего не означает.
      by: BONDTYPE
      values: ["Дисконтная облигация"]
    # **Бумага без купона — дисконтная, как бы её ни назвала биржа.** Вид
    # у «ГПБ006Р04P» и «Сбер SbD9R» не объявлен дисконтным, а купон у обеих
    # ноль, и цены 53,16 и 54,79 % при доходности около 16 % — это дисконт
    # за срок. Сравнение точное, а не пороговое: ноль есть ноль, и калибровать
    # тут нечего.
    - code: zero_coupon
      breaks: [price]
      why: >-
        Купон ноль означает, что бумага гасится одним номиналом, и цена её
        ниже номинала по устройству. Признак зоны дефолта срабатывает
        на такой бумаге всегда и ничего не означает.
      by: COUPONPERCENT
      # Сравнение числовое, а не строковое: источник печатает ноль и как `0`,
      # и как `0.0`, и пустое поле от нуля здесь надо отличать — пустое
      # означает «купон не объявлен», а не «купона нет».
      equals_zero: true
    - code: unknown_coupons_to_maturity
      breaks: [yield]
      why: >-
        «Фиксированный с неизвестными купонами» означает, что купоны известны
        до оферты и не известны дальше. К оферте доходность определена
        и публикуется — таких строк 301 из 328, — а к погашению нет.
        Отбрасывать их целиком значило бы выбросить почти весь сегмент бумаг
        с офертой.
      by: COUPON_DETAILS
      values: ["Фиксированный с неизвестными купонами"]
      unless:
        by: BONDSUBTYPE
        values: ["До оферты (put)", "До оферты (call)"]
      measured_rows: 24
  # **Пустое `COUPON_DETAILS` основанием для отказа не служит.** Первая
  # редакция считала его «купон не объявлен» и отбрасывала 843 строки,
  # из которых 492 — обычные амортизируемые облигации с фиксированным купоном
  # («СЗКК 03», ставка 8,91): поле у них просто не заполнено. Признак
  # отсутствия купона — отсутствие доходности, и он проверяется сам собой.
  empty_coupon_details: keep
  # **Цена без сделок — не мнение рынка, а расчётная величина биржи.**
  # У «АЛЬФАБ1Р27» цена 51,5 % при нуле сделок, у «ПЕРЕСВЕТБ3» — 24,58 %
  # при нуле: по такой бумаге никто не торговал, и утверждать «рынок
  # оценивает возврат тела» нечем. Это не порог ликвидности — ядро ориентира
  # отбирается своими числами, — а различение наблюдения и его отсутствия.
  price_needs_trade: true
  # **Правило сравнимости относится к доходности, а не к строке.** Цена
  # определена у любой бумаги, и признак зоны дефолта считается по ней;
  # отбросив строку флоатера целиком, мы теряли бы вместе с несравнимой
  # доходностью вполне сравнимую цену. Замер 24.09.2026: ценовой ряд есть
  # у 477 эмитентов, спредовый — у 461, то есть **у 16 эмитентов цена есть,
  # а спреда нет**. Среди них «Концессии водоснабжения — Саратов»: обе
  # бумаги плавающие, событие 13.01.2025 есть, а рынка у нас не было вовсе.
  price_before_exclusion: true
  # **Горизонт называет сама биржа, и пересчитывать его не нужно.** Поле
  # `BONDSUBTYPE` говорит, к чему посчитаны `YIELDCLOSE` и `DURATION`:
  # «До погашения», «До оферты (put)», «До оферты (call)». Мы это записываем,
  # а не считаем заново: у бумаги с офертой дюрация к погашению завышена
  # в разы, и спред по ней сравнивал бы восьмилетнюю бумагу с годовой.
  horizon_field: BONDSUBTYPE

# --- спред -------------------------------------------------------------------
spread:
  # G-спред: доходность выпуска минус кривая бескупонной доходности ОФЗ
  # в точке дюрации этого выпуска. Кривая берётся закрытием того же дня:
  # у ОФЗ за полгода уровень смещался на проценты, и кривая другого дня
  # дала бы спред, которого не было.
  kind: g_spread
  unit: basis_points
  # **Кривая берётся опубликованными точками, а не считается по параметрам.**
  # Биржа публикует саму кривую в одиннадцати точках (`yearyields`: 0,25 —
  # 20 лет), и этого для спреда достаточно: дюрация корпоративной бумаги
  # ложится внутрь этого отрезка почти всегда. Формулу параметров
  # (Нельсон — Сигель — Свенссон с девятью поправочными слагаемыми) мы
  # **не воспроизводим по памяти**: постоянные в ней объявлены документом
  # биржи, а угаданная постоянная даёт кривую настоящего вида и неверную —
  # тот же класс, что конвенция разрядов. Параметры при этом хранятся: когда
  # документ будет выверен, формула сверится с точками и заменит интерполяцию.
  curve:
    source: yearyields
    interpolation: linear_in_years
    params_kept: [B1, B2, B3, T1, G1, G2, G3, G4, G5, G6, G7, G8, G9]
    # Дюрация вне отрезка точек: короче 0,25 года и длиннее 20 лет.
    # Продлевать кривую собственным правилом мы не будем — берётся крайняя
    # точка, и строка помечается, потому что это не значение кривой,
    # а её край.
    outside_points: clamp_and_mark
    check_tolerance_bp: 5
    check_origin: >-
      Допуск пригодится, когда формула появится: пять базисных пунктов —
      округление публикации (точки печатаются с четырьмя знаками в процентах).
      До тех пор сверять нечего: кривая и есть опубликованные точки.
  # Отрицательный спред правомерен: корпоративная бумага изредка торгуется
  # ниже кривой на коротком конце. Обрезки снизу здесь нет — она спрятала бы
  # дефект чтения кривой.
  ceiling_bp: 20000
  ceiling_origin: >-
    Потолок предложен 22.09.2026 и не калиброван: выше двухсот процентов
    годовых доходность перестаёт быть ценой риска и становится ценой
    дефолтной бумаги, для которой объявлена своя зона по цене.
  # **ВДО — рабочее определение владельца 29.09.2026**: эмитент, у которого
  # G-спред к кривой ОФЗ в последний день ряда не ниже 500 б. п. Признака
  # ВДО у источника нет, и без объявленного определения «сколько из них
  # ВДО» каждый замер отвечал бы по-своему. Мера — последний день, а не
  # «хоть раз за ряд»: та мерила бы длину ряда. Спред тот же, что
  # у лестницы (`kind`), то есть сводится оборотом по выпускам эмитента.
  #
  # Первое применение — разведка 29.09.2026: из 65 держателей основания p99
  # ВДО 56 (от 1 000 б. п. — 49, от 500 до 1 000 — 7).
  high_yield:
    from_bp: 500
    measured_on: last_day
    status: working_definition
    origin: Решение владельца 29.09.2026 по ночному докладу, пункт 3.
  # **Ограничение меры: у короткой бумаги кратность растёт без роста риска.**
  # Спред есть разность доходности и кривой, а доходность к сроку у бумаги
  # за месяц до погашения чувствительна к копейке цены: отклонение в один
  # процент номинала даёт десятки процентов годовых. Кратность к ориентиру
  # при этом выходит трёхзначной, а риска в ней нет.
  #
  # Проверено 24.09.2026 на Кириллице: наибольшая кратность за весь ряд —
  # **449× 07.11.2024**, за двадцать два месяца до неисполненного погашения,
  # и она о бумаге у погашения, а не о состоянии эмитента. Разгон последних
  # недель перед событием при этом настоящий — 8,5× → 115× за две недели.
  #
  # Следствия, и они разные для расчёта и для показа. В **расчёте** признак
  # защищён подтверждением «K из N»: одиночный всплеск короткой бумаги его
  # не набирает. В **показе** — карточка, материалы, замер — наибольшая
  # кратность берётся за последние 90 дней ряда, а не за весь ряд: «449×»
  # рядом с событием читалось бы как предупреждение, которого не было.
  short_maturity_inflates_multiple:
    seen_at: "Кириллица, 07.11.2024"
    multiple: 449.3
    days_before_event: 669
    guarded_in_scoring_by: confirmation
    guarded_in_display_by: 90
    why_not_excluded: >-
      Отсекать короткие бумаги правилом сравнимости мы не стали: дюрация
      у них известна, кривая в этой точке публикуется, и спред посчитан
      верно — неверно было бы читать его как цену риска. Отсечка по сроку
      до погашения — порог, которого не на чем откалибровать: событий
      у коротких бумаг в наборе нет вовсе.

# --- очистка -----------------------------------------------------------------
#
# **Порядок частей — часть правила.** Сперва величина дня у выпуска, потом
# величина дня у эмитента: сложив сделки всех выпусков в одну кучу, мы дали бы
# эмитенту с десятью выпусками десятикратный вес против эмитента с одним.
cleaning:
  per_issue_day:
    # Средневзвешенная цена устойчивее цены закрытия: одна сделка в конце дня
    # цену закрытия двигает, оборот — нет.
    prefer: YIELDATWAP
    fallback: YIELDCLOSE
    weight: VALUE
  per_issuer_day:
    # **Спред сводится оборотом, цена — наименьшей.** Это разные вопросы:
    # спред отвечает «как рынок оценивает долг эмитента в целом», и неликвидный
    # хвост там наравне с торгуемым выпуском был бы искажением; цена отвечает
    # «есть ли бумага, которой рынок не верит», и одной такой бумаги
    # достаточно. Обе величины берутся только у торговавшихся в тот день —
    # у цены это объявлено `price_needs_trade`.
    price: min
    weight: VALUE
    why: >-
      Вес — оборот выпуска: у эмитента с длинной и короткой бумагой спред
      различается, и простое среднее объявило бы неликвидный хвост наравне
      с торгуемым выпуском.
  # Обрезка внутри дня, а не по всей истории: уровень рынка двигается,
  # и перцентиль двух лет отрезал бы целые месяцы.
  trim_percentile: [0.1, 99.9]
  trim_origin: >-
    Предложено 22.09.2026 против опечаток источника: одна строка с доходностью
    в тысячи процентов сдвигает перцентиль ядра. Доля отсекаемого измеряется
    и печатается — обрезка без знаменателя неотличима от потери данных.

# --- ликвидное ядро и ориентир ----------------------------------------------
#
# **Ориентир — перцентиль ядра на дату, а не индекс.** Индекс составлен
# из своего перечня по своим правилам и говорит о другом предмете; нам нужен
# уровень, относительно которого бумага дорога или дёшева **сегодня**.
benchmark:
  liquid_core:
    min_trades: 10
    min_turnover_rub: 1000000
    calibration_status: preliminary
    origin: >-
      Величины предложены 22.09.2026 и не калиброваны. Требование к замеру:
      напечатать, сколько выпусков и какая доля оборота рынка остаётся в ядре
      на дату, — ядро, в которое попадает три бумаги, ориентиром не является.
  percentile: 25
  percentile_origin: >-
    Двадцать пятый перцентиль предложен 22.09.2026: медиана смещается вместе
    с рынком в кризис, а нижний квартиль держится за качественной частью ядра.
    Не калиброван; проверяется тем же замером — насколько ориентир устойчив
    к составу ядра.
  # Ориентир считается на каждую дату, и день без ядра остаётся без ориентира:
  # подставить вчерашний значило бы объявить сегодняшний спред посчитанным.
  missing_day: refuse
  # **Кратность к ориентиру около нуля смысла не имеет** (решение владельца
  # 29.09.2026). В сентябре — ноябре 2024 года ориентир дня стоял на 74–78
  # б. п. по медиане месяца, в декабре был и отрицательный (−9,7), и над
  # порогом p99 стояло 64–78 % эмитентов с рядом против 2–5 % в обычный
  # месяц. Кратность делится на ориентир не ниже пола; сам ориентир
  # печатается как посчитан, а пол называется рядом, когда он сработал.
  #
  # **Пол — из распределения, а не по событиям**: около девятого перцентиля
  # ориентира за два года (десятый — 109 б. п.; ниже 100 — 47 дней из 511).
  # Пол срабатывает в аномальные дни и не трогает обычный рынок. 150 б. п. —
  # уже двадцать второй перцентиль (112 дней из 511): он переписывал бы
  # порог и в обычные месяцы — медиана февраля 2026 года 142, ориентир
  # 25.09.2026 — 152.
  floor_bp: 100
  floor_status: approved
  floor_origin: >-
    Решение владельца 29.09.2026: пол из распределения ориентира (≈ p9),
    а не по событиям.
  # **Справочно: разведочный замер, прежняя мера, до 29.09** — вне боевого
  # пути, без интервалов; на нём принято решение о поле.
  # Замер 29.09.2026 при сроке жизни 40 торговых дней (`lifetime`): сейчас
  # и накануне события варианты не различаются — у p99 19 эмитентов и 11
  # из 32 событий у всех четырёх, — различается только стояние в прошлом.
  # Прирост — поточечный срез (`lifetime.measured_origin`). Без срока жизни
  # пол работает сильнее: p99 сейчас 68 → 42 (100) → 38 (150), прирост
  # по прежней мере 3,3 → 3,9 → 4,2×, пойманных до события 23 → 19 → 19.
  floor_measured:
    none:     {p99_now: 19, p99_caught: 11, p99_lift: 12.9, p95_now: 59, p95_lift: 8.8}
    at_100:   {p99_now: 19, p99_caught: 11, p99_lift: 16.6, p95_now: 59, p95_lift: 9.1}
    at_150:   {p99_now: 19, p99_caught: 11, p99_lift: 18.7, p95_now: 56, p95_lift: 10.0}
    level_at_100: {p99_now: 19, p99_caught: 11, p99_lift: 18.2, p95_now: 59, p95_lift: 11.2}
  # **Уровень спреда вместо кратности при малом ориентире не взят.** Он и есть
  # пол, только со вторым замороженным числом: ниже 100 б. п. порог
  # p99 — 30,67 × 193 (медиана ориентира) = 5 914 б. п., а на 100 б. п.
  # он падает до 3 067. Порог, который снижается при росте ориентира,
  # немонотонен, и эмитент выходил бы из основания от одного движения рынка.
  level_instead_declined: >-
    Немонотонный порог: скачок с 5 914 до 3 067 б. п. на границе 100 б. п.
    Прирост 18,2× против 16,6× у пола 100 при тех же пойманных.
  # **Ориентир осени 2024 года занижен наполовину нами, наполовину рынком**
  # (проверка 29.09.2026 по сырым срезам, `data/raw/moex`). Наше: сами ОФЗ-ПД
  # к нашей кривой стоят с медианой −44…−65 б. п. в сентябре — декабре 2024
  # года против −14…+14 с марта 2025 года, хотя должны стоять около нуля.
  # Кривая — бескупонная доходность в точке дюрации, а сравнивается с ней
  # доходность к погашению купонной бумаги; расхождение наибольшее при
  # глубокой инверсии (наклон 10 лет − полгода до −678 б. п. в ноябре 2024
  # года), но с наклоном не совпадает — в феврале — марте 2025 года
  # инверсия −405…−471 при расхождении −33…0. Рыночное: первый эшелон
  # и сам сжался — РЖД 38 б. п. по медиане в октябре — ноябре 2024 года
  # против 107 годом позже, Роснефть −136 против −20, Газпром нефть −116
  # против 90; даже с поправкой на 50–65 б. п. уровень ниже обычного.
  # Пол нужен при любом из объяснений; поправка кривой по самим ОФЗ —
  # открытый вопрос метода, а не этого решения.
  autumn_2024_check:
    ofz_to_curve_median_bp: {"2024-10": -55, "2024-11": -65, "2025-10": -6, "2026-09": 3}
    first_tier_median_bp:
      "2024-10/11": {РЖД: 38, Роснефть: -136, Газпром нефть: -116, МТС: 48, Ростелеком: 62}
      "2025-10/11": {РЖД: 107, Роснефть: -20, Газпром нефть: 90, МТС: 203, Ростелеком: 224}
    conclusion: частью наше (кривая к ОФЗ −55…−65 б. п.), частью рынок

# --- лестница кратности ------------------------------------------------------
#
# **Ступень объявляется вместе с тем, что она отсекает.** Пустые поля `measured`
# заполняет замер распределения, и до тех пор лестница не применяется ни к чему:
# порог, о котором неизвестно, какую долю рынка он режет, — это не порог,
# а число. События в обоснование не идут: они проверяют упреждение.
ladder:
  metric: multiple_to_benchmark
  # **Ступени переставлены на перцентили распределения** (решение владельца
  # 24.09.2026 по замеру). Круглые кратности 1,5 / 2 / 3 / 5× отсекали
  # 74 / 67 / 55 / 42 % рынка — то есть мерили фон: медиана кратности
  # по рынку 3,66×. Ниже p75 в маршрут не идёт ничего.
  # **Ступеней в маршруте две из четырёх, и это решение владельца 24.09.2026.**
  # Три ступени с приростом 1,7 / 1,9 / 2,4× различают то, что не различается:
  # они говорят об одном и том же с точностью до шума, и корзина у них была бы
  # одна. Поэтому от p75 до p95 в маршрут идёт **одна** ступень — p95, —
  # а нижние остаются объявленными с числами: удалённая ступень неотличима
  # от забытой, а померенная и отвергнутая — сведение.
  steps:
    - code: level_p75
      percentile: 75
      multiple: 6.92
      calibration_status: measured
      measured: {share_of_market: 0.25, lift: 1.7, precision: 0.115, recall: 0.969}
      in_route: false
      why: >-
        Прирост 1,7× при четверти рынка — это ещё фон. В карточке печатается,
        корзины не называет.
    - code: level_p90
      percentile: 90
      multiple: 9.28
      calibration_status: measured
      measured: {share_of_market: 0.10, lift: 1.9, precision: 0.125, recall: 0.906}
      in_route: false
      why: >-
        Прирост 1,9× против 2,3× у p95 при вдвое большей доле рынка:
        отдельной ступенью это различение мнимое.
    - code: level_p95
      percentile: 95
      multiple: 12.15
      calibration_status: measured
      # Основная мера, поточечно (29.09.2026): прирост 6,8× [4,6; 9,3],
      # точность 6,8 % [4,1; 9,7], выявляемость 38,0 % [25,5; 51,4]. Прежней
      # мерой (справочно) было 2,3×, 15,4 % и 90,6 %.
      measured: {share_of_market: 0.05, lift: 6.8, precision: 0.068, recall: 0.380}
      in_route: true
      ground: market_spread_wide
      basket: attention
      subgroup: market
      escalation: false
      why: >-
        Прирост 2,3× для разбора слаб, но это не ноль: выявляемость 90,6 %
        при двадцатой части рынка. Отсюда внимание без эскалации — смотреть,
        а не поднимать. Эта же ступень — единственное, чем рынок высказался
        о Кириллице: её кратность дошла до 115× за неделю до неисполненного
        погашения, а подтверждения «7 из 10» тот всплеск не набрал — бумага
        перестала торговаться раньше.
    - code: level_p99
      percentile: 99
      multiple: 30.67
      calibration_status: measured
      # Основная мера, поточечно (29.09.2026): прирост 16,6× [10,3; 24,9],
      # точность 16,5 % [8,9; 25,3], выявляемость 28,2 % [17,1; 39,5];
      # накануне события стоит у 12 из 33, упреждение от начала стояния
      # 54 дня [30; 68]. Прежней мерой (справочно) было 3,3×, 21,8 % и 75 %.
      measured: {share_of_market: 0.01, lift: 16.6, precision: 0.165, recall: 0.282}
      in_route: true
      ground: market_spread_extreme
      basket: review
      # **Подтверждение здесь мягче общего, и это решение владельца
      # 24.09.2026.** Размен назван числами (по календарю событий
      # от объявления, 25.09.2026): выявляемость с 53 % до 75 %,
      # упреждение со 106 до 165 дней, прирост с 3,6× до 3,3×. Для маршрута
      # выявляемость дороже точности — лишний просмотр дешевле пропуска, —
      # а 165 дней против 106 это в полтора раза больше времени на действие.
      # При решении размен был 69 → 81 % и 79 → 138 дней: календарь сдвинул
      # числа, но не сторону размена. Обе величины предварительны
      # и перемеряются в фазе 6.
      confirmation: {of: 5, out_of: 10}
      confirmation_status: preliminary
      why: >-
        Единственная ступень с приростом выше трёх: 110 эмитентов, из них
        24 с событием, упреждение 165 дней по медиане. Все числа —
        с подтверждением «5 из 10»; без подтверждения та же ступень даёт
        300 эмитентов и прирост 1,6×, с прежним «7 из 10» — 72 и 3,6×
        при упреждении 106 дней.
      statement_origin: >-
        **Разбор наравне с ценой — решение владельца 24.09.2026, и довод
        не в приросте.** По основной мере (поточечно, 29.09.2026) приросты
        равны — 16,6× у p99 и 16,5× у цены, интервалы перекрываются, — а
        упреждение от начала стояния у p99 длиннее: 54 дня — время что-то
        сделать, 36 у цены — время зафиксировать. При решении прежней мерой
        было 3,3× против 6,2× и 165 дней против 61.
  measured_on: "2026-09-24"
  measured_origin: >-
    Замер `eval/market_lead_run.py` на 482 эмитентах с рыночным рядом
    и 37 событиях в окне доставки. Перцентили считаются по дням и сводятся
    медианой: распределение кратности двигается вместе с рынком, и один
    перцентиль по всей истории смешал бы спокойный год с кризисным месяцем.
    **Кратность у ступени заморожена днём замера, а не пересчитывается
    ежедневно**: порог, едущий вместе с распределением, менял бы корзину
    без единого изменения у эмитента — и отличить это было бы нечем.
    **Прирост, точность, выявляемость и упреждение пересчитаны 25.09.2026**
    по календарю событий от даты объявления неплатежа: прежний датировал
    событие концом льготного срока, на 14 дней позже. Кратности ступеней —
    порог — заморожены 24.09.2026 и не тронуты; `measured_on` — день
    заморозки. **У ступеней маршрута (p95, p99) числа `measured` с 29.09.2026
    — основной, поточечной мерой** (решение владельца): прирост по эмитентам,
    сработавшим хоть раз, для рынка не годится. У p75 и p90 — прежней мерой:
    в маршрут они не идут и не перемерялись. `confirmation_measured`
    и `appearance_measured` ниже — прежней мерой, справочно.
  # **Справочно: прежняя мера, до 29.09** — по эмитентам, сработавшим хоть
  # раз; для рынка не годится. Основной мерой цена подтверждения перемерена
  # 29.09.2026 (`eval/market_lead_run.py`, «Цена подтверждения — основная
  # мера»); числа — в отчёте замера, порог не менялся.
  # **Цена подтверждения измерена на самой ступени** (p99, календарь
  # от объявления, 25.09.2026): без подтверждения 300 эмитентов и прирост
  # 1,6×; «3 из 5» — 240 и 1,8×; «5 из 10» — 110, прирост 3,3×, выявляемость
  # 75 %, упреждение 165 дней; «7 из 10» — 72, прирост 3,6×, выявляемость
  # 53 %, упреждение 106 дней; «14 из 20» — 50, прирост 4,2×, выявляемость
  # 44 %, упреждение 73 дня.
  confirmation_measured:
    at_1_of_1: {fired: 300, with_event: 31, lift: 1.6, lead_days: 454}
    at_3_of_5: {fired: 240, with_event: 29, lift: 1.8, lead_days: 558}
    at_5_of_10: {fired: 110, with_event: 24, lift: 3.3, lead_days: 165}
    at_7_of_10: {fired: 72, with_event: 17, lift: 3.6, lead_days: 106}
    at_14_of_20: {fired: 50, with_event: 14, lift: 4.2, lead_days: 73}
  # **Подтверждение здесь не украшение, а условие осмысленности.** Порог,
  # отсекающий процент рынка в день, за два года срабатывает почти у каждого:
  # «хотя бы раз» отвечает на вопрос о длине ряда, а не о признаке.
  requires_confirmation: true
  # **Справочно: прежняя мера, до 29.09.**
  # **Упреждение появления считается отдельно от упреждения стояния**
  # (решение владельца 24.09.2026). Признак, державшийся уже в первый
  # наблюдавшийся день, ничего не упредил: он описывает положение, а сколько
  # он стоял до начала ряда — неизвестно. Числа замера 25.09.2026 (календарь
  # от объявления), только по появлению: у p95 — 99 срабатываний, 13
  # с событием, прирост 2,0×, упреждение 102 дня; у p99 — 62, 14 с событием,
  # прирост 3,4×, упреждение 89 дней; у цены — 62, 29 с событием, прирост
  # 7,0×, упреждение 61 день. Цена от различения не страдает вовсе: ниже 60 %
  # номинала бумага с начала ряда почти не стоит.
  appearance_measured:
    level_p95: {fired: 99, with_event: 13, lift: 2.0, lead_days: 102}
    level_p99: {fired: 62, with_event: 14, lift: 3.4, lead_days: 89}
    price_distress: {fired: 62, with_event: 29, lift: 7.0, lead_days: 61}

# --- скорость расширения -----------------------------------------------------
#
# **Уровень и движение — разные обстоятельства.** Бумага, третий год стоящая
# на трёхкратной кратности, и бумага, пришедшая к ней за неделю, говорят
# о разном: первая — о цене риска, вторая — о событии.
widening:
  # **Замерено и не подтвердилось** (24.09.2026). Ожидание было обратным:
  # расширение должно было дать меньше срабатываний и большее упреждение,
  # раз сигнал — изменение, а не уровень. На данных вышло иначе.
  growth: 0.60
  windows: [4_observations, 14_days, 30_days]
  calibration_status: measured
  measured:
    # Без подтверждения расширение срабатывает у трёх эмитентов из четырёх —
    # это фон, как и уровень на низких ступенях.
    raw: {fired: 377, with_event: 31, lift: 1.2}
    # С подтверждением «7 из 10» рассыпается надвое: по календарю остаётся
    # фоном (313 из 482), по числу наблюдений почти не срабатывает вовсе —
    # 52 эмитента, из них 2 с событием, прирост 0,6×, то есть хуже
    # случайного отбора.
    confirmed_observations: {fired: 52, with_event: 2, lift: 0.6}
    confirmed_month: {fired: 313, with_event: 28, lift: 1.3}
  in_route: false
  origin: >-
    Замер 24.09.2026 на 482 эмитентах и 37 событиях, числа пересчитаны
    25.09.2026 по календарю событий от объявления. Вывод: изменение спреда
    само по себе признаком не служит — ни как продолжающийся рост
    (подтверждение его гасит), ни как разовый скачок (гасит фон). Правило
    остаётся объявленным недействующим: удалённое не отличить от забытого,
    а величина, померенная и отвергнутая, — сведение.

# --- отклонение от собственной нормы ----------------------------------------
#
# **Замерено и не подтвердилось так же.** Спред против своей же медианы
# за 90 дней: кратность 3× с подтверждением даёт 124 эмитента, 14 с событием,
# прирост 1,7× при упреждении 102 дня — лучше расширения и хуже уровня p99
# и цены (календарь событий от объявления, 25.09.2026). Отдельным признаком
# не заводится.
own_norm:
  window_days: 90
  min_observations: 20
  calibration_status: measured
  measured:
    at_1_5: {fired: 333, with_event: 29, lift: 1.3}
    at_2_0: {fired: 227, with_event: 23, lift: 1.5}
    at_3_0: {fired: 124, with_event: 14, lift: 1.7}
  in_route: false

# --- подтверждение устойчивости ---------------------------------------------
#
# **Рыночный признак подтверждается «K из N», и это решение владельца
# 24.09.2026.** Одна дневная свеча — не сигнал: у неликвидной бумаги одна
# сделка двигает доходность на проценты. Подтверждение откладывает вывод
# ровно на то, чем он подтверждается, и цена этого измеряется замером
# упреждения.
confirmation:
  default: {of: 7, out_of: 10}
  systemic: {of: 14, out_of: 20}
  systemic_origin: >-
    Решение владельца 24.09.2026: у системно значимого эмитента цена ложной
    тревоги выше, и подтверждение требуется длиннее. Перечень системно
    значимых берётся из `routing.yaml` (`systemic`), второго не заводится.

# --- срок жизни основания ----------------------------------------------------
#
# **Основание стоит, пока оно подтверждено недавно, а не «хоть раз за ряд»**
# (решение владельца 29.09.2026). До того рыночное основание ставилось первым
# днём подтверждения за всю историю ряда и не снималось, пока у последнего
# дня есть величина: это мера «сработал хотя бы раз», и она мерит длину ряда.
# У 48 из 65 держателей p99 основание появилось осенью 2024 года, при
# ориентире около нуля, а подтверждено на 25.09.2026 у 14 из 65.
#
# **Срок считается торговыми днями биржи, а не наблюдениями эмитента**: у
# неликвидной бумаги сорок наблюдений растягиваются на полгода, и срок по ним
# мерил бы ликвидность бумаги, а не давность сигнала.
lifetime:
  trading_days: 40
  status: approved
  # **Срок — решение владельца по событиям**, в отличие от пола: у срока нет
  # распределения, из которого его взять, есть только размен выявляемости
  # на точность, названный числами ниже.
  origin: >-
    Решение владельца 29.09.2026 по замеру на календаре событий: 40 торговых
    дней против 10 и 20.
  applies_to: [level_p95, level_p99, price_distress]
  # **Цена — хотя бы одно наблюдение ниже границы за срок**, а не последняя
  # цена. У бумаги около 60 % последняя цена пересекает границу туда
  # и обратно, и основание входило бы в корзину 2,73 раза за год на эмитента
  # против 1,18; накануне события последняя цена ловит 21 из 32 против 23,
  # упреждение 13 дней против 36. Вариант «по последней цене» — `last`.
  price_rule: any_within
  # **«С {since}» называет начало нынешнего стояния**, а не первый день ряда:
  # основание, снятое и поставленное заново, стоит с нового дня.
  since: episode_start
  measured_on: "2026-09-29"
  measured_origin: >-
    Ряд на 25.09.2026 (511 торговых дней, 483 эмитента с рядом), события —
    календарь от объявления неплатежа, 32 события у эмитентов с рядом;
    подтверждение ступеней прежнее, у системно значимых — «14 из 20».
    «Разбор» — последний прогон маршрута (28.09.2026, 191; по ряду 190:
    у 9706046074 цены в ряду больше нет) с заменёнными рыночными
    основаниями. «Поймано» — основание стоит накануне события;
    упреждение — от начала непрерывного стояния, медиана. Прирост —
    поточечный: на 18 срезах (первые торговые дни месяцев 01.2025 — 06.2026)
    доля событий в следующие 90 дней у стоящих к той же доле у всех
    с рядом (базовая 1,0 %). Прежняя мера — строка `ever` — тем же
    способом; её прирост по «сработал хоть раз» (3,3×, 169 дней) —
    в `ladder.confirmation_measured`. Ориентир без пола. Замер разведочный,
    вне боевого пути; перемер боевым путём — `eval/market_lead_run.py`.
  # **Справочно: разведочный замер, прежняя мера, до 29.09** — на нём
  # выбран срок; основная мера боевым путём — `distress_zone.measured`
  # и `measured` ступеней маршрута.
  measured:
    ever: {review: 190, p99_now: 68, p99_caught: 17, p99_lead: 143, p99_lift: 3.5,
           p95_now: 144, p95_caught: 22, p95_lift: 2.2,
           price_now: 71, price_caught: 25, price_lead: 78, price_lift: 8.8,
           market_caught: 26}
    n10:  {review: 130, p99_now: 16, p99_caught: 10, p99_lead: 41, p99_lift: 25.5,
           p95_now: 53, p95_caught: 14, p95_lift: 12.8,
           price_now: 40, price_caught: 22, price_lead: 25, price_lift: 20.2,
           market_caught: 23}
    n20:  {review: 132, p99_now: 18, p99_caught: 10, p99_lead: 52.5, p99_lift: 19.9,
           p95_now: 57, p95_caught: 15, p95_lift: 11.8,
           price_now: 41, price_caught: 22, price_lead: 32, price_lift: 18.6,
           market_caught: 23}
    n40:  {review: 134, p99_now: 19, p99_caught: 11, p99_lead: 54, p99_lift: 12.9,
           p95_now: 59, p95_caught: 17, p95_lift: 8.8,
           price_now: 43, price_caught: 23, price_lead: 36, price_lift: 16.5,
           market_caught: 23}
  # **Сорок, а не двадцать** — довод тот же, что у «5 из 10»: для маршрута
  # выявляемость дороже точности. Накануне события рынок целиком (p99 или
  # цена) ловит 23 из 32 при любом сроке; сорок дней против двадцати
  # добавляют одно событие к p99 и два к p95 ценой двух эмитентов
  # в «Разборе» и двух во «Внимании» сейчас. Три события, потерянные против
  # прежней меры, названы: 7705722209 (последнее подтверждение за 93 дня
  # до события), 7714835008 и 5503168016 (подтверждения только осенью
  # 2024 года).
  lost_against_ever: ["7705722209", "7714835008", "5503168016"]

# --- зона дефолта по цене ----------------------------------------------------
#
# **Ниже некоторой цены доходность теряет смысл.** У бумаги, стоящей 9,5 %
# номинала (ЕвроТранс, 21.09.2026), доходность к погашению — арифметика
# над числом, в которое никто не верит: рынок торгует не доходность,
# а вероятность возврата тела. Поэтому ниже границы признак объявляется
# **ценой**, а не спредом, и печатается ценой.
distress_zone:
  price_below_percent: 60
  calibration_status: measured
  in_route: true
  basket: review
  ground: market_price_distress
  # **Граница не сужается** (решение владельца 24.09.2026). Довод при решении
  # был в упреждении: при 40 % оно падало с 43 дней до 14 — признак переставал
  # быть отбором к просмотру и становился констатацией. **Пересчёт по календарю
  # событий от объявления (25.09.2026) довод усилил**: при 40 % теряется
  # треть событий — выявляемость 68,8 % против 90,6 % при 60 %, — точность
  # почти та же (44 % против 41 %), упреждение 22 дня против 61. Замер
  # по 40 % оставлен для фазы 6, где решается тяжесть, а не отбор.
  narrowing_declined:
    at: 40
    precision: 0.440
    recall: 0.688
    lead_days: 22
    kept_for: "фаза 6"
  # **Поздний признак — так и сказано.** Основная мера с 29.09.2026 —
  # поточечная (решение владельца): на 18 срезах основание стоит в среднем
  # у 9,8 эмитента, точность 16,5 % [9,3; 26,2], прирост 16,5× [10,7; 25,8]
  # при базовой доле 1,0 %; накануне события оно стоит у 24 из 33, а
  # упреждение от начала стояния — медиана 36 дней [26; 78]. Это признание
  # случившегося на несколько недель раньше, а не предупреждение за квартал,
  # и формулировка основания называет это число (`lead_days`).
  measured:
    at_60: {standing_avg: 9.8, hits: 29, precision: 0.165, recall: 0.408,
            lift: 16.5, caught_eve: 24, events: 33, lead_days: 36}
  measured_origin: >-
    Перемер 29.09.2026 боевым расчётом (`eval/market_lead_run.py`, основная
    мера): срок жизни 40 торговых дней, цена ниже 60 % хоть раз за срок,
    18 срезов — первые торговые дни месяцев 01.2025 — 06.2026, событие
    в следующие 90 дней, базовая доля 1,0 %; интервалы 90 % — бутстрэп
    по эмитентам. Накануне события — 33 события у эмитентов с рядом.
    Границы 40 % и 75 % этой мерой не перемерялись: их числа — прежней
    мерой, в `measured_ever`.
  # **Справочно, прежняя мера — для рынка не годится**: она не засчитывает
  # основание, стоявшее с начала ряда. Числа оставлены как запись о том,
  # на чём принимались решения 24–25.09.2026.
  measured_ever:
    at_40: {fired: 50, with_event: 22, precision: 0.440, lift: 6.6, lead_days: 22}
    at_60: {fired: 71, with_event: 29, precision: 0.408, lift: 6.2, lead_days: 61}
    at_75: {fired: 174, with_event: 31, precision: 0.178, lift: 2.7, lead_days: 195}
  measured_ever_origin: >-
    Замер 24.09.2026, пересчитан 25.09.2026 по календарю событий от даты
    объявления неплатежа: 482 эмитента с рядом, 37 событий в окне доставки,
    32 из них у эмитента с рядом, базовая доля 6,6 %. Границу двигать есть
    куда в обе стороны, и цена движения названа числом: 40 % даёт точность
    44 % при выявляемости 69 % и упреждении 22 дня, 75 % — точность 18 %
    при упреждении 195 дней. Выявляемость и при 75 % не полная (96,9 %):
    Кириллица, у которой бумага перестала торговаться на 99 % номинала
    за восемнадцать дней до неисполненного погашения, до этой цены
    не дошла вовсе.
  # **Признак считается без подтверждения, и это не упущение.** Цена ниже
  # 60 % номинала — не дневная свеча неликвидной бумаги. По прежнему
  # календарю подтверждение «7 из 10» срезало упреждение с 43 дней до 10;
  # по календарю от объявления (25.09.2026) оно срезает выявляемость —
  # 15 пойманных против 29, прирост 3,8× против 6,2× при упреждении 69 дней
  # против 61. Довод сменился, решение осталось: подтверждение здесь снимает
  # не шум, а половину событий.
  confirmation_declined: {of: 7, out_of: 10, lead_days: 69, lift: 3.8}
  # **Наблюдение, а не правило** (решение владельца 24.09.2026 по развилке 27).
  # После правил `discount`, `zero_coupon` и `price_needs_trade` из ложных
  # срабатываний цены осталось одно с обычной доходностью: «АЛЬФАБ1Р34»,
  # купон 0,01 % при виде «фиксированный», доходность 16,44 %. Бумага
  # дисконтная по существу и не дисконтная по объявлению. Порога под одно
  # наблюдение не заводится; запись стоит здесь, чтобы второй такой случай
  # не пришлось искать заново.
  observed:
    - what: "купон 0,01 % при виде «фиксированный»"
      seen_at: "АЛЬФАБ1Р34, 21.09.2026"
      why_not_a_rule: >-
        Одно наблюдение порога не даёт, а отсечка по купону рискует потерять
        бумагу в настоящем дефолте с низким купоном: выявляемость цены
        сейчас 90,6 %, и менять её ради одного ложного срабатывания нечем.
  # **Формулировка живёт там же, где формулировки прочих оснований маршрута**
  # (`routing.yaml`, `statements.by_ground.market_price_distress`): второй
  # перечень формулировок разошёлся бы с первым. Здесь — почему она такая.
  statement_origin: >-
    Формулировка обязана называть упреждение прямо: 36 дней по медиане
    от начала стояния основания (основная мера, 29.09.2026; прежней мерой
    было 61, а до календаря от объявления — 43) — это признание случившегося
    на месяц раньше, а не предупреждение за квартал. Признак, названный без
    этого, читался бы как прогноз. Число подставляется из `measured.at_60`.
  yield_is_meaningless: true

# --- что печатается и как ----------------------------------------------------
display:
  spread_scale: 0
  multiple_scale: 2
  # Цена печатается в процентах номинала одним знаком: «30,0 %» — столько же
  # сведений, сколько «30,00 %», а разрядность у процентов в проекте одна.
  price_scale: 1
  # Спред печатается вместе с ориентиром дня и кратностью: «1 240 б. п.»
  # без «при ориентире 310» не говорит ничего — уровень рынка двигается.
  always_with_benchmark: true

# --- хранение ----------------------------------------------------------------
storage:
  # ISS — архив: сырой кэш срезов чистится, посчитанное хранится.
  # Решение владельца 24.09.2026.
  raw_cache: disposable
  computed: keep
  computed_at: data/market/series.json
  computed_by: finlib.sources.market.series
  recompute: daily
  why: >-
    Сырые срезы занимают 1,6 ГБ и переспрашиваются у источника в любой день;
    посчитанные спреды — ряд, который восстанавливается только пересчётом
    и нужен ежедневно.
