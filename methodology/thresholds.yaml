# Допуски и уровни контролей качества.
#
# ВНИМАНИЕ. Абсолютные допуски заданы в ТЫСЯЧАХ РУБЛЕЙ и привязаны к единице
# измерения комплекта. Единица определяется формой отчётности — перечень форм
# и код ОКЕИ в methodology/lines.yaml, блок units, — а комплект из форм вне
# этого перечня уходит в карантин контролем unit_not_determined. Если появится
# источник, отдающий рубли или миллионы, эти пороги станут бессмысленными:
# их придётся либо пересчитывать по unit_multiplier, либо задавать отдельным
# набором на единицу измерения.
# Загрузчик контролей обязан сверяться с unit_code комплекта.

version: "1.1.0"

unit_code: "384"  # ОКЕИ: тысячи рублей — единица, к которой привязаны пороги

# Именованные константы, доступные формулам показателей. Числовых литералов
# в формулах нет вовсе: любое число — это либо код строки, либо константа
# отсюда. Для отчётности за неполный год число дней другое, поэтому оно
# задаётся здесь, а не в коде расчёта.
constants:
  DAYS: 365      # дней в отчётном периоде

# Допуск на округление при проверке сходимости итогов.
# На всех трёх пробах (Газпром, Стройсервис, Магнит) итоги сходятся точно
# в ноль, поэтому относительный допуск выключен: он размывал бы сигнал.
rounding:
  absolute: 1        # тыс. руб.
  relative: "0"      # доля от проверяемого итога; 0 — не применяется

# Изменение показателя более чем в factor раз — предупреждение.
# min_base отсекает скачки на микровеличинах: рост с 1 до 10 тыс. руб.
# формально десятикратный, но содержательно ничего не значит.
jump_detection:
  factor: 5
  min_base: 1000     # тыс. руб.

# Правдоподобие величин при заявленной единице измерения.
#
# Единица определяется формой отчётности (lines.yaml, блок units), и это
# правило, выведенное из состава форм: оно сломается на источнике, отдающем
# рубли или миллионы. Ошибка в тысячу раз не ловится ни одним другим
# контролем — баланс сойдётся, сходимость разделов сойдётся, коэффициенты
# будут верны, а все абсолютные величины окажутся неверны.
#
# Отсюда два контроля. Первый — грубые границы валюты баланса: он ловит
# не всякую подмену единицы, а только выводящую величину за пределы
# правдоподобного, и потому предупреждающий, с требованием ручного
# подтверждения. Второй — скачок ровно в тысячу раз между смежными
# периодами: непрерывно действующая организация так не меняется, и это
# подмена единицы, а не хозяйственное событие. Он блокирующий.
magnitude:
  # Границы валюты баланса в тысячах рублей.
  balance_total:
    min: 10          # тыс. руб.
    max: 100000000000  # тыс. руб., то есть 100 трлн руб.
    origin: >-
      Нижняя граница — порядок минимального уставного капитала общества
      с ограниченной ответственностью: валюта баланса действующего юрлица
      ниже неё неправдоподобна. Верхняя — четырёхкратный запас к валюте
      баланса крупнейшей организации проб (ПАО «Газпром», 2,6e10 тыс. руб.).
      Границы грубые намеренно: контроль ловит подмену единицы, а не
      отклонение от отраслевой нормы, и ложное срабатывание здесь дороже
      пропуска. Подлежат пересмотру на эталонном наборе задачи 17.
  # Скачок величины между смежными периодами, указывающий на подмену единицы.
  period_shift:
    factor: 1000
    tolerance: "0.2"   # доля: отношение считается кратным при отклонении до 20 %
    min_base: 10       # тыс. руб.: на микровеличинах отношение бессмысленно
    origin: >-
      Подмена единицы даёт отношение ровно в тысячу раз. Проверяется близость
      к этой кратности, а не просто большая величина: рост в триста раз бывает
      хозяйственным событием и ловится контролем jump_detection, а ровно
      тысячекратный — нет.

# Связка отчёта о финансовых результатах с балансом: прирост нераспределённой
# прибыли должен объясняться чистой прибылью. Полностью сходится редко —
# разницу дают дивиденды, переоценка, исправления прошлых лет. Сигналим только
# на крупном необъяснённом расхождении, и только как предупреждение.
retained_earnings_link:
  unexplained_share_of_assets: "0.05"   # доля валюты баланса
  min_absolute: 1000                     # тыс. руб.

# Уровень каждого контроля. Блокирующий провал отправляет комплект в карантин.
checks:
  balance_equality:
    severity: blocking
  section_sum:
    severity: blocking
  profit_chain:
    severity: blocking
  mandatory_fields:
    severity: blocking
  # Единица измерения обязана быть определена формой комплекта. Прежде она
  # принималась как предположение, и это дефект данных: ошибка в тысячу раз
  # не ловится ни одним другим контролем.
  unit_not_determined:
    severity: blocking
  period_revised:
    severity: warning
  jump_detection:
    severity: warning
  # Грубые границы: ловят не всякую подмену единицы, поэтому предупреждение
  # с требованием ручного подтверждения, а не карантин.
  balance_magnitude:
    severity: warning
  # Тысячекратный скачок между периодами — подмена единицы, а не событие.
  period_magnitude_shift:
    severity: blocking
  retained_earnings_link:
    severity: warning

# Строки, обязательные к раскрытию. Для упрощённой отчётности перечень свой:
# валовой прибыли и итогов разделов в ней нет.
mandatory_lines:
  full: ["1600", "1700", "1300", "2110"]
  simplified: ["1600", "1700", "1300", "2110"]
