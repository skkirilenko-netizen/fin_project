# Расчёт балла и присвоение класса финансового состояния.
#
# Вся арифметика зафиксирована здесь. Языковая модель класс не определяет
# и пересматривать не вправе (инвариант 2).
#
# Балл показателя складывается из уровня и динамики. Уровень отвечает
# на вопрос «где показатель находится», динамика — «куда и как он движется».
# Одной динамики недостаточно: устойчиво хорошая, но не растущая организация
# получала бы средний балл, а слабая, но улучшающаяся — высокий.
#
# ВСЕ ШКАЛЫ КУСОЧНО-ЛИНЕЙНЫЕ. Ступенчатая шкала давала бы скачок класса при
# изменении коэффициента на сотую долю, и объяснить это пользователю нельзя.
# Между опорными точками — линейная интерполяция, за крайними точками
# значение не меняется.

version: "1.1.0"

# Абсолютные опорные точки шкал.
#
# ЭТО НЕ НОРМАТИВЫ. Формулировки вида «ниже норматива» или «не соответствует
# нормативу» применительно к этим величинам запрещены — см. правило
# в prompts/rules.md. Допустимо говорить только о балле по группе и о динамике.
calibration_points:
  scale_type: absolute
  origin: >-
    Экспертная калибровка, версия методики 1.1.0. Подлежит замене на отраслевые
    перцентили по мере накопления базы отчётностей. Опорные точки не являются
    нормативами и не выражают требований какого-либо регулятора; они задают
    шкалу перевода значения показателя в балл и вне этой шкалы смысла не имеют.
  limitation_note: >-
    Балльная оценка построена на экспертной калибровке без отраслевой привязки.
    При сопоставлении организаций разных видов деятельности сравнимость
    ограничена: одно и то же значение коэффициента для торговой компании
    и для производственной означает разное.

  # Шкалы по показателям: значение показателя -> балл уровня.
  # Задаются там, где опорные точки удаётся обосновать. Показатель без шкалы
  # оценивается по бесспорному ориентиру (benchmark) или только по динамике —
  # выдумывать точки ради полноты покрытия мы не будем.
  metrics:
    equity_ratio:
      points:
        - [ "0.10", 0 ]
        - [ "0.20", 25 ]
        - [ "0.30", 50 ]
        - [ "0.40", 75 ]
        - [ "0.50", 100 ]
      note: >-
        Шаг +25 баллов на каждые +0,10 автономии, верхняя точка 0,50 — сто
        баллов, ниже 0,10 — ноль. Между точками линейная интерполяция.

metric_score:
  # Уровень весит больше динамики: состояние важнее направления.
  level_weight: "0.6"
  dynamics_weight: "0.4"

  level:
    # Половина за текущее положение, половина за устойчивость положения.
    # Только текущее — слишком дёргано, только устойчивость — прошлое
    # перевешивает нынешний провал.
    last_period_weight: "0.5"
    persistence_weight: "0.5"
    # Ширина линейного перехода вокруг бесспорного ориентира задаётся долей
    # от material_change показателя: то есть тем изменением, которое для него
    # уже признано существенным. Новых подобранных величин не вводится.
    benchmark_band_from_material_change: "1.0"

  dynamics:
    direction_weight: "0.5"
    stability_weight: "0.3"
    gap_weight: "0.2"
    # Разрыв гасит слагаемое не мгновенно: от порога скачка до порога,
    # умноженного на это число, балл убывает линейно.
    gap_saturation: "2"

# Сумма весов групп обязана равняться 100. Проверяется при загрузке методики
# и отдельным тестом.
groups:
  liquidity:
    name: Ликвидность
    weight: 25
  capital_structure:
    name: Структура капитала
    weight: 15
  debt_service:
    name: Обслуживание долга
    weight: 15
  profitability:
    name: Рентабельность
    weight: 30
  turnover:
    name: Оборачиваемость
    weight: 15

# Границы по общему баллу. Сравнение нестрогое сверху: балл, равный границе,
# относится к старшему классу. Классификация ступенчата по своей природе —
# это единственное место, где ступень неустранима, поэтому в заключении
# рядом с классом всегда приводится сам балл.
classes:
  - code: A
    name: Устойчивое финансовое состояние
    min_score: "80"
  - code: B
    name: Удовлетворительное финансовое состояние
    min_score: "65"
  - code: C
    name: Состояние с признаками напряжения
    min_score: "50"
  - code: D
    name: Неустойчивое финансовое состояние
    min_score: "35"
  - code: E
    name: Критическое финансовое состояние
    min_score: "0"

lowest_class: E

# Стоп-факторы. Условие срабатывания объявлено в metrics.yaml, там же
# обоснование самого порога. Здесь — последствие для класса и обоснование
# именно градации: почему одно жёстче другого.
stop_factors:
  - code: negative_equity
    name: Отрицательный собственный капитал
    metrics: [equity, equity_ratio]
    effect: lowest_class
    rationale: >-
      Обязательства превышают активы: организация не покрывает долги даже
      при полной реализации имущества. Это состояние, а не затруднение,
      поэтому класс низший независимо от остальных показателей.

  - code: weak_coverage
    name: Нехватка оборотного капитала и покрытия процентов
    metrics: [nwc, interest_cover]
    effect: cap_at_class
    cap: C
    rationale: >-
      Мягче отрицательного капитала потому, что оба показателя отражают
      структуру финансирования, а не несостоятельность. Отрицательный
      оборотный капитал бывает штатным режимом при быстром обороте,
      а покрытие ниже единицы за один период может объясняться разовым
      падением прибыли. Класс ограничивается, но не опускается до низшего.

# Уверенность в оценке. Считается отдельно от класса и на него не влияет.
confidence:
  levels: [high, medium, low]
  default: high
  # Одно основание понижает до medium, два и более — до low.
  downgrade_on:
    - code: incomplete_group
      description: В группе больше половины показателей не рассчитаны
      threshold: "0.5"
    - code: unverified_periods
      description: >-
        Ряды опираются на периоды, не проверенные блокирующими контролями
    - code: flagged
      description: Сработал флаг, понижающий уверенность
