# Стандарт отчётности как измерение модели
#
# Ряды по РСБУ и по МСФО несопоставимы: у одного юридического лица
# и у группы разный периметр, разные правила признания и разная валюта
# баланса. Поэтому стандарт входит в ключи уникальности фактов, показателей
# и оценки, а правила обращения с ним заданы здесь, а не в коде.
#
# Измерение называется standard, а не source: source в src_file занят
# и означает другое — способ получения комплекта (ресурс или поданный файл).
# Одна и та же отчётность может прийти обоими способами, оставаясь
# отчётностью одного стандарта.

version: "1.0.0"

# Какой стандарт служит базой оценки ------------------------------------------
#
# Для группы, публикующей консолидированную отчётность, база — МСФО: она
# описывает периметр, в котором организация ведёт деятельность, тогда как
# РСБУ отдельного юридического лица у холдинга описывает управляющую
# компанию. Для организации без консолидированной отчётности база — РСБУ:
# другой отчётности у неё нет.
#
# Показатели неосновного стандарта считаются и хранятся: они нужны для
# сверки и как более свежий срез — РСБУ сдаётся раньше. В балльную оценку
# они не идут, потому что шкалы калиброваны по одному стандарту, и балл,
# собранный из двух, не значит ничего.
base_standard:
  # Порядок предпочтения: первый стандарт, по которому у организации есть
  # рассчитанные показатели, становится базой оценки.
  preference:
    - ifrs
    - rsbu
  # Текст для раздела «Ограничения анализа», когда база выбрана не первым
  # предпочтением. Оговорка обязательна: читатель видит оценку по отчётности
  # одного юридического лица и вправе знать, что группы за ней нет.
  rsbu_base_note: >-
    Оценка построена на отчётности отдельного юридического лица по РСБУ:
    консолидированная отчётность по МСФО в расчёт не поступала. Периметр
    группы, в которую входит организация, настоящим документом не описан.
  # Оговорка для показателей неосновного стандарта: они посчитаны, но
  # в балл не вошли. Без неё читатель не поймёт, почему показатель есть
  # в приложении и отсутствует в разложении оценки.
  secondary_note: >-
    Показатели по отчётности другого стандарта рассчитаны и приведены
    в приложении. В балльную оценку они не входят: шкалы калиброваны
    по одному стандарту, и балл, собранный из двух, сопоставим ни с чем.

# Запрет смешения --------------------------------------------------------------
#
# Показатель считается по величинам одного стандарта. Смешение даёт число,
# которое выглядит настоящим и не значит ничего: чистый долг группы
# к выручке управляющей компании — не долговая нагрузка, а артефакт.
# Контроль выполняется при расчёте каждого показателя и сообщает число
# проверенных величин, а не только срабатывания.
mixing:
  reason: >-
    Величины показателя относятся к разным стандартам отчётности; смешение
    РСБУ и МСФО в одном показателе запрещено методикой.

# Расхождение между стандартами -------------------------------------------------
#
# ЗАГОТОВКА. Показатель, рассчитанный по обоим стандартам за сопоставимый
# период, может расходиться, и величина расхождения — самостоятельный
# признак: она говорит о том, сколько деятельности лежит за периметром
# юридического лица. Но порог отсечки назвать пока нечем: наблюдений
# по двум стандартам у нас ноль.
#
# Поэтому сигнал объявлен, но не действует: active: false. Расчёт его
# пропускает, что проверяется тестом. Это не забытая строка справочника —
# заготовка с объявленной причиной, и к ней возвращаются, когда наберётся
# набор данных ветки МСФО (задача 29).
divergence:
  active: false
  inactive_reason: >-
    Порог не откалиброван: организаций, по которым в базе есть показатели
    обоих стандартов за сопоставимый период, пока нет. Величина отсечки
    задаётся после набора данных ветки МСФО.
  # Показатели, расхождение которых осмысленно сравнивать: величины
  # безразмерные либо приведённые к выручке. Абсолютные суммы сравнивать
  # бессмысленно — у группы они больше по устройству.
  comparable_metrics:
    - equity_ratio
    - cur_liq
    - net_margin
  # Периоды считаются сопоставимыми, если отчётные даты совпадают.
  # Годовая отчётность обоих стандартов сдаётся на 31 декабря, и допуска
  # здесь не нужно: расхождение дат означает разные периоды, а не округление.
  period_match: exact
