# Тип эмитента и применимость стоп-факторов.
#
# **Стоп-факторы РСБУ на МСФО механически не переносятся.** Основание
# в природе данных, а не в удобстве: формальное условие одно, экономический
# смысл противоположный. У квазисуверенной структуры проценты возмещаются
# целевым финансированием учредителя, и покрытие процентов ниже единицы
# означает устройство, а не бедствие; у Сегежи то же условие при автономии
# 0,2 % и накопленном убытке означает ровно то, что написано.
#
# **Видов неприменимости три, и смешивать их нельзя** — разведка 18.09.2026
# на пяти комплектах показала все три сразу:
#
#   by_type      стоп-фактор не применяется к типу эмитента целиком.
#                Автодор: покрытие процентов −1,72 при процентах, которые
#                возмещает Принципал.
#   by_context   стоп-фактор не применяется при условии на других
#                показателях. ФосАгро: отрицательный оборотный капитал
#                −50 569 при покрытии процентов 5,7 — краткосрочный долг
#                рефинансируется, и это не бедствие.
#   поправка     сам показатель у этого типа считается иначе. Это уже
#                не стоп-фактор, и живёт он не здесь, а в составе
#                показателей (`methodology/ifrs_metrics.yaml`): у ЛСР
#                текущая ликвидность 4,15 при запасах 310 977, которые суть
#                незавершённое строительство, и 217 501 на счетах эскроу,
#                компании недоступных.
#
# **Неприменение печатается всегда.** Молчаливое неприменение стоп-фактора —
# то же, что молчаливый выбор документа: исход меняется, а следа нет.

version: "0.1.0"

# Тип определяется **структурой отчётности**, а текст служит подтверждением.
# Маркеры по словам ненадёжны сами по себе: у ЛСР дважды встречается
# «кредитная организация» — речь о банках, дающих проектное финансирование, —
# и по тексту он стал бы финансовой организацией.
types:
  - code: corporate
    name: Обычный корпоративный эмитент
    default: true
    confirmation: not_required

  - code: quasi_sovereign
    name: Квазисуверенная (проектная) структура
    # Статьи расчётов с учредителем: у Автодора задолженность Принципала
    # 856 349 — 70 % активов, и это не дебиторская задолженность в обычном
    # смысле, а расчёты по поручению государства.
    structural_any_of:
      - ifrs.agency_principal_receivable
      - ifrs.agency_principal_costs
      - ifrs.principal_funding_received
    markers:
      - Принципал
      - концессионн
      - целевое финансирование
      - Государственная компания
    min_markers: 2
    confirmation: required

  - code: developer
    name: Девелопер, работающий по счетам эскроу
    structural_any_of:
      - ifrs.escrow_savings_in_revenue
      - ifrs.cash_from_operations_excl_escrow
    markers:
      - эскроу
      - долевого строительства
      - проектное финансирование
    min_markers: 2
    confirmation: required

  - code: financial
    name: Финансовая организация
    # Определяется на приёме документа, до разбора форм: у финансовой
    # организации неклассифицированный баланс, и статей, по которым тип
    # опознаётся структурно, в нём нет вовсе.
    determined_at: intake
    confirmation: not_required

# Стоп-факторы, применимость которых зависит от типа. Коды те же, что
# в РСБУ: правило одно, меняется только применимость.
stop_factors:
  - code: negative_equity
    name: Отрицательный собственный капитал
  - code: negative_autonomy
    name: Отрицательный коэффициент автономии
  - code: negative_nwc
    name: Отрицательный чистый оборотный капитал
  - code: interest_cover_below_one
    name: Покрытие процентов ниже единицы

not_applicable:
  - stop_factor: interest_cover_below_one
    kind: by_type
    type: quasi_sovereign
    rationale: >-
      Процентные расходы квазисуверенной структуры возмещаются целевым
      финансированием учредителя и в её собственный результат не входят.
      У Автодора начислено 54 382 при операционном убытке 713, и покрытие
      процентов измеряет устройство расчётов, а не способность обслуживать
      долг.
    limitation: >-
      Стоп-фактор «покрытие процентов ниже единицы» не применён: эмитент
      отнесён к квазисуверенным структурам, процентные расходы которых
      возмещаются учредителем. Показатель рассчитан и приведён, но оценку
      не понижает.
    origin: >-
      Разбор годовой отчётности Автодора за 2025 год: процентные расходы
      54 382 из примечания 11, целевое финансирование Принципала —
      примечание 14.
    calibration_status: "preliminary, наблюдение одно, подлежит пересмотру
      на наборе задачи 29"

  - stop_factor: negative_nwc
    kind: by_context
    # Условие объявлено здесь, а не в коде: прочитав справочник, надо
    # видеть, когда стоп-фактор не применяется.
    when:
      metric: interest_cover
      condition: gte
      value: "3"
    rationale: >-
      Отрицательный оборотный капитал при уверенном покрытии процентов
      означает опору на возобновляемое краткосрочное финансирование,
      а не неплатёжеспособность. У ФосАгро оборотный капитал −50 569
      при покрытии процентов 5,7 и автономии 0,36.
    limitation: >-
      Стоп-фактор «отрицательный чистый оборотный капитал» не применён:
      покрытие процентов выше порога, при котором отрицательный оборотный
      капитал объясняется возобновляемым краткосрочным финансированием.
      Доступность рефинансирования машинным признаком не подтверждается
      и требует проверки человеком.
    origin: >-
      Порог 3 выбран экспертно как величина, при которой обслуживание долга
      не вызывает сомнений. Проверен на пяти комплектах: отсекает ФосАгро
      (5,7) и не отсекает Сегежу (−1,99).
    calibration_status: "preliminary, откалибровано по 5 комплектам,
      подлежит пересмотру на наборе задачи 29"

# Сверка стоп-фактора с аудиторским заключением. Совпадение и расхождение —
# разные ситуации, и вторая требует осторожности в формулировках: стоп-фактор
# остаётся в силе, но подтверждения извне у него нет.
audit_consistency:
  confirmed_by:
    negative_equity: [going_concern_uncertainty]
    negative_autonomy: [going_concern_uncertainty]
    negative_nwc: [going_concern_uncertainty]
    interest_cover_below_one: [going_concern_uncertainty]
  confirmed_note: >-
    Стоп-фактор согласуется с аудиторским заключением: аудитор объявил
    существенную неопределённость в отношении непрерывности деятельности.
  unconfirmed_note: >-
    Стоп-фактор сработал, а в аудиторском заключении раздела о непрерывности
    деятельности нет. Обстоятельство остаётся в силе, но внешнего
    подтверждения у него нет.
  not_readable_note: >-
    Сверить стоп-фактор с аудиторским заключением нельзя: заключение
    не прочитано. Отсутствие подтверждения здесь не означает его отсутствия
    в самом заключении.
