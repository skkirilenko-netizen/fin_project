# Признаки изменения по промежуточной отчётности
#
# **Промежуточный комплект отвечает на другой вопрос, чем годовой.** Годовой
# говорит, каково положение; промежуточный между двумя годовыми говорит, что
# оно **изменилось**, — и мерить его теми же шкалами нельзя: шкалы
# откалиброваны на годовых величинах (`standards.yaml`, `period_preference`).
# Поэтому здесь объявлены признаки изменения, а не уровня, и в один перечень
# с уровнями они не сводятся.
#
# **Поток промежуточной отчётности накопительный с начала года** и приводится
# к скользящим двенадцати месяцам тождеством методики; баланс берётся на дату
# как есть. Правило одно на проект и объявлено в `standards.yaml`, здесь оно
# только применяется (`metrics/interim.py`).
#
# **Уверенность в основании по промежуточному комплекту ниже, и основание
# обязано это говорить**: отчётность не аудирована и обычно не проходит даже
# обзорной проверки. Оговорка стоит в самой формулировке, а не рядом с ней,
# потому что основание печатается строкой и оговорка, оставшаяся в другом
# месте, до читателя не доходит.

version: "0.1.0"

# --- состояние справочника ----------------------------------------------------
#
# **Ни один признак в маршрут пока не идёт.** Отсечки берутся из распределения
# (дорожная карта, принцип «пороги из распределения, а не по событиям»),
# а само распределение считается замером `eval/interim_lead_run.py`. Объявить
# признак действующим, не измерив прироста и упреждения, значило бы завести
# правило по двум наблюдениям — ровно то, против чего заведён замер рынка.
status:
  in_route: false
  in_route_origin: >-
    Признаки заведены 24.09.2026 вместе с загрузкой промежуточных комплектов
    (фаза 5). Действующими объявляются решением человека после замера: прирост
    в корзине, выявляемость и упреждение — на общем окне наблюдения и с мерой
    «сработал до события», как у рыночного слоя.

# --- уверенность ---------------------------------------------------------------
confidence:
  # Ступень понижения та же, что у прочих оснований понижения уверенности
  # ветки МСФО: основание названо, а величина ступени у уверенности одна.
  lower: true
  origin: >-
    Промежуточная отчётность аудиту не подлежит. Приравнять её к годовой
    значило бы объявить проверенным то, что никто не проверял.
  # Оговорка входит в текст основания. Слот {as_of} — отчётная дата
  # промежуточного комплекта, {kind} — его вид словами.
  note: "по неаудированной {kind} отчётности на {as_of}"
  kind_words:
    interim: промежуточной
    full: годовой
  # **К каким основаниям маршрута оговорка приписывается** (фаза 5-бис,
  # решение владельца 25.09.2026): к тем, что говорят о величинах базы.
  # Источник основания объявлен в `routing.yaml` (`ground_sources`); срок
  # раскрытия, карантин, пробел данных и наша оценка о величинах базы
  # не говорят, и оговорка к ним не относится.
  applies_to_sources:
    - отчётность
    - выпуск и отчётность
    - отчётность (периметр)

# --- как мерится изменение -----------------------------------------------------
#
# **Мера одна на все три признака: доля от прежнего наблюдения.** Абсолютная
# величина у эмитентов разного размера означает разное, а доля сравнима —
# и ровно поэтому отсечка берётся перцентилем распределения самих долей,
# а не назначается числом.
#
# **Прежнее наблюдение — предыдущий комплект того же эмитента**, годовой или
# промежуточный, какой ближе. Сравнивать полугодие с полугодием прошлого года
# здесь не нужно: у баланса сезонности нет, а поток уже приведён к скользящим
# двенадцати месяцам и потому сравним с любым другим скользящим годом.
measure:
  kind: share_of_previous
  origin: >-
    Доля сравнима между эмитентами, абсолютная величина — нет. Отрицательное
    прежнее наблюдение доли не даёт: рост от −20 до +100 в долях не выражается,
    и такая пара из распределения исключается вместе со своим знаменателем.
  # Наблюдение, у которого прежняя величина не раскрыта либо неположительна,
  # в распределение не идёт и считается отдельно: «признак не сработал»
  # и «мерить было нечем» — разные исходы.
  requires_positive_previous: true

# --- признаки ------------------------------------------------------------------
#
# У каждого объявлено: какую величину он смотрит, в какую сторону, откуда
# берётся отсечка и что печатается читателю. Величина называется не кодом
# строки, а именем правила маршрута (`routing.yaml`, блок `standards`):
# у РСБУ денежные средства стоят строкой 1250, у МСФО позицией `ifrs.cash`,
# и второго перечня кодов здесь не заводится.
features:
  - code: interim_cash_drop
    name: Денежные средства сократились
    line: cash
    direction: down
    rolling: false
    percentile: 95
    percentile_origin: >-
      Отсечка берётся перцентилем распределения долей по всем эмитентам
      и всем парам комплектов. Величина предварительна и подлежит замеру.
    calibration_status: preliminary
    basket: attention
    subgroup: value_risk
    escalation: false
    statement: >-
      Денежные средства сократились на {value} % за период до {as_of}
      (было {previous}, стало {current} {unit}) — {note}.
    # **Отсечка заморожена днём замера** (решение владельца 28.09.2026):
    # порог, едущий вместе с распределением, отвечал бы каждый раз о другом.
    # Величина — наблюдавшаяся доля на p95, та, что дал `interim_lead_run`
    # 27.09.2026 и повторил 28.09 на тех же данных (печатается 88,5 %).
    frozen:
      value: "0.8847"
      measured_on: "2026-09-27"
      origin: >-
        p95 распределения долей сокращения денежных средств по всем парам
        соседних комплектов вне карантина после перехода на LTM-базу:
        пар 6 879, измерено 6 624, мерить нечем 255; наблюдавшаяся величина
        0,884706, записана с четырьмя знаками.
    # **Решение по признаку** (владелец 28.09.2026, по числам после 5-бис):
    # в маршрут не вводится, в карточке — справочно.
    decision:
      by: "Сергей, 28.09.2026"
      in_route: false
      card: reference
      measured: >-
        eval/interim_lead_run.py после фазы 5-бис (27.09.2026, повторено
        28.09): прирост 2,08× при упреждении 22 дня (от 17 до 125), поймано
        4 из 35 событий в окне промежуточной отчётности (базовая доля 4,3 %,
        819 эмитентов) — от шума не отличим. До 5-бис было 2,61×, 5 из 35,
        35 дней: видимость комплекта сдвинулась со срока закона на день
        появления у агрегатора. Для сравнения ступень рынка p95 — 2,0× при
        102 днях по появлению (2,3× по уровню).
      review: >-
        Пересмотр — при калибровке фазы 6, с доверительными интервалами.

  - code: interim_short_debt_growth
    name: Краткосрочный долг вырос
    line: short_debt
    direction: up
    rolling: false
    percentile: 95
    percentile_origin: >-
      Та же отсечка и то же происхождение: перцентиль распределения долей.
    calibration_status: preliminary
    basket: attention
    subgroup: value_risk
    escalation: false
    statement: >-
      Краткосрочный долг вырос на {value} % за период до {as_of}
      (было {previous}, стало {current} {unit}) — {note}.

  - code: interim_operating_decline
    name: Скользящий операционный результат снизился
    line: operating
    direction: down
    # **Поток приводится к скользящим двенадцати месяцам**, иначе полугодие
    # сравнивалось бы с годом и признак срабатывал бы у каждого эмитента
    # в первом же полугодии.
    rolling: true
    percentile: 95
    percentile_origin: >-
      Та же отсечка и то же происхождение: перцентиль распределения долей.
    calibration_status: preliminary
    basket: attention
    subgroup: value_risk
    escalation: false
    statement: >-
      Операционный результат за скользящие двенадцать месяцев снизился
      на {value} % к {as_of} (было {previous}, стало {current} {unit}) — {note}.

# --- чего здесь нет и почему ----------------------------------------------------
#
# **EBITDA признаком не стала.** В формах РСБУ амортизация не раскрывается,
# поэтому EBITDA там не бывает по устройству — то же основание, по которому
# у маршрута РСБУ нет долговой нагрузки. Измеряется ближайшая раскрытая
# величина того же рода — прибыль от продаж (2200), у МСФО — операционная
# прибыль; подмена названа, а не сделана молча.
#
# **Прежде здесь было объявлено, что промежуточной консолидированной
# отчётности источник не отдаёт, и это было нашей ошибкой** (25.09.2026):
# её отбраковывала загрузка с ключом комплекта по году. Перегружено
# 1 776 комплектов у 324 эмитентов, и замер идёт по обоим стандартам.
not_measured:
  - subject: ebitda
    reason: >-
      В формах РСБУ амортизация не раскрывается: EBITDA там не бывает
      по устройству. Признак измеряется по операционному результату —
      прибыли от продаж (2200) у РСБУ и операционной прибыли у МСФО.
      Признак по EBITDA промежуточной отчётности МСФО не заведён и не мерился.

# --- тренд LTM в карточке -------------------------------------------------------
#
# **Карточка показывает, куда идёт LTM, а не одну точку** (фаза 5-бис):
# скользящие двенадцать месяцев на последние отчётные даты и динамику
# с начала года к тому же периоду прошлого года — квартал к кварталу,
# а не полугодие к году. Корзину тренд не двигает: это сведение.
trend:
  quarters: 5
  lines:
    rsbu:
      "2110": выручка
      "2200": прибыль от продаж
    ifrs:
      ifrs.revenue: выручка
      ifrs.operating_profit: операционная прибыль

# --- сверка IV квартала --------------------------------------------------------
#
# **Годовой минус девять месяцев — подразумеваемый IV квартал** (фаза 5-бис,
# решение владельца 25.09.2026). Мера — доля IV квартала в годовой величине;
# годовая неположительная доли не даёт, и такая пара считается «мерить
# нечем», а не «сошлось». **Отсечки двусторонние, по 1-му и 99-му перцентилю
# распределения долей** (принцип 2 дорожной карты: из распределения, а не по
# событиям), своё у каждой строки каждого стандарта. Аномалия — запись журнала
# уровня warning (`implied_q4_anomaly`); в маршрут она не идёт, карантина
# не ставит. Отсечки заморожены днём замера, как кратности рыночной лестницы:
# порог, едущий вместе с распределением, отвечал бы каждый раз о другом.
implied_q4:
  in_route: false
  measured_on: "2026-09-25"
  measured_origin: >-
    Распределение долей по всем парам «годовой — девять месяцев того же года»
    вне карантина на 25.09.2026, годовая величина положительна. РСБУ: выручка
    1 623 пары, прибыль от продаж 1 333; МСФО: выручка 205, операционная
    прибыль 181. У выручки РСБУ 1-й перцентиль равен нулю: IV квартал без
    выручки бывает, отрицательным — нет.
  lines:
    rsbu:
      "2110": {low: "0.000", high: "0.970"}
      "2200": {low: "-3.470", high: "1.885"}
    ifrs:
      ifrs.revenue: {low: "0.126", high: "0.999"}
      ifrs.operating_profit: {low: "-3.017", high: "2.527"}
