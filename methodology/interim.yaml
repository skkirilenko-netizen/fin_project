# Признаки изменения по промежуточной отчётности
#
# **Промежуточный комплект отвечает на другой вопрос, чем годовой.** Годовой
# говорит, каково положение; промежуточный между двумя годовыми говорит, что
# оно **изменилось**, — и мерить его теми же шкалами нельзя: шкалы
# откалиброваны на годовых величинах (`standards.yaml`, `period_preference`).
# Поэтому здесь объявлены признаки изменения, а не уровня, и в один перечень
# с уровнями они не сводятся.
#
# **Поток промежуточной отчётности накопительный с начала года** и приводится
# к скользящим двенадцати месяцам тождеством методики; баланс берётся на дату
# как есть. Правило одно на проект и объявлено в `standards.yaml`, здесь оно
# только применяется (`metrics/interim.py`).
#
# **Уверенность в основании по промежуточному комплекту ниже, и основание
# обязано это говорить**: отчётность не аудирована и обычно не проходит даже
# обзорной проверки. Оговорка стоит в самой формулировке, а не рядом с ней,
# потому что основание печатается строкой и оговорка, оставшаяся в другом
# месте, до читателя не доходит.

version: "0.1.0"

# --- состояние справочника ----------------------------------------------------
#
# **Ни один признак в маршрут пока не идёт.** Отсечки берутся из распределения
# (дорожная карта, принцип «пороги из распределения, а не по событиям»),
# а само распределение считается замером `eval/interim_lead_run.py`. Объявить
# признак действующим, не измерив прироста и упреждения, значило бы завести
# правило по двум наблюдениям — ровно то, против чего заведён замер рынка.
status:
  in_route: false
  in_route_origin: >-
    Признаки заведены 24.09.2026 вместе с загрузкой промежуточных комплектов
    (фаза 5). Действующими объявляются решением человека после замера: прирост
    в корзине, выявляемость и упреждение — на общем окне наблюдения и с мерой
    «сработал до события», как у рыночного слоя.

# --- уверенность ---------------------------------------------------------------
confidence:
  # Ступень понижения та же, что у прочих оснований понижения уверенности
  # ветки МСФО: основание названо, а величина ступени у уверенности одна.
  lower: true
  origin: >-
    Промежуточная отчётность аудиту не подлежит. Приравнять её к годовой
    значило бы объявить проверенным то, что никто не проверял.
  # Оговорка входит в текст основания. Слот {as_of} — отчётная дата
  # промежуточного комплекта, {kind} — его вид словами.
  note: "по неаудированной {kind} отчётности на {as_of}"
  kind_words:
    interim: промежуточной
    full: годовой

# --- как мерится изменение -----------------------------------------------------
#
# **Мера одна на все три признака: доля от прежнего наблюдения.** Абсолютная
# величина у эмитентов разного размера означает разное, а доля сравнима —
# и ровно поэтому отсечка берётся перцентилем распределения самих долей,
# а не назначается числом.
#
# **Прежнее наблюдение — предыдущий комплект того же эмитента**, годовой или
# промежуточный, какой ближе. Сравнивать полугодие с полугодием прошлого года
# здесь не нужно: у баланса сезонности нет, а поток уже приведён к скользящим
# двенадцати месяцам и потому сравним с любым другим скользящим годом.
measure:
  kind: share_of_previous
  origin: >-
    Доля сравнима между эмитентами, абсолютная величина — нет. Отрицательное
    прежнее наблюдение доли не даёт: рост от −20 до +100 в долях не выражается,
    и такая пара из распределения исключается вместе со своим знаменателем.
  # Наблюдение, у которого прежняя величина не раскрыта либо неположительна,
  # в распределение не идёт и считается отдельно: «признак не сработал»
  # и «мерить было нечем» — разные исходы.
  requires_positive_previous: true

# --- признаки ------------------------------------------------------------------
#
# У каждого объявлено: какую величину он смотрит, в какую сторону, откуда
# берётся отсечка и что печатается читателю. Величина называется не кодом
# строки, а именем правила маршрута (`routing.yaml`, блок `standards`):
# у РСБУ денежные средства стоят строкой 1250, у МСФО позицией `ifrs.cash`,
# и второго перечня кодов здесь не заводится.
features:
  - code: interim_cash_drop
    name: Денежные средства сократились
    line: cash
    direction: down
    rolling: false
    percentile: 95
    percentile_origin: >-
      Отсечка берётся перцентилем распределения долей по всем эмитентам
      и всем парам комплектов. Величина предварительна и подлежит замеру.
    calibration_status: preliminary
    basket: attention
    subgroup: value_risk
    escalation: false
    statement: >-
      Денежные средства сократились на {value} % за период до {as_of}
      (было {previous}, стало {current} {unit}) — {note}.

  - code: interim_short_debt_growth
    name: Краткосрочный долг вырос
    line: short_debt
    direction: up
    rolling: false
    percentile: 95
    percentile_origin: >-
      Та же отсечка и то же происхождение: перцентиль распределения долей.
    calibration_status: preliminary
    basket: attention
    subgroup: value_risk
    escalation: false
    statement: >-
      Краткосрочный долг вырос на {value} % за период до {as_of}
      (было {previous}, стало {current} {unit}) — {note}.

  - code: interim_operating_decline
    name: Скользящий операционный результат снизился
    line: operating
    direction: down
    # **Поток приводится к скользящим двенадцати месяцам**, иначе полугодие
    # сравнивалось бы с годом и признак срабатывал бы у каждого эмитента
    # в первом же полугодии.
    rolling: true
    percentile: 95
    percentile_origin: >-
      Та же отсечка и то же происхождение: перцентиль распределения долей.
    calibration_status: preliminary
    basket: attention
    subgroup: value_risk
    escalation: false
    statement: >-
      Операционный результат за скользящие двенадцать месяцев снизился
      на {value} % к {as_of} (было {previous}, стало {current} {unit}) — {note}.

# --- чего здесь нет и почему ----------------------------------------------------
#
# **EBITDA признаком не стала, и это свойство данных, а не выбор.**
# Промежуточные комплекты у нас есть только по РСБУ: агрегатор промежуточной
# консолидированной отчётности не отдаёт вовсе. В формах РСБУ амортизация
# не раскрывается, поэтому EBITDA там не бывает по устройству — то же
# основание, по которому у маршрута РСБУ нет долговой нагрузки. Измеряется
# ближайшая раскрытая величина того же рода — прибыль от продаж (2200),
# и подмена названа, а не сделана молча.
not_measured:
  - subject: ebitda
    reason: >-
      Промежуточные комплекты в базе только по РСБУ, а в формах РСБУ
      амортизация не раскрывается: EBITDA там не бывает по устройству.
      Признак измеряется по операционному результату (2200).
  - subject: interim_ifrs
    reason: >-
      Промежуточной консолидированной отчётности источник не отдаёт;
      документы МСФО разбираются поштучно и массовым слоем не являются.
