    form: ifrs.statement_of_profit_or_loss
    section: profit_or_loss
    in_brackets: true
    # Вычитаемая статья: величина хранится со знаком, а нормальный знак —
    # подсказка на случай, когда эмитент печатает расход без скобок.
    normal_sign: -1
    aliases:
