# Унифицированная модель статей консолидированной отчётности по МСФО.
#
# Справочник параллельный справочнику РСБУ, а не его продолжение. Причины
# в природе данных, а не в удобстве:
#
#   1. В МСФО нет кодов строк, утверждённых нормативным актом. Позиция
#      опознаётся наименованием через синонимы; в РСБУ первичен код,
#      а наименование повторяется («Заёмные средства» — и 1410, и 1510).
#      Это разные механизмы опознания, и общий каталог заставил бы натягивать
#      один на другой.
#   2. Состав статей меняется от эмитента к эмитенту, тогда как справочник
#      РСБУ фиксирован формой. Разная природа — разные правила проверки.
#   3. Специфические статьи сверх порога существенности получают коды при
#      подтверждении человеком, то есть справочник пополняется во время
#      работы. Подтверждённые статьи живут не здесь, а в таблице
#      ifrs_line_confirmation: методика правится руками, и дифф —
#      единственный контроль над ней. Позиция, присвоенная во время работы,
#      методикой не является.
#
# КОД ПОЗИЦИИ — `ifrs.<имя>`. Префикс обязателен и проверяется загрузчиком.
# Точка в коде выбрана намеренно: четырёхзначное число в грамматике формул
# уже означает код строки РСБУ, а голое строчное имя — константу методики
# из thresholds.yaml. Код с точкой не может быть ни тем, ни другим, и в
# fact_report.line_code он с первого взгляда отличим от кода РСБУ.
#
# Состав итоговых строк (components) — то же, что в РСБУ: перечень слагаемых
# с операторами, по которому работают контроли сходимости. Арифметика состава
# от природы кодов не зависит и вынесена в quality/totals.py.

version: "0.1.0"

# Формы отчётности. Кодов ОКУД у них нет: это не формы, утверждённые
# приказом, а разделы консолидированной отчётности, и называются они
# у эмитентов по-разному. Код формы — наш, с тем же префиксом.
forms:
  ifrs.statement_of_financial_position:
    name: Отчёт о финансовом положении
    aliases:
      - Консолидированный отчёт о финансовом положении
      - Отчёт о финансовом положении (баланс)
      - Консолидированный бухгалтерский баланс
  ifrs.statement_of_profit_or_loss:
    name: Отчёт о прибыли или убытке
    aliases:
      - Консолидированный отчёт о прибыли или убытке
      - Отчёт о прибыли или убытке и прочем совокупном доходе
      - Консолидированный отчёт о прибыли или убытке и прочем совокупном доходе
      - Отчёт о совокупном доходе
  ifrs.statement_of_cash_flows:
    name: Отчёт о движении денежных средств
    aliases:
      - Консолидированный отчёт о движении денежных средств

# --- Отчёт о финансовом положении: внеоборотные активы ------------------------
#
# Синонимы собраны с шести разобранных комплектов, и у каждого отмечено,
# у кого он встречен: через полгода при разборе расхождения нужно видеть,
# откуда взялось написание, а не доверять памяти.

positions:
  - code: ifrs.ppe
    name: Основные средства
    form: ifrs.statement_of_financial_position
    section: non_current_assets
    aliases:
      - {name: Основные средства, seen_at: ФосАгро}
      - {name: Основные средства и незавершённое строительство, seen_at: Автодор}
      - {name: Основные средства и капитальное строительство, seen_at: Норникель}

  - code: ifrs.right_of_use_assets
    name: Активы в форме права пользования
    form: ifrs.statement_of_financial_position
    section: non_current_assets
    aliases:
      - {name: Активы в форме права пользования, seen_at: ФосАгро}
      - {name: Right-of-use активы, seen_at: Сегежа}
      - {name: Активы в форме права пользования по договорам аренды, seen_at: ЛСР}

  - code: ifrs.intangible_assets
    name: Нематериальные активы
    form: ifrs.statement_of_financial_position
    section: non_current_assets
    aliases:
      - {name: Нематериальные активы, seen_at: ФосАгро}
      - {name: Прочие нематериальные активы, seen_at: Сегежа}

  - code: ifrs.goodwill
    name: Гудвил
    form: ifrs.statement_of_financial_position
    section: non_current_assets
    aliases:
      - {name: Гудвил, seen_at: Сегежа}
      - {name: Гудвилл, seen_at: ЛСР}
      - {name: Деловая репутация, seen_at: Норникель}

  - code: ifrs.investments_in_associates
    name: Инвестиции в ассоциированные и совместные предприятия
    form: ifrs.statement_of_financial_position
    section: non_current_assets
    aliases:
      - {name: Инвестиции в ассоциированные предприятия, seen_at: Норникель}
      - {name: Инвестиции в ассоциированные и совместные предприятия, seen_at: ФосАгро}
      - {name: Инвестиции в совместные предприятия, seen_at: ЛСР}

  - code: ifrs.deferred_tax_assets
    name: Отложенные налоговые активы
    form: ifrs.statement_of_financial_position
    section: non_current_assets
    aliases:
      - {name: Отложенные налоговые активы, seen_at: ФосАгро}
      - {name: Отложенный налоговый актив, seen_at: Автодор}

  - code: ifrs.other_non_current_assets
    name: Прочие внеоборотные активы
    form: ifrs.statement_of_financial_position
    section: non_current_assets
    aliases:
      - {name: Прочие внеоборотные активы, seen_at: ФосАгро}
      - {name: Прочие долгосрочные активы, seen_at: Норникель}
      - {name: Прочие внеоборотные финансовые активы, seen_at: Сегежа}

  - code: ifrs.total_non_current_assets
    name: Итого внеоборотные активы
    form: ifrs.statement_of_financial_position
    section: non_current_assets
    is_total: true
    aliases:
      - {name: Итого внеоборотные активы, seen_at: ФосАгро}
      - {name: Итого долгосрочные активы, seen_at: Норникель}
      - {name: Внеоборотные активы, seen_at: ФосАгро}
      - {name: Итого внеоборотных активов, seen_at: ЛСР}
    components:
      - {code: ifrs.ppe}
      - {code: ifrs.right_of_use_assets}
      - {code: ifrs.intangible_assets}
      - {code: ifrs.goodwill}
      - {code: ifrs.investments_in_associates}
      - {code: ifrs.deferred_tax_assets}
      - {code: ifrs.other_non_current_assets}

# --- Оборотные активы ---------------------------------------------------------

  - code: ifrs.inventories
    name: Запасы
    form: ifrs.statement_of_financial_position
    section: current_assets
    aliases:
      - {name: Запасы, seen_at: ФосАгро}
      - {name: Товарно-материальные запасы, seen_at: Норникель}

  - code: ifrs.trade_receivables
    name: Торговая и прочая дебиторская задолженность
    form: ifrs.statement_of_financial_position
    section: current_assets
    aliases:
      - {name: Торговая и прочая дебиторская задолженность, seen_at: ФосАгро}
      - {name: Дебиторская задолженность и авансы выданные, seen_at: Норникель}
      - {name: Торговая дебиторская задолженность, seen_at: Сегежа}

  - code: ifrs.advances_paid
    name: Авансы выданные
    form: ifrs.statement_of_financial_position
    section: current_assets
    aliases:
      - {name: Авансы выданные, seen_at: ЛСР}
      - {name: Авансы поставщикам, seen_at: Автодор}
      - {name: Предоплата и прочие текущие активы, seen_at: Сегежа}

  - code: ifrs.cash
    name: Денежные средства и их эквиваленты
    form: ifrs.statement_of_financial_position
    section: current_assets
    # Оговорка безусловная: она верна для любого эмитента и идёт в раздел
    # «Ограничения анализа». Средства, ограниченные в использовании, в эту
    # позицию не входят, и у застройщика это решает дело: у ЛСР 217 501 млн
    # на счетах эскроу стоят под балансом сноской и компании недоступны.
    note: >-
      В состав денежных средств и их эквивалентов не входят средства,
      ограниченные в использовании: остатки на счетах эскроу, залоговые
      и целевые счета раскрываются отдельно и в свободную ликвидность
      не включаются.
    aliases:
      - {name: Денежные средства и их эквиваленты, seen_at: ФосАгро}
      - {name: Денежные средства и эквиваленты денежных средств, seen_at: Норникель}
      - {name: Денежные средства, seen_at: Автодор}

  - code: ifrs.other_current_assets
    name: Прочие оборотные активы
    form: ifrs.statement_of_financial_position
    section: current_assets
    aliases:
      - {name: Прочие оборотные активы, seen_at: ФосАгро}
      - {name: Прочие краткосрочные активы, seen_at: Норникель}
      - {name: Прочие текущие активы, seen_at: Сегежа}

  - code: ifrs.total_current_assets
    name: Итого оборотные активы
    form: ifrs.statement_of_financial_position
    section: current_assets
    is_total: true
    aliases:
      - {name: Итого оборотные активы, seen_at: ФосАгро}
      - {name: Итого краткосрочные активы, seen_at: Норникель}
      - {name: Оборотные активы, seen_at: ФосАгро}
      - {name: Итого оборотных активов, seen_at: ЛСР}
    components:
      - {code: ifrs.inventories}
      - {code: ifrs.trade_receivables}
      - {code: ifrs.advances_paid}
      - {code: ifrs.cash}
      - {code: ifrs.other_current_assets}

  - code: ifrs.total_assets
    name: Итого активы
    form: ifrs.statement_of_financial_position
    section: assets
    is_total: true
    aliases:
      - {name: Итого активы, seen_at: ФосАгро}
      - {name: Итого активов, seen_at: ЛСР}
      - {name: Всего активы, seen_at: Автодор}
      - {name: Итого сумма активов, seen_at: Норникель}
    components:
      - {code: ifrs.total_non_current_assets}
      - {code: ifrs.total_current_assets}

# --- Капитал ------------------------------------------------------------------

  - code: ifrs.share_capital
    name: Акционерный капитал
    form: ifrs.statement_of_financial_position
    section: equity
    sign: any
    aliases:
      - {name: Акционерный капитал, seen_at: ФосАгро}
      - {name: Уставный капитал, seen_at: Автодор}
      - {name: Уставный и добавочный капитал, seen_at: Сегежа}

  - code: ifrs.share_premium
    name: Эмиссионный доход
    form: ifrs.statement_of_financial_position
    section: equity
    sign: any
    # Наименование исправлено: код называет эмиссионный доход, а стояло
    # «Добавочный капитал». Это не одно и то же — добавочный капитал шире
    # и включает переоценку, — но в консолидированной отчётности по МСФО
    # эмитенты называют одну и ту же строку и так и так: у Сегежи
    # «Добавочный капитал», у ФосАгро «Эмиссионный доход». Раздельных
    # кодов не заводим, пока не встретится эмитент, раскрывший обе строки
    # сразу; синоним оставлен, а расхождение содержания — в оговорке.
    note: >-
      Эмиссионный доход приведён по строке, которую эмитент называет либо
      эмиссионным доходом, либо добавочным капиталом. У эмитента, раскрывшего
      переоценку внутри добавочного капитала, величина шире эмиссионного
      дохода.
    aliases:
      - {name: Добавочный капитал, seen_at: ЛСР}
      - {name: Эмиссионный доход, seen_at: Норникель}

  - code: ifrs.retained_earnings
    name: Накопленная прибыль (непокрытый убыток)
    form: ifrs.statement_of_financial_position
    section: equity
    sign: any
    aliases:
      - {name: Нераспределённая прибыль, seen_at: ФосАгро}
      - {name: Накопленная прибыль, seen_at: Норникель}
      - {name: Накопленный убыток, seen_at: Сегежа}
      - {name: Нераспределённая прибыль (непокрытый убыток), seen_at: ЛСР}

  - code: ifrs.other_reserves
    name: Накопленный прочий совокупный доход
    form: ifrs.statement_of_financial_position
    section: equity
    sign: any
    aliases:
      - {name: Прочие резервы, seen_at: Норникель}
      - {name: Накопленный прочий совокупный доход, seen_at: ФосАгро}
      - {name: Резерв пересчёта валют, seen_at: Сегежа}

  - code: ifrs.non_controlling_interests
    name: Неконтролирующие доли участия
    form: ifrs.statement_of_financial_position
    section: equity
    sign: any
    aliases:
      - {name: Неконтролирующие доли участия, seen_at: ФосАгро}
      - {name: Неконтролирующая доля, seen_at: Норникель}
      - {name: Доля неконтролирующих акционеров, seen_at: ЛСР}

  - code: ifrs.treasury_shares
    name: Собственные выкупленные акции
    form: ifrs.statement_of_financial_position
    section: equity
    sign: any
    in_brackets: true
    # Контр-статья капитала: величина хранится со знаком, нормальный знак —
    # подсказка на случай печати без скобок. У ЛСР строка пришла с плюсом
    # (+2 570 / +1 851), и капитал акционеров от этого не сходился.
    normal_sign: -1
    aliases:
      - {name: "Собственные акции, выкупленные у акционеров", seen_at: ЛСР}
      - {name: Собственные акции, seen_at: ЛСР}

  - code: ifrs.equity_attributable_to_owners_of_parent
    name: Капитал, приходящийся на акционеров материнской компании
    form: ifrs.statement_of_financial_position
    section: equity
    is_total: true
    # Правомерно отрицателен по той же причине, что и итог капитала.
    sign: any
    aliases:
      - {name: "Итого капитал, приходящийся на долю акционеров", seen_at: ЛСР}
      - {name: "Итого капитал, приходящийся на акционеров материнской компании",
         seen_at: ФосАгро}
      - {name: "Итого капитала, причитающегося акционерам Компании", seen_at: ФосАгро}
      - {name: "Капитал, приходящийся на акционеров Компании", seen_at: Сегежа}
    components:
      - {code: ifrs.share_capital}
      - {code: ifrs.share_premium}
      - {code: ifrs.treasury_shares}
      - {code: ifrs.retained_earnings}
      - {code: ifrs.other_reserves}

  - code: ifrs.total_equity
    name: Итого капитал
    form: ifrs.statement_of_financial_position
    section: equity
    is_total: true
    # Итог капитала правомерно отрицателен, и это не признак одного
    # состояния: у Автодора −111 млн при рейтингах АА(RU)/ruAA+ — капитала
    # нет по устройству, прибыль реинвестируется Принципалу; у Сегежи
    # −15 008 млн при накопленном убытке 138 955 млн и существенной
    # неопределённости непрерывности деятельности. Формальное условие одно,
    # смысл противоположный — отсюда тип эмитента в задаче 26.
    sign: any
    aliases:
      - {name: Итого капитал, seen_at: ФосАгро}
      - {name: Итого капитала, seen_at: ЛСР}
      - {name: Всего капитал, seen_at: Автодор}
      - {name: Итого собственный капитал, seen_at: Норникель}
    components:
      - {code: ifrs.share_capital}
      - {code: ifrs.share_premium}
      - {code: ifrs.treasury_shares}
      - {code: ifrs.retained_earnings}
      - {code: ifrs.other_reserves}
      - {code: ifrs.non_controlling_interests}

