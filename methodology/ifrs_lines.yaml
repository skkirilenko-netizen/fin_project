    # прибыль за год. Сводить их к одному смыслу нельзя, а опознавать нужно:
    # без этой строки блок корректировок не с чего начинать.
    aliases:
      - {name: Прибыль до налогообложения, seen_at: Автодор}
      - {name: Прибыль от операционной деятельности, seen_at: ФосАгро}
      - {name: Чистый убыток за год, seen_at: Сегежа}
      - {name: Прибыль за год, seen_at: ЛСР}

