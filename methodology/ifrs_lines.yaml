# --- Отчёт о прибыли или убытке -----------------------------------------------
#
# Расходные статьи помечены in_brackets: в отчётности они печатаются
# в круглых скобках, хранятся как величина расхода, а вычитание задано
# оператором в составе итоговой строки. Соглашение то же, что в РСБУ.

