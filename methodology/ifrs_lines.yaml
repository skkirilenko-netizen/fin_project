# --- Изменения оборотного капитала и промежуточные итоги операционного потока ---
#
# **Косвенный метод устроен одинаково у всех, и то, что ядро здесь было тоньше
# всего, — наш пробел, а не свойство отчётности.** Эти позиции пришли из
# разметки: каждая подтверждена человеком у трёх–пяти эмитентов и до подъёма
# числилась специфической. Коды и смысл оставлены те, что присвоены
# при разметке.
#
# Наименования у эмитентов расходятся сильно, и это не помеха: у Норникеля
# блок изменений оборотного капитала подписан просто балансовыми словами —
# «Запасы», «Торговая и прочая кредиторская задолженность». Со строками
# баланса они не спорят: ключ справочника — пара «форма, наименование»,
# а форма здесь другая.

  - code: ifrs.cash_before_working_capital_changes
    name: Денежный поток от операционной деятельности до изменений оборотного капитала
    form: ifrs.statement_of_cash_flows
    section: operating_cash_flow
    sign: any
    # Промежуточный итог, а не корректировка: им кончается блок корректировок
    # и начинается блок изменений оборотного капитала. Состав не объявляется —
    # у каждого эмитента свой набор корректировок, и один состав на всех
    # означал бы вечно несходящийся итог.
    #
    # У ЛСР строка названа операционной прибылью, а не денежным потоком:
    # это то же место цепочки, и различие в слове, а не в величине. У двух
    # эмитентов из пяти строка не подписана вовсе — там она опознаётся
    # человеком, синонимом взять нечего.
    aliases:
      - {name: "Потоки денежных средств от операционной деятельности\
          \ без учета изменений оборотного капитала и резервов", seen_at: Автодор}
