# Существенность специфической статьи: доля валюты баланса, сверх которой
# статья никогда не сворачивается в «прочее», а выносится отдельной позицией
# с кодом, присвоенным при подтверждении человеком.
#
# Основание порога — три наблюдения: у Автодора 85 % активов лежат в двух
# статьях, которых нет ни у кого другого (задолженность Принципала, затраты
# в интересах Принципала); у Сегежи обязательства по опционным соглашениям —
# около 30 % краткосрочных обязательств; у ЛСР средства на счетах эскроу.
# Порог 5 % ниже любого из них с запасом: он отсекает мелочь, а не отбирает
# существенное.
# --- Осознанно игнорируемые наименования -------------------------------------
#
# **Игнорируемое наименование — принятое решение, а неопознанное —
# недоработка**, и путать их нельзя: то же различие, что у РСБУ между
# `ignored_codes` и `unknown_line_code`. Строка, объявленная здесь, не идёт
# ни в очередь разметки, ни в основания экрана сверки, а считается отдельно:
# ноль игнорируемых строк и «их никто не искал» — разные сведения.
#
# Причина обязательна у каждого предмета. Общее у всех четырёх одно: **это
# величины на акцию и свойства инструмента, а не финансового состояния**.
# Методика оценивает организацию, и ни один её показатель, ни один флаг
# и ни один стоп-фактор на величину в расчёте на акцию не опирается.
# У таких строк к тому же своя единица — рубли или доллары на акцию, —
# и, попав в факты комплекта, они оказались бы числом в чужой единице:
# ошибка того же рода, что подмена тысяч миллионами.
#
# Опознаются они наименованием и **дословно**, как синонимы: ignore
# по вхождению слова однажды проглотил бы настоящую статью, а потеря
# величины здесь так же тиха, как в остальных местах ветки.
ignored:
  - subject: Прибыль на акцию
    reason: >-
      Прибыль на акцию раскрывается по МСФО (IAS) 33 и относится к акции,
      а не к организации: в показателях методики, во флагах и в стоп-факторах
      она не участвует. Единица у неё своя — рубли или доллары на акцию,
      а не единица комплекта.
    names:
      - {name: Базовая и разводненная прибыль на акцию (в руб.), seen_at: ФосАгро}
      - {name: "Базовая и разводненная прибыль на акцию, причитающаяся\
          \ акционерам материнской компании (долл. США на акцию)",
          seen_at: Норникель}
      # У Акрона строки две, с подзаголовком «Прибыль на акцию» над ними.
      - {name: Базовая (выраженная в рублях), seen_at: Акрон}
      - {name: Разводненная (выраженная в рублях), seen_at: Акрон}

  - subject: Количество акций
    reason: >-
      Средневзвешенное число акций служит знаменателем прибыли на акцию
      и больше нигде: величина не денежная, в единице комплекта
      не выражается и ни в один показатель методики не входит.
    names:
      - {name: "Средневзвешенное количество акций, находящихся в обращении",
          seen_at: Черкизово}
      # Подстрока под средневзвешенным количеством: тем же оборотом эмитенты
      # подписывают и прибыль на акцию, и число акций. Оба предмета
      # игнорируются, поэтому различать их не требуется.
      - {name: базовое и разводненное, seen_at: Черкизово}

  - subject: Номинальная стоимость акции
    reason: >-
      Номинал — свойство инструмента, а не финансового состояния: в расчёт
      идёт уставный капитал целиком (`ifrs.share_capital`), а стоимость одной
      акции ни в одном показателе не участвует.
    # В разобранных комплектах в основных формах не встречена: номинал
    # раскрывается в примечании о капитале. Написание добавляется тогда,
    # когда строка встретится, — выдумывать его незачем.
    names: []

  - subject: Дивиденд на акцию
    reason: >-
      Величина на акцию. Выплаченные дивиденды методика берёт целиком
      из отчёта о движении денежных средств (`ifrs.dividends_paid`);
      приходящаяся на одну акцию доля ни в показателях, ни в сигналах
      не используется.
    names: []

materiality:
  share_of_total_assets: "0.05"
  origin: >-
    Экспертная отсечка по трём наблюдениям ветки МСФО. Подлежит уточнению
    на регрессионном наборе задачи 29.

# Сколько эмитентов, подтвердивших одну и ту же специфическую статью
# независимо друг от друга, делают её кандидатом в ядро. Признак машинный
# и никого ни к чему не обязывает: поднятие позиции в ядро — решение
# человека и правка этого файла руками. Признак лишь показывает, что пора
# посмотреть.
core_candidate:
  distinct_issuers: 3
  origin: >-
    Три эмитента — наименьшее число, при котором совпадение перестаёт быть
    частным случаем одного составителя отчётности. Величина экспертная,
    подлежит уточнению по мере накопления подтверждений.
