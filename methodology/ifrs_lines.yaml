    in_brackets: true
    # Вычитаемая статья: величина хранится со знаком, а нормальный знак —
    # подсказка на случай, когда эмитент печатает расход без скобок.
    normal_sign: -1
    aliases:
      - {name: Себестоимость продаж, seen_at: ФосАгро}
      - {name: Себестоимость реализации, seen_at: Норникель}
