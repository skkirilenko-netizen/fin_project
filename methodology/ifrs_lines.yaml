# Существенность специфической статьи: доля валюты баланса, сверх которой
# статья никогда не сворачивается в «прочее», а выносится отдельной позицией
# с кодом, присвоенным при подтверждении человеком.
#
# Основание порога — три наблюдения: у Автодора 85 % активов лежат в двух
# статьях, которых нет ни у кого другого (задолженность Принципала, затраты
# в интересах Принципала); у Сегежи обязательства по опционным соглашениям —
# около 30 % краткосрочных обязательств; у ЛСР средства на счетах эскроу.
# Порог 5 % ниже любого из них с запасом: он отсекает мелочь, а не отбирает
# существенное.
materiality:
  share_of_total_assets: "0.05"
  origin: >-
    Экспертная отсечка по трём наблюдениям ветки МСФО. Подлежит уточнению
    на регрессионном наборе задачи 29.

# Сколько эмитентов, подтвердивших одну и ту же специфическую статью
# независимо друг от друга, делают её кандидатом в ядро. Признак машинный
# и никого ни к чему не обязывает: поднятие позиции в ядро — решение
# человека и правка этого файла руками. Признак лишь показывает, что пора
# посмотреть.
core_candidate:
  distinct_issuers: 3
  origin: >-
    Три эмитента — наименьшее число, при котором совпадение перестаёт быть
    частным случаем одного составителя отчётности. Величина экспертная,
    подлежит уточнению по мере накопления подтверждений.
