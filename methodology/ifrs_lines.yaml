      - {name: Валовая прибыль (убыток), seen_at: Сегежа}
    # Состав складывается: знак вычитаемой статьи хранится в самой величине.
    # Прежде знак задавался оператором, а величина приходила без него —
    # и «Себестоимость (160 017)» складывалась с выручкой вместо вычитания.
    components:
      - {code: ifrs.revenue}
      - {code: ifrs.cost_of_sales}

