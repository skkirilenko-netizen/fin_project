    normal_sign: -1
    # Оговорка безусловная и существенная: в отчёте о прибыли или убытке
    # финансовые расходы приводятся за вычетом капитализированных процентов
    # и полученных субсидий. У Автодора в форме 131 млн, в примечании —
    # 26 430 млн, из которых 26 024 покрыты целевым финансированием
    # Принципала. Покрытие процентов по форме даёт 7,5 при стоимости долга
    # в двести раз выше видимой, поэтому реальная величина берётся
    # из примечания (задача 24).
    note: >-
      Финансовые расходы в отчёте о прибыли или убытке приводятся за вычетом
      капитализированных процентов и полученного целевого финансирования.
      Начисленные проценты до вычетов раскрываются в примечании к заёмным
      средствам, и покрытие процентов считается по нему.
    aliases:
      - {name: Финансовые расходы, seen_at: ФосАгро}
      - {name: Процентные расходы, seen_at: Автодор}
