# --- Корректировки прибыли в отчёте о движении денежных средств ----------------
#
# Косвенный метод начинается с прибыли и приводит её к денежному потоку:
# неденежные расходы возвращаются, доходы и расходы, отнесённые к другим
# разделам, снимаются. **Это статьи, а не служебные строки.** Амортизация
# в ОДДС у Сегежи — 5 971 млн, и она идёт в EBITDA напрямую; объявить такие
# строки не статьями значило бы потерять слагаемое показателя.
#
# **Величина корректировки и величина той же статьи в отчёте о прибыли
# или убытке — разные числа с разным смыслом.** У Сегежи процентные расходы
# ОПУ и корректировка ОДДС совпадают по модулю и различаются знаком,
# у ЛСР корректировка нетто (44 184) не равна финансовым расходам (47 968),
# у Автодора процентный расход ОПУ 414 против корректировки 374. Один код
# на них воспроизвёл бы затирание, ради устранения которого заведено правило
# `sources/ifrs_claims.py`. Отсюда префикс `cf_adj_`: код принадлежит форме,
# и одноимённая строка ОПУ на него не претендует.
#
# Амортизация своей корректировки не получает: `ifrs.depreciation` объявлена
# в этой же форме и этом же разделе и уже **является** корректировкой ОДДС.
# Второй код для неё был бы ровно тем двойником, против которого правило.

  - code: ifrs.cf_starting_profit
    name: Прибыль, с которой начинается косвенный метод
    form: ifrs.statement_of_cash_flows
