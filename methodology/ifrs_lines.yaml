      - {name: Накопленный убыток, seen_at: Сегежа}
      - {name: Нераспределённая прибыль (непокрытый убыток), seen_at: ЛСР}

  - code: ifrs.other_reserves
    name: Накопленный прочий совокупный доход
    form: ifrs.statement_of_financial_position
