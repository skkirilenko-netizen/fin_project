# Приёмка части первой: когда экспертная проверка списка считается пройденной.
# Согласовано владельцем 13.10.2026.
#
# **Это не порог маршрута.** Корзин эти числа не меняют и об эмитенте ничего
# не говорят: они отвечают, пройдена ли экспертная проверка — материал
# критерия выхода «экспертиза» (`ROADMAP.md`, «Критерий выхода — „эмитенты
# закрыты“»: «экспертная проверка не находит критичных дефектов два раза
# подряд»). Читают их пакет проверки (`eval/expert_review_run.py`, лист
# «Инструкция») и итог критериев (`eval/exit_criteria.py`) — одним местом,
# чтобы инструкция эксперту и разбор его ответа не разошлись.
version: "0.1.0"
status: approved
expert_review:
  # **«Лишних» в «Разборе» — не больше десятой части листа.** «Лишний» —
  # эмитент, которому по знанию эксперта разбор не нужен. Доля, а не число:
  # «Разбор» за год менялся от 90 до 190 строк.
  extra_share_max: "0.10"
  # Критичный дефект — по списку человек пропустил бы эмитента с проблемой
  # (известное кредитное событие в «Без внимания» или «Выборке») либо ошибка
  # данных меняет корзину. Ни одного.
  critical_max: 0
  # Пройденных проверок подряд для критерия выхода — слово дорожной карты.
  consecutive: 2
  # **Счёт — с первого пакета, отправленного коллегам: маршрут 15.10.2026.**
  # Прежние проверки (22.09, 23.09, 30.09) шли по другому пакету и без графы
  # «лишний» и отметки о просмотре «Без внимания»; в счёт «два раза подряд»
  # они не идут.
  counted_from: "2026-10-15"
  origin: >-
    Решения владельца 12.10.2026: критерий проверки — нет критичных дефектов,
    «лишних» в «Разборе» не больше 10 %, «Разбор» и «Выборка» размечены
    целиком, «Без внимания» просмотрен целиком; порог — в методике диффом;
    счёт двух проверок подряд — с пакета 13.10.2026, прежние не засчитываются.
    Согласовано 13.10.2026; counted_from — дата маршрута пакета, а не дата
    ответа эксперта: эксперт оценивает маршрут на эту дату. Решение владельца
    14.10.2026: счёт — с первого пакета, отправленного коллегам, — маршрута
    15.10.2026 (было 13.10.2026: пакет за эту дату коллегам не ушёл).
