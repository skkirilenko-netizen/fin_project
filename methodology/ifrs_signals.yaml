# Надзорные сигналы ветки МСФО.
#
# **Параллельный справочник, а не продолжение справочника РСБУ** — по той же
# причине, по какой параллельны справочники статей и показателей: величины
# опознаются кодами позиций `ifrs.*`, отсечки привязаны к валюте баланса,
# а не к выручке, и состав признаков свой. Арифметика при этом одна
# (`scoring/signals.py`): расходиться должны входы, а не правило.
#
# **Перенесено не всё, и непереносимое объявлено вместе с причиной.** Признак,
# который на консолидированной отчётности не срабатывает никогда, хуже
# отсутствующего: ноль срабатываний неотличим от невыполненного контроля.
#
# **Отсечка капитальных признаков — 5 % валюты баланса**, порог существенности
# ветки. Выручка базой здесь не годится: у группы с консолидированной
# отчётностью движение капитала соотносится с размером баланса, а не с оборотом,
# и у холдинга без выручки отсечка от выручки не определена вовсе.

version: "0.2.0"

# Величины, подставляемые в формулировки помимо самой величины сигнала:
# имя слота → код позиции. Справочник у ветки свой, и код прибыли здесь
# свой: прежде он был зашит в коде подстановки кодом строки РСБУ.
#
# **После слота единицы точка не ставится.** Наименование единицы кончается
# точкой («млн руб.»), и предложение, оборванное сразу за слотом, даёт две
# точки подряд: «выплачено 87 333 млн руб.. Стоп-фактор…».
slots:
  profit: ifrs.profit_for_period

signals:

  - code: equity_withdrawal
    name: Выплаты акционерам сверх заработанного
    level: supervisory
    # **Признак не о выплате, а об изъятии сверх заработанного.** Выплата,
    # умещающаяся в финансовый результат периода, — обычная дивидендная
    # политика: у ФосАгро 46 620 при прибыли 114 243, и надзорным признаком
    # это не является. Суть признака РСБУ была в другом: у ПК «Стройсервис»
    # капитал упал при прибыли, то есть изъято больше, чем заработано.
    #
    # Величина — превышение выплат над результатом периода. При убытке
    # превышение равно выплатам плюс убыток, поэтому любая выплата при убытке
    # признак даёт: заработанного не было вовсе.
    #
    # **В МСФО изъятие наблюдается прямо, а не выводится остатком.** В РСБУ
    # признак строился на расхождении прироста капитала с прибылью, потому
    # что другого следа у выплаты не было. Здесь выплата стоит отдельной
    # строкой отчёта о движении денежных средств.
    expression: "-ifrs.dividends_paid - ifrs.profit_for_period"
    condition: gt
    # Отсечка привязана к финансовому результату, а не к валюте баланса:
    # предмет признака — отношение выплаты к заработанному.
    threshold_of: ifrs.profit_for_period
    threshold: "0.10"
    display_scale: 0
    as_absolute: true
    origin: >-
      Отсечка 10 % финансового результата: превышение меньше этого объясняется
      расхождением дат объявления и выплаты дивидендов, когда выплачивается
      прибыль прошлого года. Величина экспертная, перенесена с отсечки
      расхождения РСБУ. Проверено: у ФосАгро выплаты 46 620 при прибыли
      114 243 признака не дают, и это верно — дивидендная политика
      надзорным обстоятельством не является.
      Два случая признак не ловит и оба объявлены: при нулевом финансовом
      результате отсечка не определена, и признак не срабатывает; выкуп
      собственных акций в него не входит — отдельной позиции отчёта
      о движении денежных средств для него в справочнике нет, и выдумывать
      написание строки, которой мы не видели, мы не будем.
    calibration_status: "preliminary, откалибровано по 2 эмитентам ветки,
      подлежит пересмотру на наборе задачи 29"
    text: >-
      Выплаты акционерам превышают финансовый результат периода на {value}
      {unit} при результате {profit} {unit}: распределено больше, чем
      заработано. Требуется установление источника выплаты и сопоставление
      с решениями о распределении прибыли.

  - code: equity_withdrawal_under_stop_factor
    name: Выплаты акционерам при сработавшем стоп-факторе
    level: supervisory
    # **Условие здесь не о величинах, а об исходе оценки**, и формулой его
    # не выразить: выплата правомерна сама по себе, но выплата при состоянии,
    # из-за которого класс ограничен, — обстоятельство независимо от размера.
    expression: "-ifrs.dividends_paid"
    condition: gt
    threshold: "0"
    requires_stop_factor: true
    display_scale: 0
    as_absolute: true
    origin: >-
      Отсечка нулевая намеренно и объявлена: предмет признака — сам факт
      выплаты при состоянии, ограничившем класс, а не её размер. Нулевая
      отсечка в прочих случаях запрещена, потому что срабатывает на любой
      строке; здесь именно это и требуется, а сработавший стоп-фактор
      условие ограничивает.
    calibration_status: "preliminary, на наблюдениях ветки не срабатывал:
      у обоих эмитентов со стоп-факторами строки выплат нет"
    text: >-
      Выплаты акционерам произведены при обстоятельстве, ограничившем класс
      финансового состояния: выплачено {value} {unit} — требуется установление
      того, чем выплата обеспечена и каким решением произведена. Стоп-фактор,
      ограничивший класс, назван в этом же разделе.

  - code: equity_contribution
    name: Докапитализация акционерами
    # **Уровень «требует внимания», а не надзорный, и это содержательно.**
    # Смысл признака — поддержка акционера: для вывода о состоянии это скорее
    # обстоятельство в пользу организации, и надзорных мер оно не требует.
    # Внимания требует направление: докапитализация бывает и покрытием убытка,
    # и вложением в развитие, и различает их не сама величина.
    level: attention
    # **Считается по балансу, а не по потоку.** У Сегежи по отчёту о движении
    # денежных средств поступление от выпуска акций 51 012, а по балансу
    # эмиссионный доход вырос на 81 057: разница — неденежная часть, скорее
    # всего зачёт требований, и терять её нельзя. Баланс показывает прирост
    # целиком, поток — только денежную его часть.
    expression: >-
      (ifrs.share_capital + ifrs.share_premium)
      - (prev(ifrs.share_capital) + prev(ifrs.share_premium))
    condition: gt
    threshold_of: ifrs.total_assets
    threshold: "0.05"
    display_scale: 0
    origin: >-
      Зеркальная отсечка к выплатам, та же величина и то же основание: 5 %
      валюты баланса — порог существенности ветки. Проверено на комплекте
      ПАО «Сегежа Групп» за 2025 год: прирост 81 057 млн при валюте баланса
      141 745 млн — 57 %.
    calibration_status: "preliminary, откалибровано по 2 эмитентам ветки,
      подлежит пересмотру на наборе задачи 29"
    # Наименование единицы кончается точкой («млн руб.»), поэтому после слота
    # точки не ставится: «на 87 333 млн руб.. Такой прирост» — две точки подряд.
    text: >-
      Акционеры докапитализировали организацию: уставный капитал и эмиссионный
      доход за период выросли на {value} {unit} при финансовом результате
      {profit} {unit} — поддержка акционера есть обстоятельство в пользу
      организации, и внимания требует её направление: покрытие накопленного
      убытка, замещение заёмного финансирования либо вложение в развитие.
      Требуется установление источника и назначения: денежная часть видна
      в отчёте о движении денежных средств, зачёт требований — только
      в примечаниях.

  - code: equity_movement_unexplained
    name: Необъяснённое движение собственного капитала
    level: supervisory
    # **Сверка, а не третий способ измерить то же.** Движение капитала
    # за период объясняется совокупным доходом, вложениями акционеров
    # и выплатами им. Что не объяснилось этими тремя — остаток, и он же
    # признак: у ПК «Стройсервис» по РСБУ ровно таким остатком оказалось
    # изъятие 42 000 тыс. руб., которого в заключении не было вовсе.
    # Выплаты стоят со своим знаком (отток отрицателен), поэтому вычитаются.
    expression: >-
      (ifrs.total_equity - prev(ifrs.total_equity))
      - ifrs.total_comprehensive_income
      - ((ifrs.share_capital + ifrs.share_premium)
         - (prev(ifrs.share_capital) + prev(ifrs.share_premium)))
      - ifrs.dividends_paid
    condition: gte
    # Сравнивается модуль: важна и недостача, и излишек — необъяснённый
    # прирост капитала такой же признак, как необъяснённое его уменьшение.
    compare_absolute: true
    threshold_of: ifrs.total_assets
    threshold: "0.05"
    display_scale: 0
    as_absolute: true
    origin: >-
      Та же отсечка 5 % валюты баланса: остаток ниже порога существенности
      объясняется округлением, переклассификацией и движением
      неконтролирующих долей. Сверка тождества IAS 1.106 — изменение капитала
      раскладывается на совокупный доход и операции с собственниками.
    calibration_status: "preliminary, отсечка перенесена с признаков движения
      капитала, на наблюдениях ветки не проверена"
    text: >-
      Движение собственного капитала за период не объясняется совокупным
      доходом и операциями с акционерами: необъяснённый остаток составляет
      {value} {unit} — требуется сверка с отчётом об изменениях капитала
      и выяснение природы операции.

  - code: debt_shift_to_short_term
    name: Смещение долга в краткосрочный
    level: attention
    # **Мерится смещение, а не уровень.** Доля краткосрочного долга сама
    # по себе — свойство долговой политики: у ФосАгро она 63,8 % при классе B.
    # Признак же о другом — о том, что срочность долга изменилась за период,
    # и погашения приблизились, даже когда сам долг не вырос.
    expression: >-
      ifrs.short_term_borrowings
      / (ifrs.short_term_borrowings + ifrs.long_term_borrowings)
      - prev(ifrs.short_term_borrowings)
      / (prev(ifrs.short_term_borrowings) + prev(ifrs.long_term_borrowings))
    condition: gte
    threshold: "0.20"
    # Доля приходит долей единицы: числовых литералов в формулах нет, и умножить
    # на сто выражение не может. Печатается величина процентными пунктами —
    # той же мерой, что структурный сдвиг.
    as_percentage_points: true
    display_scale: 1
    origin: >-
      Отсечка та же, что у структурного сдвига, — 20 процентных пунктов:
      она уже откалибрована и мерит то же самое, перераспределение за год
      сопоставимой доли. Кандидат замечен при чтении заключения по ФосАгро:
      долговая нагрузка умеренная, а долг смещён в краткосрочный, и класс C
      получался не из-за размера долга, а из-за срочности. Проверено:
      у ФосАгро смещение около 15 п. п., и признака оно не даёт.
    calibration_status: "preliminary, отсечка перенесена со структурного сдвига,
      на наблюдениях ветки не проверена"
    text: >-
      Доля краткосрочных заёмных средств в совокупном долге за период выросла
      на {value} п. п. Смещение долга в краткосрочный приближает погашения
      и требует сопоставления с графиком погашений и с доступными лимитами
      финансирования.

# Структурный сдвиг баланса: изменение доли укрупнённой статьи. Правило то же,
# что в РСБУ, и отсечка та же — 20 процентных пунктов; различаются только коды
# статей, потому что справочники разные.
structure_shift:
  name: Структурный сдвиг баланса
  level: attention
  threshold_points: "20"
  condition: gte
  compare_absolute: true
  display_scale: 1
  as_absolute: true
  base: ifrs.total_assets
  # Рядом с кодом — то, как статью называет формулировка. Здесь она совпадает
  # с наименованием позиции: в консолидированном балансе итог раздела и назван
  # по смыслу, а не «Итого по разделу I».
  lines:
    ifrs.total_non_current_assets: Внеоборотные активы
    ifrs.total_current_assets: Оборотные активы
    ifrs.total_equity: Собственный капитал
    ifrs.total_non_current_liabilities: Долгосрочные обязательства
    ifrs.total_current_liabilities: Краткосрочные обязательства
  origin: >-
    Отсечка перенесена из справочника РСБУ вместе с основанием: перераспределение
    пятой части баланса за год — событие, а не колебание. На отчётности
    по МСФО она не проверялась и подлежит пересмотру на наборе задачи 29.
  calibration_status: "preliminary, отсечка перенесена из РСБУ,
    на наблюдениях ветки не проверена"
  text: >-
    Доля статьи «{line}» в валюте баланса за период изменилась с {before}
    до {after}, изменение — {value} п. п. Структурный сдвиг такого размера
    требует объяснения: он означает смену характера деятельности либо разовую
    операцию, сопоставимую с размером баланса.

# Интенсивность пересмотра сравнительных данных.
revision_intensity:
  name: Интенсивный пересмотр сравнительных данных
  level: attention
  condition: gt
  display_scale: 1
  active: false
  inactive_reason: >-
    Отсечки нет, и назначить её не на чем. Комплектов МСФО у эмитента один-два,
    а расхождений между отчётной и сравнительной колонками на паре комплектов
    89: отсечка, подобранная по такому знаменателю, мерила бы размер нашего
    набора, а не отчётность эмитента. Признак объявлен и ждёт набора задачи 29.
  origin: >-
    Перенесён из справочника РСБУ, где отсечка 5 расхождений на комплект
    подобрана по трём организациям. Здесь знаменатель другой по устройству:
    в РСБУ комплектов у организации бывает восемь, в МСФО — один-два.
  calibration_status: "preliminary, наблюдений для отсечки нет"
  text: >-
    Сравнительные данные пересматривались интенсивно: расхождений между
    отчётными и сравнительными значениями {mismatches}, комплектов отчётности
    {sets}. Пересмотр сам по себе правомерен, но его интенсивность снижает
    сопоставимость периодов и требует объяснения причин переклассификации.

# **Признаки РСБУ, которые в ветку не переносятся, — с причиной у каждого.**
# Молчание о них читалось бы как «перенесены все»: перечень признаков ветки
# сравнивают с перечнем РСБУ, и отсутствующий признак без причины неотличим
# от забытого.
not_transferred:
  - code: transit_structure
    name: Признаки транзитной структуры
    reason: >-
      Отношение выручки к валюте баланса выше двадцати у консолидированной
      группы недостижимо: активы группы включают активы всех дочерних
      организаций, а оборот считается по группе целиком. Признак, который
      не срабатывает никогда, неотличим от невыполненного контроля,
      и заводить его значило бы держать в справочнике мёртвую строку.
  - code: extreme_margin
    name: Чрезвычайно высокая чистая рентабельность
    reason: >-
      Перенос отложен. Чистая прибыль по МСФО включает долю в результате
      ассоциированных организаций, переоценку и курсовые разницы: у холдинга
      рентабельность выше половины выручки — норма, а не признак. Признак
      осмыслен по операционной марже, и отсечку для неё назначать не на чем,
      пока в наборе нет наблюдений.
