# Правила состава документа: что обязано в нём быть и в каком виде.
#
# Экспертная оценка трёх пилотных заключений показала, что состав разделов
# нельзя оставлять на усмотрение модели. По ПАО «Газпром» раздел «Фактическая
# база» не содержал совокупного долга, чистого долга, чистого оборотного
# капитала и выручки — величин, на которых построены последующие разделы, —
# зато содержал сведения о нераскрытии одной строки баланса. Вопросы
# к организации были адресованы строкам, которых упрощённая форма
# не предусматривает, повторяли друг друга и не ранжировались.
#
# Поэтому состав обязательных величин, правила вопросов и перечень предложений
# по дальнейшим действиям заданы здесь. Формулировки предписаны и берутся
# дословно: модель их не изобретает.
#
# Числовые пороги объявляются с полем origin, как калибровочные точки
# в scoring.yaml и отсечки сигналов в signals.yaml.

# 1.3.0 — вводная фраза «Фактической базы» переписана: строки отчётности
# называются с кодами, показатели — наименованием. Версия поднята потому,
# что текст печатается в документе: два прогона с разной формулировкой
# не должны выглядеть одинаково версионированными.
version: "1.3.0"

# Раздел «Риски и надзорные сигналы» ------------------------------------------
#
# Раздел собирается расчётом целиком, как разделы «Ключевой вывод»
# и «Предложения по дальнейшим действиям». Прежде его писала модель поверх
# детерминированного перечня сигналов, и замер 17.09.2026 показал, чем это
# кончается: по ООО «Магнит» весь раздел свёлся к фразе «Надзорный сигнал имеет
# величину 20,8», по ПК «Стройсервис» — к четырём однотипным строкам с кодами,
# от которых после снятия разметки остаются голые числа.
#
# Всё, что нужно разделу, уже посчитано: формулировки сигналов предписаны,
# величины и отсечки набраны при оценке, стоп-фактор и его последствие
# объявлены в scoring.yaml. Модели здесь нечего добавить.
risks:
  intro: >-
    Выявлены обстоятельства, требующие внимания. Формулировки заданы методикой
    и получены расчётом, а не оценочным суждением:
  # Отсутствие срабатываний — не то же, что отсутствие рисков, и молчать
  # об этой разнице нельзя: пустой раздел читается как заключение о
  # благополучии, которого расчёт не делал.
  none_found: >-
    Обстоятельств, отнесённых методикой к надзорным сигналам, расчётом
    не выявлено. Это означает отсутствие срабатываний по заданным признакам,
    а не отсутствие рисков: перечень признаков ограничен методикой
    и построен на годовой {statements_genitive}.
  # Стоп-фактор — то же обстоятельство, что названо в «Ключевом выводе»,
  # но там он объясняет класс, а здесь входит в картину рисков. Формулировка
  # берётся из scoring.yaml и здесь не дублируется.
  stop_factor_intro: >-
    Оценка ограничена стоп-фактором, установленным методикой:
  # Сработать может несколько, и называются все: у Сегежи их три —
  # неопределённость непрерывности деятельности, отрицательный оборотный
  # капитал и покрытие процентов ниже единицы, — а раздел называл один.
  # Согласование со числом — часть формулировки, а не задача кода.
  stop_factors_intro: >-
    Оценка ограничена стоп-факторами, установленными методикой:
  # **Ограничение слабее присвоенного класса не утверждается действующим.**
  # У Сегежи класс E, а формулировка отрицательного оборотного капитала
  # обещает ограничение средним: обстоятельство в силе, а ограничения,
  # о котором оно говорит, класс уже не требует.
  cap_not_binding: >-
    Ограничение класса, которое устанавливает этот стоп-фактор, слабее
    присвоенного класса и его не меняет: обстоятельство остаётся в силе,
    а класс определён другим основанием.
  # В картине рисков стоп-факторов несколько, и оговорка приводится один раз
  # с перечнем: повторённая при каждом, она занимала больше места, чем сами
  # формулировки. Согласование со числом — часть формулировки.
  cap_not_binding_named: >-
    Ограничение класса, которое устанавливает стоп-фактор {names}, слабее
    присвоенного класса и его не меняет: обстоятельство остаётся в силе,
    а класс определён другим основанием.
  caps_not_binding_named: >-
    Ограничения класса, которые устанавливают стоп-факторы {names}, слабее
    присвоенного класса и его не меняют: обстоятельства остаются в силе,
    а класс определён другим основанием.

# Актуальность данных ---------------------------------------------------------
#
# По двум организациям из трёх отчётность составлена на 31.12.2024, а документ
# формируется в сентябре 2026: разрыв двадцать месяцев, и в документе он никак
# не отмечен. Читатель вправе считать, что видит нынешнее состояние, тогда как
# оценка описывает состояние на отчётную дату.
freshness:
  max_months: 15
  origin: >-
    Отсечка выбрана экспертно от срока сдачи годовой отчётности: комплект
    за истекший год сдаётся до конца марта следующего, поэтому до пятнадцати
    месяцев разрыва означают, что более свежей годовой отчётности попросту
    не существует. Разрыв больше означает другое: свежая отчётность либо
    не сдана, либо не получена, и это обстоятельство для читателя
    существенно. Подлежит уточнению на регрессионном наборе задачи 17.
  # Подстановка {months} — разрыв в месяцах, он же приведён в шапке документа.
  statement: >-
    Отчётность, положенная в основу документа, составлена на отчётную дату,
    указанную в шапке; с этой даты до дня формирования документа прошло
    {months} месяцев. Выводы характеризуют состояние организации на отчётную
    дату, а не на день чтения: за истекшее время могли произойти события,
    годовой отчётностью не отражённые.

# Обязательный состав раздела «Фактическая база» ------------------------------
#
# Величины, на которых построены последующие разделы, обязаны быть названы
# в фактической базе независимо от того, что модель сочтёт заслуживающим
# упоминания. Прочее попадает туда по машинному признаку: участие
# в стоп-факторе, во флаге или вхождение в число наибольших изменений.
# **Состав объявлен по стандартам, а не один на оба.** Строка РСБУ называется
# кодом, утверждённым приказом; в консолидированной отчётности таких кодов нет,
# и статья называется позицией унифицированной модели. Перечень РСБУ, применённый
# к фактам МСФО, нашёл бы ноль величин и отбросил их все как отсутствующие —
# то есть проверка состава прошла бы, не проверив ничего.
fact_base:
  rsbu:
    lines:
      - "1600"   # валюта баланса
      - "1300"   # собственный капитал
      - "2110"   # выручка
      - "2400"   # финансовый результат
    metrics:
      - debt_total   # совокупный долг
      - net_debt     # чистый долг
      - nwc          # чистый оборотный капитал
    # Сколько наибольших изменений за период добавляется сверх обязательных.
    top_changes: 5
    origin: >-
      Перечень задан содержанием последующих разделов: интерпретация, риски
      и вопросы строятся на размере организации, собственном капитале, обороте,
      финансовом результате, долговой нагрузке и оборотном капитале. Число
      наибольших изменений выбрано экспертно: пяти достаточно, чтобы описать
      динамику, и мало, чтобы заслонить обязательные величины. Подлежит
      уточнению на регрессионном наборе задачи 17.
  ifrs:
    lines:
      - ifrs.total_assets              # валюта баланса
      - ifrs.total_equity              # собственный капитал
      - ifrs.revenue                   # выручка
      - ifrs.profit_for_period         # финансовый результат
      - ifrs.cash                      # денежные средства
      # Начисленные проценты по заёмным средствам берутся из примечания,
      # и раздел называет примечание вместе со строкой. **Без этого покрытие
      # процентов не совпадает ни с одной строкой отчёта о прибыли или убытке,
      # и читатель не понимает почему**: у Автодора в форме 414, а начислено
      # 54 382; у Норникеля строка формы объявлена очищенной
      # от капитализированных процентов.
      - ifrs.interest_expense_accrued
      # **Покрытие процентов обязано воспроизводиться по фактической базе.**
      # В разделе стояли проценты 21 694, а в интерпретации — покрытие 4,378:
      # ни числителя, ни второго слагаемого знаменателя читатель не видел
      # и проверить отношение не мог. Операционная прибыль — числитель,
      # капитализированные проценты — вторая часть знаменателя.
      - ifrs.operating_profit
      - ifrs.interest_capitalised
    metrics:
      - debt_total     # совокупный долг — знаменатель FFO / Долг
      - ebitda         # знаменатель Чистый долг / EBITDA
      - net_debt       # чистый долг
    # Наибольшие изменения приводятся: сравнительная колонка загружена фактами,
    # показатели считаются по обоим периодам, а изменения — по правилу методики
    # показателей МСФО (`scoring.dynamics_use: reference_only`): они идут
    # читателю и в балл не входят. Пять — то же число, что у РСБУ: столько
    # описывает динамику и не заслоняет обязательные величины.
    top_changes: 5
    origin: >-
      Перечень переносит правило РСБУ на состав статей МСФО: размер
      организации, собственный капитал, оборот, финансовый результат,
      денежные средства и долговая нагрузка. Чистого оборотного капитала
      в методике МСФО нет вовсе, поэтому его в перечне нет; вместо него
      названы знаменатели отношений — совокупный долг и EBITDA, — которые
      ни одной строкой отчётности не стоят и собираются расчётом.

# Вопросы к организации -------------------------------------------------------
#
# Вопрос о том, почему не раскрыта строка, содержательного ответа не имеет:
# упрощённая форма её не предусматривает, а в полной нераскрытие само по себе
# правомерно. Спрашивать нужно по существу обстоятельства, а не о форме.
questions:
  min_count: 3
  max_count: 5
  # Порядок оснований: сначала то, с чем связан наибольший риск. Вопросы
  # ранжируются по этому порядку, а не по тому, в каком порядке основания
  # пришли из расчёта.
  subject_order:
    - supervisory_signal   # надзорный сигнал
    - going_concern_plans  # планы руководства при объявленной неопределённости
    - stop_factor          # сработавший стоп-фактор
    - flag_conflict        # столкновение флага и стоп-фактора
    - attention_signal     # сигнал, требующий внимания
    - quarantined_set      # комплект, отбракованный контролями
    - missing_metric       # показатель, не рассчитанный из-за нехватки данных
  origin: >-
    Ограничение тремя–пятью вопросами выбрано экспертно: три — нижняя граница,
    при которой перечень остаётся содержательным, пять — верхняя, за которой
    вопросы перестают читать. Порядок оснований задан тяжестью последствий:
    надзорный сигнал старше стоп-фактора, стоп-фактор старше обстоятельства,
    требующего внимания. Подлежит уточнению на регрессионном наборе задачи 17.
  # Формулировки вопросов предписаны, а не сочиняются моделью. Проверка
  # 17.09.2026 показала, чем кончалось сочинение: из пяти вопросов по ООО
  # «Магнит» три были вида «какие строки отсутствуют в расчёте», то есть ровно
  # запрещённые вопросы о нераскрытии, а по ПК «Стройсервис» модель ввела
  # порог «90 % выручки», которого методика не содержит, и посчитала разность
  # величин двух периодов.
  #
  # Вопрос задаётся по существу обстоятельства: за счёт чего получен
  # результат, чем обеспечено обязательство, кто сторона расчётов. Вопрос
  # о том, почему строка не раскрыта, содержательного ответа не имеет.
  texts:
    supervisory_signal: >-
      Чем объясняется обстоятельство, отнесённое методикой к надзорным
      сигналам, — «{name}»? Требуется пояснение по существу операций,
      приведших к нему, с приложением подтверждающих документов.
    # **Аудитор говорит, что планы раскрыты, а не что они исполнимы.** Раздел
    # о существенной неопределённости у Сегежи ссылается на примечание,
    # в котором руководство описывает меры, — и это единственное место
    # документа, где вопрос задаётся о будущем, а не о прошлом. Без него
    # заключение фиксирует сомнение аудитора и ничего у организации
    # не спрашивает.
    going_concern_plans: >-
      Какими мерами, в какие сроки и за счёт каких источников руководство
      предполагает устранить обстоятельства, которые аудитор назвал
      существенной неопределённостью в отношении непрерывности деятельности?
      Планы руководства раскрыты в {where}; требуется подтверждение их
      исполнимости — договорами, графиками погашения и решениями участников.
    stop_factor: >-
      За счёт каких источников организация предполагает восстановить
      положение, зафиксированное стоп-фактором «{name}»?
    flag_conflict: >-
      Каков состав расчётов со связанными сторонами в величинах {metrics}?
      Признак структуры группы и стоп-фактор опираются на одни и те же
      величины, и прочтение каждой из них требует подтверждения.
    attention_signal: >-
      Чем объясняется обстоятельство, требующее внимания, — «{name}»?
    quarantined_set: >-
      Чем объясняются расхождения в комплекте отчётности за {year} год,
      из-за которых он не прошёл контроли качества?
    missing_metric: >-
      Какими расшифровками организация может подтвердить положение, которое
      описывает показатель «{name}»? По данным сданной отчётности он
      не рассчитывается.
  # Где раскрыты планы руководства. Аудитор называет примечание сам — ссылка
  # структурна, как всякая ссылка на примечание в этом проекте, — и вопрос
  # называет то же примечание. Не назвал — вопрос говорит о примечаниях
  # вообще: выдумывать номер нельзя.
  plans_where:
    known: "примечании {note}"
    unknown: "примечаниях к отчётности"
  # Оснований может не оказаться вовсе, и тогда раздел не пустует: молчание
  # читалось бы как потерянный раздел.
  none_found: >-
    Обстоятельств, требующих запроса пояснений, расчётом не выявлено.

# Раздел «Фактическая база» ---------------------------------------------------
#
# Раздел собирается расчётом: состав его и без того задан методикой (блок
# fact_base выше), а величины приходят из расчёта с кодами. Модели оставалось
# переписать перечень, и она этого не делала — писала производные вместо
# величин («изменение за период строки 2120 — 1 832,1 %») и теряла
# обязательные позиции.
#
# Строка отчётности называется вместе с кодом: «(1600)» — привычная ссылка,
# по которой читатель находит величину в самой отчётности. Показатель —
# одним наименованием: `debt_total` и `nwc` внутренние идентификаторы
# методики, и тексту документа они чужие.
#
# Вступление разведено по стандарту отчётности. Кодов строк, утверждённых
# приказом, в консолидированной отчётности не существует: состав статей
# эмитент определяет сам, и у нас они опознаются позициями унифицированной
# модели. Обещать читателю коды строк там, где их нет, — сказать неправду
# о документе.
fact_base_section:
  intro:
    rsbu: >-
      Величины, на которых построены последующие разделы. Состав перечня задан
      методикой; строки бухгалтерской отчётности приведены с их кодами,
      показатели названы по наименованию.
    ifrs: >-
      Величины, на которых построены последующие разделы. Состав перечня задан
      методикой; статьи консолидированной отчётности приведены наименованиями
      позиций унифицированной модели, показатели названы по наименованию.
      Кодов строк, утверждённых нормативным актом, консолидированная
      отчётность не содержит.
  extra_intro: >-
    Сверх обязательных приводятся величины, участвующие в сработавшем
    стоп-факторе или во флаге и вошедшие в число наибольших изменений
    за период.

# Как называется отчётность, на которой построен расчёт ----------------------
#
# «Бухгалтерская отчётность» в заключении по МСФО — утверждение о другом
# предмете: консолидированная отчётность составляется по международным
# стандартам и бухгалтерской отчётностью юридического лица не является.
# Формулировка объявлена для каждого стандарта, иначе справочник не загрузится:
# молча напечатать чужую — то же, что обещать читателю коды строк там, где
# их нет.
#
# Падежи объявлены здесь же, а не выводятся кодом: словоформы — свойство
# языка, а не устройства программы.
statements_wording:
  rsbu:
    genitive: бухгалтерской отчётности
    accusative: бухгалтерскую отчётность
  ifrs:
    genitive: консолидированной финансовой отчётности по МСФО
    accusative: консолидированную финансовую отчётность по МСФО

# Заключение об одной организации не называет другую -------------------------
#
# Правило заведено 21.09.2026 против нашей же пометки: оговорки методики
# писались для нас и несли наблюдения по набору, а в документ шли дословно.
# В «Ограничениях анализа» по ФосАгро стояло «у ЛСР расхождение между двумя
# мерами оказалось наибольшим из наблюдавшихся» — сведение о другой
# организации, которое читатель проверить не может.
#
# Ищутся опознавательные слова организаций, известных базе. Родовые слова
# наименований объявлены здесь и признаком не считаются: «Группа» стоит
# в наименовании у четырёх эмитентов набора, и запрет на неё запретил бы
# писать о группе компаний вообще.
other_issuers:
  # Родовые слова и организационные формы: ни те ни другие не опознают
  # организацию. Перечень целиком здесь — свободных строк в коде нет.
  generic_words:
    - пао
    - оао
    - зао
    - ооо
    - ао
    - мкпао
    - гк
    - гмк
    - лк
    - ак
    - публичное
    - акционерное
    - общество
    - обществом
    - ограниченной
    - ответственностью
    - производственный
    - кооператив
    - международная
    - группа
    - групп
    - компания
    - компании
    - холдинг
    - холдинге
    - корпорация
    - концерн
    - банк
    - россии
  # Короткое слово опознавательным не бывает: «ВК» и «ОР» встречаются
  # в тексте как части слов и сокращений.
  min_word_length: 3
  origin: >-
    Перечень родовых слов — по наименованиям организаций базы на 21.09.2026:
    «Группа ЛСР», «Группа Черкизово», «Сегежа Групп», «СИБУР Холдинг»,
    «Почта России».

# Предложения по дальнейшим действиям -----------------------------------------
#
# Документ содержал вопросы, но не содержал вывода о том, что с организацией
# делать. Предложение — не оценочное суждение модели, а следствие машинных
# признаков: сработал надзорный сигнал, сработал стоп-фактор, класс не присвоен,
# комплект в карантине, данные устарели. Формулировки предписаны.
#
# Условия (when) — машинные признаки; предложение выводится, если выполнен
# хотя бы один. Признак always выводит предложение всегда.
actions:
  - code: monitoring
    name: Постановка на мониторинг
    when: [always]
    text: >-
      Поставить организацию на мониторинг: повторить расчёт по следующему
      годовому комплекту отчётности и сопоставить показатели с приведёнными
      здесь. Настоящая оценка описывает состояние на отчётную дату
      и обновляется только с поступлением новой отчётности.

  # Предложение ссылается на раздел словами, и раздел объявлен полем
  # `refers_to`: ссылка на пустой раздел — противоречие. У ФосАгро «Запрос
  # пояснений» отсылал к «Рискам и надзорным сигналам», где расчёт не выявил
  # ничего: обстоятельством был отбракованный комплект, а он описан
  # в «Ограничениях анализа», а не там.
  - code: request_explanations
    name: Запрос пояснений
    when: [supervisory_signal, attention_signal]
    refers_to: [4, 6]
    text: >-
      Запросить у организации пояснения по обстоятельствам, перечисленным
      в разделе «Риски и надзорные сигналы», вместе с расшифровками строк
      отчётности, на которых эти обстоятельства построены. Перечень вопросов
      приведён в разделе «Вопросы к организации».

  - code: request_set_clarification
    name: Уточнение отбракованной отчётности
    when: [quarantined_set, blocking_check_failed]
    refers_to: [5]
    text: >-
      Вернуться к комплектам отчётности, не прошедшим контроли качества:
      основания отбраковки перечислены в разделе «Ограничения анализа».
      Комплект в карантине в расчёт не входит, и до устранения причины часть
      периодов остаётся вне оценки.

  - code: request_interim
    name: Запрос более свежей отчётности
    when: [stale_data]
    text: >-
      Запросить промежуточную {statements_accusative} на ближайшую отчётную
      дату. Использованная отчётность отстоит от дня формирования документа
      настолько, что выводы относятся к отчётной дате и нынешнее состояние
      организации могут не описывать.

  - code: deep_analysis
    name: Углублённый анализ
    when: [stop_factor, no_class, flag_conflict]
    text: >-
      Провести углублённый анализ с привлечением сведений, которых в годовой
      отчётности нет: расшифровок дебиторской и кредиторской задолженности,
      условий заёмных договоров, состава финансовых вложений и связанных
      сторон. Настоящий расчёт опирается только на публичную
      {statements_accusative} и её пределами ограничен.

  - code: escalation
    name: Эскалация
    when: [supervisory_signal]
    text: >-
      Вынести материалы на рассмотрение ответственного лица в порядке,
      установленном для надзорных сигналов. Признаки, отнесённые методикой
      к надзорным, выявлены расчётом и требуют решения, а не только фиксации
      в документе.

# Базовое заключение по данным агрегатора (уровень 1) --------------------------
#
# Решение владельца 28.09.2026: заключения по МСФО строятся в три уровня,
# и первый — по нормализованным данным агрегатора для всех эмитентов «Разбора»
# с МСФО у Cbonds, **без класса** (вариант А). Класс по составу величин
# агрегатора был бы другим классом под тем же именем: покрытие процентов
# считается только по примечаниям (группа «Обслуживание долга», вес 30),
# эскроу девелопера у агрегатора нет, и из трёх стоп-факторов Сегежи по его
# данным считается один. Документ говорит об этом сам — в шапке, а не мелким
# шрифтом.
#
# **Доля совпавших подставляется из таблицы сверки, а не пишется числом**
# (решение владельца 29.09.2026): число, вписанное строкой, пережило бы
# перемер сверки. Места подстановки — {issuers}, {matched}, {compared};
# без записанной сверки сборка отказывается.
aggregator_conclusion:
  title: Базовое заключение по данным агрегатора (МСФО)
  source: >-
    Величины — нормализованная консолидированная отчётность по МСФО в обработке
    агрегатора Cbonds; документ эмитента не разбирался. Сверка агрегатора
    с разобранными документами на {issuers} эмитентах: в отчётной колонке
    совпадает {matched} величин из {compared}.
  no_class: >-
    Класс финансового состояния не присваивается: состав величин агрегатора
    иной, чем у заключения по документу, — покрытие процентов по примечаниям
    и эскроу у девелоперов в нём не раскрываются. Вместо класса приведён вывод
    маршрута мониторинга: нужен ли разбор человеком и по каким основаниям.
  sections:
    - {code: route, title: Вывод маршрута}
    - {code: values, title: Величины маршрута}
    - {code: trend, title: Скользящие двенадцать месяцев}
    - {code: refinancing, title: Рефинансирование}
    - {code: changes, title: Признаки изменения — справочно}
    - {code: limits, title: Ограничения}
  limitations:
    - >-
      Аудиторское заключение, примечания, ковенанты, залоги, поручительства
      и события после отчётной даты не рассматривались: их у агрегатора нет.
    - >-
      Промежуточная отчётность аудиту не подлежит; величины на промежуточную
      дату неаудированы.
    - >-
      Пороги маршрута предварительны; вывод маршрута — ответ на вопрос
      «нужен ли человек», а не оценка кредитоспособности.
  origin: >-
    Состав согласован владельцем 29.09.2026 с двумя правками: доля совпавших —
    из таблицы сверки, перенос строки в ограничениях. Код сборки —
    `report/aggregator.py`.

# Заключение уровня 2: уровень 1 плюс аудиторское заключение и долг
# по примечанию эмитента. Код сборки — `report/level2.py`; места подстановки
# названы у полей в `report/policy.py`.
level2_conclusion:
  title: Заключение уровня 2 по МСФО
  # Абзац уровня 1 об источнике («документ эмитента не разбирался») здесь
  # неверен: уровень 2 документ читал. Доля совпавших — та же, из сверки.
  source: >-
    Величины маршрута, тренд и рефинансирование — нормализованная
    консолидированная отчётность по МСФО в обработке агрегатора Cbonds.
    Сверка агрегатора с разобранными документами на {issuers} эмитентах:
    в отчётной колонке совпадает {matched} величин из {compared}.
  document: >-
    Аудиторское заключение и сроки погашения долга взяты из документа
    эмитента «{document}» на {date}; прочие разделы — по данным агрегатора,
    как в базовом заключении.
  sections:
    - {code: route, title: Вывод маршрута}
    - {code: values, title: Величины маршрута}
    - {code: trend, title: Скользящие двенадцать месяцев}
    - {code: refinancing, title: Рефинансирование}
    - {code: changes, title: Признаки изменения — справочно}
    - {code: audit, title: Заключение аудитора}
    - {code: debt, title: Долг по примечанию эмитента}
    - {code: covenants, title: Ограничительные условия (ковенанты)}
    - {code: pledges_guarantees, title: Залоги и поручительства}
    - {code: subsequent_events, title: События после отчётной даты}
    - {code: limits, title: Ограничения}
  quarantine: >-
    Комплект документа в карантине по основаниям: {reasons}. Заключение
    аудитора приведено, величины форм документа не используются.
  # Раскрытия приводятся цитатами эмитента: пересказывать их мы не вправе,
  # а суммы в абзацах — величины разного смысла под одним словом
  # (`ifrs_note_lines.yaml`, `disclosures`). Места подстановки: {note} —
  # номер и наименование примечания, {page} — страница, {text} — абзац.
  disclosures:
    quote: "Примечание {note}, стр. {page}: «{text}»"
    # Предел цитаты по видам (решение владельца 30.09.2026): ковенанты,
    # залоги, поручительства — 1 500 знаков; события после отчётной даты —
    # 4 000, потому что примечание приводится целиком и бывает на страницу
    # (у ЛСР — досрочное погашение 40 742 млн руб. и обесценение выбывшей
    # «дочки»). Длиннее — обрезка на границе предложения с отсылкой
    # к примечанию.
    quote_max_chars:
      covenants: 1500
      pledges: 1500
      guarantees: 1500
      subsequent_events: 4000
    cut: "(далее — в примечании {note})"
    covenants_found: >-
      Об ограничительных условиях эмитент пишет в примечании о долге:
    breach_markers: >-
      В тексте есть приметы нарушения ограничительных условий: {markers}.
      Нарушение устанавливает человек по самому примечанию; до его решения
      оно не утверждается и не отрицается.
    reclassification: >-
      В тексте есть примета переноса долгосрочного долга в краткосрочный
      (МСФО (IAS) 1.74): {markers}.
    no_breach_markers: >-
      Примет нарушения ограничительных условий в тексте примечания нет;
      это не утверждение о соблюдении — его делает только эмитент.
    pledges_found: "О залогах эмитент пишет:"
    guarantees_found: >-
      О поручительствах и финансовых гарантиях эмитент пишет (выданные
      или полученные — по тексту):
    events_found: "Эмитент раскрывает события после отчётной даты:"
    # {what} — предмет, {where} — перечень просмотренных примечаний.
    # Наименования предметов для {what}: раздел «Залоги и поручительства»
    # говорит о двух предметах, и у каждого исход свой.
    what:
      covenants: Ограничительные условия
      pledges: Залоги
      guarantees: Поручительства и финансовые гарантии
      subsequent_events: События после отчётной даты
    not_found: >-
      {what}: в примечаниях {where} абзацев нет. Это сведение о просмотренном,
      а не утверждение об отсутствии.
    note_not_found: >-
      {what}: примечания с таким наименованием в документе нет.
  debt:
    basis: >-
      Сроки погашения — недисконтированные договорные потоки из раздела
      о риске ликвидности (примечание {note}) на {date}, {unit}. Потоки
      включают будущие проценты и с балансом не сверяются.
    passed: >-
      Строки долга таблицы сверены по графе балансовой стоимости с займами
      ({against}): {value} против {reference} {unit} — сошлось.
    with_lease: >-
      Строки долга таблицы сверены по графе балансовой стоимости с займами
      ({against}): не сошлось с займами, сошлось с займами и обязательствами
      по аренде — таблица сроков включает аренду.
    loans_only: >-
      Займы таблицы сверены по графе балансовой стоимости с займами
      ({against}): {loans} против {reference} {unit} — сошлось. Долгоподобные
      обязательства ({names}) в займы опоры не входят и не сверены.
    # Тот же исход, когда долгоподобные сверены ниже по итогу примечания
    # (запасная опора при непрочитанном балансе). Формулировка владельца
    # 30.09.2026: прежняя «не сверены» читалась как противоречие следующему
    # абзацу, где сверка сошлась.
    loans_only_note_below: >-
      Займы таблицы сверены по графе балансовой стоимости с займами
      ({against}): {loans} против {reference} {unit} — сошлось. Долгоподобные
      обязательства ({names}) в займы агрегатора не входят; их сверка —
      по итогу примечания, ниже.
    failed: >-
      Сверка строк долга таблицы с займами ({against}) не сошлась: {value}
      против {reference} {unit}. Величины сроков не приводятся.
    no_carrying: >-
      Графы балансовой стоимости в таблице нет — сумма строк долга с займами
      ({against}) не сверена. Потоки приведены как напечатаны: они
      недисконтированные и с балансом не сверяются.
    no_reference: >-
      Займов у опоры сверки ({against}) нет — сверять не с чем. Величины
      сроков не приводятся.
    not_read: "Сроки погашения по документу не приводятся: {reason}."
    as_printed: >-
      Графа «{label}» пересекает границы корзин либо покрывает корзину
      не целиком и приведена как напечатана.
    unread_rows: "Строки таблицы, не прочитанные либо не опознанные: {names}."
    loans_label: Займы
    with_debt_like_label: "Займы и долгоподобные обязательства ({names})"
    debt_like_not_reconciled: >-
      Потоки по займам вместе с долгоподобными обязательствами ({names})
      не приводятся: сумма не сверена.
    # Запасная опора — итог примечания, когда баланс не прочитан (решение
    # владельца 30.09.2026, формулировка согласована им же).
    note_total_against: >-
      опора — итог примечания {note}; страница баланса без текстового слоя,
      комплект в карантине
  limitations:
    - >-
      Класс финансового состояния не присваивается, как и в базовом
      заключении: величины маршрута — данные агрегатора.
    - >-
      Из примечаний рассмотрены примечание о долге и раздел о риске
      ликвидности; ковенанты, залоги, поручительства и события после
      отчётной даты — только в примечаниях, названных в разделах выше.
      Прочие примечания не просматривались, связанные стороны как предмет
      не рассматривались.
    - >-
      Отчётная дата документа и отчётная дата величин агрегатора могут
      различаться; обе названы.
  origin: >-
    План уровня 2 согласован 29.09.2026; основа сроков, хранение графами
    как напечатаны, долгоподобные обязательства и печать без сверки
    при отсутствии графы балансовой — по решениям 30.09.2026. Дифф
    согласован владельцем 30.09.2026.
