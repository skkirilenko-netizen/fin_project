# Правила состава документа: что обязано в нём быть и в каком виде.
#
# Экспертная оценка трёх пилотных заключений показала, что состав разделов
# нельзя оставлять на усмотрение модели. По ПАО «Газпром» раздел «Фактическая
# база» не содержал совокупного долга, чистого долга, чистого оборотного
# капитала и выручки — величин, на которых построены последующие разделы, —
# зато содержал сведения о нераскрытии одной строки баланса. Вопросы
# к организации были адресованы строкам, которых упрощённая форма
# не предусматривает, повторяли друг друга и не ранжировались.
#
# Поэтому состав обязательных величин, правила вопросов и перечень предложений
# по дальнейшим действиям заданы здесь. Формулировки предписаны и берутся
# дословно: модель их не изобретает.
#
# Числовые пороги объявляются с полем origin, как калибровочные точки
# в scoring.yaml и отсечки сигналов в signals.yaml.

# 1.3.0 — вводная фраза «Фактической базы» переписана: строки отчётности
# называются с кодами, показатели — наименованием. Версия поднята потому,
# что текст печатается в документе: два прогона с разной формулировкой
# не должны выглядеть одинаково версионированными.
version: "1.3.0"

# Раздел «Риски и надзорные сигналы» ------------------------------------------
#
# Раздел собирается расчётом целиком, как разделы «Ключевой вывод»
# и «Предложения по дальнейшим действиям». Прежде его писала модель поверх
# детерминированного перечня сигналов, и замер 17.09.2026 показал, чем это
# кончается: по ООО «Магнит» весь раздел свёлся к фразе «Надзорный сигнал имеет
# величину 20,8», по ПК «Стройсервис» — к четырём однотипным строкам с кодами,
# от которых после снятия разметки остаются голые числа.
#
# Всё, что нужно разделу, уже посчитано: формулировки сигналов предписаны,
# величины и отсечки набраны при оценке, стоп-фактор и его последствие
# объявлены в scoring.yaml. Модели здесь нечего добавить.
risks:
  intro: >-
    Выявлены обстоятельства, требующие внимания. Формулировки заданы методикой
    и получены расчётом, а не оценочным суждением:
  # Отсутствие срабатываний — не то же, что отсутствие рисков, и молчать
  # об этой разнице нельзя: пустой раздел читается как заключение о
  # благополучии, которого расчёт не делал.
  none_found: >-
    Обстоятельств, отнесённых методикой к надзорным сигналам, расчётом
    не выявлено. Это означает отсутствие срабатываний по заданным признакам,
    а не отсутствие рисков: перечень признаков ограничен методикой
    и построен на годовой бухгалтерской отчётности.
  # Стоп-фактор — то же обстоятельство, что названо в «Ключевом выводе»,
  # но там он объясняет класс, а здесь входит в картину рисков. Формулировка
  # берётся из scoring.yaml и здесь не дублируется.
  stop_factor_intro: >-
    Оценка ограничена стоп-фактором, установленным методикой:

# Актуальность данных ---------------------------------------------------------
#
# По двум организациям из трёх отчётность составлена на 31.12.2024, а документ
# формируется в сентябре 2026: разрыв двадцать месяцев, и в документе он никак
# не отмечен. Читатель вправе считать, что видит нынешнее состояние, тогда как
# оценка описывает состояние на отчётную дату.
freshness:
  max_months: 15
  origin: >-
    Отсечка выбрана экспертно от срока сдачи годовой отчётности: комплект
    за истекший год сдаётся до конца марта следующего, поэтому до пятнадцати
    месяцев разрыва означают, что более свежей годовой отчётности попросту
    не существует. Разрыв больше означает другое: свежая отчётность либо
    не сдана, либо не получена, и это обстоятельство для читателя
    существенно. Подлежит уточнению на регрессионном наборе задачи 17.
  # Подстановка {months} — разрыв в месяцах, он же приведён в шапке документа.
  statement: >-
    Отчётность, положенная в основу документа, составлена на отчётную дату,
    указанную в шапке; с этой даты до дня формирования документа прошло
    {months} месяцев. Выводы характеризуют состояние организации на отчётную
    дату, а не на день чтения: за истекшее время могли произойти события,
    годовой отчётностью не отражённые.

# Обязательный состав раздела «Фактическая база» ------------------------------
#
# Величины, на которых построены последующие разделы, обязаны быть названы
# в фактической базе независимо от того, что модель сочтёт заслуживающим
# упоминания. Прочее попадает туда по машинному признаку: участие
# в стоп-факторе, во флаге или вхождение в число наибольших изменений.
# **Состав объявлен по стандартам, а не один на оба.** Строка РСБУ называется
# кодом, утверждённым приказом; в консолидированной отчётности таких кодов нет,
# и статья называется позицией унифицированной модели. Перечень РСБУ, применённый
# к фактам МСФО, нашёл бы ноль величин и отбросил их все как отсутствующие —
# то есть проверка состава прошла бы, не проверив ничего.
fact_base:
  rsbu:
    lines:
      - "1600"   # валюта баланса
      - "1300"   # собственный капитал
      - "2110"   # выручка
      - "2400"   # финансовый результат
    metrics:
      - debt_total   # совокупный долг
      - net_debt     # чистый долг
      - nwc          # чистый оборотный капитал
    # Сколько наибольших изменений за период добавляется сверх обязательных.
    top_changes: 5
    origin: >-
      Перечень задан содержанием последующих разделов: интерпретация, риски
      и вопросы строятся на размере организации, собственном капитале, обороте,
      финансовом результате, долговой нагрузке и оборотном капитале. Число
      наибольших изменений выбрано экспертно: пяти достаточно, чтобы описать
      динамику, и мало, чтобы заслонить обязательные величины. Подлежит
      уточнению на регрессионном наборе задачи 17.
  ifrs:
    lines:
      - ifrs.total_assets              # валюта баланса
      - ifrs.total_equity              # собственный капитал
      - ifrs.revenue                   # выручка
      - ifrs.profit_for_period         # финансовый результат
      - ifrs.cash                      # денежные средства
      # Начисленные проценты по заёмным средствам берутся из примечания,
      # и раздел называет примечание вместе со строкой. **Без этого покрытие
      # процентов не совпадает ни с одной строкой отчёта о прибыли или убытке,
      # и читатель не понимает почему**: у Автодора в форме 414, а начислено
      # 54 382; у Норникеля строка формы объявлена очищенной
      # от капитализированных процентов.
      - ifrs.interest_expense_accrued
    metrics:
      - debt_total     # совокупный долг — знаменатель FFO / Долг
      - ebitda         # знаменатель Чистый долг / EBITDA
      - net_debt       # чистый долг
    # Наибольшие изменения приводятся: сравнительная колонка загружена фактами,
    # показатели считаются по обоим периодам, а изменения — по правилу методики
    # показателей МСФО (`scoring.dynamics_use: reference_only`): они идут
    # читателю и в балл не входят. Пять — то же число, что у РСБУ: столько
    # описывает динамику и не заслоняет обязательные величины.
    top_changes: 5
    origin: >-
      Перечень переносит правило РСБУ на состав статей МСФО: размер
      организации, собственный капитал, оборот, финансовый результат,
      денежные средства и долговая нагрузка. Чистого оборотного капитала
      в методике МСФО нет вовсе, поэтому его в перечне нет; вместо него
      названы знаменатели отношений — совокупный долг и EBITDA, — которые
      ни одной строкой отчётности не стоят и собираются расчётом.

# Вопросы к организации -------------------------------------------------------
#
# Вопрос о том, почему не раскрыта строка, содержательного ответа не имеет:
# упрощённая форма её не предусматривает, а в полной нераскрытие само по себе
# правомерно. Спрашивать нужно по существу обстоятельства, а не о форме.
questions:
  min_count: 3
  max_count: 5
  # Порядок оснований: сначала то, с чем связан наибольший риск. Вопросы
  # ранжируются по этому порядку, а не по тому, в каком порядке основания
  # пришли из расчёта.
  subject_order:
    - supervisory_signal   # надзорный сигнал
    - stop_factor          # сработавший стоп-фактор
    - flag_conflict        # столкновение флага и стоп-фактора
    - attention_signal     # сигнал, требующий внимания
    - quarantined_set      # комплект, отбракованный контролями
    - missing_metric       # показатель, не рассчитанный из-за нехватки данных
  origin: >-
    Ограничение тремя–пятью вопросами выбрано экспертно: три — нижняя граница,
    при которой перечень остаётся содержательным, пять — верхняя, за которой
    вопросы перестают читать. Порядок оснований задан тяжестью последствий:
    надзорный сигнал старше стоп-фактора, стоп-фактор старше обстоятельства,
    требующего внимания. Подлежит уточнению на регрессионном наборе задачи 17.
  # Формулировки вопросов предписаны, а не сочиняются моделью. Проверка
  # 17.09.2026 показала, чем кончалось сочинение: из пяти вопросов по ООО
  # «Магнит» три были вида «какие строки отсутствуют в расчёте», то есть ровно
  # запрещённые вопросы о нераскрытии, а по ПК «Стройсервис» модель ввела
  # порог «90 % выручки», которого методика не содержит, и посчитала разность
  # величин двух периодов.
  #
  # Вопрос задаётся по существу обстоятельства: за счёт чего получен
  # результат, чем обеспечено обязательство, кто сторона расчётов. Вопрос
  # о том, почему строка не раскрыта, содержательного ответа не имеет.
  texts:
    supervisory_signal: >-
      Чем объясняется обстоятельство, отнесённое методикой к надзорным
      сигналам, — «{name}»? Требуется пояснение по существу операций,
      приведших к нему, с приложением подтверждающих документов.
    stop_factor: >-
      За счёт каких источников организация предполагает восстановить
      положение, зафиксированное стоп-фактором «{name}»?
    flag_conflict: >-
      Каков состав расчётов со связанными сторонами в величинах {metrics}?
      Признак структуры группы и стоп-фактор опираются на одни и те же
      величины, и прочтение каждой из них требует подтверждения.
    attention_signal: >-
      Чем объясняется обстоятельство, требующее внимания, — «{name}»?
    quarantined_set: >-
      Чем объясняются расхождения в комплекте отчётности за {year} год,
      из-за которых он не прошёл контроли качества?
    missing_metric: >-
      Какими расшифровками организация может подтвердить положение, которое
      описывает показатель «{name}»? По данным сданной отчётности он
      не рассчитывается.
  # Оснований может не оказаться вовсе, и тогда раздел не пустует: молчание
  # читалось бы как потерянный раздел.
  none_found: >-
    Обстоятельств, требующих запроса пояснений, расчётом не выявлено.

# Раздел «Фактическая база» ---------------------------------------------------
#
# Раздел собирается расчётом: состав его и без того задан методикой (блок
# fact_base выше), а величины приходят из расчёта с кодами. Модели оставалось
# переписать перечень, и она этого не делала — писала производные вместо
# величин («изменение за период строки 2120 — 1 832,1 %») и теряла
# обязательные позиции.
#
# Строка отчётности называется вместе с кодом: «(1600)» — привычная ссылка,
# по которой читатель находит величину в самой отчётности. Показатель —
# одним наименованием: `debt_total` и `nwc` внутренние идентификаторы
# методики, и тексту документа они чужие.
#
# Вступление разведено по стандарту отчётности. Кодов строк, утверждённых
# приказом, в консолидированной отчётности не существует: состав статей
# эмитент определяет сам, и у нас они опознаются позициями унифицированной
# модели. Обещать читателю коды строк там, где их нет, — сказать неправду
# о документе.
fact_base_section:
  intro:
    rsbu: >-
      Величины, на которых построены последующие разделы. Состав перечня задан
      методикой; строки бухгалтерской отчётности приведены с их кодами,
      показатели названы по наименованию.
    ifrs: >-
      Величины, на которых построены последующие разделы. Состав перечня задан
      методикой; статьи консолидированной отчётности приведены наименованиями
      позиций унифицированной модели, показатели названы по наименованию.
      Кодов строк, утверждённых нормативным актом, консолидированная
      отчётность не содержит.
  extra_intro: >-
    Сверх обязательных приводятся величины, участвующие в сработавшем
    стоп-факторе или во флаге и вошедшие в число наибольших изменений
    за период.

# Предложения по дальнейшим действиям -----------------------------------------
#
# Документ содержал вопросы, но не содержал вывода о том, что с организацией
# делать. Предложение — не оценочное суждение модели, а следствие машинных
# признаков: сработал надзорный сигнал, сработал стоп-фактор, класс не присвоен,
# комплект в карантине, данные устарели. Формулировки предписаны.
#
# Условия (when) — машинные признаки; предложение выводится, если выполнен
# хотя бы один. Признак always выводит предложение всегда.
actions:
  - code: monitoring
    name: Постановка на мониторинг
    when: [always]
    text: >-
      Поставить организацию на мониторинг: повторить расчёт по следующему
      годовому комплекту отчётности и сопоставить показатели с приведёнными
      здесь. Настоящая оценка описывает состояние на отчётную дату
      и обновляется только с поступлением новой отчётности.

  - code: request_explanations
    name: Запрос пояснений
    when: [supervisory_signal, attention_signal, quarantined_set, blocking_check_failed]
    text: >-
      Запросить у организации пояснения по обстоятельствам, перечисленным
      в разделе «Риски и надзорные сигналы», вместе с расшифровками строк
      отчётности, на которых эти обстоятельства построены. Перечень вопросов
      приведён в разделе «Вопросы к организации».

  - code: request_interim
    name: Запрос более свежей отчётности
    when: [stale_data]
    text: >-
      Запросить промежуточную бухгалтерскую отчётность на ближайшую отчётную
      дату. Использованная отчётность отстоит от дня формирования документа
      настолько, что выводы относятся к отчётной дате и нынешнее состояние
      организации могут не описывать.

  - code: deep_analysis
    name: Углублённый анализ
    when: [stop_factor, no_class, flag_conflict]
    text: >-
      Провести углублённый анализ с привлечением сведений, которых в годовой
      отчётности нет: расшифровок дебиторской и кредиторской задолженности,
      условий заёмных договоров, состава финансовых вложений и связанных
      сторон. Настоящий расчёт опирается только на публичную бухгалтерскую
      отчётность и её пределами ограничен.

  - code: escalation
    name: Эскалация
    when: [supervisory_signal]
    text: >-
      Вынести материалы на рассмотрение ответственного лица в порядке,
      установленном для надзорных сигналов. Признаки, отнесённые методикой
      к надзорным, выявлены расчётом и требуют решения, а не только фиксации
      в документе.
