# Доставка: технические параметры отбора запросов. **Не методика оценки.**
#
# Род — технический параметр (CLAUDE.md, «Методическое решение и технический
# параметр разбора»): к суждению об эмитенте отношения не имеет, ошибка здесь
# видна на первой же доставке — график, который надо было перезабрать, а он
# не перезабран, расходится с записью выпуска.

flows:
  # **Отбор графиков по существу** (задача владельца 01.10.2026). Запись
  # выпуска обновляется у источника по поводам, графика не касающимся:
  # долларовый объём, остаток в обращении, число сделок, код CFI. По одной
  # дате обновления (`updating_date ≥ дата`) прогон перезабирал график
  # и оферты у 142–181 выпуска в день. Перезабирается только тот, у кого
  # с прошлой доставки изменилось хоть одно поле этого перечня.
  #
  # Замер на сохранённых доставках 29.09–01.10.2026 (`eval/flows_substantive_run.py`):
  # из 181 / 142 / 172 обновлённых выпусков без существенных изменений
  # 134 / 81 / 92 — 268 / 162 / 184 запроса в день.
  substantive_fields:
    # Купон: условия, текущий купон и ставка — фиксация плавающего купона
    # видна здесь.
    - cupon_rus
    - curr_coupon_sum
    - curr_coupon_rate
    - emission_coupon_rate
    - cupon_period
    - floating_rate
    - margin
    - variable_rate_type_id
    # Номинал и его амортизация.
    - nominal_price
    - outstanding_nominal_price
    - initial_nominal_price
    - currency_id
    # Сроки: погашение, оферты, досрочное погашение, обращение.
    - maturity_date
    - offert_date
    - offert_date_call
    - offert_date_put
    - early_redemption_date
    - date_of_start_circulation
    - date_of_end_placing
    # Статус выпуска: дефолт и погашение меняют график.
    - status_id
