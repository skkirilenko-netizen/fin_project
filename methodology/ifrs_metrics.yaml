# Показатели по МСФО, их шкалы и правила расчёта (задача 27).
#
# **Состав подобран под маршрутизацию, а не под полноту.** Вопрос к каждому
# показателю один: меняет ли он решение «нужен ли человек». Проверка не
# умозрительная: у ЛСР не сработал ни один стоп-фактор, ликвидность
# не считается вовсе, а Чистый долг / EBITDA 5,5 при FFO / Долг 2 % —
# то есть без этих двух показателей он проходит незамеченным.
#
# **Рентабельность и оборачиваемость в балл не идут.** Они описывают
# деятельность, но решения не меняют: убыток Сегежи уже виден
# стоп-факторами, а высокая маржа ФосАгро ничего не отменяет. Их место —
# приложение.
#
# **Пороги — экспертная калибровка со ссылкой на подход рейтинговых
# методологий, а не их таблицы.** Копировать чужие границы и выдавать
# за свои мы не будем; формулировки «ниже норматива» запрещены здесь так же,
# как в РСБУ.

version: "0.3.0"

# --- Поправки состава показателя по типу эмитента (задача 26) -----------------
#
# **Поправка, которую нечем посчитать, даёт отказ, а не исходный показатель.**
# У ЛСР текущая ликвидность 4,15, но 310 977 запасов — незавершённое
# строительство, а 217 501 на счетах эскроу компании недоступны и стоят
# сноской под балансом, а не строкой. Пока величина эскроу не извлечена,
# поправленная ликвидность не считается — и **исходная тоже не приводится**:
# показатель, заведомо завышенный вчетверо, хуже отсутствующего.

adjustments:
  - metric: cur_liq
    name: Текущая ликвидность
    type: developer
    adjusted_name: Текущая ликвидность с поправкой на эскроу и запасы
    exclude_from_numerator:
      - code: ifrs.inventories
        reason: >-
          У девелопера запасы — незавершённое строительство: в деньги
          в пределах года они не обращаются.
      - code: ifrs.escrow_balance
        reason: >-
          Средства на счетах эскроу принадлежат дольщикам до передачи
          объекта и компании недоступны.
    requires:
      - ifrs.escrow_balance
    # Место, которое называет отказ. Оговорка целиком для этого не годится:
    # она объясняет последствие, а отказ обязан назвать, где величина лежит.
    where: средства на счетах эскроу раскрыты сноской под балансом, а не строкой формы
    on_missing: not_calculable
    reason_code: escrow_not_extracted
    limitation: >-
      Текущая ликвидность у девелопера, работающего по счетам эскроу,
      не рассчитана: средства на счетах эскроу раскрыты сноской, а не
      строкой отчётности, и исключить их из оборотных активов нечем.
      Показатель без этой поправки завышен и поэтому не приводится.
    origin: >-
      Разбор годовой отчётности ЛСР за 2025 год: текущая ликвидность 4,15,
      запасы 310 977 при валюте баланса 659 466, средства на счетах эскроу
      217 501 по сноске под отчётом о финансовом положении.

# --- Показатели ----------------------------------------------------------------

metrics:
  - code: net_debt_ebitda
    name: Чистый долг / EBITDA
    group: debt_burden
    unit: ratio
    direction: lower_better
    in_scoring: true
    numerator: net_debt
    denominator: ebitda
    denominator_must_be_positive: true
    note: >-
      Долг — только заёмные средства: обязательства по аренде, кредиторская
      задолженность и оценочные обязательства в него не входят.
    methodology_note: >-
      Состав долга тот же, что в наборе показателей по РСБУ. Сопоставление
      справочников — сведение о методике, и в заключение оно не идёт: рядом
      с величинами консолидированной отчётности упоминание другого стандарта
      читается как утверждение об этой организации.

  - code: ffo_to_debt
    name: FFO / Долг
    group: debt_burden
    unit: ratio
    direction: higher_better
    in_scoring: true
    numerator: ffo
    denominator: debt_total
    note: >-
      FFO — денежные средства от операционной деятельности до изменений
      оборотного капитала за вычетом уплаченных процентов и налога на прибыль.
    methodology_note: >-
      Денежный взгляд на ту же нагрузку: EBITDA не знает ни процентов,
      ни налогов, и у ЛСР расхождение между двумя мерами оказалось
      наибольшим из наблюдавшихся.

  - code: interest_cover_accrued
    name: Покрытие процентов по начисленным
    group: debt_service
    unit: ratio
    direction: higher_better
    in_scoring: true
    numerator: ifrs.operating_profit
    denominator: interest_accrued
    denominator_must_be_positive: true
    # Величина знаменателя берётся только из примечаний. Подстановка строки
    # формы запрещена: у Автодора это дало бы 414 вместо 54 382.
    denominator_source: notes_only
    # **Отрицательное покрытие печатается словом, а не числом.** «−2,66»
    # выглядит кратностью и читается как «покрыто в два с половиной раза
    # наоборот», тогда как смысл один: операционной прибыли нет вовсе.
    # Вывод здесь по знаку, и число к нему ничего не добавляет.
    negative_shown_as: отрицательно
    negative_shown_origin: >-
      Комплект ПАО «Сегежа Групп» за 2025 год: операционный убыток 50 628
      при начисленных процентах 19 059. Отношение −2,66 верно и бесполезно:
      величина отношения при убытке зависит от размера убытка, а не
      от способности обслуживать долг.
    note: >-
      Знаменатель — проценты, начисленные по заёмным средствам, вместе
      с капитализированными. Величина из отчёта о прибыли или убытке
      не подставляется: она бывает очищена от капитализированных процентов.

  - code: debt_maturity_cover
    name: Покрытие погашений ближайших 12 месяцев денежными средствами
    group: debt_service
    unit: ratio
    direction: higher_better
    in_scoring: true
    numerator: ifrs.cash
    denominator: debt_due_within_year
    denominator_must_be_positive: true
    # Величина знаменателя лежит в таблице сроков примечания о займах,
    # которая пока не разбирается. Показатель объявлен, но ни у одного
    # эмитента не считается — и это сказано прямо, а не спрятано нулём.
    availability: not_extracted_yet
    note: >-
      Знаменатель — погашения заёмных средств, приходящиеся на ближайшие
      двенадцать месяцев: они раскрываются таблицей сроков в примечании
      о заёмных средствах, а не строкой формы.
    methodology_note: >-
      Пик погашения решает маршрутизацию даже при умеренной нагрузке.
      Таблица сроков погашения пока не разбирается, поэтому показатель
      не рассчитывается ни у одного эмитента набора; отказ об этом говорит
      прямо, и в оговорке о содержании повторять его незачем.

  - code: equity_ratio
    name: Коэффициент автономии
    group: capital_structure
    unit: ratio
    direction: higher_better
    in_scoring: true
    numerator: ifrs.total_equity
    denominator: ifrs.total_assets
    denominator_must_be_positive: true

  - code: cur_liq
    name: Текущая ликвидность
    group: liquidity
    unit: ratio
    direction: higher_better
    in_scoring: true
    numerator: ifrs.total_current_assets
    denominator: ifrs.total_current_liabilities
    denominator_must_be_positive: true

  # --- Вне балла: описывают деятельность, решения не меняют ------------------
  - code: ebitda_margin
    name: Рентабельность по EBITDA
    group: profitability
    unit: ratio
    direction: higher_better
    in_scoring: false
    numerator: ebitda
    denominator: ifrs.revenue
    denominator_must_be_positive: true
    exclusion_kind: not_routing
    exclusion_reason: >-
      Рентабельность описывает деятельность, но решения «нужен ли человек»
      не меняет: убыток виден стоп-факторами, а высокая маржа ничего
      не отменяет. Показатель приводится в приложении.

  - code: net_debt
    name: Чистый долг
    group: debt_burden
    unit: currency
    direction: lower_better
    in_scoring: false
    numerator: net_debt
    exclusion_kind: no_level_scale
    exclusion_reason: >-
      Абсолютная величина, бесспорного ориентира у неё быть не может.
      Нагрузка оценивается отношениями, у которых шкала есть.

  # Знаменатели отношений объявлены показателями — справочными, вне балла.
  # **Читатель обязан видеть, из чего сложен результат**: «Чистый долг / EBITDA
  # 1,78» проверить нечем, если ни чистого долга, ни EBITDA в документе нет,
  # а ни одной строкой отчётности они не стоят — обе собираются расчётом.
  # В балл они не идут по той же причине, что чистый долг: у абсолютной
  # величины шкалы уровня нет.
  - code: debt_total
    name: Совокупный долг
    group: debt_burden
    unit: currency
    direction: lower_better
    in_scoring: false
    numerator: debt_total
    exclusion_kind: no_level_scale
    exclusion_reason: >-
      Абсолютная величина: шкалы уровня у неё нет. Приводится как знаменатель
      отношения FFO / Долг.

  - code: ebitda
    name: EBITDA
    group: debt_burden
    unit: currency
    direction: higher_better
    in_scoring: false
    numerator: ebitda
    exclusion_kind: no_level_scale
    exclusion_reason: >-
      Абсолютная величина: шкалы уровня у неё нет. Приводится как знаменатель
      отношения Чистый долг / EBITDA и как основание рентабельности по EBITDA.

  # Величины стоп-факторов объявлены показателями — справочными, вне балла.
  # **Стоп-фактор проверяется по показателю, а не по статье**: у эмитента,
  # не раскрывшего капитал отдельной строкой, статьи нет, а показатель
  # считается. В балл они не идут потому же, почему собственный капитал
  # не идёт в балл в РСБУ: это стоп-фактор, а не измерение.
  - code: equity
    name: Собственный капитал
    group: capital_structure
    unit: currency
    direction: higher_better
    in_scoring: false
    numerator: ifrs.total_equity
    exclusion_kind: stop_factor
    exclusion_reason: >-
      Величина стоп-фактора, а не измерение: знак капитала ограничивает класс,
      а величина сама по себе шкалы уровня не имеет.

  - code: nwc
    name: Чистый оборотный капитал
    group: liquidity
    unit: currency
    direction: higher_better
    in_scoring: false
    numerator: nwc
    exclusion_kind: stop_factor
    exclusion_reason: >-
      Величина стоп-фактора, а не измерение: запас оборотных средств
      над краткосрочными обязательствами оценивается текущей ликвидностью,
      у которой шкала есть.

# --- Группы и веса -------------------------------------------------------------
# Сумма весов обязана равняться 100 — проверяется загрузкой и тестом.

# Группы, не участвующие в балле: у них нет веса и быть не может. Показатели
# приложения живут здесь, чтобы не притворяться взвешенными.
appendix_groups:
  profitability:
    name: Рентабельность

groups:
  debt_burden:
    name: Долговая нагрузка
    weight: 40
  debt_service:
    name: Обслуживание долга
    weight: 30
  capital_structure:
    name: Структура капитала
    weight: 15
  liquidity:
    name: Ликвидность
    weight: 15

# --- Шкалы ---------------------------------------------------------------------

calibration_points:
  scale_type: absolute
  origin: >-
    Экспертная калибровка задачи 27 со ссылкой на подход публичных методологий
    рейтинговых агентств к границам долговой нагрузки. Их таблицы не
    копируются: заимствован подход, а не величины. Опорные точки нормативами
    не являются и вне шкалы перевода значения в балл смысла не имеют.
  limitation_note: >-
    Балльная оценка построена на экспертной калибровке по пяти комплектам
    отчётности без отраслевой привязки. Сравнимость организаций разных видов
    деятельности ограничена.
  metrics:
    net_debt_ebitda:
      points:
        - [ "5.0", 0 ]
        - [ "3.5", 35 ]
        - [ "2.0", 70 ]
        - [ "1.0", 100 ]
    ffo_to_debt:
      points:
        - [ "0.12", 0 ]
        - [ "0.20", 35 ]
        - [ "0.30", 70 ]
        - [ "0.45", 100 ]
    interest_cover_accrued:
      points:
        - [ "1.0", 0 ]
        - [ "1.5", 25 ]
        - [ "3.0", 55 ]
        - [ "5.0", 80 ]
        - [ "8.0", 100 ]
    debt_maturity_cover:
      points:
        - [ "0.25", 0 ]
        - [ "0.50", 40 ]
        - [ "0.75", 70 ]
        - [ "1.00", 100 ]
    equity_ratio:
      points:
        - [ "0.00", 0 ]
        - [ "0.15", 30 ]
        - [ "0.25", 55 ]
        - [ "0.35", 80 ]
        - [ "0.50", 100 ]
    cur_liq:
      points:
        - [ "0.80", 0 ]
        - [ "1.00", 40 ]
        - [ "1.50", 75 ]
        - [ "2.00", 100 ]

# --- Классы --------------------------------------------------------------------

classes:
  - code: A
    name: Устойчивое финансовое состояние
    min_score: "80"
  - code: B
    name: Удовлетворительное финансовое состояние
    min_score: "65"
  - code: C
    name: Состояние с признаками напряжения
    min_score: "50"
  - code: D
    name: Неустойчивое финансовое состояние
    min_score: "35"
  - code: E
    name: Критическое финансовое состояние
    min_score: "0"

# --- Достаточность основания ---------------------------------------------------
#
# Правило то же, что в РСБУ, и перенесено намеренно: главный признак — не
# число показателей, а доля веса, которую забирает одна группа. У нас это
# не умозрительно: в долговую нагрузку входит график погашения, который
# не считается ни у кого, и группа держится на двух показателях из трёх.

sufficiency:
  # **Стоп-фактор старше правила достаточности** — правило перенесено из РСБУ
  # вместе со своим основанием: отрицательный капитал или нехватка результата
  # на проценты есть состояние, установленное одной величиной, и узость
  # основания оценки его не отменяет. Прежде в ветке МСФО его не было, и у ПАО
  # «Сегежа Групп» при отрицательном оборотном капитале, убытке и автономии
  # 0,002 класс не присваивался вовсе: сработавший стоп-фактор молчал, потому
  # что групп показателей оказалось мало.
  #
  # Недостаток основания при этом не замалчивается: он идёт отдельной причиной
  # (`breadth_reason`), и балльная оценка не печатается — число рядом с классом
  # читалось бы как её итог.
  stop_factor_overrides_breadth: true
  stop_factor_overrides_origin: >-
    Правило РСБУ, перенесённое 21.09.2026. Основание то же: класс, ограниченный
    стоп-фактором, установлен состоянием, а не взвешенным баллом, и от широты
    основания не зависит.
  no_class:
    max_group_weight: "0.5"
    max_group_weight_reason: >-
      Оценка определяется одной группой показателей, интегральный класс
      не формируется
    min_metrics: 3
    min_metrics_reason: >-
      Показателей в расчёте недостаточно для интегральной оценки, класс
      не формируется
    min_groups: 2
    min_groups_reason: >-
      Показатели относятся к одной группе, интегральная оценка не формируется

# --- Расхождение показателей одной группы --------------------------------------
#
# Чистый долг / EBITDA и FFO / Долг измеряют одно и то же разными способами.
# Систематическое расхождение означает либо содержательный сигнал, либо
# неверную калибровку одной из шкал, и различать эти два случая должен
# человек — поэтому расхождение объявляется, а не сглаживается.

divergence:
  within_group: debt_burden
  metrics: [net_debt_ebitda, ffo_to_debt]
  # Четверть шкалы: балл от нуля до ста.
  threshold: 25
  note: >-
    Баллы двух мер долговой нагрузки разошлись более чем на четверть шкалы.
    Расхождение само по себе не ошибка: EBITDA не знает уплаченных процентов
    и налогов, и у эмитента с дорогим долгом денежная мера строже
    бухгалтерской.

# --- Участие динамики в балле --------------------------------------------------
#
# **Балл показателя МСФО равен баллу уровня. Динамика в балл не входит.**
# Правило объявлено, а не выведено из того, что ряда пока нет: в РСБУ балл
# складывается из уровня (0,6) и динамики (0,4), и молчание здесь читалось бы
# как «по МСФО считается так же, только динамика потерялась».
#
# Основание — состав показателей ветки. Он подобран под маршрутизацию, и решение
# «нужен ли человек» принимается по уровню: долговая нагрузка 5,5 требует
# внимания независимо от того, была ли она год назад шестью. Сравнительная
# колонка при этом нужна читателю: она показывает, куда двигалась величина,
# и потому изменения считаются и печатаются — в приложении и в перечне
# наибольших изменений, — но в балл не идут.
#
# Второе основание — цена ошибки. Динамика по МСФО опирается на сравнительную
# колонку, которая блокирующими контролями не проверялась: своего комплекта
# у такого периода нет. Пускать непроверенную величину в балл, определяющий
# класс, значило бы ставить оценку на том, что мы не проверяли.
scoring:
  score_from: level_only
  origin: >-
    Решение задачи 28. Ключевые показатели ветки оцениваются по уровню:
    состав подобран под маршрутизацию, и решение «нужен ли человек» уровнем
    и определяется. Сравнительные данные идут читателю, а не шкале: период,
    существующий только сравнительной колонкой, блокирующими контролями
    не проверялся, и его величина не вправе двигать класс.
  dynamics_use: reference_only
  dynamics_origin: >-
    Изменения за период считаются и печатаются — в приложении и в перечне
    наибольших изменений фактической базы. В балл не входят по правилу выше.

# --- Промежуточная отчётность --------------------------------------------------

annualisation:
  # **Число месяцев периода берётся из отчётной даты.** Промежуточная
  # отчётность по МСФО составляется нарастающим итогом с начала года,
  # поэтому у отчёта на 30.06 период равен шести месяцам, на 31.03 — трём.
  # Правило объявлено здесь, а не подразумевается кодом: без него число
  # месяцев пришлось бы задавать снаружи, и однажды его задали бы
  # двенадцатью — так и было, пока аннуализация не срабатывала ни разу.
  months_from: report_date_month
  months_origin: >-
    МСФО (IAS) 34 предписывает промежуточную отчётность нарастающим итогом
    с начала отчётного года. Правило сломается у эмитента, чей финансовый
    год начинается не в январе; такие в разобранных не встречались,
    и признака для них у нас нет.
  # Потоковые величины приводятся к году, балансовые — нет.
  scaled:
    - ebitda
    - interest_accrued
    - ifrs.operating_profit
    - ifrs.revenue
  # FFO не аннуализируется вовсе. Решение принято явно: операционный поток
  # сезонен, у девелопера особенно — поступления с эскроу раскрываются при
  # вводе объектов. Умножение на 12/N даёт число, которое выглядит годовым,
  # не являясь им, и проверить его нечем. Правило то же, что у ликвидности
  # ЛСР: показатель, заведомо искажённый, хуже отсутствующего.
  never_scaled:
    - ffo
  never_scaled_reason: >-
    FFO на промежуточной отчётности не рассчитывается: операционный поток
    распределён по году неравномерно, и приведение его к году умножением
    дало бы величину, которую нечем проверить.
  limitation: >-
    Показатели за промежуточный период приведены к году умножением на
    отношение двенадцати месяцев к числу месяцев периода. Приведение
    относится к потоковым величинам; балансовые взяты как есть.
  marker: annualised
