# Состав показателей по МСФО: пока только поправки по типу эмитента.
#
# **Файл заведён задачей 26 и полон не будет до задачи 27.** Здесь лежит
# ровно одно: случай, когда показатель у эмитента определённого типа
# считается иначе. Это не стоп-фактор и не его неприменимость — это другой
# состав самого показателя, и место ему в составе показателей, а не в оценке.
#
# **Поправка, которую нечем посчитать, даёт отказ, а не исходный показатель.**
# У ЛСР текущая ликвидность 4,15, но 310 977 запасов — незавершённое
# строительство, а 217 501 на счетах эскроу компании недоступны и стоят
# сноской под балансом, а не строкой. Пока величина эскроу не извлечена,
# поправленная ликвидность не считается — и **исходная тоже не приводится**:
# показатель, заведомо завышенный вчетверо, хуже отсутствующего.

version: "0.1.0"

adjustments:
  - metric: cur_liq
    name: Текущая ликвидность
    type: developer
    adjusted_name: Текущая ликвидность с поправкой на эскроу и запасы
    # Что исключается из числителя у этого типа и почему.
    exclude_from_numerator:
      - code: ifrs.inventories
        reason: >-
          У девелопера запасы — незавершённое строительство: в деньги
          в пределах года они не обращаются.
      - code: ifrs.escrow_balance
        reason: >-
          Средства на счетах эскроу принадлежат дольщикам до передачи
          объекта и компании недоступны.
    # Величина, без которой поправка не считается. Сноска под балансом
    # ЛСР её называет (217 501), но строкой отчётности она не является,
    # и извлечение сносок в величины — работа задачи 27.
    requires:
      - ifrs.escrow_balance
    on_missing: not_calculable
    reason_code: escrow_not_extracted
    limitation: >-
      Текущая ликвидность у девелопера, работающего по счетам эскроу,
      не рассчитана: средства на счетах эскроу раскрыты сноской, а не
      строкой отчётности, и исключить их из оборотных активов нечем.
      Показатель без этой поправки завышен и поэтому не приводится.
    origin: >-
      Разбор годовой отчётности ЛСР за 2025 год: текущая ликвидность 4,15,
      запасы 310 977 при валюте баланса 659 466, средства на счетах эскроу
      217 501 по сноске под отчётом о финансовом положении.
