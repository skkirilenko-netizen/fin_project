# Показатели по МСФО, их шкалы и правила расчёта (задача 27).
#
# **Состав подобран под маршрутизацию, а не под полноту.** Вопрос к каждому
# показателю один: меняет ли он решение «нужен ли человек». Проверка не
# умозрительная: у ЛСР не сработал ни один стоп-фактор, ликвидность
# не считается вовсе, а Чистый долг / EBITDA 5,5 при FFO / Долг 2 % —
# то есть без этих двух показателей он проходит незамеченным.
#
# **Рентабельность и оборачиваемость в балл не идут.** Они описывают
# деятельность, но решения не меняют: убыток Сегежи уже виден
# стоп-факторами, а высокая маржа ФосАгро ничего не отменяет. Их место —
# приложение.
#
# **Пороги — экспертная калибровка со ссылкой на подход рейтинговых
# методологий, а не их таблицы.** Копировать чужие границы и выдавать
# за свои мы не будем; формулировки «ниже норматива» запрещены здесь так же,
# как в РСБУ.

version: "0.2.0"

# --- Поправки состава показателя по типу эмитента (задача 26) -----------------
#
# **Поправка, которую нечем посчитать, даёт отказ, а не исходный показатель.**
# У ЛСР текущая ликвидность 4,15, но 310 977 запасов — незавершённое
# строительство, а 217 501 на счетах эскроу компании недоступны и стоят
# сноской под балансом, а не строкой. Пока величина эскроу не извлечена,
# поправленная ликвидность не считается — и **исходная тоже не приводится**:
# показатель, заведомо завышенный вчетверо, хуже отсутствующего.

adjustments:
  - metric: cur_liq
    name: Текущая ликвидность
    type: developer
    adjusted_name: Текущая ликвидность с поправкой на эскроу и запасы
    exclude_from_numerator:
      - code: ifrs.inventories
        reason: >-
          У девелопера запасы — незавершённое строительство: в деньги
          в пределах года они не обращаются.
      - code: ifrs.escrow_balance
        reason: >-
          Средства на счетах эскроу принадлежат дольщикам до передачи
          объекта и компании недоступны.
    requires:
      - ifrs.escrow_balance
    # Место, которое называет отказ. Оговорка целиком для этого не годится:
    # она объясняет последствие, а отказ обязан назвать, где величина лежит.
    where: средства на счетах эскроу раскрыты сноской под балансом, а не строкой формы
    on_missing: not_calculable
    reason_code: escrow_not_extracted
    limitation: >-
      Текущая ликвидность у девелопера, работающего по счетам эскроу,
      не рассчитана: средства на счетах эскроу раскрыты сноской, а не
      строкой отчётности, и исключить их из оборотных активов нечем.
      Показатель без этой поправки завышен и поэтому не приводится.
    origin: >-
      Разбор годовой отчётности ЛСР за 2025 год: текущая ликвидность 4,15,
      запасы 310 977 при валюте баланса 659 466, средства на счетах эскроу
      217 501 по сноске под отчётом о финансовом положении.

# --- Показатели ----------------------------------------------------------------

metrics:
  - code: net_debt_ebitda
    name: Чистый долг / EBITDA
    group: debt_burden
    unit: ratio
    direction: lower_better
    in_scoring: true
    numerator: net_debt
    denominator: ebitda
    denominator_must_be_positive: true
    note: >-
      Долг — только заёмные средства: обязательства по аренде, кредиторская
      задолженность и оценочные обязательства в него не входят. Состав тот же,
      что в РСБУ.

  - code: ffo_to_debt
    name: FFO / Долг
    group: debt_burden
    unit: ratio
    direction: higher_better
    in_scoring: true
    numerator: ffo
    denominator: debt_total
    note: >-
      FFO — денежные средства от операционной деятельности до изменений
      оборотного капитала за вычетом уплаченных процентов и налога на прибыль.
      Денежный взгляд на ту же нагрузку: EBITDA не знает ни процентов,
      ни налогов, и у ЛСР расхождение между двумя мерами оказалось
      наибольшим из наблюдавшихся.

  - code: interest_cover_accrued
    name: Покрытие процентов по начисленным
    group: debt_service
    unit: ratio
    direction: higher_better
    in_scoring: true
    numerator: ifrs.operating_profit
    denominator: interest_accrued
    denominator_must_be_positive: true
    # Величина знаменателя берётся только из примечаний. Подстановка строки
    # формы запрещена: у Автодора это дало бы 414 вместо 54 382.
    denominator_source: notes_only
    note: >-
      Знаменатель — проценты, начисленные по заёмным средствам, вместе
      с капитализированными. Величина из отчёта о прибыли или убытке
      не подставляется: она бывает очищена от капитализированных процентов.

  - code: debt_maturity_cover
    name: Покрытие погашений ближайших 12 месяцев денежными средствами
    group: debt_service
    unit: ratio
    direction: higher_better
    in_scoring: true
    numerator: ifrs.cash
    denominator: debt_due_within_year
    denominator_must_be_positive: true
    # Величина знаменателя лежит в таблице сроков примечания о займах,
    # которая пока не разбирается. Показатель объявлен, но ни у одного
    # эмитента не считается — и это сказано прямо, а не спрятано нулём.
    availability: not_extracted_yet
    note: >-
      Пик погашения решает маршрутизацию даже при умеренной нагрузке.
      Таблица сроков погашения из примечания о заёмных средствах пока
      не разбирается, поэтому показатель не рассчитывается ни у кого.

  - code: equity_ratio
    name: Коэффициент автономии
    group: capital_structure
    unit: ratio
    direction: higher_better
    in_scoring: true
    numerator: ifrs.total_equity
    denominator: ifrs.total_assets
    denominator_must_be_positive: true

  - code: cur_liq
    name: Текущая ликвидность
    group: liquidity
    unit: ratio
    direction: higher_better
    in_scoring: true
    numerator: ifrs.total_current_assets
    denominator: ifrs.total_current_liabilities
    denominator_must_be_positive: true

  # --- Вне балла: описывают деятельность, решения не меняют ------------------
  - code: ebitda_margin
    name: Рентабельность по EBITDA
    group: profitability
    unit: ratio
    direction: higher_better
    in_scoring: false
    numerator: ebitda
    denominator: ifrs.revenue
    denominator_must_be_positive: true
    exclusion_kind: not_routing
    exclusion_reason: >-
      Рентабельность описывает деятельность, но решения «нужен ли человек»
      не меняет: убыток виден стоп-факторами, а высокая маржа ничего
      не отменяет. Показатель приводится в приложении.

  - code: net_debt
    name: Чистый долг
    group: debt_burden
    unit: currency
    direction: lower_better
    in_scoring: false
    numerator: net_debt
    exclusion_kind: no_level_scale
    exclusion_reason: >-
      Абсолютная величина, бесспорного ориентира у неё быть не может.
      Нагрузка оценивается отношениями, у которых шкала есть.

# --- Группы и веса -------------------------------------------------------------
# Сумма весов обязана равняться 100 — проверяется загрузкой и тестом.

# Группы, не участвующие в балле: у них нет веса и быть не может. Показатели
# приложения живут здесь, чтобы не притворяться взвешенными.
appendix_groups:
  profitability:
    name: Рентабельность

groups:
  debt_burden:
    name: Долговая нагрузка
    weight: 40
  debt_service:
    name: Обслуживание долга
    weight: 30
  capital_structure:
    name: Структура капитала
    weight: 15
  liquidity:
    name: Ликвидность
    weight: 15

# --- Шкалы ---------------------------------------------------------------------

calibration_points:
  scale_type: absolute
  origin: >-
    Экспертная калибровка задачи 27 со ссылкой на подход публичных методологий
    рейтинговых агентств к границам долговой нагрузки. Их таблицы не
    копируются: заимствован подход, а не величины. Опорные точки нормативами
    не являются и вне шкалы перевода значения в балл смысла не имеют.
  limitation_note: >-
    Балльная оценка построена на экспертной калибровке по пяти комплектам
    отчётности без отраслевой привязки. Сравнимость организаций разных видов
    деятельности ограничена.
  metrics:
    net_debt_ebitda:
      points:
        - [ "5.0", 0 ]
        - [ "3.5", 35 ]
        - [ "2.0", 70 ]
        - [ "1.0", 100 ]
    ffo_to_debt:
      points:
        - [ "0.12", 0 ]
        - [ "0.20", 35 ]
        - [ "0.30", 70 ]
        - [ "0.45", 100 ]
    interest_cover_accrued:
      points:
        - [ "1.0", 0 ]
        - [ "1.5", 25 ]
        - [ "3.0", 55 ]
        - [ "5.0", 80 ]
        - [ "8.0", 100 ]
    debt_maturity_cover:
      points:
        - [ "0.25", 0 ]
        - [ "0.50", 40 ]
        - [ "0.75", 70 ]
        - [ "1.00", 100 ]
    equity_ratio:
      points:
        - [ "0.00", 0 ]
        - [ "0.15", 30 ]
        - [ "0.25", 55 ]
        - [ "0.35", 80 ]
        - [ "0.50", 100 ]
    cur_liq:
      points:
        - [ "0.80", 0 ]
        - [ "1.00", 40 ]
        - [ "1.50", 75 ]
        - [ "2.00", 100 ]

# --- Классы --------------------------------------------------------------------

classes:
  - code: A
    name: Устойчивое финансовое состояние
    min_score: "80"
  - code: B
    name: Удовлетворительное финансовое состояние
    min_score: "65"
  - code: C
    name: Состояние с признаками напряжения
    min_score: "50"
  - code: D
    name: Неустойчивое финансовое состояние
    min_score: "35"
  - code: E
    name: Критическое финансовое состояние
    min_score: "0"

# --- Достаточность основания ---------------------------------------------------
#
# Правило то же, что в РСБУ, и перенесено намеренно: главный признак — не
# число показателей, а доля веса, которую забирает одна группа. У нас это
# не умозрительно: в долговую нагрузку входит график погашения, который
# не считается ни у кого, и группа держится на двух показателях из трёх.

sufficiency:
  no_class:
    max_group_weight: "0.5"
    max_group_weight_reason: >-
      Оценка определяется одной группой показателей, интегральный класс
      не формируется
    min_metrics: 3
    min_metrics_reason: >-
      Показателей в расчёте недостаточно для интегральной оценки, класс
      не формируется
    min_groups: 2
    min_groups_reason: >-
      Показатели относятся к одной группе, интегральная оценка не формируется

# --- Расхождение показателей одной группы --------------------------------------
#
# Чистый долг / EBITDA и FFO / Долг измеряют одно и то же разными способами.
# Систематическое расхождение означает либо содержательный сигнал, либо
# неверную калибровку одной из шкал, и различать эти два случая должен
# человек — поэтому расхождение объявляется, а не сглаживается.

divergence:
  within_group: debt_burden
  metrics: [net_debt_ebitda, ffo_to_debt]
  # Четверть шкалы: балл от нуля до ста.
  threshold: 25
  note: >-
    Баллы двух мер долговой нагрузки разошлись более чем на четверть шкалы.
    Расхождение само по себе не ошибка: EBITDA не знает уплаченных процентов
    и налогов, и у эмитента с дорогим долгом денежная мера строже
    бухгалтерской.

# --- Промежуточная отчётность --------------------------------------------------

annualisation:
  # Потоковые величины приводятся к году, балансовые — нет.
  scaled:
    - ebitda
    - interest_accrued
    - ifrs.operating_profit
    - ifrs.revenue
  # FFO не аннуализируется вовсе. Решение принято явно: операционный поток
  # сезонен, у девелопера особенно — поступления с эскроу раскрываются при
  # вводе объектов. Умножение на 12/N даёт число, которое выглядит годовым,
  # не являясь им, и проверить его нечем. Правило то же, что у ликвидности
  # ЛСР: показатель, заведомо искажённый, хуже отсутствующего.
  never_scaled:
    - ffo
  never_scaled_reason: >-
    FFO на промежуточной отчётности не рассчитывается: операционный поток
    распределён по году неравномерно, и приведение его к году умножением
    дало бы величину, которую нечем проверить.
  limitation: >-
    Показатели за промежуточный период приведены к году умножением на
    отношение двенадцати месяцев к числу месяцев периода. Приведение
    относится к потоковым величинам; балансовые взяты как есть.
  marker: annualised
