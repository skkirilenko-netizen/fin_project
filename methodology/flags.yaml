# Флаги: обстоятельства, которые меняют прочтение оценки, но не саму оценку.
#
# Условия записаны на том же языке формул, что и показатели: четырёхзначное
# число — код строки, числовых литералов нет. Никакого нового механизма.
#
# affects_class всюду false. Класс — фиксированная арифметика (инвариант 2),
# и подкручивать его эвристикой нельзя. Флаг понижает уверенность и добавляет
# обязательную оговорку в раздел «Ограничения анализа».

version: "1.0.0"

flags:
  - code: holding_structure
    name: Признаки холдинговой структуры
    level: warning
    affects_class: false
    lowers_confidence: true
    combine: all
    conditions:
      # Финансовые вложения занимают заметную долю активов.
      - expression: "1170 / 1600"
        condition: gte
        value: "0.15"
      # Доходы от участия в других организациях не меньше прибыли от продаж.
      # Записано разностью, а не отношением, чтобы условие работало и при
      # отрицательной прибыли от продаж.
      - expression: "2310 - 2200"
        condition: gte
        value: "0"
    calibration: >-
      Пороги подобраны на одном наблюдении — ПАО «Газпром», отчётность
      за 2025 год: финансовые вложения 21,2 % активов, доходы от участия
      превышают прибыль от продаж в 5,4 раза. Одного наблюдения для
      калибровки недостаточно, пороги подлежат уточнению на эталонном
      наборе задачи 11.
    # Область действия: показатели, прочтение которых зависит от того, что
    # стоит за краткосрочными обязательствами и прибылью от продаж. Поле
    # машинное: по нему опознаётся столкновение флага со стоп-фактором,
    # построенным на тех же показателях. Объявлением области флаг не отменяет
    # ни один показатель — он называет, что именно требует ручной проверки.
    scope:
      - cur_liq
      - quick_liq
      - abs_liq
      - nwc
      - own_wc_ratio
      - interest_cover
      - debt_to_op_profit
    # Что означает одновременное срабатывание этого флага и стоп-фактора
    # из его области. Стоп-фактор при этом НЕ смягчается: иначе флаг стал бы
    # путём обхода оценки. Подстановки: {stop_factor} — наименование
    # стоп-фактора, {metrics} — показатели, попавшие под оба.
    conflict_statement: >-
      Стоп-фактор «{stop_factor}» построен на показателях, прочтение которых
      зависит от внутригрупповых расчётов: {metrics}. Одновременно сработал
      флаг «Признаки холдинговой структуры». Оценка при этом не смягчается —
      флаг не отменяет стоп-фактор и класс остаётся присвоенным по методике.
      Требуется ручная проверка: раскрыть состав краткосрочных обязательств
      и дебиторской задолженности в части расчётов с дочерними и зависимыми
      обществами и подтвердить либо отклонить прочтение названных показателей.
    # Подстановки: {share_of_assets} — доля финансовых вложений в активах,
    # {participation} — соотношение доходов от участия с прибылью от продаж.
    #
    # Формулировка намеренно слабее прежней. Прежняя объявляла показатели
    # ликвидности, оборачиваемости и операционной рентабельности имеющими
    # ограниченную применимость — утверждение слишком сильное для признака,
    # построенного на доле финансовых вложений. Флаг вправе указать, что
    # проверить, но не объявлять группу показателей неприменимой.
    text: >-
      Отчётность составлена по РСБУ и отражает деятельность отдельного
      юридического лица. Признаки холдинговой структуры: финансовые вложения
      составляют {share_of_assets} активов, доходы от участия в других
      организациях {participation}. Это основание проверить состав
      краткосрочных обязательств и дебиторской задолженности на расчёты
      с дочерними и зависимыми обществами: условия таких расчётов внутри
      группы могут отличаться от расчётов со сторонними контрагентами,
      и прочтение показателей ликвидности и обслуживания долга от этого
      зависит. Оценка группы требует консолидированной отчётности по МСФО,
      которая в настоящем анализе не использовалась и, если группа
      непубличная, может не составляться вовсе.
