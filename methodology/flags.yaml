# Флаги: обстоятельства, которые меняют прочтение оценки, но не саму оценку.
#
# Условия записаны на том же языке формул, что и показатели: четырёхзначное
# число — код строки, числовых литералов нет. Никакого нового механизма.
#
# affects_class всюду false. Класс — фиксированная арифметика (инвариант 2),
# и подкручивать его эвристикой нельзя. Флаг понижает уверенность и добавляет
# обязательную оговорку в раздел «Ограничения анализа».

version: "1.0.0"

flags:
  - code: holding_structure
    name: Признаки холдинговой структуры
    level: warning
    affects_class: false
    lowers_confidence: true
    combine: all
    conditions:
      # Финансовые вложения занимают заметную долю активов.
      - expression: "1170 / 1600"
        condition: gte
        value: "0.15"
      # Доходы от участия в других организациях не меньше прибыли от продаж.
      # Записано разностью, а не отношением, чтобы условие работало и при
      # отрицательной прибыли от продаж.
      - expression: "2310 - 2200"
        condition: gte
        value: "0"
    calibration: >-
      Пороги подобраны на одном наблюдении — ПАО «Газпром», отчётность
      за 2025 год: финансовые вложения 21,2 % активов, доходы от участия
      превышают прибыль от продаж в 5,4 раза. Одного наблюдения для
      калибровки недостаточно, пороги подлежат уточнению на эталонном
      наборе задачи 11.
    # Подстановки: {share_of_assets} — доля финансовых вложений в активах,
    # {participation} — соотношение доходов от участия с прибылью от продаж.
    text: >-
      Отчётность составлена по РСБУ и отражает деятельность отдельного
      юридического лица. Признаки холдинговой структуры: финансовые вложения
      составляют {share_of_assets} активов, доходы от участия в других
      организациях {participation}. Для такой структуры показатели
      ликвидности, оборачиваемости и операционной рентабельности имеют
      ограниченную применимость: операционная деятельность может быть
      сосредоточена в дочерних обществах, а отчётность головной компании —
      отражать преимущественно владение долями и распределение дивидендов.
      Оценка группы требует консолидированной отчётности по МСФО, которая
      в настоящем анализе не использовалась и, если группа непубличная,
      может не составляться вовсе.
