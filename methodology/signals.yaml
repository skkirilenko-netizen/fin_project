# Надзорные сигналы: детерминированные признаки, требующие внимания.
#
# Экспертная оценка пилотных заключений показала, что по ПК «Стройсервис»
# система не отразила единственный существенный сигнал: при чистой прибыли
# 40 839 тыс. руб. собственный капитал сократился с 691 до −442 тыс. руб.,
# что предполагает изъятие в пользу участников порядка 42 000 тыс. руб.
# Оборот 44 771 тыс. руб. при активах 418 тыс. руб. и чистой рентабельности
# 91 % — картина, которую нельзя оставлять на усмотрение модели.
#
# Поэтому сигнал — не интерпретация, а арифметика: условие проверяется
# по формуле, формулировка берётся отсюда дословно. Модель их не изобретает
# и не переписывает.
#
# ПОРОГИ ЗДЕСЬ — ЭКСПЕРТНЫЕ И ПОДЛЕЖАТ ЗАМЕНЕ. Отраслевых распределений
# пока нет, поэтому у каждого порога есть поле origin, как у калибровочных
# точек в scoring.yaml. После накопления базы (задача 19) они уступят место
# отраслевым перцентилям.
#
# Происхождение и зрелость порога — разные сведения, и полей поэтому два.
# origin отвечает, откуда взялась величина; calibration_status — на скольких
# наблюдениях она проверена и можно ли на неё опираться. Статус обязателен
# у каждого порога и начинается машинным признаком: preliminary — порог
# предварительный, calibrated — установлен на регрессионном наборе.
# Сейчас предварительны все шесть: наблюдений три, и это не выборка.
#
# Язык условий тот же, что у показателей: четырёхзначное число — код строки,
# прописное имя — константа. Числовых литералов в формулах нет.
#
# Условие сравнения (condition) объявлено у каждого сигнала, включая те два,
# где величина считается не формулой. Иначе отсечка лежала бы в методике,
# а знак сравнения — в коде, и формулировка оказалась бы не выводима
# из справочника: прочитав его, нельзя было бы сказать, когда она печатается.

version: "1.0.0"

# Уровень сигнала определяет место в заключении и вес во внимании читателя:
#   attention — обстоятельство, требующее объяснения;
#   supervisory — признак, по которому принимают надзорные меры.
signals:

  - code: equity_withdrawal
    name: Признаки распределения в пользу участников
    level: supervisory
    # Прирост капитала должен объясняться финансовым результатом. Расхождение
    # сверх порога означает движение капитала помимо прибыли.
    expression: "(1300 - prev(1300)) - 2400"
    condition: lt
    # Порог задан долей выручки, а не абсолютом: у крупной организации
    # расхождение в миллион — округление, у малой — вся деятельность.
    threshold_of: "2110"
    threshold: "-0.10"
    display_scale: 0
    as_absolute: true
    origin: >-
      Отсечка 10 % выручки выбрана экспертно как величина, которую нельзя
      объяснить округлением или переклассификацией. Проверена на ПК
      «Стройсервис»: расхождение 41 972 тыс. руб. при выручке 44 771 тыс. руб.
      составляет 94 % и сигнал даёт. Подлежит замене на отраслевой перцентиль.
    calibration_status: "preliminary, откалибровано по 3 организациям,
      подлежит пересмотру на регрессионном наборе"
    text: >-
      Прирост собственного капитала не объясняется финансовым результатом
      периода: расхождение составляет {value} тыс. руб. при чистой прибыли
      {profit} тыс. руб. Такое расхождение характерно для распределения
      в пользу участников. Требуется подтверждение решениями о распределении
      прибыли и сверка с отчётом об изменениях капитала.

  - code: equity_contribution
    name: Прирост капитала выше финансового результата
    level: attention
    expression: "(1300 - prev(1300)) - 2400"
    condition: gt
    threshold_of: "2110"
    threshold: "0.10"
    display_scale: 0
    origin: >-
      Зеркальная отсечка к equity_withdrawal, та же величина и то же
      происхождение: расхождение сверх 10 % выручки не объясняется
      округлением.
    calibration_status: "preliminary, откалибровано по 3 организациям,
      подлежит пересмотру на регрессионном наборе"
    text: >-
      Прирост собственного капитала превышает финансовый результат периода
      на {value} тыс. руб. Такое превышение характерно для взносов участников
      либо переоценки внеоборотных активов. Требуется установление источника.

  - code: transit_structure
    name: Признаки транзитной структуры
    level: supervisory
    # Оборот, многократно превышающий валюту баланса, означает, что активы
    # в обороте не участвуют: деятельность проходит через организацию.
    expression: "2110 / 1600"
    condition: gt
    threshold: "20"
    display_scale: 1
    origin: >-
      Отсечка 20 оборотов выбрана экспертно: у торговли с высокой
      оборачиваемостью показатель достигает 10–15, значения выше требуют
      объяснения. У ПК «Стройсервис» 107. Подлежит замене на отраслевой
      перцентиль: для торговли и для производства нормальный уровень
      различается кратно. Известный риск отсечки: оценка «10–15 у торговли»
      сама ни на чём не основана, и при аренде помещений и малых остатках
      двадцать оборотов набирает обычная торговая организация. Сигнал
      при этом сработает не на транзитной структуре, а на виде деятельности.
      Порог оставлен до перекалибровки на регрессионном наборе задачи 17
      осознанно: у наблюдаемого случая величина 107, и запас до отсечки
      пятикратный.
    calibration_status: "preliminary, откалибровано по 3 организациям,
      подлежит пересмотру на регрессионном наборе"
    text: >-
      Выручка превышает валюту баланса в {value} раза. Активов такого размера
      недостаточно для обслуживания оборота собственными силами, что
      характерно для транзитной структуры либо для деятельности на давальческом
      сырье или по агентской схеме. Требуется установление содержания операций.

  - code: extreme_margin
    name: Чрезвычайно высокая чистая рентабельность
    level: attention
    expression: "2400 / 2110"
    condition: gt
    threshold: "0.50"
    display_scale: 2
    origin: >-
      Отсечка 50 % выбрана экспертно: чистая рентабельность выше половины
      выручки у организации без нематериальных активов и лицензионных доходов
      требует объяснения. У ПК «Стройсервис» 91 %. Подлежит замене
      на отраслевой перцентиль.
    calibration_status: "preliminary, откалибровано по 3 организациям,
      подлежит пересмотру на регрессионном наборе"
    text: >-
      Чистая рентабельность составляет {value} — доля прибыли в выручке
      необычно высока. Требуется установление состава доходов и расходов:
      такая рентабельность характерна для посреднической деятельности либо
      для неполного отражения расходов.

# Структурный сдвиг баланса: изменение доли укрупнённой статьи.
structure_shift:
  name: Структурный сдвиг баланса
  level: attention
  # Статьи и база объявлены здесь, а не перечислены в коде: перечень —
  # методическое решение, и свободных строк в коде быть не должно. У ветки
  # МСФО он свой, в своём справочнике, а правило одно.
  #
  # Рядом с кодом — то, как статью называет **формулировка**: справочник строк
  # зовёт её «Итого по разделу I», и в прозе сигнала это читателю ничего
  # не говорит.
  base: "1600"
  lines:
    "1100": Внеоборотные активы
    "1200": Оборотные активы
    "1300": Капитал и резервы
    "1400": Долгосрочные обязательства
    "1500": Краткосрочные обязательства
  # Порог в процентных пунктах доли в валюте баланса. Сравнивается модуль
  # сдвига: сигнал даёт и уход доли, и её приход.
  threshold_points: "20"
  condition: gte
  compare_absolute: true
  display_scale: 1
  # Величина подставляется по модулю: направление сдвига читается из долей
  # на начало и на конец периода, которые стоят рядом в той же фразе.
  # Сравнивается тоже модуль, поэтому и основание сигнала печатается модулем:
  # в основании стоит ровно та величина, которую сравнили с отсечкой.
  as_absolute: true
  origin: >-
    Отсечка 20 процентных пунктов выбрана экспертно: перераспределение пятой
    части баланса за год — событие, а не колебание. Подлежит замене
    на отраслевой перцентиль.
  calibration_status: "preliminary, откалибровано по 3 организациям,
    подлежит пересмотру на регрессионном наборе"
  # Величина подставляется с сокращением «п. п.»: при склонении «процентных
  # пункта» согласование с числом получается неверным то при целой величине,
  # то при дробной, а подбирать форму по числу — задача, которой в методике
  # не место.
  text: >-
    Доля статьи «{line}» в валюте баланса за период изменилась с {before}
    до {after}, изменение — {value} п. п. Структурный сдвиг такого размера
    требует объяснения: он означает смену характера деятельности либо разовую
    операцию, сопоставимую с размером баланса.

# Интенсивность пересмотра сравнительных данных.
revision_intensity:
  name: Интенсивный пересмотр сравнительных данных
  level: attention
  # Число срабатываний контроля period_value_mismatch на комплект отчётности.
  threshold_per_set: "5"
  condition: gt
  display_scale: 1
  origin: >-
    Отсечка 5 расхождений на комплект подобрана так, чтобы сработали обе
    наблюдаемые организации: у ООО «Магнит» 28 расхождений на 5 комплектов
    (5,6), у ПАО «Газпром» 52 на 4 (13,0). Порог подогнан под известный
    ответ на выборке из трёх организаций — это не калибровка. Интенсивность
    пересмотра сама по себе характеристика качества отчётности, которую
    прежде никто не интерпретировал, и отсечку следует установить заново
    на эталонном наборе задачи 17.
  calibration_status: "preliminary, откалибровано по 3 организациям,
    подлежит пересмотру на регрессионном наборе"
  # Числа поставлены после существительных, а не перед ними: «на 5 комплекта»
  # получалось бы при одном значении и «на 4 комплекта» при другом, а выбирать
  # форму слова по числу методика не должна.
  #
  # Подстановка {value} здесь не годится: величина сигнала — расхождений
  # на комплект, а в формулировку идут само число расхождений и число
  # комплектов. Один и тот же знак подстановки не может означать в одном
  # справочнике две разные величины, иначе основание сигнала и его
  # формулировка расходятся молча.
  text: >-
    Сравнительные данные пересматривались интенсивно: расхождений между
    отчётными и сравнительными значениями {mismatches}, комплектов отчётности
    {sets}. Пересмотр сам по себе правомерен, но его интенсивность снижает
    сопоставимость периодов и требует объяснения причин переклассификации.
