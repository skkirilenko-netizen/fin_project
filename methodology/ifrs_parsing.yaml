# Правила разбора файла консолидированной отчётности.
#
# Файл приходит вёрсткой, а не данными: числа набраны так, как счёл нужным
# составитель отчётности. Прежде чем извлекать величины, нужно определить,
# как этот документ пишет числа, — и определить детерминированно, с отказом
# при неоднозначности.

version: "0.2.0"

# Порядок определения параметров ------------------------------------------------
#
# Параметры определяются по очереди, и очередь не произвольна: каждый
# следующий имеет смысл только после предыдущего.
#
#   1. Текстовый слой. Нет текста — определять нечего вовсе.
#   2. Тип документа. Годовой отчёт эмитента на триста страниц финансовой
#      отчётностью не является, и валюту с разделителем разрядов в нём искать
#      бессмысленно: числа там есть, они осмысленны, и любой из них определится.
#      Проверено дорого: однажды вместо отчётности загрузились пять годовых
#      отчётов.
#   3. Периметр методики. Финансовая организация отсекается до разбора:
#      у неё неклассифицированный баланс и свои показатели.
#   4. Валюта. Не рубль — организация вне периметра.
#   5. Единица измерения.
#   6. Разделитель разрядов.
#   7. Число периодов.
#   8. Вид отчётности.

# Текстовый слой ----------------------------------------------------------------
#
# Промежуточная отчётность Автодора — сканы: pdftotext извлекает 26 байт.
# OCR финансовых таблиц рискованнее разбора текста и отложен до задачи 29;
# пока документ без текстового слоя отклоняется с внятной причиной.
text_layer:
  min_characters: 2000
  origin: >-
    Порог выбран экспертно: две тысячи знаков — это меньше одной страницы
    форм, и документ короче заведомо не содержит отчётности. У скана
    извлекается 26 байт, у настоящего комплекта — десятки тысяч знаков,
    так что порог лежит далеко от обеих величин.

# Тип документа -----------------------------------------------------------------
#
# Признак финансовой отчётности — наличие заголовков основных форм. Он же
# и единственный надёжный: годовой отчёт эмитента содержит и числа,
# и упоминания отчётности, и даже отдельные показатели, но форм в нём нет.
#
# Заголовки берутся из справочника статей (methodology/ifrs_lines.yaml,
# блок forms) вместе с синонимами: перечень там один на всю ветку.
document_kind:
  # Сколько разных форм должно найтись, чтобы документ считался отчётностью.
  # Две: отчёт о финансовом положении и отчёт о прибыли или убытке. Одна
  # форма встречается и в годовом отчёте — в виде выдержки.
  min_forms: 2
  # Заголовок опознаётся по ядру наименования, а не по полной фразе.
  # Проверено на настоящей отчётности: у Сегежи формы называются
  # «Консолидированный отчет специального назначения о финансовом положении»,
  # и полная фраза справочника в неё не укладывается. Ядро — то, что
  # не меняется: предмет отчёта.
  cores:
    ifrs.statement_of_financial_position:
      - о финансовом положении
      - бухгалтерский баланс
    ifrs.statement_of_profit_or_loss:
      - о прибыли или убытке
      - о прибылях и убытках
      - о совокупном доходе
      - о финансовых результатах
    ifrs.statement_of_cash_flows:
      - о движении денежных средств
  # Сколько знаков строки считается заголовком. Заголовок формы — короткая
  # строка: в оглавлении и в примечаниях те же слова стоят внутри длинных
  # предложений, и по ним документ опознавался бы отчётностью всегда.
  heading_max_length: 120
  # Сколько строк переноса склеивается с заголовком при поиске ядра.
  # Заголовок формы набран в две строки, и ядро наименования разрывается
  # переносом: у Сегежи «О ФИНАНСОВОМ \nПОЛОЖЕНИИ» и «О ДВИЖЕНИИ ДЕНЕЖНЫХ
  # \nСРЕДСТВ». Без склейки настоящий заголовок не находился вовсе, и формой
  # становилось оглавление, где те же слова умещаются в строку: баланс дал
  # ноль строк, отчёт о движении денежных средств — две строки телефонов.
  heading_wrap_lines: 1
  # Из нескольких вхождений заголовка выбирается то, за которым идёт таблица:
  # оглавление состоит ровно из таких же коротких строк. Отличить его
  # по номеру страницы — угадывание, а по тому, что идёт следом, — признак.
  lookahead_lines: 60
  min_table_rows: 5
  # Сколько строк отделяет заголовок формы от первой строки её таблицы.
  # Под заголовком стоят единица измерения и шапка колонок: у Сегежи одиннадцать
  # строк, потому что каждая дата колонки набрана двумя строками, у ФосАгро
  # девять. За строкой оглавления таблица так близко не начинается — там
  # идут другие строки оглавления и пустые, и без этой отсечки формой
  # у Автодора становилось оглавление, стоящее вплотную к формам.
  #
  # Двадцати строк мало: у ЛСР между колонтитулом страницы с балансом и первой
  # строкой таблицы стоят номер страницы, надпись о пояснениях, сноска
  # о счетах эскроу и шапка колонок, набранная по строке на дату, — двадцать
  # строк ровно.
  heading_to_table_lines: 24
  # Где кончается таблица формы. Прежде блок тянулся до заголовка следующей
  # формы и захватывал примечания целиком: у ЛСР в «блоке баланса»
  # оказывалось 698 строк вместо нескольких десятков. Раздутый знаменатель
  # портит и опознание — доля опознанных строк считается по мусору, —
  # и голосование за конвенцию: числа примечаний подают ложные улики.
  #
  # Таблица кончается там, где подряд идут строки без величин. Подзаголовок
  # раздела («Внеоборотные активы») — одна-две такие строки, поэтому порог
  # заметно больше.
  table_end_gap: 8
  table_end_origin: >-
    Восемь строк подряд без величин внутри формы не встречаются: между
    разделами баланса стоит одна строка заголовка, изредка две. За таблицей
    же идёт сплошной текст — примечание или подпись. Проверено на шести
    комплектах ветки.
  table_rows_origin: >-
    Пять строк с величинами подряд в оглавлении не встречаются, а у любой
    формы их десятки: на пяти разобранных комплектах приходится от 526
    до 997 табличных строк на документ. Окно в шестьдесят строк покрывает
    начало таблицы и не дотягивается до следующей формы.
  # Формы, без которых документ отчётностью не считается ни при каком числе
  # прочих: без баланса нет ни структуры, ни валюты баланса.
  required_forms:
    - ifrs.statement_of_financial_position
  reasons:
    not_statements: >-
      Это не консолидированная финансовая отчётность: заголовков основных
      форм в документе нет. Вероятно, подан годовой отчёт эмитента —
      он содержит стратегию, обзор рынка и отдельные показатели,
      но отчётностью не является.

# Периметр методики -------------------------------------------------------------
#
# Финансовая организация распознаётся и отклоняется с внятной причиной,
# а не оценивается по методике для нефинансовых: у неё неклассифицированный
# баланс без деления на оборотные и внеоборотные активы, и показатели свои.
financial_institution:
  # Достаточно одного признака: все они однозначны.
  markers:
    - чистые инвестиции в лизинг
    - чистая инвестиция в лизинг
    - средства в кредитных организациях
    - обязательные резервы в центральном банке
    - обязательные резервы в банке россии
    - средства клиентов
    - кредиты выданные клиентам
    - процентные доходы, рассчитанные по эффективной ставке
  # Неклассифицированный баланс: ни одного упоминания деления на оборотные
  # и внеоборотные. Признак вспомогательный — он срабатывает вместе
  # с маркерами, а не вместо них: у нефинансовой организации деление есть
  # всегда, но назвать его могут по-разному.
  unclassified_balance_markers:
    - оборотные активы
    - краткосрочные активы
    - внеоборотные активы
    - долгосрочные активы
  reasons:
    financial_institution: >-
      Финансовая организация: в отчётности присутствуют признаки банковского
      или лизингового баланса. Отдельная методика для финансовых организаций
      не реализована, оценка не проводится.

# Валюта -------------------------------------------------------------------------
#
# Берётся из шапки формы: «в миллионах российских рублей», «млн руб.».
# Иная валюта — отказ: методика рублёвая, а пересчёт по курсу отчётной даты
# был бы нашим допущением поверх отчётности эмитента.
#
# ИЩЕТСЯ В ШАПКЕ ФОРМЫ, А НЕ ПО ВСЕМУ ДОКУМЕНТУ. Проверено на настоящей
# отчётности: у ЛСР слова «долларах США» встречаются один раз — в примечании
# о валютных рисках, — а «млн руб.» сто восемьдесят шесть раз. Поиск по всему
# документу отклонил рублёвую отчётность российского девелопера как
# составленную в долларах. В отчётности на двести страниц упоминание чужой
# валюты есть почти всегда, и признаком валюты отчётности оно не является.
header_window:
  # Сколько знаков после заголовка формы считается её шапкой. Валюта
  # и единица измерения стоят там: «(в миллионах российских рублей)».
  characters: 600
  origin: >-
    Шапка формы занимает несколько строк: наименование, отчётная дата,
    единица измерения, заголовки колонок. Шестьсот знаков покрывают их
    с запасом и не доходят до первых статей. Подлежит уточнению
    на регрессионном наборе задачи 29.

currency:
  rouble_markers:
    - российских рублей
    - росcийских рублей
    - руб.
    - рублях
    - рублей
    - ₽
  foreign_markers:
    долларах США: USD
    долл. США: USD
    долларов США: USD
    евро: EUR
    юанях: CNY
  reasons:
    not_determined: >-
      Валюта отчётности не определена: в шапках форм нет указания валюты,
      а принимать рубль по умолчанию нельзя — отчётность в долларах США
      встречается и у российских эмитентов.
    not_rouble: >-
      Отчётность составлена не в рублях. Методика рублёвая; пересчёт
      по курсу отчётной даты был бы нашим допущением поверх отчётности
      эмитента и в заключение не попадёт.

# Единица измерения --------------------------------------------------------------
#
# Объявляется самим документом в шапке формы, поэтому unit_source здесь
# explicit. Не объявлена — отказ: правило «форма задаёт единицу» действует
# для источников, которые единицу не сообщают, а консолидированная
# отчётность сообщает её всегда.
units:
  markers:
    миллионах: "385"
    миллионов: "385"
    млн: "385"
    тысячах: "384"
    тысяч: "384"
    тыс.: "384"
    миллиардах: "386"
    млрд: "386"
  reasons:
    not_determined: >-
      Единица измерения не определена: в шапках форм нет указания на тысячи,
      миллионы или миллиарды. Принять единицу по умолчанию нельзя — ошибка
      в тысячу раз не ловится ни одним контролем сходимости.

# Число периодов ------------------------------------------------------------------
#
# Переменное: Норникель даёт три периода, остальные разобранные эмитенты два.
# Модель принимает N периодов, и число определяется по датам в шапке таблицы,
# а не задаётся заранее.
periods:
  min_count: 2
  max_count: 5
  reasons:
    not_determined: >-
      Отчётные даты не определены: в шапках форм не нашлось дат, по которым
      приведены величины. Без них неизвестно, к какому периоду относится
      каждая колонка.

# Вид отчётности -------------------------------------------------------------------
#
# Сокращённые версии содержат не все примечания, и вид фиксируется, потому
# что попадает в ограничения анализа: раскрываемая отчётность и отчётность
# специального назначения описывают не то же, что полная.
reporting_kind:
  markers:
    промежуточная сокращённая: interim
    сокращённая консолидированная: interim
    (ias) 34: interim
    ias 34: interim
    мсфо (ias) 34: interim
    специального назначения: special_purpose
    специальной отчётности: special_purpose
    раскрываемая консолидированная: disclosable
    раскрываемая финансовая: disclosable
  # Вид по умолчанию, когда ни один маркер не встретился. Здесь умолчание
  # правомерно и неопасно: полная годовая отчётность маркеров не несёт,
  # а перечисленные виды объявляют себя сами — на титульном листе и
  # в заголовке форм. Ошибка в сторону полноты видна сразу: примечания,
  # которых методика требует, не найдутся.
  default: full
  limitations:
    interim: >-
      Отчётность промежуточная (МСФО (IAS) 34): состав примечаний сокращён,
      величины за период приведены неполным годом. Показатели, считаемые
      за год, требуют аннуализации, и она отмечается в документе отдельно.
    special_purpose: >-
      Отчётность специального назначения: составлена для определённого
      круга пользователей и не предназначена для общего распространения.
      Состав раскрытий определён заданием на составление, а не полным
      требованием стандартов.
    disclosable: >-
      Раскрываемая консолидированная отчётность: состав примечаний
      сокращён по сравнению с полной, и часть раскрытий, на которых
      строятся показатели долговой нагрузки, может отсутствовать.

# Разделитель разрядов ---------------------------------------------------------
#
# Определяется НА УРОВНЕ ДОКУМЕНТА, а не отдельного числа. Причина в том, что
# отдельное число конвенции не выдаёт: «663,888» — это 663 888 при запятой
# в роли разделителя разрядов и 663,888 при запятой в роли десятичного знака.
# Оба прочтения осмысленны, различаются в тысячу раз, и выбрать между ними
# можно только по документу целиком.
#
# Ошибка здесь не ловится ни одним контролем сходимости: если конвенция
# применена ко всем числам одинаково, баланс сойдётся, разделы сойдутся,
# коэффициенты будут верны — неверными окажутся все абсолютные величины.
# Это тот же класс дефекта, что единица измерения в РСБУ, и отношение к нему
# такое же: правило, а не предположение, и карантин при неопределённости.
#
# Свидетельства собираются по выборке чисел документа:
#
#   за русскую конвенцию (разряды — пробел, десятичный знак — запятая):
#     «1 234 567»  — пробел между группами по три цифры;
#     «12,5»       — после запятой не три цифры, значит запятая десятичная;
#   за английскую (разряды — запятая, десятичный знак — точка):
#     «1,234,567»  — две и более запятых в одном числе;
#     «12.5»       — после точки не три цифры, значит точка десятичная.
#
# Число вида «663,888» свидетельством не является ни для одной конвенции:
# именно оно и создаёт неоднозначность.
# ЗА КОНВЕНЦИЮ ГОЛОСУЮТ ТОЛЬКО ДЕНЕЖНЫЕ ВЕЛИЧИНЫ ИЗ ТАБЛИЦ ФОРМ. Всё
# остальное — источник ложных улик, и снижать из-за него порог нельзя:
# это подбор под наблюдаемые данные, а на следующем эмитенте потребуется
# порог ещё ниже. Чинится источник, а не отсечка.
#
# До голосования исключаются:
#   номера пунктов и подпунктов — «12.5» в начале строки;
#   ссылки на стандарты — «МСФО (IAS) 34», «IFRS 9»;
#   даты и годы — «31.12.2025», «2024»;
#   проценты и ставки — «12,5 %»;
#   номера примечаний и страниц — «Пояснения 12», «стр. 13-75»;
#   всё, что стоит вне блока формы, — примечания и текстовая часть.
#
# На очищенной выборке требование полного единогласия достижимо и означает
# именно то, что должно: все денежные величины документа записаны одинаково.
digit_grouping:
  # Строки, величины которых приведены не в единице отчётности. Они стоят
  # внутри форм и законны, но за конвенцию разрядов голосовать не вправе:
  # прибыль на акцию печатается в рублях с копейками — «(2.01)», — тогда
  # как суммы в той же форме идут миллионами с пробелами. У Сегежи это
  # единственные две улики против единогласия, и обе не о разрядах.
  not_money_rows:
    - на акцию
    - за акцию
    - количество акций
    - номинальной стоимостью
    - курс
    # Строка сама объявляет иную единицу: отчётность в миллионах, а величина
    # в рублях. У Сегежи прибыль на акцию приходит строкой «…акций Компании,
    # в российских рублях 20 (2.01) (1.42)» — слов «на акцию» в ней уже нет,
    # они остались в предыдущей строке вёрстки.
    - в российских рублях
    - в рублях на акцию
  # Сколько свидетельств нужно, чтобы конвенция считалась установленной.
  # Одно свидетельство — это опечатка составителя, а не конвенция документа.
  min_evidence: 3
  # Какую долю свидетельств должен собрать победитель. Единица означает:
  # ни одного свидетельства против. Смешанные конвенции в одном документе
  # не разбираются — это не выбор большинством, а отказ.
  min_share: "1.0"
  # Какую долю чисел с разделителем разрядов должны составлять свидетельства,
  # чтобы голосование вообще что-то решало. Улики считаются не сами по себе,
  # а против неоднозначных чисел: у ФосАгро их шесть против ста пятидесяти
  # трёх, три процента, — и все шесть ложные, слипшаяся строка
  # «5 573,628 507,689» читается как число с пробелом между разрядами.
  # У остальных разобранных эмитентов неоднозначных чисел нет вовсе, и доля
  # улик равна единице. Порог отделяет горстку от меньшинства: пятая часть
  # чисел с разделителем — это уже разметка документа, а три процента —
  # случайность вёрстки. Ниже порога голосование не решает ничего, и ответ
  # ищется в бесспорных уликах и в арифметике.
  min_decisive: "0.2"
  origin: >-
    Порог экспертный: три числа с однозначной разметкой встречаются в любой
    форме отчётности, а требование полного единогласия отражает то, что
    конвенция — свойство вёрстки документа, а не статистика. Подлежит
    уточнению на регрессионном наборе задачи 29.
  # Отказы разбора: причина называется кодом контроля и уходит в dq_log.
  # Неоднозначность разрешается арифметикой, а не порогом. Число «663,888»
  # само по себе допускает оба прочтения, но документ — не набор отдельных
  # чисел: итог сходится с суммой слагаемых при верной конвенции и не сходится
  # при неверной. У ФосАгро 445 912 + 217 976 = 663 888 — это и есть ответ,
  # и он получен из документа, а не выбран нами.
  #
  # Проверяются обе конвенции, и принимается та, при которой сходится больше
  # итогов. Если не сходится ни одна либо сходятся обе одинаково — отказ
  # остаётся: арифметика ответа не дала.
  arithmetic_resolution:
    enabled: true
    min_totals: 2
    origin: >-
      Двух сошедшихся итогов достаточно: случайное совпадение суммы
      по двум разным разделам при неверном прочтении в тысячу раз
      невозможно. Проверено на ФосАгро, где неоднозначны все величины форм.
  reasons:
    ambiguous: >-
      Разделитель разрядов не определён: числа документа допускают и русскую,
      и английскую конвенцию, а различаются прочтения в тысячу раз. Разбор
      по умолчанию запрещён, и арифметика ответа не дала: итоги не сошлись
      ни при одном прочтении либо сошлись при обоих.
    conflicting: >-
      Разделитель разрядов не определён: в документе встречаются числа обеих
      конвенций одновременно. Единой конвенции у документа нет.
    insufficient: >-
      Разделитель разрядов не определён: чисел с однозначной разметкой
      в документе меньше, чем требует методика.
    outweighed: >-
      Разделитель разрядов не определён: чисел с однозначной разметкой
      в документе горстка против сотни допускающих оба прочтения,
      и голосование здесь ничего не решает. Арифметика ответа тоже не дала:
      итоги не сошлись ни при одном прочтении либо сошлись при обоих.

# Правдоподобие выбранной конвенции --------------------------------------------
#
# Контроль после определения: неверно выбранная конвенция расходится
# на три порядка, то есть заметно. Проверяются две величины, обе доступны
# сразу после разбора основных форм.
#
#   1. Сумма статей раздела против его итога. При неверной конвенции часть
#      чисел прочитана в тысячу раз иначе, и итог не сойдётся.
#   2. Валюта баланса против порядка величин выручки. У действующей
#      организации они соотносятся в пределах разумного диапазона; расхождение
#      в тысячу раз означает, что формы прочитаны по-разному.
#
# Контроль не заменяет определения конвенции и не выбирает её: он ловит
# случай, когда определение оказалось неверным.
grouping_plausibility:
  # Во сколько раз валюта баланса может отличаться от выручки в любую
  # сторону, прежде чем это перестанет объясняться хозяйственной моделью.
  # Границы грубые намеренно: контроль ловит подмену конвенции, а не
  # отраслевое отклонение.
  assets_to_revenue:
    min: "0.02"
    max: "500"
    origin: >-
      Границы выбраны с запасом от наблюдаемых: у торговой организации
      активы много меньше выручки, у инфраструктурной — много больше.
      Подмена конвенции даёт отношение, отличающееся от истинного в тысячу
      раз, и в эти границы не попадает. Подлежит уточнению на регрессионном
      наборе задачи 29.
  # Отношение, близкое к тысяче, — прямой признак того, что часть чисел
  # прочитана по другой конвенции. Проверяется именно кратность тысяче,
  # как в period_magnitude_shift для РСБУ.
  thousand_factor: "1000"
  thousand_tolerance: "0.02"
