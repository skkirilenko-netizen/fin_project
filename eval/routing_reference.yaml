# Эталонные ожидания списка наблюдения — в двух уровнях.
#
# **Уровень проекта проверяется, уровень контура — нет, и это объявлено.**
# Проект отвечает за слой отчётности: величины, их знаки, отсутствие величины,
# состав списка. События — дефолт между отчётными датами, отзыв рейтинга,
# рыночное расхождение — живут в рабочем контуре, и проект их не видит
# по устройству. Включить их в проверяемый эталон значило бы держать его
# красным по причине, которую проект исправить не может, — а красный эталон
# перестают читать.
#
# Прогон — `eval/routing_reference_run.py` (`make routing-reference`).
# Любое расхождение уровня проекта — остановка, а не графа в отчёте.

version: "0.1.0"

origin: >-
  Экспертная проверка списка наблюдения 22.09.2026: снимок годовой отчётности
  не видит дефолтов между отчётными датами, а пустая долговая нагрузка
  и ноль вместо нераскрытого выводили эмитентов в «Без внимания». Ожидания
  записаны по её итогам.

# --- уровень проекта: проверяется каждым прогоном ---------------------------
project:
  # **Ожидание переписано 22.09.2026 по вашему решению.** Сперва было
  # «не рассчитан — не ниже внимания», потом восстановлен вывод по границе:
  # при положительной операционной прибыли и границе ниже порога критерий
  # пройден доказуемо, а дефект был в печати — строка писала «не считается»
  # и границы не показывала. Проверяется теперь именно печать.
  - code: bound_is_shown_not_missing
    expect: shows_bound
    where: >-
      У восьми эмитентов записки долговая нагрузка не рассчитана, а граница
      сверху есть: в строке стоит «не выше Nx по операционной прибыли»,
      и основания «данных недостаточно» у них нет.
    why: >-
      Граница — доказательство, а не пробел: амортизация неотрицательна,
      поэтому отношение к EBITDA не выше отношения к операционной прибыли.
      Но строка, писавшая «не считается» и не показывавшая границы, выглядела
      решением по величине, которой нет.
    issuers: ["7703255661", "7801293231", "6316031581", "1658008723",
              "2464010490", "7727620673", "1655201119", "9724221716"]

  - code: aggregator_zero_is_not_a_loss
    expect: no_ground
    ground: operating_loss
    where: ЯКОВЛЕВ (3807002509) — операционного убытка по нулю не объявлять.
    why: >-
      Ноль у агрегатора означает и нераскрытие. Прежде он читался как
      операционный убыток, то есть как утверждение об эмитенте, сделанное
      по величине, которой источник не раскрыл.
    issuers: ["3807002509"]

  - code: absorbed_issuer_excluded
    expect: absent
    where: >-
      «Глоракс (не сущ.)» (7717761040) в списке отсутствует: карточка источника
      объявляет поглощение, и преемник — живой «Глоракс» (9729387137).
    why: >-
      Отчётность поглощённого эмитента — история. Правило структурное:
      статусы приходят кодами, справочника к ним у API нет, а «(не сущ.)»
      в наименовании — примета, не признак.
    issuers: ["7717761040"]

  - code: non_positive_ebitda_not_clear
    expect: not_clear
    where: >-
      Ни один эмитент с неположительной EBITDA не стоит в «Без внимания».
    why: >-
      Отношение чистого долга к неположительной EBITDA отрицательно, и шкала
      читает его как низкую нагрузку. Отрицательное отношение означает либо
      чистую денежную позицию, либо убыток, и путать их нельзя.
    issuers: []
    rule: every_issuer_with_non_positive_ebitda

  # **Событийный слой перенесён в проект 22.09.2026**, и ожидания вместе с ним:
  # дефолт по выпуску и рейтинг категории D, RD, SD или C проект теперь видит
  # публичными данными источника, а не только экспертной проверкой.
  - code: default_goes_to_review
    expect: review
    where: >-
      ЕвроТранс (5029169023) и Кириллица (4004021785) — в «Разборе»: у первого
      неурегулированный дефолт по двенадцати выпускам, у второго выпуск БО-03
      в статусе «Дефолт по погашению».
    why: >-
      Дефолт случается между отчётными датами, и годовая отчётность его не видит
      по устройству: у ЕвроТранса числа за 2025 год спокойны. Прежде оба стояли
      в «Без внимания».
    issuers: ["5029169023", "4004021785"]

  - code: rating_category_goes_to_review
    expect: review
    where: >-
      ЖКХ РС(Я) (1435133520) — в «Разборе»: рейтинг Эксперт РА ruC, категория C.
    why: >-
      Категория C — преддефолтный уровень, объявленный агентством. Категория
      берётся из справочника точек шкал источника, а ESG-шкалы в градацию
      не идут: их точки «ESG-A-» кредитоспособности не измеряют.
    issuers: ["1435133520"]

# --- уровень контура: события и рынок, в проекте не проверяется --------------
#
# Здесь записано, чего проект **не** видит. Проверять это его прогоном нельзя:
# дефолт между отчётными датами, отзыв рейтинга и рыночное расхождение
# приходят из событийного слоя, которого в проекте нет. Перечень нужен,
# чтобы ожидание не потерялось и чтобы видно было, какая его часть закрывается
# новыми методами источника (выпуски и рейтинги).
circuit:
  - code: default_between_reporting_dates
    expect: not_below_review
    issuers:
      "7730176955": >-
        Антерра: два выпуска с неурегулированным дефолтом, рейтинг НРА D|ru|.
        Проект её теперь видит, но ожидание остаётся контурным: у эмитента
        комплекта в списке нет, и проверять в проекте нечего.
    closed_by: >-
      **Закрыто 22.09.2026**: `get_emissions` даёт статус выпуска и признак
      неурегулированного дефолта, `get_rating_emitent_maxdate` — категорию
      и прогноз, и оба стали основаниями маршрута. ЕвроТранс, Кириллица
      и ЖКХ РС(Я) перенесены в ожидания уровня проекта.

  - code: group_contour
    expect: not_below_attention
    issuers:
      "7420000133": >-
        Уральская кузница: группа «Мечел», у которой сама головная компания
        в «Разборе». Своего рейтинга у неё нет вовсе.
      "5003077160": >-
        Русагро: рыночное расхождение и событийный слой; в слое отчётности
        АКРА AA-(RU), прогноз стабильный.
    closed_by: >-
      Поле группы у карточки есть (`group_name_rus`, `id_group`), данные
      показаны: 43 группы с двумя и более эмитентами в списке, у 26 корзины
      внутри группы разные. Правило «дочерняя не мягче группы» не заведено —
      решение человека.
