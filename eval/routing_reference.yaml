# Эталонные ожидания списка наблюдения — в двух уровнях.
#
# **Уровень проекта проверяется, уровень контура — нет, и это объявлено.**
# Проект отвечает за слой отчётности: величины, их знаки, отсутствие величины,
# состав списка. События — дефолт между отчётными датами, отзыв рейтинга,
# рыночное расхождение — живут в рабочем контуре, и проект их не видит
# по устройству. Включить их в проверяемый эталон значило бы держать его
# красным по причине, которую проект исправить не может, — а красный эталон
# перестают читать.
#
# Прогон — `eval/routing_reference_run.py` (`make routing-reference`).
# Любое расхождение уровня проекта — остановка, а не графа в отчёте.

version: "0.1.0"

origin: >-
  Экспертная проверка списка наблюдения 22.09.2026: снимок годовой отчётности
  не видит дефолтов между отчётными датами, а пустая долговая нагрузка
  и ноль вместо нераскрытого выводили эмитентов в «Без внимания». Ожидания
  записаны по её итогам.

# --- уровень проекта: проверяется каждым прогоном ---------------------------
project:
  # **Ожидание переписано 22.09.2026 по вашему решению.** Сперва было
  # «не рассчитан — не ниже внимания», потом восстановлен вывод по границе:
  # при положительной операционной прибыли и границе ниже порога критерий
  # пройден доказуемо, а дефект был в печати — строка писала «не считается»
  # и границы не показывала. Проверяется теперь именно печать.
  - code: bound_is_shown_not_missing
    expect: shows_bound
    where: >-
      У восьми эмитентов записки долговая нагрузка не рассчитана, а граница
      сверху есть: в строке стоит «не выше Nx по операционной прибыли»,
      и основания «данных недостаточно» у них нет.
    why: >-
      Граница — доказательство, а не пробел: амортизация неотрицательна,
      поэтому отношение к EBITDA не выше отношения к операционной прибыли.
      Но строка, писавшая «не считается» и не показывавшая границы, выглядела
      решением по величине, которой нет.
    issuers: ["7703255661", "7801293231", "6316031581", "1658008723",
              "2464010490", "7727620673", "1655201119", "9724221716"]

  - code: aggregator_zero_is_not_a_loss
    expect: no_ground
    ground: operating_loss
    where: ЯКОВЛЕВ (3807002509) — операционного убытка по нулю не объявлять.
    why: >-
      Ноль у агрегатора означает и нераскрытие. Прежде он читался как
      операционный убыток, то есть как утверждение об эмитенте, сделанное
      по величине, которой источник не раскрыл.
    issuers: ["3807002509"]

  - code: absorbed_issuer_excluded
    expect: absent
    where: >-
      «Глоракс (не сущ.)» (7717761040) в списке отсутствует: карточка источника
      объявляет поглощение, и преемник — живой «Глоракс» (9729387137).
    why: >-
      Отчётность поглощённого эмитента — история. Правило структурное:
      статусы приходят кодами, справочника к ним у API нет, а «(не сущ.)»
      в наименовании — примета, не признак.
    issuers: ["7717761040"]

  # **Ни один эмитент не покидает список молча**, и живые не покидают его
  # вовсе. Поле поглощения названо у источника «Компания, оставшаяся после
  # слияния/поглощения» и заполнено у живых тоже; прочитанное как «поглощён»,
  # оно вывело из списка 24 действующих эмитента 22.09.2026.
  - code: live_issuers_stay
    expect: present
    where: >-
      Ростелеком, МегаФон, Вымпелком, Т Плюс, Мосэнерго, Металлоинвест
      и Мостотрест стоят в списке: статус их карточек — «действующая».
    why: >-
      Основание выхода — статус карточки вместе с известным преемником,
      а не поле поглощения. Проверка стоит именно на этих семи: они названы
      повторной проверкой как живые, и потеря любого из них означает, что
      правило снова читает поле вместо статуса.
    issuers: ["7707049388", "7812014560", "7713076301", "6315376946",
              "7705035012", "7705392230", "7701045732"]

  # **Единица комплекта проверяется у каждой строки, а не у семи названных.**
  # Ошибка в тысячу раз не ловится ни одним контролем сходимости: сходится
  # всё, кроме самих величин, — и заметить её можно только сверив
  # напечатанное с комплектом. 22.09.2026 таких строк было 57.
  - code: grounds_name_the_unit_of_the_set
    expect: unit_named
    where: >-
      Ни одно основание маршрута не печатает денежную величину в единице
      чужого комплекта: у комплекта в миллионах — «млн руб.», и «тыс. руб.»
      рядом с его числом невозможно.
    why: >-
      Проверка стояла только в заключении (`report/consistency.py::
      check_unit`), а список наблюдения и выгрузка печатали мимо неё —
      у Мечела, АФК «Система» и Уральской Стали миллионы были подписаны
      тысячами. Теперь единая точка печати денежную величину без названной
      единицы не печатает вовсе, и сверяет её одна функция на все выходы.
    issuers: []
    rule: every_issuer

  # **Ожидания повторной проверки 22.09.2026.** Девять эмитентов названы
  # человеком как «не ниже разбора», двое — как «не ниже внимания»; каждый
  # держится своим основанием, и эталон проверяет исход, а не путь к нему.
  - code: named_issuers_stay_in_review
    expect: review
    where: >-
      ЕвроТранс, Кириллица, Антерра, Инвест-Девелопмент, Гарант-Инвест,
      ЖКХ РС(Я), Самолёт, Монополия и Сегежа — в «Разборе».
    why: >-
      Перечень назван повторной проверкой списка: у каждого либо событие
      выпуска, либо рейтинг преддефолтной категории, либо стоп-фактор
      с ограничением класса низшим. Эталон без него ловил бы разрастание
      правил, но не их пропажу.
    issuers: ["5029169023", "4004021785", "7730176955", "7714933728",
              "7726637843", "1435133520", "9731004688", "7810766685",
              "9703024202"]

  # **Решение человека — обстоятельство наравне с машинными.** Статуса
  # наблюдения у источника нет вовсе, и без журнала Русагро стояла бы
  # в «Без внимания» при рейтинге под наблюдением АКРА.
  - code: manual_decision_holds_the_floor
    expect: not_clear
    where: >-
      Группа Русагро (5003077160) не ниже «Внимания»: решение человека
      от 22.09.2026 о наблюдении АКРА, срок до 22.04.2027.
    why: >-
      Прогноз в карточке стабильный, а рейтинг под наблюдением с 22.04.2026:
      вывести одно из другого нельзя, и обстоятельство вносится журналом
      `routing_decision` с автором, основанием и сроком.
    issuers: ["5003077160"]

  # **Второй проход не вправе терять доводы первого.** Прежде он собирал
  # перечень доводов заново руками, и у поднятого эмитента исчезали основания
  # рефинансирования, крупного долга и сектора повышенного риска.
  - code: uralskaya_kuznitsa_keeps_its_own_ground
    expect: not_clear
    where: >-
      Уральская кузница (7420000133) не ниже «Внимания» — по собственному
      основанию: платежей ближайших 12 месяцев 1 461 190 против денежных
      средств 105 288 тыс. руб.
    why: >-
      Прежде её единственным основанием стояло «Группа Мечел: Южный Кузбасс
      в разборе», а своё, настоящее, теряла пересборка доводов во втором
      проходе. Группа теперь справочна, и основание осталось одно — верное.
    issuers: ["7420000133"]

  - code: non_positive_ebitda_not_clear
    expect: not_clear
    where: >-
      Ни один эмитент с неположительной EBITDA не стоит в «Без внимания».
    why: >-
      Отношение чистого долга к неположительной EBITDA отрицательно, и шкала
      читает его как низкую нагрузку. Отрицательное отношение означает либо
      чистую денежную позицию, либо убыток, и путать их нельзя.
    issuers: []
    rule: every_issuer_with_non_positive_ebitda

  # **Событийный слой перенесён в проект 22.09.2026**, и ожидания вместе с ним:
  # дефолт по выпуску и рейтинг категории D, RD, SD или C проект теперь видит
  # публичными данными источника, а не только экспертной проверкой.
  - code: default_goes_to_review
    expect: review
    where: >-
      ЕвроТранс (5029169023) и Кириллица (4004021785) — в «Разборе»: у первого
      неурегулированный дефолт по двенадцати выпускам, у второго выпуск БО-03
      в статусе «Дефолт по погашению».
    why: >-
      Дефолт случается между отчётными датами, и годовая отчётность его не видит
      по устройству: у ЕвроТранса числа за 2025 год спокойны. Прежде оба стояли
      в «Без внимания».
    issuers: ["5029169023", "4004021785"]

  # **Давность дефолта проверяется с двух сторон, и вторая важнее первой.**
  # Срабатывание правила видно по корзине, а его разрастание — только
  # по эмитенту, у которого правило сработать **не** должно: признак,
  # уводящий из разбора всякого, у кого дефолт в прошлом, хуже отсутствующего.
  - code: stale_default_asks_instead_of_review
    expect: attention
    ground: default_unsettled_stale
    where: >-
      ДВМП (2540047110) и Приморское морское пароходство (2508018932) —
      во «Внимании» с вопросом о статусе урегулирования: события 2018 и 2016
      годов.
    why: >-
      Признак неурегулированности стоит восемь лет, а обстоятельством
      настоящего он не является: с тех пор сменились и долг, и собственник.
      Разбор по такому признаку разбирал бы прошлое. Дата события источником
      не приводится и графиком платежей не восстанавливается — опора — дата
      погашения выпуска, статус которого называет неисполненное погашение.
    issuers: ["2540047110", "2508018932"]

  - code: fresh_default_stays_in_review
    expect: review
    where: >-
      Кириллица (4004021785) остаётся в разборе: событие 22.08.2026, месяц
      назад, — правило давности свежего дефолта не гасит.
    why: >-
      Эмитент тот же, что в `default_goes_to_review`, а ловится другое: там —
      видит ли слой событий дефолт вообще, здесь — не уводит ли правило
      давности из разбора свежее событие. Эталон без второй величины ловил бы
      пропажу признака, но не его разрастание.
    issuers: ["4004021785"]

  - code: rating_category_goes_to_review
    expect: review
    where: >-
      ЖКХ РС(Я) (1435133520) — в «Разборе»: рейтинг Эксперт РА ruC, категория C.
    why: >-
      Категория C — преддефолтный уровень, объявленный агентством. Категория
      берётся из справочника точек шкал источника, а ESG-шкалы в градацию
      не идут: их точки «ESG-A-» кредитоспособности не измеряют.
    issuers: ["1435133520"]

  # --- ожидания фазы 1 дорожной карты: охват --------------------------------
  #
  # Фаза 1 отвечает на вопрос «видит ли список эмитента вообще». Её критерий
  # записан в `ROADMAP.md`: каждый эмитент в корзине или в «Установить статус»;
  # ни один не выпал молча. Ожидания ниже — механическая часть этого критерия.
  - code: every_bond_issuer_is_routed
    expect: routed_or_excluded
    rule: every_bond_issuer
    where: >-
      Каждый эмитент с выпусками в обращении имеет корзину либо назван
      в журнале исключений: третьего исхода нет.
    why: >-
      Прежде универсум собирался из доставок МСФО, и список видел 206
      эмитентов из 702: 403 раскрывают только РСБУ, 93 не раскрывают
      у источника ничего. Отсутствие их не было видно даже как отсутствие —
      именно это ожидание такой случай и ловит.

  - code: exclusion_names_reason_and_successor
    expect: excluded_with_reason
    rule: every_excluded_issuer
    where: >-
      Ни один эмитент не покидает список молча: у каждого выхода названы
      причина и преемник.
    why: >-
      Список, уменьшившийся без записи, врёт о себе сам. Правило проверяется
      тем же вызовом, которым маршрут исключает, — второго перечня
      исключённых не появляется.

  # **Единица строки сверяется с объявленной источником, а не сама с собой.**
  # Проверка `unit_named` спрашивает другое: не напечатана ли в тексте строки
  # единица чужого комплекта. Она ловит расхождение внутри строки и молчит,
  # если неверна сама графа, — а умолчание «тыс. руб.» однажды подписало
  # тысячами миллионы у 57 строк списка.
  - code: unit_of_the_row_is_the_unit_of_the_source
    expect: unit_matches_source
    rule: every_ifrs_row
    where: >-
      У каждой строки, маршрут которой построен по консолидированной
      отчётности, единица совпадает с масштабом, объявленным источником
      в той же строке ответа.
    why: >-
      Ошибка в единице тихая: баланс сходится, разделы сходятся, коэффициенты
      верны, и неверными оказываются только абсолютные величины — ровно
      в тысячу раз. Поймать её можно лишь сверкой с источником, и сверка
      обязана быть независимой: единицу пишет загрузчик, и спрашивать её
      у него же бессмысленно.

  - code: live_issuers_with_successor_field_stay
    expect: present
    rule: every_live_issuer_with_successor_field
    where: >-
      Эмитент с выпусками в обращении, у которого поле преемника заполнено,
      а статус карточки действующий, стоит в списке.
    why: >-
      Поле названо у источника «Компания, оставшаяся после слияния
      или поглощения» и заполнено у живых тоже — у Ростелекома, МегаФона,
      Норникеля. Прочитанное как «поглощён», оно вывело из списка 24 живых
      эмитента 22.09.2026. Решает статус карточки, а поле лишь называет
      преемника.
      Круг ожидания — эмитенты с выпусками в обращении: у Самараэнерго
      и Саратовэнерго поле заполнено и статус действующий, но ни выпусков,
      ни отчётности у нас нет, и отсутствие их в списке говорит о составе
      списка, а не о правиле выхода.

  # **Контрольный набор третьей проверки, 23.09.2026.** Он не о правиле,
  # а об исходе: тринадцать эмитентов, которых человек, просмотрев список,
  # назвал требующими разбора, и четверо, которым в разборе не место.
  # Ожидание держит обе стороны: правило, поднявшее «Разбор» до половины
  # списка, ловится вторым набором так же, как пропажа — первым.
  - code: third_review_named_issuers
    expect: not_below_review
    where: >-
      Тринадцать эмитентов третьей проверки стоят не ниже «Разбора». Корзина
      статуса тоже засчитывается: она старше корзин тяжести и задаёт другой
      вопрос, а не смягчает этот.
    why: >-
      Перечень назван человеком по прочтении списка 23.09.2026: у всех
      обстоятельства события — дефолт по выпуску, перевод в сектор риска,
      рейтинг категории D либо C. Правка правил величин их корзины менять
      не вправе.
    issuers: ["5404373487", "7743476441", "7705722209", "2311127765",
              "5503168016", "6658460424", "7724331419", "4025428684",
              "4012004991", "9718011220", "7703550709", "3620013012",
              "3446010280"]

  - code: financing_structures_are_not_in_review
    expect: not_review
    where: >-
      Газпром Капитал, ИКС 5 ФИНАНС и ЕвразХолдинг Финанс в «Разбор»
      не попадают: у первых двух поручитель в списке, и корзина берётся
      у него, у третьего поручителя в списке нет — и это очередь «добрать
      поручителя», а не разбор эмитента.
    why: >-
      Разбор сказан о том, у кого обстоятельство найдено. У финансирующей
      структуры собственные величины описывают договор, а не деятельность:
      прежде «поручитель в списке отсутствует» стояло даже там, где он
      в списке и в «Без внимания».
    issuers: ["7726588547", "7715630469", "7707710865"]

  - code: structural_issuers_are_not_in_review
    expect: not_review
    where: >-
      СФО и ипотечные агенты с обслуживаемыми выпусками в «Разбор»
      не попадают: обстоятельств события у них нет, а балансовые показатели
      сделку не описывают.
    why: >-
      У структурного эмитента отрицательный собственный капитал — устройство
      сделки: активы куплены на средства от выпуска. Прежде 59 из 186 позиций
      «Разбора» занимали они, 44 по строке 1300, и однотипные эмитенты стояли
      в трёх разных корзинах по её знаку.
    issuers: ["7722743495", "9703181501", "7704872635", "7743201768"]

# --- уровень контура: события и рынок, в проекте не проверяется --------------
#
# Здесь записано, чего проект **не** видит. Проверять это его прогоном нельзя:
# дефолт между отчётными датами, отзыв рейтинга и рыночное расхождение
# приходят из событийного слоя, которого в проекте нет. Перечень нужен,
# чтобы ожидание не потерялось и чтобы видно было, какая его часть закрывается
# новыми методами источника (выпуски и рейтинги).
circuit:
  - code: default_between_reporting_dates
    expect: not_below_review
    issuers:
      "7730176955": >-
