# Состав регрессионного набора (задача 17).
#
# Набор нужен, чтобы сравнивать поведение системы до и после правки методики
# или инструкций генерации. Пока его нет, сравнивать новое поведение не с чем,
# и по этой причине архитектурный разворот задачи 18 выполняется только
# после появления набора.
#
# В файле — ИНН и основание включения, больше ничего. Признаки покрытия здесь
# НЕ объявляются: они измеряются по базе после прогона. Объявленный признак
# описывал бы намерение, а не отчётность — организация включается затем, чтобы
# дать упрощённую форму, а сдаёт полную, — и набор врал бы о себе сам.
#
# Целевой размер — от тридцати до пятидесяти организаций. Сейчас в наборе три:
# те самые, на которых делалась экспертная оценка. Перечень собирается вручную:
# ГИР БО ищет только по конкретному ИНН, отобрать организации по признаку
# у источника нельзя.

version: "1.0.0"

organizations:
  - inn: "7736050003"
    reason: >-
      Полная отчётность крупной организации, признаки холдинговой структуры,
      отрицательный чистый оборотный капитал, глубина истории в четыре
      комплекта. Один из трёх пилотных документов экспертной оценки.

  - inn: "2522002003"
    reason: >-
      Корректировки отчётности и комплект, не прошедший блокирующие контроли;
      класс не присваивается из-за узости основания. Один из трёх пилотных
      документов экспертной оценки.

  - inn: "2100010824"
    reason: >-
      Упрощённая отчётность, отрицательный собственный капитал, признаки
      распределения в пользу участников. Один из трёх пилотных документов
      экспертной оценки.

# Чем измеряются признаки покрытия ------------------------------------------
#
# Коды методики названы здесь, а не зашиты в прогонщик: если флаг переименуют,
# набор должен сказать об этом, а не молча объявить измерение непокрытым.
coverage:
  # Холдинговые структуры опознаются по сработавшему флагу методики.
  holding_flag: holding_structure

# Размерные группы -----------------------------------------------------------
#
# Нужны только для описания покрытия набора: в расчёте показателей, в оценке
# и в заключении они не участвуют и участвовать не должны. Группа определяется
# по выручке за отчётный период; организация без раскрытой выручки в разбивку
# не попадает вовсе — угадывать размер по валюте баланса мы не будем.
size_groups:
  origin: >-
    Границы взяты из постановления Правительства Российской Федерации № 265
    о предельных значениях дохода для субъектов малого и среднего
    предпринимательства. Это не калибровка и не экспертная отсечка:
    величины нормативные и служат единственной цели — показать, что набор
    не состоит из организаций одного размера.
  # Значения в тысячах рублей: отчётность приходит в этой единице (ОКЕИ 384).
  unit_code: "384"
  bounds:
    - code: micro
      name: Микропредприятие
      max_revenue: "120000"
    - code: small
      name: Малое предприятие
      max_revenue: "800000"
    - code: medium
      name: Среднее предприятие
      max_revenue: "2000000"
    - code: large
      name: Крупное предприятие
