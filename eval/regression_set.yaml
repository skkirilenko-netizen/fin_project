# Настройки регрессионного набора (задача 17).
#
# Набор нужен, чтобы сравнивать поведение системы до и после правки методики
# или инструкций генерации. Пока его нет, сравнивать новое поведение не с чем,
# и по этой причине архитектурный разворот задачи 18 выполняется только
# после появления набора.
#
# Сам состав — `eval/sample_40.csv`: там ИНН, заявленная категория и основание
# включения. Здесь — то, чем поведение организации измеряется после прогона.
# Разделение не формальное: состав правится руками и часто, правила измерения —
# редко и с обоснованием.
#
# ЗАЯВЛЕННАЯ КАТЕГОРИЯ — ГИПОТЕЗА, А НЕ ФАКТ. Организация включается затем,
# чтобы дать отрицательный капитал, а сдаёт отчётность с положительным.
# Поэтому признаки меряются по базе и сопоставляются с заявленным: отчёт
# показывает заявленное покрытие против фактического, а не пересказывает
# файл состава.

version: "2.1.0"

# Чем измеряются признаки ----------------------------------------------------
#
# Коды методики названы здесь, а не зашиты в прогонщик: если флаг переименуют,
# набор должен сказать об этом, а не молча объявить измерение непокрытым.
coverage:
  # Холдинговые структуры опознаются по сработавшему флагу методики.
  holding_flag: holding_structure

# Пороги признаков.
#
# ОНИ ОПИСАТЕЛЬНЫЕ: делят набор на категории и в расчёте показателей, в оценке
# и в заключении не участвуют и участвовать не должны. Норматива за ними нет,
# происхождение объявлено у каждого.
features:
  large_balance:
    # Валюта баланса, тыс. руб.
    value: "1000000000"
    origin: >-
      Триллион рублей отделяет организации, у которых порядок величин сам
      по себе нагружает расчёт и вывод, от прочих. Отсечка выбрана экспертно
      и ни на что, кроме описания набора, не влияет.
  incomplete_disclosure:
    # Доля показателей, не рассчитанных за последний период.
    value: "0.5"
    origin: >-
      Половина показателей — граница, за которой отчётность перестаёт
      описывать деятельность: у вырожденного баланса СФО не считается
      большинство коэффициентов. Отсечка выбрана экспертно.
  near_zero_revenue:
    # Отношение выручки к валюте баланса.
    value: "0.01"
    origin: >-
      Сотая доля валюты баланса отделяет организацию без оборота от
      организации с малым оборотом. Отсечка выбрана экспертно.

# Категории состава и признак, по которому категория подтверждается ----------
#
# Признак — необходимый, а не достаточный: полные формы сдают и средние
# организации, и крупные, и подтверждение категории 2 не отменяет того,
# что у организации может обнаружиться триллионный баланс. Поэтому отчёт
# приводит все признаки организации, а не только заявленный, — и решение
# о переносе в другую категорию принимает человек.
categories:
  - id: 1
    name: Упрощённая отчётность
    feature: simplified_forms
  - id: 2
    name: Полная отчётность, средний бизнес
    feature: full_forms
  - id: 3
    name: Крупные организации
    feature: large_balance
  - id: 4
    name: Отрицательный собственный капитал
    feature: negative_equity
  - id: 5
    name: Убыток два года подряд
    feature: loss_two_years
  - id: 6
    name: Смена знака показателя
    feature: sign_change
  - id: 7
    name: Холдинг, высокая доля финвложений
    feature: holding_structure
  - id: 8
    name: Неполное раскрытие
    feature: incomplete_disclosure
  - id: 9
    name: Младше двух лет
    feature: single_report_year
  - id: 10
    name: Ликвидация / банкротство
    # Признака ликвидации в бухгалтерской отчётности нет: организация
    # в конкурсном производстве сдаёт те же формы. Выдумывать признак
    # ради полноты таблицы мы не будем — категория проверяется вручную.
    manual: признак в отчётности не выражен, проверяется по сведениям ЕГРЮЛ
  - id: 11
    name: Нулевые / близкие к нулю обороты
    feature: near_zero_revenue
  - id: 12
    name: Вне периметра, ожидается отказ
    # Признака по базе здесь нет и быть не может: организация вне периметра
    # в базу не попадает вовсе. Категория подтверждается самим отказом,
    # и он проверяется графой «итог совпал с ожиданием»: у этих организаций
    # ожидаемый исход — refusal, и отказ засчитывается как успех прогона,
    # а не как дефект.
    manual: подтверждается отказом, который проверяется ожидаемым исходом
  - id: 13
    name: Организации без выручки по устройству
    # Специализированные финансовые общества, ипотечные агенты и холдинговые
    # компании групп выручки не показывают: доход у них — проценты по займам
    # и дивиденды, строка 2110 не заполняется. Блокирующий контроль
    # обязательных строк их отчётность отбраковывает, и это ожидаемый исход,
    # а не дефект методики: у работающей организации нераскрытая выручка —
    # серьёзный сигнал, и ослаблять контроль ради этих организаций нельзя.
    # Поэтому у категории свой ожидаемый исход — quarantine_expected.
    #
    # Признак «выручка не раскрыта» отличается от «обороты около нуля»
    # (категория 11): там организация оборот показала, и он мал; здесь
    # показывать нечего вовсе.
    feature: revenue_not_disclosed

# Размерные группы -----------------------------------------------------------
#
# Нужны только для описания покрытия набора: в расчёте показателей, в оценке
# и в заключении они не участвуют и участвовать не должны. Группа определяется
# по выручке за отчётный период; организация без раскрытой выручки в разбивку
# не попадает вовсе — угадывать размер по валюте баланса мы не будем.
size_groups:
  origin: >-
    Границы взяты из постановления Правительства Российской Федерации № 265
    о предельных значениях дохода для субъектов малого и среднего
    предпринимательства. Это не калибровка и не экспертная отсечка:
    величины нормативные и служат единственной цели — показать, что набор
    не состоит из организаций одного размера.
  # Значения в тысячах рублей: отчётность приходит в этой единице (ОКЕИ 384).
  unit_code: "384"
  bounds:
    - code: micro
      name: Микропредприятие
      max_revenue: "120000"
    - code: small
      name: Малое предприятие
      max_revenue: "800000"
    - code: medium
      name: Среднее предприятие
      max_revenue: "2000000"
    - code: large
      name: Крупное предприятие
