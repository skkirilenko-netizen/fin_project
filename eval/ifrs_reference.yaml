# Эталонные величины ветки МСФО: всё, что найдено на настоящих документах.
#
# **Зачем файл.** Каждая величина здесь однажды была неверна, и дефект
# находился не тестом. Тесты ветки синтетические: они проверяют механизм —
# «сноска под таблицей берётся», — а вёрстку настоящего документа не
# повторяют. Ровно так прошёл регресс 21.09.2026: сноска ЛСР об эскроу
# не извлекалась вовсе, тест был зелёным, потому что приписывал сноску
# после таблицы, а у ЛСР она напечатана выше неё.
#
# **Правило прогона: любое расхождение — остановка.** Не предупреждение
# и не графа в отчёте: величина, однажды проверенная глазами, меняться
# молча не вправе. Прогон идёт после каждой правки разбора.
#
# **Состав правится руками, как состав регрессионного набора.** У каждой
# проверки объявлено: чей документ, что проверяется, где найдено и **почему
# это важно** — без последнего через полгода нельзя отличить существенную
# величину от случайно попавшей.
#
# Откуда берётся ответ, объявлено полем `source`:
#   document — из разбора документа, база не нужна;
#   database — из базы после загрузки и подтверждения комплекта.
# Смешивать нельзя: величина разбора проверяется без базы, а тип эмитента
# и отказ показателя без неё не существуют.

version: "0.1.0"

checks:

  # --- ПАО «Группа ЛСР» ---------------------------------------------------

  - inn: "7838360491"
    issuer: ПАО «Группа ЛСР»
    document: LSR CFS_12m2025_RUS_р_п.pdf
    source: document
    kind: note_contains
    subject: сноска об эскроу под балансом
    expect: "217 501"
    found_at: "2026-09-18"
    why: >-
      Средства на счетах эскроу организации недоступны, и без этой величины
      текущая ликвидность девелопера читается вчетверо выше. Сноска стоит
      **выше** таблицы — между заголовком формы и шапкой колонок, потому что
      баланс продолжается со страницы без текстового слоя, — и поиск только
      под таблицей её не находил.

  - inn: "7838360491"
    issuer: ПАО «Группа ЛСР»
    document: LSR CFS_12m2025_RUS_р_п.pdf
    source: document
    kind: value
    code: ifrs.long_term_borrowings
    expect: "328256"
    found_at: "2026-09-20"
    why: >-
      Самая дорогая ошибка ветки: «Кредиты и займы» стоят в балансе дважды,
      справочник повтора не допускал, и краткосрочный долг затирал
      долгосрочный — в расчёт шло 35 876 вместо 328 256 при сходящемся
      балансе.

  - inn: "7838360491"
    issuer: ПАО «Группа ЛСР»
    document: LSR CFS_12m2025_RUS_р_п.pdf
    source: document
    kind: value
    code: ifrs.short_term_borrowings
    expect: "35876"
    found_at: "2026-09-20"
    why: >-
      Вторая половина того же тождества: краткосрочный долг обязан остаться
      на своём месте, а не подменить долгосрочный.

  - inn: "7838360491"
    issuer: ПАО «Группа ЛСР»
    report_date: "2025-12-31"
    source: database
    kind: issuer_type
    expect: developer
    found_at: "2026-09-21"
    why: >-
      Оба структурных признака девелопера присвоены человеком, и вердикт,
      смотревший только на опознанное справочником, отвечал «corporate».
      Тип решает, применяется ли поправка ликвидности: без него 4,148 шло
      в балл группой 100 из 100.

  - inn: "7838360491"
    report_date: "2025-12-31"
    source: database
    kind: metric_refused
    code: cur_liq
    expect: adjustment_impossible
    found_at: "2026-09-21"
    why: >-
      Поправку по типу эмитента нечем посчитать: величина эскроу стоит
      сноской, а не строкой. Показатель, завышенный вчетверо, хуже
      отсутствующего — правило объявлено методикой, и отказ обязан быть
      именно отказом, а не исходной величиной.

  # --- ПАО «ФосАгро» ------------------------------------------------------

  - inn: "7736216869"
    issuer: ПАО «ФосАгро»
    document: PhosAgro_Financials_6m2026_RU_final.pdf
    source: document
    kind: value
    code: ifrs.revenue
    expect: "281388"
    found_at: "2026-09-20"
    why: >-
      Промежуточный отчёт печатает четыре графы: полугодие и квартал за два
      года. Прежде брались самые правые, то есть квартальные, и комплект
      за полугодие собирался из величин квартала — графа согласована сама
      с собой, все итоги сходятся, и неверны только сами величины.

  - inn: "7736216869"
    issuer: ПАО «ФосАгро»
    document: PhosAgro_Financials_6m2026_RU_final.pdf
    source: document
    kind: value
    code: ifrs.income_tax
    expect: "-6766"
    found_at: "2026-09-20"
    why: >-
      Тот же дефект граф: налог квартала −6 466 против полугодового −6 766.
      Проверяется вместе с выручкой, потому что одна верная величина
      не доказывает, что взята верная графа.

  - inn: "7736216869"
    issuer: ПАО «ФосАгро»
    document: PhosAgro_Financials_6m2026_RU_final.pdf
    source: document
    kind: grouping
    expect: english
    found_at: "2026-09-19"
    why: >-
      Неверная конвенция разрядов оставляет баланс сошедшимся, разделы
      сошедшимися и коэффициенты верными — неверными окажутся все
      абсолютные величины. Ни один контроль сходимости этого не поймает,
      и проверить можно только тем, что конвенция названа верно.

  # --- ПАО «Сегежа Групп» -------------------------------------------------

  - inn: "9703024202"
    issuer: ПАО «Сегежа Групп»
    document: Segezha_IFRS_Cons_SP_FS_25-r.pdf
    source: document
    kind: note_value
    code: ifrs.interest_expense_accrued
    expect: "19059"
    note: 9
    found_at: "2026-09-21"
    why: >-
      Покрытие процентов считается по начисленным процентам из примечания,
      а не по финансовым расходам формы. Без перехода по ссылке показатель
      не считается вовсе, и с ним пропадает вся группа «Обслуживание долга».

  - inn: "9703024202"
    report_date: "2025-12-31"
    source: database
    kind: stop_factors
    expect:
      - going_concern_uncertainty
      - negative_nwc
      - interest_cover_below_one
    found_at: "2026-09-21"
    why: >-
      Стоп-факторы жили только в замере: расчёт по фактам звал оценку
      с пустым перечнем и писал `stop_factor_code = NULL`. Три сработавших
      у Сегежи — единственное наблюдение, на котором это видно.

  - inn: "9703024202"
    issuer: ПАО «Сегежа Групп»
    report_date: "2025-12-31"
    source: database
    kind: audit_signal
    expect: going_concern_uncertainty
    found_at: "2026-09-21"
    why: >-
      Мнение немодифицированное, а раздел о непрерывности деятельности
      объявлен: соразмерность выходила перевёрнутой — уверенность высшая
      и эскалации нет, тогда как аудитор сомневается в самой способности
      продолжать деятельность. Сигнал надзорный и обязан стоять в разделе 4.

  # --- ПАО «Группа ЛСР», следствия типа эмитента --------------------------

  - inn: "7838360491"
    report_date: "2025-12-31"
    source: database
    kind: group_out_of_score
    code: liquidity
    expect: "Ликвидность"
    found_at: "2026-09-21"
    why: >-
      Текущая ликвидность у девелопера не рассчитана, и группа целиком
      выпадает из балла: 12,3 вместо 25,5. Прежде 4,148 шло в балл группой
      100 из 100 при 217 501 млн недоступных средств на счетах эскроу —
      то есть завышенный вчетверо показатель получал высшую оценку.

  # --- ПАО «ФосАгро», признаки, которые не должны срабатывать -------------

  - inn: "7736216869"
    report_date: "2025-12-31"
    source: database
    kind: signal_absent
    code: equity_withdrawal
    expect: "не срабатывает"
    found_at: "2026-09-21"
    why: >-
      Дивиденды 46 620 при прибыли 114 243 — обычная дивидендная политика.
      Пока отсечка была привязана к валюте баланса, признак давал надзорный
      уровень и эскалацию: предмет признака — изъятие сверх заработанного,
      а не выплата. **Проверяется именно несрабатывание**: признак, дающий
      надзорный сигнал всякому плательщику дивидендов, хуже отсутствующего.

  - inn: "7736216869"
    report_date: "2025-12-31"
    source: database
    kind: caveat_kind
    expect: about_disclosure
    found_at: "2026-09-21"
    why: >-
      Оговорка ФосАгро — о нераскрытых сегментах, то есть о полноте раскрытий,
      а не о величинах: аудитор подтвердил числа, и уверенность в показателях
      понижать не за что. Прежде вид оговорки не различался вовсе, и нераскрытые
      сегменты понижали уверенность наравне с заниженным резервом Автодора.
      Здесь проверяется **предложение машины** по приметам основания: вид
      устанавливает человек, и до его решения следствия не применяются.

