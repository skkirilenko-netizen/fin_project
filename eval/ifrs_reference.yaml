# --- Непроверяемое, с причиной ---------------------------------------------
#
# **Молчание о непроверенном читалось бы как «проверено».** Величина, которую
# прогон взять не может, объявляется здесь вместе с причиной — тем же
# правилом, по которому непокрытый признак регрессионного набора объявляет,
# почему он непокрыт.
not_checked:
  - inn: "8401005730"
    issuer: ПАО «ГМК „Норильский никель“»
    subject: долгосрочный долг не затёрт краткосрочным
    reason: >-
      Единственный документ эмитента составлен в долларах, и комплект
      отбраковывается на приёме: методика рублёвая. Величины долга при этом
      не опознаются справочником вовсе — строки размечены человеком, —
      и проверять пришлось бы разметку, а не разбор. То же свойство
      проверяется у ЛСР и Сегежи, где документы рублёвые.
