# Настройки регрессионного набора МСФО (задача 29).
#
# Устройство то же, что у набора РСБУ, и по той же причине: состав правится
# руками и часто — это таблица, которую открывают в редакторе таблиц, —
# а правила измерения правятся редко и с обоснованием. Состав лежит
# в `eval/ifrs_sample.csv`, здесь — то, чем поведение эмитента измеряется
# после прогона.
#
# ЗАЯВЛЕННАЯ КАТЕГОРИЯ — ГИПОТЕЗА, А НЕ ФАКТ. Эмитента включают ради
# отрицательного капитала, а он публикует отчётность с положительным;
# включают ради мнения с оговоркой, а мнение оказывается безоговорочным.
# Поэтому признаки меряются по базе и по итогу прогона и сопоставляются
# с заявленным: отчёт показывает заявленное покрытие против фактического,
# а не пересказывает файл состава.
#
# ЧЕМ НАБОР МСФО ОТЛИЧАЕТСЯ ОТ НАБОРА РСБУ. В РСБУ отчётность берётся
# из ГИР БО по ИНН, и участие эмитента в прогоне ничего не стоит. Здесь
# документ выгружается руками, и **цена участия — вечер работы человека**.
# Поэтому у каждого признака объявлено, откуда он берётся: из нормализованных
# данных Cbonds (выгрузка не нужна) или из документа (нужна). Без этого
# перечень признаков читается как список того, что достаётся даром.

version: "0.1.0"

# Откуда берётся признак ------------------------------------------------------
#
# `cbonds` — нормализованная отчётность агрегатора: величины отчётных форм,
#   валюта, масштаб, ряд отчётных дат. Документ для такого признака не нужен.
# `pdf` — только документ эмитента: вид аудиторского мнения, примечания,
#   специфические статьи, конвенция разрядов, страницы без текстового слоя.
#   Их у Cbonds нет по устройству, а не по недосмотру.
#
# Словарь один на эмитента и на признак, и это не совпадение: у эмитента
# `data_source` отвечает, откуда берутся **его** данные, у признака `source` —
# откуда берётся **он сам**. Значение `both` законно только у эмитента:
# признак берётся либо оттуда, либо отсюда, и «оба» у него означало бы,
# что источник не назван.
sources:
  cbonds: нормализованная отчётность агрегатора, выгрузка документа не нужна
  pdf: только документ эмитента, требуется ручная выгрузка

# Признаки покрытия -----------------------------------------------------------
#
# Коды названы здесь, а не зашиты в прогонщик: если признак переименуют,
# набор обязан сломаться, а не молча объявить измерение непокрытым.
features:
  # --- тип эмитента: определяется статьями отчётности --------------------
  corporate_issuer:
    name: обычный корпоративный эмитент
    source: pdf
  quasi_sovereign_issuer:
    name: квазисуверенный или проектный эмитент
    source: pdf
  developer_issuer:
    name: девелопер с эскроу
    source: pdf

  # --- вид отчётности ----------------------------------------------------
  full_reporting:
    name: полная годовая отчётность
    source: pdf
  interim_reporting:
    name: промежуточная отчётность по МСФО (IAS) 34
    source: pdf
  disclosable_reporting:
    name: раскрываемая отчётность
    source: pdf
  special_purpose_reporting:
    name: отчётность специального назначения
    source: pdf

  # --- аудиторское заключение --------------------------------------------
  #
  # Вида мнения у Cbonds нет ни у одного эмитента: поле «Аудированность»
  # не заполнено вовсе. Отбирать по нему нельзя, и эмитент с оговоркой
  # находится только выгрузкой документа — вслепую.
  unmodified_opinion:
    name: безоговорочно положительное мнение
    source: pdf
  modified_opinion:
    name: модифицированное мнение аудитора
    source: pdf
  going_concern:
    name: существенная неопределённость о непрерывности деятельности
    source: pdf
  review_engagement:
    name: обзорная проверка вместо аудита
    source: pdf
  audit_not_readable:
    name: заключение не прочитано
    source: pdf

  # --- извлечение и экран сверки -----------------------------------------
  automatic_intake:
    name: извлечение принято автоматически
    source: pdf
  material_specific_item:
    name: специфическая статья сверх порога существенности
    source: pdf
  lost_page:
    name: страница без текстового слоя внутри форм
    source: pdf
  english_grouping:
    name: английская конвенция разделителя разрядов
    source: pdf

  # --- величины отчётности ------------------------------------------------
  #
  # Единственные признаки, которые меряются без выгрузки: у Cbonds есть
  # капитал, прибыль и валюта. По ним и отбираются кандидаты.
  negative_equity:
    name: отрицательный собственный капитал
    source: cbonds
  loss:
    name: убыток за отчётный период
    source: cbonds

  # --- вне периметра ------------------------------------------------------
  financial_institution:
    name: финансовая организация
    source: pdf
  foreign_currency:
    name: отчётность не в рублях
    source: cbonds
  no_text_layer:
    name: документ без текстового слоя
    source: pdf

# Категории состава и признак, которым категория подтверждается ---------------
#
# Признак необходимый, а не достаточный: обычные корпоративные эмитенты есть
# и среди прибыльных, и среди убыточных, и подтверждение категории 1
# не отменяет того, что у эмитента может обнаружиться мнение с оговоркой.
# Поэтому отчёт приводит все признаки эмитента, а не только заявленный.
categories:
  - id: 1
    name: Обычный корпоративный эмитент
    feature: corporate_issuer
  - id: 2
    name: Квазисуверенный или проектный
    feature: quasi_sovereign_issuer
  - id: 3
    name: Девелопер с эскроу
    feature: developer_issuer
  - id: 4
    name: Стресс и отрицательный капитал
    feature: negative_equity
  - id: 5
    name: Вне периметра, ожидается отказ
    # Признака по базе здесь нет и быть не может: комплект, отклонённый
    # на приёме, фактов не порождает вовсе. Категория подтверждается самим
    # отказом, и он проверяется графой «итог совпал с ожиданием»: ожидаемый
    # исход у этих эмитентов — refusal, и отказ засчитывается успехом
    # прогона, а не дефектом. Правило то же, что у кредитных организаций
    # в наборе РСБУ.
    manual: подтверждается отказом, который проверяется ожидаемым исходом
  - id: 6
    name: Резерв, в прогон не идёт
    # Резерв остаётся в составе и в прогон не идёт: выбрасывать эмитента,
    # который завтра понадобится, незачем. Признака у категории нет —
    # она описывает не свойство отчётности, а наше решение.
    manual: решение о составе, свойством отчётности не является

# Ожидаемые исходы ------------------------------------------------------------
#
# Исход объявлен в составе и сверяется с тем, что вышло. Ожидаемый отказ —
# тоже успех: эмитент вне периметра методики подтверждает правило, а не
# нарушает его, и в число остановок прогона он не попадает.
outcomes:
  analysis: комплект принят, показатели и оценка посчитаны
  refusal: приём отклонил документ с названной причиной — ожидаемый исход
  manual_review: >-
    комплект принят, но автоматически не прошёл и требует подтверждения
    человеком. Отдельный исход, а не разновидность отказа: извлечение
    состоялось, и человеку есть что подтверждать

# Метрики прогона -------------------------------------------------------------
#
# Ключевая — доля автоматического прохождения: от неё зависит, возможен ли
# скрининг. У каждой метрики объявлен знаменатель: доля без знаменателя
# неотличима от отсутствия измерения.
metrics:
  automatic_share:
    name: доля извлечений, прошедших автоматически
    denominator: эмитенты, документ которых принят приёмом
  recognised_share:
    name: доля строк, опознанных справочником
    denominator: строки таблиц принятых форм
  totals_matched:
    name: доля сошедшихся итогов
    denominator: итоги, которые было чем проверить
  class_assigned:
    name: доля эмитентов с присвоенным классом
    denominator: эмитенты, дошедшие до оценки
  seconds_per_issuer:
    name: время на эмитента
    denominator: эмитенты в прогоне

# Что остаётся непроверенным ---------------------------------------------------
#
# Перечень не декоративный: он отвечает на вопрос, чего добор документов
# не даст. Признак объявляется здесь, когда его нельзя ни отобрать по API,
# ни ожидать от добора с разумной вероятностью.
uncovered:
  - feature: adverse_opinion
    name: отрицательное мнение и отказ от выражения мнения
    reason: >-
      В публично раскрываемой отчётности по МСФО не встречаются: эмитент,
      получивший такое заключение, обычно перестаёт публиковать отчётность.
      Наблюдения искать следует в РСБУ у организаций в банкротстве —
      это задача 30, а не добор документов сюда.
  - feature: notes_complete
    name: полнота обязательных примечаний
    reason: >-
      Признак известен только из документа и заранее не отбирается: состав
      примечаний объявляется самим эмитентом. Мерится по факту на том
      наборе, который выгружен, и целью добора быть не может.
